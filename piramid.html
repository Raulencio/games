<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PYRAMID OF THE GODS — 2.5D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#17120c;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle,#604b29 0%,#2b2012 50%,#100c08 100%);
    color:#f2d99d;
}

#menu h1{
    text-align:center;
    font-size:clamp(28px,8vw,58px);
    letter-spacing:4px;
    line-height:.95;
    text-shadow:0 5px 0 #100c08;
}

.subtitle{
    margin-top:10px;
    font-size:11px;
    letter-spacing:4px;
    color:#c9aa70;
}

.menuBox{
    width:min(92vw,430px);
    margin-top:25px;
    padding:18px;
    border:1px solid #9e7c42;
    border-radius:18px;
    background:#17120de8;
    box-shadow:0 15px 50px #000b;
}

.menuTitle{
    text-align:center;
    font-size:13px;
    margin-bottom:12px;
}

.gods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.god{
    min-height:78px;
    border:1px solid #624c2d;
    border-radius:11px;
    background:#302416;
    color:#e7d19b;
    cursor:pointer;
}

.god.selected{
    background:#5a4522;
    border-color:#e4bd63;
    box-shadow:0 0 15px #d3a94c33;
}

.glyph{
    display:block;
    font-size:28px;
    line-height:35px;
}

.god small{
    font-size:9px;
}

#startBtn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#c79a43;
    color:#171108;
    font-weight:bold;
    font-size:16px;
}

/* ================= HUD ================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.panel{
    background:#17120ccc;
    border:1px solid #9c7b43aa;
    border-radius:11px;
    box-shadow:0 4px 18px #0007;
    color:#e9d49d;
}

#topHud{
    position:absolute;
    top:7px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

#stats{
    width:min(205px,48vw);
    padding:8px;
    font-size:10px;
}

.hp{
    height:10px;
    margin:4px 0;
    background:#321915;
    border-radius:5px;
    overflow:hidden;
}

#hpBar{
    height:100%;
    width:100%;
    background:#bd4435;
}

.xp{
    height:5px;
    background:#282235;
    border-radius:4px;
    overflow:hidden;
}

#xpBar{
    height:100%;
    width:0;
    background:#9570d0;
}

#miniPanel{
    width:min(155px,36vw);
    aspect-ratio:1;
    padding:5px;
}

#mini{
    width:100%;
    height:100%;
    display:block;
}

#godInfo{
    position:absolute;
    top:96px;
    left:7px;
    padding:7px 9px;
    font-size:10px;
}

#message{
    position:absolute;
    bottom:125px;
    left:50%;
    transform:translateX(-50%);
    width:min(66vw,390px);
    min-height:40px;
    padding:8px;
    text-align:center;
    font-size:11px;
}

#pause{
    pointer-events:auto;
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #a7864e;
    background:#17120dcc;
    color:#eed79e;
}

/* ================= JOYSTICK ================= */

#joystick{
    pointer-events:auto;
    position:absolute;
    left:14px;
    bottom:17px;
    width:116px;
    height:116px;
    border-radius:50%;
    background:#211a10a8;
    border:2px solid #c9aa6a66;
}

#stick{
    position:absolute;
    left:32px;
    top:32px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#d4b46d99;
    border:2px solid #ead7a5;
    box-shadow:0 4px 12px #0008;
}

/* ================= ACCIONES ================= */

#actions{
    pointer-events:auto;
    position:absolute;
    right:13px;
    bottom:18px;
    display:flex;
    align-items:flex-end;
    gap:9px;
}

.action{
    width:62px;
    height:62px;
    border-radius:50%;
    border:2px solid #b99a5c;
    background:#21190fcc;
    color:#ead39a;
    font-weight:bold;
}

#attack{
    width:76px;
    height:76px;
    font-size:16px;
}

#skill{
    border-color:#9270d0;
}

/* ================= PAUSA ================= */

#pauseScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:80;
    background:#0009;
    align-items:center;
    justify-content:center;
}

.pauseBox{
    width:min(85vw,340px);
    padding:22px;
    border-radius:17px;
    background:#21180d;
    border:1px solid #a18047;
    color:#ecd59d;
    text-align:center;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    border:1px solid #806334;
    background:#46341d;
    color:#ecd59d;
}

@media(max-height:620px){
    #joystick{
        width:92px;
        height:92px;
        bottom:9px;
    }

    #stick{
        width:40px;
        height:40px;
        left:24px;
        top:24px;
    }

    .action{
        width:52px;
        height:52px;
    }

    #attack{
        width:65px;
        height:65px;
    }

    #message{
        bottom:91px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

    <h1>PYRAMID<br>OF THE GODS</h1>
    <div class="subtitle">2.5D MOBILE ADVENTURE</div>

    <div class="menuBox">

        <div class="menuTitle">SELECCIONA TU DIOS</div>

        <div class="gods">

            <button class="god selected" data-god="horus">
                <span class="glyph">𓅃</span>
                <small>HORUS<br>VELOCIDAD</small>
            </button>

            <button class="god" data-god="anubis">
                <span class="glyph">𓃢</span>
                <small>ANUBIS<br>EVASIÓN</small>
            </button>

            <button class="god" data-god="sekhmet">
                <span class="glyph">𓁛</span>
                <small>SEKHMET<br>DAÑO</small>
            </button>

            <button class="god" data-god="thoth">
                <span class="glyph">𓅝</span>
                <small>THOTH<br>CRÍTICO</small>
            </button>

            <button class="god" data-god="isis">
                <span class="glyph">𓆄</span>
                <small>ISIS<br>VIDA</small>
            </button>

            <button class="god" data-god="ra">
                <span class="glyph">𓂀</span>
                <small>RA<br>PODER</small>
            </button>

        </div>

        <button id="startBtn">
            INICIAR EXPEDICIÓN
        </button>

    </div>
</div>

<div id="hud">

    <div id="topHud">

        <div id="stats" class="panel">

            <b id="level">NIVEL 1</b>

            <div class="hp">
                <div id="hpBar"></div>
            </div>

            <div class="xp">
                <div id="xpBar"></div>
            </div>

            <div id="statText">
                VEL 1.00 · EVA 5% · CRIT 5%
            </div>

        </div>

        <div id="miniPanel" class="panel">
            <canvas id="mini"></canvas>
        </div>

    </div>

    <div id="godInfo" class="panel">
        𓅃 HORUS
    </div>

    <div id="message" class="panel">
        Encuentra la puerta.
    </div>

    <button id="pause">Ⅱ</button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">
        <button id="skill" class="action">DIOS</button>
        <button id="attack" class="action">⚔</button>
    </div>

</div>

<div id="pauseScreen">

    <div class="pauseBox">

        <h2>PAUSA</h2>

        <button id="resume">
            CONTINUAR
        </button>

        <button id="backMenu">
            MENÚ
        </button>

    </div>

</div>

<script>
"use strict";

/* ============================================================
   MOTOR
============================================================ */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

const TILE=64;

const FOV=Math.PI/3;
const MAX_DEPTH=1500;

let running=false;
let paused=false;

let map=[];
let mapW=35;
let mapH=27;

let enemies=[];

/* ============================================================
   DIOS
============================================================ */

const GODS={

    horus:{
        name:"HORUS",
        glyph:"𓅃",
        speed:1.15,
        evade:.05,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:100
    },

    anubis:{
        name:"ANUBIS",
        glyph:"𓃢",
        speed:1.05,
        evade:.20,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:105
    },

    sekhmet:{
        name:"SEKHMET",
        glyph:"𓁛",
        speed:.98,
        evade:.05,
        damage:1.35,
        crit:.08,
        critDamage:1.8,
        hp:115
    },

    thoth:{
        name:"THOTH",
        glyph:"𓅝",
        speed:1.02,
        evade:.06,
        damage:1,
        crit:.25,
        critDamage:2,
        hp:95
    },

    isis:{
        name:"ISIS",
        glyph:"𓆄",
        speed:1.02,
        evade:.08,
        damage:1,
        crit:.06,
        critDamage:1.5,
        hp:140
    },

    ra:{
        name:"RA",
        glyph:"𓂀",
        speed:1.1,
        evade:.07,
        damage:1.12,
        crit:.1,
        critDamage:1.7,
        hp:105
    }
};

let selectedGod="horus";

/* ============================================================
   SAVE
============================================================ */

let save={
    level:1,
    xp:0,
    speed:0,
    evade:0,
    crit:0,
    critDamage:0,
    god:"horus"
};

function loadGame(){

    try{

        const data=
            JSON.parse(
                localStorage.getItem(
                    "POTG_SAVE_04"
                )
            );

        if(data){

            save=Object.assign(
                save,
                data
            );

            selectedGod=
                save.god||"horus";
        }

    }catch(e){}
}

function saveGame(){

    save.god=selectedGod;

    try{

        localStorage.setItem(
            "POTG_SAVE_04",
            JSON.stringify(save)
        );

    }catch(e){}
}

loadGame();

/* ============================================================
   PLAYER
============================================================ */

const player={
    x:0,
    y:0,
    angle:0,
    hp:100,
    attack:false,
    attackTime:0,
    attackDuration:.30,
    cooldown:0
};

/* ============================================================
   COMPAÑERO
============================================================ */

const companion={
    x:0,
    y:0,
    angle:0,
    radius:13,
    speed:145,
    bob:0
};

/* ============================================================
   PUERTA
============================================================ */

let door={
    x:0,
    y:0
};

/* ============================================================
   MAPA
============================================================ */

function newMap(){

    mapW=35+Math.floor(Math.random()*4)*2;
    mapH=27+Math.floor(Math.random()*4)*2;

    map=[];

    for(let y=0;y<mapH;y++){

        map[y]=[];

        for(let x=0;x<mapW;x++){

            map[y][x]=1;
        }
    }

    const cx=Math.floor(mapW/2);
    const cy=Math.floor(mapH/2);

    /*
      Gran zona principal.
      Evita el efecto de laberinto.
    */

    carve(
        cx-8,
        cy-6,
        cx+9,
        cy+7
    );

    /*
      cuatro sectores grandes
    */

    carve(2,4,11,mapH-5);
    carve(mapW-11,4,mapW-2,mapH-5);

    carve(
        cx-4,
        2,
        cx+5,
        cy+2
    );

    carve(
        cx-4,
        cy-1,
        cx+5,
        mapH-2
    );

    /*
      corredores amplios
    */

    corridor(cx,cy,5,cy);
    corridor(cx,cy,mapW-6,cy);
    corridor(cx,cy,cx,4);
    corridor(cx,cy,cx,mapH-5);

    /*
      cámaras aleatorias
    */

    for(let i=0;i<8;i++){

        const rw=4+Math.floor(Math.random()*5);
        const rh=4+Math.floor(Math.random()*4);

        const rx=
            2+
            Math.floor(
                Math.random()*(mapW-rw-4)
            );

        const ry=
            2+
            Math.floor(
                Math.random()*(mapH-rh-4)
            );

        carve(
            rx,
            ry,
            rx+rw,
            ry+rh
        );

        corridor(
            cx,
            cy,
            Math.floor(rx+rw/2),
            Math.floor(ry+rh/2)
        );
    }

    /*
      Mantener bordes sólidos.
    */

    for(let x=0;x<mapW;x++){

        map[0][x]=1;
        map[1][x]=1;

        map[mapH-1][x]=1;
        map[mapH-2][x]=1;
    }

    for(let y=0;y<mapH;y++){

        map[y][0]=1;
        map[y][1]=1;

        map[y][mapW-1]=1;
        map[y][mapW-2]=1;
    }

    player.x=(cx+.5)*TILE;
    player.y=(cy+.5)*TILE;

    player.angle=0;

    companion.x=player.x-TILE;
    companion.y=player.y;

    createDoor();

    spawnEnemies();

    player.hp=getStats().maxHp;

    message("Nueva sala generada.");
}

function carve(x1,y1,x2,y2){

    for(let y=Math.max(2,y1);
        y<Math.min(mapH-2,y2);
        y++){

        for(let x=Math.max(2,x1);
            x<Math.min(mapW-2,x2);
            x++){

            map[y][x]=0;
        }
    }
}

function corridor(x1,y1,x2,y2){

    let x=x1;
    let y=y1;

    while(x!==x2){

        map[y][x]=0;

        if(y+1<mapH)
            map[y+1][x]=0;

        x+=x<x2?1:-1;
    }

    while(y!==y2){

        map[y][x]=0;

        if(x+1<mapW)
            map[y][x+1]=0;

        y+=y<y2?1:-1;
    }
}

function wallAt(x,y){

    const tx=Math.floor(x/TILE);
    const ty=Math.floor(y/TILE);

    if(
        tx<0||
        ty<0||
        tx>=mapW||
        ty>=mapH
    )
        return true;

    return map[ty][tx]===1;
}

/* ============================================================
   PUERTA PEGADA A PARED
============================================================ */

function createDoor(){

    const options=[];

    for(let y=2;y<mapH-2;y++){

        for(let x=2;x<mapW-2;x++){

            if(map[y][x]!==0)
                continue;

            /*
              La puerta comparte la posición de la celda
              abierta inmediatamente delante de una pared.
            */

            if(wallAt(
                (x+.5)*TILE,
                (y-1+.5)*TILE
            )){
                options.push({x,y});
            }

            if(wallAt(
                (x+.5)*TILE,
                (y+1+.5)*TILE
            )){
                options.push({x,y});
            }

            if(wallAt(
                (x-1+.5)*TILE,
                (y+.5)*TILE
            )){
                options.push({x,y});
            }

            if(wallAt(
                (x+1+.5)*TILE,
                (y+.5)*TILE
            )){
                options.push({x,y});
            }
        }
    }

    if(options.length){

        door=
            options[
                Math.floor(
                    Math.random()*options.length
                )
            ];
    }
}

/* ============================================================
   COLISIÓN
============================================================ */

function collision(x,y,r){

    return(
        wallAt(x-r,y-r)||
        wallAt(x+r,y-r)||
        wallAt(x-r,y+r)||
        wallAt(x+r,y+r)
    );
}

/* ============================================================
   LÍNEA DE VISIÓN
   IMPORTANTE:
   LOS ENEMIGOS NO PUEDEN APARECER ATRAVESANDO MUROS.
============================================================ */

function lineOfSight(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    const distance=Math.hypot(dx,dy);

    /*
      Paso pequeño para no saltarse una pared.
    */

    const steps=Math.ceil(distance/3);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        const x=x1+dx*t;
        const y=y1+dy*t;

        if(wallAt(x,y))
            return false;
    }

    return true;
}

/* ============================================================
   ENEMIGOS
============================================================ */

function spawnEnemies(){

    enemies=[];

    const count=
        6+
        Math.floor(
            Math.random()*4
        );

    for(let i=0;i<count;i++){

        for(let attempt=0;attempt<100;attempt++){

            const x=
                (2+
                Math.random()*(mapW-4))*
                TILE;

            const y=
                (2+
                Math.random()*(mapH-4))*
                TILE;

            if(wallAt(x,y))
                continue;

            if(
                Math.hypot(
                    x-player.x,
                    y-player.y
                )<TILE*4
            )
                continue;

            enemies.push({

                x,
                y,

                radius:14,

                hp:
                    60+
                    save.level*8,

                maxHp:
                    60+
                    save.level*8,

                speed:
                    34+
                    Math.random()*15,

                angle:0,

                cooldown:
                    Math.random(),

                wander:
                    Math.random()*Math.PI*2,

                think:0,

                hit:0,

                dead:false
            });

            break;
        }
    }
}

/* ============================================================
   IA ENEMIGOS
============================================================ */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)
            continue;

        e.cooldown-=dt;
        e.hit=Math.max(0,e.hit-dt);

        const dx=player.x-e.x;
        const dy=player.y-e.y;

        const distance=Math.hypot(dx,dy);

        e.angle=Math.atan2(dy,dx);

        /*
          El enemigo solamente activa persecución
          si realmente puede ver al jugador.
        */

        const visible=
            distance<620 &&
            lineOfSight(
                e.x,
                e.y,
                player.x,
                player.y
            );

        if(visible){

            if(distance>78){

                const nx=dx/(distance||1);
                const ny=dy/(distance||1);

                const amount=e.speed*dt;

                tryEnemyMove(
                    e,
                    nx*amount,
                    ny*amount
                );

            }else if(e.cooldown<=0){

                enemyAttack(e);

                e.cooldown=.9;
            }

        }else{

            /*
              Patrulla.
            */

            e.think-=dt;

            if(e.think<=0){

                e.think=
                    .8+
                    Math.random()*1.5;

                e.wander+=
                    (Math.random()-.5)*2;
            }

            const amount=
                e.speed*.25*dt;

            tryEnemyMove(
                e,
                Math.cos(e.wander)*amount,
                Math.sin(e.wander)*amount
            );
        }
    }
}

function tryEnemyMove(e,dx,dy){

    if(
        !collision(
            e.x+dx,
            e.y,
            e.radius
        )
    )
        e.x+=dx;

    if(
        !collision(
            e.x,
            e.y+dy,
            e.radius
        )
    )
        e.y+=dy;
}

function enemyAttack(e){

    if(
        Math.random()<
        getStats().evade
    ){

        message("¡Evasión!");

        return;
    }

    player.hp-=8;

    if(player.hp<=0){

        player.hp=0;

        message("Has caído...");

        setTimeout(()=>{

            if(running){

                player.hp=
                    getStats().maxHp;

                newMap();
            }

        },800);
    }
}

/* ============================================================
   COMPAÑERO
============================================================ */

function updateCompanion(dt){

    const dx=player.x-companion.x;
    const dy=player.y-companion.y;

    const distance=Math.hypot(dx,dy);

    /*
      Mantiene aproximadamente 70 px.
      Nunca se pega al jugador.
    */

    if(distance>105){

        const targetDistance=72;

        const tx=
            player.x-
            dx/(distance||1)*
            targetDistance;

        const ty=
            player.y-
            dy/(distance||1)*
            targetDistance;

        const ax=tx-companion.x;
        const ay=ty-companion.y;

        const d=Math.hypot(ax,ay)||1;

        const speed=
            companion.speed*dt;

        const dx2=
            ax/d*
            Math.min(speed,d);

        const dy2=
            ay/d*
            Math.min(speed,d);

        if(
            !collision(
                companion.x+dx2,
                companion.y,
                companion.radius
            )
        )
            companion.x+=dx2;

        if(
            !collision(
                companion.x,
                companion.y+dy2,
                companion.radius
            )
        )
            companion.y+=dy2;
    }

    companion.angle=
        Math.atan2(
            player.y-companion.y,
            player.x-companion.x
        );

    companion.bob+=dt*5;
}

/* ============================================================
   STATS
============================================================ */

function getStats(){

    const g=GODS[selectedGod];

    return{

        speed:
            g.speed+
            save.speed+
            (save.level-1)*.025,

        evade:
            Math.min(
                .65,
                g.evade+
                save.evade
            ),

        damage:
            g.damage+
            (save.level-1)*.035,

        crit:
            Math.min(
                .75,
                g.crit+
                save.crit
            ),

        critDamage:
            g.critDamage+
            save.critDamage,

        maxHp:
            g.hp+
            (save.level-1)*8
    };
}

let joyX=0;
let joyY=0;

function movePlayer(dx,dy){

    const radius=15;

    if(
        !collision(
            player.x+dx,
            player.y,
            radius
        )
    )
        player.x+=dx;

    if(
        !collision(
            player.x,
            player.y+dy,
            radius
        )
    )
        player.y+=dy;
}

/* ============================================================
   JOYSTICK
============================================================ */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyActive=false;
let joyId=null;

function updateJoystick(x,y){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=r.width*.36;

    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    joyActive=false;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joyActive=true;
        joyId=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joyActive||
            e.pointerId!==joyId
        )
            return;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

canvas.addEventListener(

);

canvas.addEventListener(

            e.clientX-look.x;

);

canvas.addEventListener(

/* ============================================================
   ATAQUE
============================================================ */

function attack(){

    if(
        !running||
        paused||
        player.cooldown>0
    )
        return;

    player.attack=true;
    player.attackTime=0;
    player.cooldown=.42;

    const stats=getStats();

    /*
      Alcance reducido.
    */

    const range=TILE*1.45;

    for(const e of enemies){

        if(e.dead)
            continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance>range)
            continue;

        /*
          La pared también bloquea el ataque.
        */

        if(
            !lineOfSight(
                player.x,
                player.y,
                e.x,
                e.y
            )
        )
            continue;

        const targetAngle=
            Math.atan2(dy,dx);

        const difference=
            normalizeAngle(
                targetAngle-player.angle
            );

        /*
          Arco frontal del barrido.
        */

        if(Math.abs(difference)<.78){

            let damage=
                25*stats.damage;

            if(
                Math.random()<
                stats.crit
            ){

                damage*=stats.critDamage;

                message(
                    "¡GOLPE CRÍTICO!"
                );
            }

            e.hp-=damage;
            e.hit=.12;

            if(e.hp<=0){

                e.hp=0;
                e.dead=true;

                gainXP(25);

                message("+25 EXP");
            }
        }
    }
}

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}

/* ============================================================
   UPDATE
============================================================ */

function update(dt){

    if(
        !running||
        paused
    )
        return;

    player.cooldown=
        Math.max(
            0,
            player.cooldown-dt
        );

    skillCooldown=
        Math.max(
            0,
            skillCooldown-dt
        );

    if(player.attack){

        player.attackTime+=dt;

        if(
            player.attackTime>
            player.attackDuration
        ){

            player.attack=false;
        }
    }

    let mx=joyX;
    let my=joyY;

    const speed=
        110*
        getStats().speed;

    /*
      Joystick arriba = avanzar.
    */

    const forwardX=
        Math.cos(player.angle);

    const forwardY=
        Math.sin(player.angle);

    const rightX=
        Math.cos(
            player.angle+Math.PI/2
        );

    const rightY=
        Math.sin(
            player.angle+Math.PI/2
        );

    const length=
        Math.hypot(mx,my);

    if(length>1){

        mx/=length;
        my/=length;
    }

    const dx=
        (
            forwardX*(-my)+
            rightX*mx
        )*
        speed*
        dt;

    const dy=
        (
            forwardY*(-my)+
            rightY*mx
        )*
        speed*
        dt;

    movePlayer(dx,dy);

    updateCompanion(dt);
    updateEnemies(dt);

    checkDoor();

    if(messageTimer>0)
        messageTimer-=dt;
}

/* ============================================================
   RAYCAST
============================================================ */

function castRay(x,y,angle){

    const dx=Math.cos(angle);
    const dy=Math.sin(angle);

    let mx=Math.floor(x/TILE);
    let my=Math.floor(y/TILE);

    const deltaX=
        Math.abs(
            1/(dx||.000001)
        );

    const deltaY=
        Math.abs(
            1/(dy||.000001)
        );

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(dx<0){

        stepX=-1;

        sideX=
            (x/TILE-mx)*
            deltaX;

    }else{

        stepX=1;

        sideX=
            (mx+1-x/TILE)*
            deltaX;
    }

    if(dy<0){

        stepY=-1;

        sideY=
            (y/TILE-my)*
            deltaY;

    }else{

        stepY=1;

        sideY=
            (my+1-y/TILE)*
            deltaY;
    }

    let side=0;

    for(let i=0;i<180;i++){

        if(sideX<sideY){

            sideX+=deltaX;
            mx+=stepX;
            side=0;

        }else{

            sideY+=deltaY;
            my+=stepY;
            side=1;
        }

        if(isWallCell(mx,my)){

            let distance;

            if(side===0){

                distance=
                    (
                        mx-
                        x/TILE+
                        (1-stepX)/2
                    )/dx*TILE;

            }else{

                distance=
                    (
                        my-
                        y/TILE+
                        (1-stepY)/2
                    )/dy*TILE;
            }

            return{

                distance:Math.abs(distance),

                side,

                cellX:mx,
                cellY:my
            };
        }
    }

    return{
        distance:MAX_DEPTH,
        side:0,
        cellX:mx,
        cellY:my
    };
}

function isWallCell(x,y){

    if(
        x<0||
        y<0||
        x>=mapW||
        y>=mapH
    )
        return true;

    return map[y][x]===1;
}

/* ============================================================
   RENDER WALLS
============================================================ */

function renderWalls(){

    const horizon=
        H*.47;

    const rays=
        Math.min(
            360,
            Math.max(
                200,
                Math.floor(W*.72)
            )
        );

    const step=W/rays;

    for(let i=0;i<rays;i++){

        const sx=i*step;

        const camera=
            sx/W-.5;

        const angle=
            player.angle+
            camera*FOV;

        const hit=
            castRay(
                player.x,
                player.y,
                angle
            );

        let distance=
            hit.distance;

        /*
          Corrección fisheye.
        */

        distance*=
            Math.cos(
                angle-player.angle
            );

        distance=
            Math.max(
                1,
                distance
            );

        const wallHeight=
            TILE*
            H*.72/
            distance;

        const top=
            horizon-
            wallHeight/2;

        const bottom=
            horizon+
            wallHeight/2;

        /*
          Puerta integrada visualmente
          en la pared.
        */

        const isDoor=
            hit.cellX===door.x&&
            hit.cellY===door.y;

        if(isDoor){

            ctx.fillStyle="#2a2118";

            ctx.fillRect(
                sx,
                top,
                step+1,
                wallHeight
            );

            ctx.fillStyle="#0d0b08";

            ctx.fillRect(
                sx+step*.18,
                top+wallHeight*.08,
                step*.64,
                wallHeight*.92
            );

            ctx.fillStyle="#9c793b";

            ctx.fillRect(
                sx,
                top,
                step*.12,
                wallHeight
            );

            ctx.fillRect(
                sx+step*.88,
                top,
                step*.12,
                wallHeight
            );

        }else{

            const shade=
                hit.side===0
                ?1
                :.72;

            const depth=
                1-
                Math.min(
                    distance/MAX_DEPTH,
                    .7
                );

            const value=
                Math.floor(
                    80+
                    100*
                    shade*
                    depth
                );

            ctx.fillStyle=
                `rgb(${value},
                ${Math.floor(value*.78)},
                ${Math.floor(value*.51)})`;

            ctx.fillRect(
                sx,
                top,
                step+1,
                wallHeight
            );
        }
    }
}

/* ============================================================
   PROFUNDIDAD DE SPRITES
============================================================ */

/*
   Esta función es importante.

   Para cada sprite calculamos la columna de pantalla
   que ocupa y comprobamos el raycast de esa columna.

   Si una pared está más cerca que el enemigo,
   esa columna NO se dibuja.

   Resultado:
   el enemigo queda detrás de la pared,
   incluso parcialmente.
*/

function spriteVisibleColumn(
    sprite,
    screenX,
    distance
){

    const cameraX=
        screenX/W-.5;

    const rayAngle=
        player.angle+
        cameraX*FOV;

    const wall=
        castRay(
            player.x,
            player.y,
            rayAngle
        );

    const corrected=
        wall.distance*
        Math.cos(
            rayAngle-player.angle
        );

    return distance<
        corrected-4;
}

/* ============================================================
   SPRITES
============================================================ */

function renderSprites(){

    const list=[];

    for(const e of enemies){

        if(!e.dead)
            list.push({
                type:"enemy",
                object:e
            });
    }

    /*
      El compañero también es un sprite.
    */

    list.push({
        type:"companion",
        object:companion
    });

    list.sort((a,b)=>{

        const da=
            Math.hypot(
                a.object.x-player.x,
                a.object.y-player.y
            );

        const db=
            Math.hypot(
                b.object.x-player.x,
                b.object.y-player.y
            );

        return db-da;
    });

    for(const item of list){

        drawSprite(
            item.type,
            item.object
        );
    }
}

/* ============================================================
   DRAW SPRITE CON OCLUSIÓN REAL
============================================================ */

function drawSprite(type,o){

    const dx=o.x-player.x;
    const dy=o.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    if(distance<10)
        return;

    const relative=
        normalizeAngle(
            Math.atan2(dy,dx)-
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.68
    )
        return;

    /*
      Segunda seguridad:
      si el centro está detrás de una pared,
      ni siquiera comenzamos a dibujarlo.
    */

    if(
        !lineOfSight(
            player.x,
            player.y,
            o.x,
            o.y
        )
    )
        return;

    const projection=
        W/
        (
            2*
            Math.tan(FOV/2)
        );

    const screenX=
        W/2+
        Math.tan(relative)*
        projection;

    /*
      Altura de sprite.

      El punto inferior está SIEMPRE en el
      horizonte + escala del suelo.

      Esto mantiene los pies anclados.
    */

    const size=
        Math.min(
            H*1.15,
            TILE*
            H*.72/
            distance
        );

    /*
      Cámara de pie:
      línea del suelo fija.
    */

    const ground=
        H*.47+
        size*.50;

    const top=
        ground-size;

    const width=
        size*.45;

    /*
      Oclusión por columnas.

      No usamos solamente lineOfSight:
      cada columna del personaje se compara
      contra la pared correspondiente.
    */

    const start=
        Math.floor(
            screenX-width/2
        );

    const end=
        Math.ceil(
            screenX+width/2
        );

    for(let x=start;x<=end;x++){

        if(x<0||x>=W)
            continue;

        if(
            !spriteVisibleColumn(
                o,
                x,
                distance
            )
        )
            continue;

        const local=
            (x-screenX)/
            width;

        drawSpriteColumn(
            type,
            o,
            x,
            top,
            ground,
            size,
            local
        );
    }
}

/* ============================================================
   COLUMNA DE PERSONAJE
============================================================ */

function drawSpriteColumn(
    type,
    o,
    x,
    top,
    ground,
    size,
    local
){

    const a=Math.abs(local);

    /*
      cabeza
    */

    if(
        a<.34
    ){

        if(type==="enemy"){

            ctx.fillStyle=
                o.hit>0
                ?"white"
                :"#34241d";

        }else{

            ctx.fillStyle="#d7c18b";
        }

        ctx.beginPath();

        ctx.arc(
            x,
            top+size*.18,
            size*.14,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /*
      cuerpo
    */

    if(
        a<.42
    ){

        if(type==="enemy"){

            ctx.fillStyle=
                o.hit>0
                ?"white"
                :"#56362a";

        }else{

            ctx.fillStyle="#b9a16c";
        }

        ctx.fillRect(
            x,
            top+size*.30,
            1.2,
            size*.40
        );
    }

    /*
      brazos
    */

    if(
        a>.30&&
        a<.55
    ){

        ctx.fillStyle=
            type==="enemy"
            ?" #704332"
            :"#8c7549";

        ctx.fillRect(
            x,
            top+size*.34,
            1.2,
            size*.30
        );
    }

    /*
      piernas.

      TERMINAN EXACTAMENTE EN ground.
      Nunca por debajo del suelo.
    */

    if(
        a<.16
    ){

        ctx.fillStyle=
            type==="enemy"
            ?" #261b17"
            :"#624d31";

        ctx.fillRect(
            x,
            ground-size*.27,
            1.2,
            size*.27
        );
    }

    /*
      Barra de vida solamente para enemigos.
    */

    if(
        type==="enemy"&&
        a<.34
    ){

        const barWidth=
            size*.65;

        const barHeight=
            Math.max(
                3,
                size*.035
            );

        const left=
            x-
            (screenWidthHack=
                barWidth*.5
            );

        /*
          Se dibuja centrada por columna.
        */

        ctx.fillStyle="#170d0b";

        ctx.fillRect(
            x-barWidth*.5,
            top-size*.055,
            barWidth,
            barHeight
        );

        ctx.fillStyle="#c74739";

        ctx.fillRect(
            x-barWidth*.5,
            top-size*.055,
            barWidth*
            Math.max(
                0,
                o.hp/o.maxHp
            ),
            barHeight
        );
    }
}

/*
  Variable usada solamente para evitar
  cualquier dependencia externa.
*/
let screenWidthHack=0;

/* ============================================================
   ARMA
============================================================ */

function renderWeapon(){

    const progress=
        player.attack
        ?
        Math.min(
            1,
            player.attackTime/
            player.attackDuration
        )
        :0;

    /*
      Barrido horizontal suave.
    */

    const sweep=
        player.attack
        ?
        Math.sin(progress*Math.PI)
        :0;

    ctx.save();

    ctx.translate(
        W*.72,
        H*1.02
    );

    ctx.rotate(
        -.25+
        sweep*.95
    );

    const scale=
        Math.min(W,H)/650;

    ctx.scale(scale,scale);

    /*
      Brazo derecho.
    */

    ctx.fillStyle="#b17b55";

    ctx.fillRect(
        -8,
        -55,
        68,
        23
    );

    /*
      Mango.
    */

    ctx.fillStyle="#3a2619";

    ctx.fillRect(
        30,
        -95,
        14,
        105
    );

    /*
      Guarda.
    */

    ctx.fillStyle="#c9a650";

    ctx.fillRect(
        10,
        -91,
        54,
        10
    );

    /*
      Hoja.
    */

    ctx.fillStyle="#d9c79d";

    ctx.beginPath();

    ctx.moveTo(37,-90);
    ctx.lineTo(51,-90);
    ctx.lineTo(58,-275);
    ctx.lineTo(44,-304);
    ctx.lineTo(30,-275);

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#f0dda9";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();
}

/* ============================================================
   MIRA
============================================================ */

function renderCrosshair(){

    const x=W/2;
    const y=H*.47;

    ctx.strokeStyle="#f3e4be";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x-10,y);
    ctx.lineTo(x-3,y);

    ctx.moveTo(x+3,y);
    ctx.lineTo(x+10,y);

    ctx.moveTo(x,y-10);
    ctx.lineTo(x,y-3);

    ctx.moveTo(x,y+3);
    ctx.lineTo(x,y+10);

    ctx.stroke();

    ctx.fillStyle="#dfbd64";

    ctx.fillRect(
        x-1,
        y-1,
        2,
        2
    );
}

/* ============================================================
   MINI MAP
============================================================ */

function renderMiniMap(){

    const r=
        mini.getBoundingClientRect();

    const mw=r.width;
    const mh=r.height;

    if(mw<=0||mh<=0)
        return;

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    mini.width=
        Math.floor(mw*dpr);

    mini.height=
        Math.floor(mh*dpr);

    mctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    mctx.fillStyle="#100d09";

    mctx.fillRect(
        0,0,mw,mh
    );

    /*
      Siempre entra el mapa COMPLETO.
    */

    const scale=
        Math.min(
            (mw-8)/(mapW*TILE),
            (mh-8)/(mapH*TILE)
        );

    const ox=
        (mw-
        mapW*TILE*scale)/2;

    const oy=
        (mh-
        mapH*TILE*scale)/2;

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            if(map[y][x]===0){

                mctx.fillStyle="#bca06a";

            }else{

                mctx.fillStyle="#35291b";
            }

            mctx.fillRect(
                ox+
                x*TILE*scale,
                oy+
                y*TILE*scale,
                TILE*scale+.4,
                TILE*scale+.4
            );
        }
    }

    /*
      PUERTA
    */

    mctx.fillStyle="#e0b84e";

    mctx.fillRect(
        ox+
        door.x*TILE*scale,
        oy+
        door.y*TILE*scale,
        TILE*scale,
        TILE*scale
    );

    /*
      ENEMIGOS
    */

    for(const e of enemies){

        if(e.dead)
            continue;

        mctx.fillStyle="#c74338";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(2,3*scale),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
      COMPAÑERO
    */

    mctx.fillStyle="#64c5d1";

    mctx.beginPath();

    mctx.arc(
        ox+companion.x*scale,
        oy+companion.y*scale,
        Math.max(2,3*scale),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      JUGADOR
    */

    const px=
        ox+player.x*scale;

    const py=
        oy+player.y*scale;

    mctx.fillStyle="#f2d87b";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(3,4*scale),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      Dirección.
    */

    mctx.strokeStyle="#f2d87b";
    mctx.lineWidth=2;

    mctx.beginPath();

    mctx.moveTo(px,py);

    mctx.lineTo(
        px+
        Math.cos(player.angle)*13,
        py+
        Math.sin(player.angle)*13
    );

    mctx.stroke();
}

/* ============================================================
   HUD
============================================================ */

function updateHUD(){

    const stats=getStats();

    document.getElementById(
        "level"
    ).textContent=
        "NIVEL "+
        save.level;

    document.getElementById(
        "hpBar"
    ).style.width=
        Math.max(
            0,
            player.hp/
            stats.maxHp*
            100
        )+"%";

    const needed=
        100+
        (save.level-1)*60;

    document.getElementById(
        "xpBar"
    ).style.width=
        Math.min(
            100,
            save.xp/needed*100
        )+"%";

    document.getElementById(
        "statText"
    ).textContent=
        "VEL "+
        stats.speed.toFixed(2)+
        " · EVA "+
        Math.round(stats.evade*100)+
        "% · CRIT "+
        Math.round(stats.crit*100)+
        "%";

    document.getElementById(
        "godInfo"
    ).textContent=
        GODS[selectedGod].glyph+
        " "+
        GODS[selectedGod].name;
}

/* ============================================================
   RENDER
============================================================ */

function render(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=
        Math.floor(
            W*
            Math.min(
                2,
                devicePixelRatio||1
            )
        );

    canvas.height=
        Math.floor(
            H*
            Math.min(
                2,
                devicePixelRatio||1
            )
        );

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    const horizon=
        H*.47;

    /*
      CIELO
    */

    const sky=
        ctx.createLinearGradient(
            0,0,0,horizon
        );

    sky.addColorStop(
        0,
        "#806b4d"
    );

    sky.addColorStop(
        1,
        "#c8a86e"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,horizon
    );

    /*
      SUELO ARENA.

      No se refleja.
    */

    const floor=
        ctx.createLinearGradient(
            0,horizon,0,H
        );

    floor.addColorStop(
        0,
        "#b28e55"
    );

    floor.addColorStop(
        1,
        "#cfad72"
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    renderWalls();

    /*
      Sprites después de las paredes,
      pero con comprobación de profundidad
      columna por columna.
    */

    renderSprites();

    renderWeapon();

    renderCrosshair();

    updateHUD();
    renderMiniMap();
}

/* ============================================================
   START
============================================================ */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="block";

        running=true;
        paused=false;

        newMap();

        last=performance.now();
    }
);

/* ============================================================
   DIOS SELECT
============================================================ */

document.querySelectorAll(
    ".god"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document.querySelectorAll(
                ".god"
            ).forEach(
                b=>b.classList.remove(
                    "selected"
                )
            );

            button.classList.add(
                "selected"
            );

            selectedGod=
                button.dataset.god;

            saveGame();
        }
    );
});

/* ============================================================
   BOTONES
============================================================ */

document.getElementById(
    "attack"
).addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        attack();
    }
);

document.getElementById(
    "skill"
).addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        godSkill();
    }
);

document.getElementById(
    "pause"
).addEventListener(
    "click",
    ()=>{
        paused=true;

        document.getElementById(
            "pauseScreen"
        ).style.display="flex";
    }
);

document.getElementById(
    "resume"
).addEventListener(
    "click",
    ()=>{
        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";
    }
);

document.getElementById(
    "backMenu"
).addEventListener(
    "click",
    ()=>{

        running=false;
        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="none";

        document.getElementById(
            "menu"
        ).style.display="flex";
    }
);

/* ============================================================
   LOOP
============================================================ */

let last=performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );

    last=now;

    update(dt);

    if(running)
        render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
