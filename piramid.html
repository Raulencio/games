<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BEAST HUNTER</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080a08;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* ================= ESTADÍSTICAS ================= */

#stats{
    position:absolute;
    left:12px;
    top:12px;
    width:220px;
}

.title{
    color:#e0c77b;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 2px 5px #000;
    margin-bottom:7px;
}

.status{
    color:#fff;
    font-size:12px;
    margin-bottom:5px;
    text-shadow:0 2px 4px #000;
}

.bar{
    height:14px;
    width:100%;
    background:#20221f;
    border:2px solid #111;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:5px;
}

.bar span{
    display:block;
    width:100%;
    height:100%;
}

.hp span{
    background:#b83333;
}

.stamina span{
    background:#c19a3a;
}

.beastbar span{
    background:#7b3f38;
}

.capturebar span{
    background:#4f7c52;
}

/* ================= MINI MAP ================= */

#miniMap{
    position:absolute;
    right:12px;
    top:12px;
    width:130px;
    height:130px;
    border:3px solid #b8a36b;
    border-radius:50%;
    background:#182019;
    box-shadow:0 4px 15px #000;
}

/* ================= CRUZ ================= */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    opacity:.8;
}

#crosshair:before{
    width:2px;
    height:24px;
    left:11px;
}

#crosshair:after{
    height:2px;
    width:24px;
    top:11px;
}

/* ================= JOYSTICK ================= */

#joystick{
    position:absolute;
    left:18px;
    bottom:20px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff0d;
    border:2px solid #ffffff25;
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:32px;
    top:32px;
    width:57px;
    height:57px;
    border-radius:50%;
    background:#cbb47755;
    border:2px solid #d7c68f88;
}

/* ================= BOTONES ================= */

#buttons{
    position:absolute;
    right:15px;
    bottom:16px;
    width:215px;
    height:205px;
    pointer-events:auto;
}

.button{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:#131713dd;
    border:2px solid #ffffff32;
    box-shadow:0 4px 12px #000;
    font-weight:bold;
}

.button:active{
    transform:scale(.92);
    background:#715a32;
}

#attack{
    right:0;
    bottom:30px;
    width:85px;
    height:85px;
    border-radius:50%;
    font-size:30px;
}

#net{
    right:98px;
    bottom:4px;
    width:65px;
    height:65px;
    border-radius:50%;
    font-size:25px;
}

#dodge{
    right:110px;
    bottom:95px;
    width:60px;
    height:60px;
    border-radius:50%;
}

#camera{
    right:0;
    top:0;
    width:78px;
    height:54px;
    border-radius:15px;
    font-size:11px;
}

/* ================= MENSAJE ================= */

#message{
    position:absolute;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    opacity:0;
    white-space:nowrap;
}

/* ================= ESTADO BESTIA ================= */

#beastStatus{
    position:absolute;
    left:50%;
    top:18%;
    transform:translateX(-50%);
    text-align:center;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#beastName{
    color:#d7bd72;
    font-size:20px;
    letter-spacing:1px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">

        <div class="title">
            BEAST HUNTER
        </div>

        <div class="status" id="playerStatus">
            CAZADOR · NIVEL 1
        </div>

        <div class="bar hp">
            <span id="hpBar"></span>
        </div>

        <div class="bar stamina">
            <span id="staminaBar"></span>
        </div>

        <div class="bar beastbar">
            <span id="beastHpBar"></span>
        </div>

        <div class="bar capturebar">
            <span id="captureBar"></span>
        </div>

    </div>

    <div id="beastStatus">
        <div id="beastName">
            BESTIA ALFA
        </div>
        <div id="beastState">
            ESTADO: NORMAL
        </div>
    </div>

    <canvas
        id="miniMap"
        width="130"
        height="130">
    </canvas>

    <div id="crosshair"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">

        <div
            id="camera"
            class="button">
            1P / 3P
        </div>

        <div
            id="dodge"
            class="button">
            ↪
        </div>

        <div
            id="net"
            class="button">
            🕸
        </div>

        <div
            id="attack"
            class="button">
            ⚔
        </div>

    </div>

    <div id="message"></div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MAPA
========================================================= */

const MAP=[
"####################",
"#..................#",
"#..................#",
"#....####..........#",
"#....#.............#",
"#....#......###....#",
"#...........#......#",
"#...........#......#",
"#..................#",
"#......###.........#",
"#..................#",
"#..........####....#",
"#..................#",
"#....#.............#",
"#....#.............#",
"#..................#",
"#..................#",
"#..............#...#",
"#..................#",
"####################"
];

const MAP_W=20;
const MAP_H=20;

function wall(x,y){

    const gx=Math.floor(x);
    const gy=Math.floor(y);

    if(
        gx<0 ||
        gy<0 ||
        gx>=MAP_W ||
        gy>=MAP_H
    ){
        return true;
    }

    return MAP[gy][gx]==="#";
}

function free(x,y,r){

    return !(
        wall(x-r,y-r) ||
        wall(x+r,y-r) ||
        wall(x-r,y+r) ||
        wall(x+r,y+r)
    );
}

function moveEntity(e,dx,dy){

    const nx=e.x+dx;
    const ny=e.y+dy;

    if(
        free(
            nx,
            e.y,
            e.radius
        )
    ){
        e.x=nx;
    }

    if(
        free(
            e.x,
            ny,
            e.radius
        )
    ){
        e.y=ny;
    }
}


/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:2.7,
    y:2.7,

    angle:0,

    radius:.25,

    speed:2.7,

    hp:100,
    maxHp:100,

    stamina:100,
    maxStamina:100,

    level:1,

    attackTimer:0,
    attackCooldown:0,

    dodgeTimer:0,

    moving:false
};


/* =========================================================
   CÁMARA
========================================================= */

let thirdPerson=false;

let cameraDistance=4;

const MIN_ZOOM=1.8;
const MAX_ZOOM=7;

let cameraPitch=0;

const MIN_PITCH=-.65;
const MAX_PITCH=.65;

const camera={

    x:player.x,
    y:player.y,

    angle:player.angle,

    pitch:0
};


/* =========================================================
   LA BESTIA
========================================================= */

const beast={

    /*
        Una única bestia grande
        por mapa.
    */

    x:14.5,
    y:9.5,

    radius:.75,

    maxHp:1000,
    hp:1000,

    maxStamina:100,
    stamina:100,

    state:"normal",

    angle:0,

    speed:1.15,

    hitTimer:0,

    attackTimer:0,

    tiredTimer:0,

    downTimer:0,

    netTimer:0,

    escapeTimer:0,

    captureProgress:0,

    alive:true
};


/*
    Estados posibles:

    normal
    herida
    cansada
    noqueada
    atrapada
    huida
*/


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joyX=0;
let joyY=0;
let joyPointer=null;


joystick.addEventListener(
    "pointerdown",
    e=>{

        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId===joyPointer
        ){
            updateJoystick(e);
        }
    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(e){

    const r=
        joystick.getBoundingClientRect();

    let x=
        e.clientX-
        (r.left+r.width/2);

    let y=
        e.clientY-
        (r.top+r.height/2);

    const max=45;

    const d=Math.hypot(x,y);

    if(d>max){

        x=x/d*max;
        y=y/d*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform=
        `translate(${x}px,${y}px)`;
}


function resetJoystick(){

    joyPointer=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}


/* =========================================================
   CÁMARA TÁCTIL
========================================================= */

const touches=new Map();

let previousX=0;
let previousY=0;

let pinchDistance=0;
let pinchZoom=4;


canvas.addEventListener(
    "pointerdown",
    e=>{

        touches.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(touches.size===1){

            previousX=e.clientX;
            previousY=e.clientY;
        }

        if(touches.size===2){

            pinchDistance=
                getPinchDistance();

            pinchZoom=
                cameraDistance;
        }
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            !touches.has(e.pointerId)
        ){
            return;
        }

        touches.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
            DOS DEDOS:
            acercar / alejar
        */

        if(touches.size>=2){

            const d=
                getPinchDistance();

            const change=
                d-pinchDistance;

            cameraDistance=
                pinchZoom-
                change*.012;

            cameraDistance=
                Math.max(
                    MIN_ZOOM,
                    Math.min(
                        MAX_ZOOM,
                        cameraDistance
                    )
                );

            return;
        }


        /*
            UN DEDO:
            mirar
        */

        const dx=
            e.clientX-previousX;

        const dy=
            e.clientY-previousY;

        player.angle+=dx*.004;

        cameraPitch+=dy*.005;

        cameraPitch=
            Math.max(
                MIN_PITCH,
                Math.min(
                    MAX_PITCH,
                    cameraPitch
                )
            );

        previousX=e.clientX;
        previousY=e.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    removeTouch
);

canvas.addEventListener(
    "pointercancel",
    removeTouch
);


function removeTouch(e){

    touches.delete(
        e.pointerId
    );

    if(
        touches.size<2
    ){
        pinchDistance=0;
    }
}


function getPinchDistance(){

    const values=
        [...touches.values()];

    if(values.length<2)
        return 0;

    return Math.hypot(
        values[0].x-values[1].x,
        values[0].y-values[1].y
    );
}


/* =========================================================
   CAMBIO 1P / 3P
========================================================= */

document
.getElementById("camera")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        thirdPerson=!thirdPerson;

        showMessage(
            thirdPerson
            ? "TERCERA PERSONA"
            : "PRIMERA PERSONA"
        );
    }
);


/* =========================================================
   ATAQUE
========================================================= */

document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();
    }
);


function attack(){

    if(
        player.attackCooldown>0
    ){
        return;
    }

    player.attackCooldown=.48;

    player.attackTimer=.28;


    if(
        beast.state==="atrapada" ||
        beast.state==="huida"
    ){
        return;
    }


    const dx=
        beast.x-player.x;

    const dy=
        beast.y-player.y;

    const distance=
        Math.hypot(dx,dy);


    /*
        Alcance del arma.
    */

    if(distance>2.9){

        showMessage(
            "DEMASIADO LEJOS"
        );

        return;
    }


    /*
        Auto orientación.
    */

    player.angle=
        Math.atan2(
            dy,
            dx
        );


    /*
        DAÑO
    */

    beast.hp-=45;

    beast.hitTimer=.18;

    /*
        Cada golpe reduce energía.
        Cuando llega a 0 queda cansada.
    */

    beast.stamina-=15;


    if(
        beast.hp<=0
    ){

        beast.hp=0;

        beast.state=
            "cansada";
    }


    if(
        beast.stamina<=0 &&
        beast.state==="normal"
    ){

        beast.stamina=0;

        beast.state=
            "cansada";

        beast.tiredTimer=3;

        showMessage(
            "¡LA BESTIA ESTÁ CANSADA!"
        );

        return;
    }


    if(
        beast.state==="normal" ||
        beast.state==="cansada"
    ){

        showMessage(
            "⚔ GOLPE · -45"
        );
    }


    /*
        Mucho daño acumulado:
        posibilidad de caída.
    */

    if(
        beast.hp<350 &&
        beast.state!=="cansada"
    ){

        beast.state=
            "noqueada";

        beast.downTimer=5;

        showMessage(
            "¡BESTIA NOQUEADA!"
        );
    }
}


/* =========================================================
   RED
========================================================= */

document
.getElementById("net")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        useNet();
    }
);


function useNet(){

    /*
        La red solo funciona
        cuando la bestia está cansada
        o noqueada.
    */

    if(
        beast.state!=="cansada" &&
        beast.state!=="noqueada"
    ){

        showMessage(
            "LA BESTIA AÚN PUEDE LUCHAR"
        );

        return;
    }


    const dx=
        beast.x-player.x;

    const dy=
        beast.y-player.y;

    const distance=
        Math.hypot(dx,dy);


    if(distance>3){

        showMessage(
            "ACÉRCATE A LA BESTIA"
        );

        return;
    }


    beast.state=
        "atrapada";

    beast.netTimer=
        4;

    beast.captureProgress=0;

    showMessage(
        "🕸 ¡RED COLOCADA!"
    );
}


/* =========================================================
   ESQUIVA
========================================================= */

document
.getElementById("dodge")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(
            player.stamina<25
        ){
            return;
        }

        player.stamina-=25;

        player.dodgeTimer=.25;
    }
);


/* =========================================================
   MOVIMIENTO JUGADOR
========================================================= */

function updatePlayer(dt){

    if(
        player.attackTimer>0
    ){
        player.attackTimer-=dt;
    }

    if(
        player.attackCooldown>0
    ){
        player.attackCooldown-=dt;
    }

    if(
        player.dodgeTimer>0
    ){
        player.dodgeTimer-=dt;
    }


    player.stamina=
        Math.min(
            player.maxStamina,
            player.stamina+
            25*dt
        );


    const forward=-joyY;
    const strafe=joyX;

    const input=
        Math.hypot(
            forward,
            strafe
        );


    player.moving=
        input>.1;


    if(!player.moving)
        return;


    let f=forward;
    let s=strafe;


    if(input>1){

        f/=input;
        s/=input;
    }


    let speed=
        player.speed;


    if(
        player.dodgeTimer>0
    ){
        speed=5.5;
    }


    const cos=
        Math.cos(player.angle);

    const sin=
        Math.sin(player.angle);


    const dx=
        (
            cos*f-
            sin*s
        )*
        speed*
        dt;


    const dy=
        (
            sin*f+
            cos*s
        )*
        speed*
        dt;


    moveEntity(
        player,
        dx,
        dy
    );


    /*
        En tercera persona
        el personaje acompaña
        automáticamente la dirección.
    */

    if(thirdPerson){

        const target=
            Math.atan2(
                dy,
                dx
            );

        const diff=
            normalizeAngle(
                target-player.angle
            );

        player.angle+=
            diff*
            Math.min(
                1,
                dt*8
            );
    }
}


/* =========================================================
   IA DE LA BESTIA
========================================================= */

function updateBeast(dt){

    if(
        !beast.alive
    ){
        return;
    }


    if(
        beast.hitTimer>0
    ){
        beast.hitTimer-=dt;
    }


    /*
        ESTADO ATRAPADA
    */

    if(
        beast.state==="atrapada"
    ){

        beast.netTimer-=dt;

        /*
            La bestia intenta romper
            la red.
        */

        beast.captureProgress+=
            dt*22;


        /*
            Probabilidad de romperla
            antes de ser capturada.
        */

        if(
            beast.netTimer<=0
        ){

            beast.state=
                "normal";

            beast.stamina=
                30;

            beast.captureProgress=0;

            beast.escapeTimer=3;

            showMessage(
                "¡LA BESTIA ROMPIÓ LA RED!"
            );

            return;
        }


        if(
            beast.captureProgress>=100
        ){

            beast.state=
                "capturada";

            beast.alive=false;

            showMessage(
                "🏆 ¡BESTIA CAPTURADA!"
            );

            return;
        }

        return;
    }


    /*
        ESTADO NOQUEADA
    */

    if(
        beast.state==="noqueada"
    ){

        beast.downTimer-=dt;


        if(
            beast.downTimer<=0
        ){

            beast.state=
                "normal";

            beast.stamina=50;

            showMessage(
                "¡LA BESTIA SE LEVANTÓ!"
            );
        }

        return;
    }


    /*
        ESTADO CANSADA
    */

    if(
        beast.state==="cansada"
    ){

        beast.tiredTimer-=dt;

        beast.stamina+=
            10*dt;


        /*
            Si está sin vida
            queda derribada.
        */

        if(
            beast.hp<=0
        ){

            beast.state=
                "noqueada";

            beast.downTimer=5;

            showMessage(
                "¡LA BESTIA CAYÓ!"
            );

            return;
        }


        /*
            Recuperación.
        */

        if(
            beast.stamina>=35 &&
            beast.tiredTimer<=0
        ){

            beast.stamina=35;

            beast.state=
                "normal";

            showMessage(
                "LA BESTIA SE RECUPERÓ"
            );
        }

        return;
    }


    /*
        HUIDA
    */

    if(
        beast.escapeTimer>0
    ){

        beast.escapeTimer-=dt;

        const escapeAngle=
            Math.atan2(
                beast.y-player.y,
                beast.x-player.x
            );


        moveEntity(
            beast,
            Math.cos(
                escapeAngle
            )*
            beast.speed*
            2*
            dt,

            Math.sin(
                escapeAngle
            )*
            beast.speed*
            2*
            dt
        );

        return;
    }


    /*
        COMBATE NORMAL
    */

    const dx=
        player.x-beast.x;

    const dy=
        player.y-beast.y;

    const distance=
        Math.hypot(
            dx,
            dy
        );


    beast.angle=
        Math.atan2(
            dy,
            dx
        );


    /*
        Persigue al cazador.
    */

    if(
        distance<9 &&
        distance>1.5
    ){

        moveEntity(
            beast,

            Math.cos(beast.angle)*
            beast.speed*
            dt,

            Math.sin(beast.angle)*
            beast.speed*
            dt
        );
    }


    /*
        Ataque de la bestia.
    */

    beast.attackTimer-=dt;


    if(
        distance<=1.5 &&
        beast.attackTimer<=0
    ){

        beast.attackTimer=1.25;


        if(
            player.dodgeTimer<=0
        ){

            player.hp-=15;

            showMessage(
                "¡LA BESTIA TE GOLPEÓ!"
            );
        }
    }


    /*
        Recuperación gradual
        de energía.
    */

    beast.stamina=
        Math.min(
            beast.maxStamina,
            beast.stamina+
            4*dt
        );
}


/* =========================================================
   ÁNGULO
========================================================= */

function normalizeAngle(a){

    return Math.atan2(
        Math.sin(a),
        Math.cos(a)
    );
}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(dt){

    let tx;
    let ty;


    if(!thirdPerson){

        tx=player.x;
        ty=player.y;

    }else{

        const behind=
            player.angle+
            Math.PI;


        tx=
            player.x+
            Math.cos(behind)*
            cameraDistance;


        ty=
            player.y+
            Math.sin(behind)*
            cameraDistance;


        /*
            La cámara no atraviesa
            paredes.
        */

        if(
            !free(
                tx,
                ty,
                .18
            )
        ){

            for(
                let d=cameraDistance;
                d>=MIN_ZOOM;
                d-=.15
            ){

                const testX=
                    player.x+
                    Math.cos(behind)*d;

                const testY=
                    player.y+
                    Math.sin(behind)*d;


                if(
                    free(
                        testX,
                        testY,
                        .18
                    )
                ){

                    tx=testX;
                    ty=testY;

                    break;
                }
            }
        }
    }


    const smooth=
        1-Math.pow(
            .001,
            dt
        );


    camera.x+=
        (tx-camera.x)*
        smooth;

    camera.y+=
        (ty-camera.y)*
        smooth;

    camera.angle+=
        normalizeAngle(
            player.angle-
            camera.angle
        )*
        smooth;

    camera.pitch+=
        (
            cameraPitch-
            camera.pitch
        )*
        smooth;
}


/* =========================================================
   RAYCAST
========================================================= */

const FOV=Math.PI/3;

const RAYS=220;

const MAX_DEPTH=20;


function raycast(angle){

    const dx=Math.cos(angle);
    const dy=Math.sin(angle);

    let distance=0;

    while(
        distance<MAX_DEPTH
    ){

        distance+=.035;

        const x=
            camera.x+
            dx*distance;

        const y=
            camera.y+
            dy*distance;


        if(
            wall(x,y)
        ){
            return distance;
        }
    }

    return MAX_DEPTH;
}


/* =========================================================
   RENDER MUNDO
========================================================= */

function renderWorld(){

    const horizon=
        H/2+
        camera.pitch*
        H*.5;


    /*
        CIELO
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon
        );

    sky.addColorStop(
        0,
        "#17262b"
    );

    sky.addColorStop(
        1,
        "#68725e"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );


    /*
        TERRENO
    */

    const ground=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    ground.addColorStop(
        0,
        "#50523e"
    );

    ground.addColorStop(
        1,
        "#11140f"
    );

    ctx.fillStyle=ground;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    const rays=
        Math.min(
            RAYS,
            Math.floor(W/3)
        );

    const column=
        W/rays;

    const depth=[];


    for(
        let i=0;
        i<rays;
        i++
    ){

        const angle=
            camera.angle-
            FOV/2+
            i/rays*FOV;


        let distance=
            raycast(angle);


        distance*=
            Math.cos(
                angle-camera.angle
            );


        depth[i]=distance;


        const wallHeight=
            Math.min(
                H*1.7,
                H/
                (distance+.001)*
                1.15
            );


        const top=
            horizon-
            wallHeight/2;


        const shade=
            Math.max(
                20,
                120-distance*6
            );


        ctx.fillStyle=
            `rgb(
                ${Math.floor(shade)},
                ${Math.floor(shade*.87)},
                ${Math.floor(shade*.68)}
            )`;


        ctx.fillRect(
            i*column,
            top,
            column+1,
            wallHeight
        );
    }


    renderBeast(
        depth,
        rays,
        column,
        horizon
    );


    if(thirdPerson){

        renderPlayer(
            depth,
            rays,
            column,
            horizon
        );

    }else{

        renderWeapon();
    }
}


/* =========================================================
   RENDER BESTIA
========================================================= */

function renderBeast(
    depth,
    rays,
    column,
    horizon
){

    if(
        !beast.alive
    ){
        return;
    }


    const dx=
        beast.x-camera.x;

    const dy=
        beast.y-camera.y;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    let relative=
        Math.atan2(
            dy,
            dx
        )-
        camera.angle;


    relative=
        normalizeAngle(relative);


    if(
        Math.abs(relative)>FOV*.8
    ){
        return;
    }


    const screenX=
        W/2+
        Math.tan(relative)/
        Math.tan(FOV/2)*
        W/2;


    const size=
        Math.min(
            H*1.7,
            H/
            (distance+.001)*
            1.35
        );


    const index=
        Math.floor(
            screenX/column
        );


    if(
        index>=0 &&
        index<rays &&
        distance>
        depth[index]+.5
    ){
        return;
    }


    const baseY=
        horizon+
        size*.4;


    drawBeast(
        screenX,
        baseY,
        size
    );
}


/* =========================================================
   DIBUJAR BESTIA
========================================================= */

function drawBeast(
    x,
    y,
    s
){

    ctx.save();


    const scale=
        Math.max(
            40,
            s
        );


    /*
        Sombra
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        scale*.48,
        scale*.10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CUERPO GRANDE
    */

    ctx.fillStyle=
        beast.hitTimer>0
        ? "#eee"
        : "#554636";


    ctx.beginPath();

    ctx.ellipse(
        x,
        y-scale*.53,
        scale*.43,
        scale*.35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CUELLO
    */

    ctx.fillStyle=
        "#493b2e";

    ctx.fillRect(
        x-scale*.20,
        y-scale*.83,
        scale*.40,
        scale*.30
    );


    /*
        CABEZA
    */

    ctx.fillStyle=
        "#66513d";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y-scale*1.02,
        scale*.28,
        scale*.25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CUERNOS
    */

    ctx.strokeStyle=
        "#21170e";

    ctx.lineWidth=
        Math.max(
            4,
            scale*.055
        );

    ctx.beginPath();

    ctx.moveTo(
        x-scale*.18,
        y-scale*1.13
    );

    ctx.lineTo(
        x-scale*.40,
        y-scale*1.40
    );

    ctx.moveTo(
        x+scale*.18,
        y-scale*1.13
    );

    ctx.lineTo(
        x+scale*.40,
        y-scale*1.40
    );

    ctx.stroke();


    /*
        PATAS
    */

    ctx.strokeStyle=
        "#30271e";

    ctx.lineWidth=
        Math.max(
            5,
            scale*.09
        );

    ctx.beginPath();

    ctx.moveTo(
        x-scale*.27,
        y-scale*.36
    );

    ctx.lineTo(
        x-scale*.30,
        y
    );

    ctx.moveTo(
        x-scale*.08,
        y-scale*.30
    );

    ctx.lineTo(
        x-scale*.10,
        y
    );

    ctx.moveTo(
        x+scale*.08,
        y-scale*.30
    );

    ctx.lineTo(
        x+scale*.10,
        y
    );

    ctx.moveTo(
        x+scale*.27,
        y-scale*.36
    );

    ctx.lineTo(
        x+scale*.30,
        y
    );

    ctx.stroke();


    /*
        OJOS
    */

    ctx.fillStyle=
        "#d7ae3b";

    ctx.beginPath();

    ctx.arc(
        x-scale*.11,
        y-scale*1.03,
        scale*.045,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+scale*.11,
        y-scale*1.03,
        scale*.045,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        COLA
    */

    ctx.strokeStyle=
        "#493628";

    ctx.lineWidth=
        Math.max(
            4,
            scale*.055
        );

    ctx.beginPath();

    ctx.moveTo(
        x+scale*.38,
        y-scale*.60
    );

    ctx.quadraticCurveTo(
        x+scale*.65,
        y-scale*.80,
        x+scale*.62,
        y-scale*.48
    );

    ctx.stroke();


    /*
        RED
    */

    if(
        beast.state==="atrapada"
    ){

        ctx.strokeStyle=
            "#e2e2df";

        ctx.lineWidth=
            Math.max(
                3,
                scale*.025
            );

        ctx.beginPath();

        ctx.moveTo(
            x-scale*.48,
            y-scale*1.15
        );

        ctx.lineTo(
            x+scale*.48,
            y-scale*.30
        );

        ctx.moveTo(
            x+scale*.48,
            y-scale*1.15
        );

        ctx.lineTo(
            x-scale*.48,
            y-scale*.30
        );

        ctx.stroke();
    }


    /*
        VIDA DE LA BESTIA
    */

    const bw=
        scale*.9;

    ctx.fillStyle="#111";

    ctx.fillRect(
        x-bw/2,
        y-scale*1.55,
        bw,
        9
    );

    ctx.fillStyle="#9b3b35";

    ctx.fillRect(
        x-bw/2,
        y-scale*1.55,
        bw*
        Math.max(
            0,
            beast.hp/
            beast.maxHp
        ),
        9
    );


    ctx.restore();
}


/* =========================================================
   JUGADOR 3P
========================================================= */

function renderPlayer(
    depth,
    rays,
    column,
    horizon
){

    const dx=
        player.x-camera.x;

    const dy=
        player.y-camera.y;


    const distance=
        Math.hypot(dx,dy);


    let relative=
        Math.atan2(
            dy,
            dx
        )-
        camera.angle;


    relative=
        normalizeAngle(relative);


    if(
        Math.abs(relative)>FOV*.8
    ){
        return;
    }


    const x=
        W/2+
        Math.tan(relative)/
        Math.tan(FOV/2)*
        W/2;


    const size=
        Math.min(
            H,
            H/
            (distance+.001)*
            .8
        );


    drawPlayer(
        x,
        horizon+size*.45,
        size
    );
}


function drawPlayer(
    x,
    y,
    s
){

    s=Math.max(30,s);

    ctx.save();


    /*
        sombra
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        s*.25,
        s*.08,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        piernas
    */

    ctx.strokeStyle="#24282b";

    ctx.lineWidth=s*.11;

    ctx.beginPath();

    ctx.moveTo(
        x-s*.08,
        y-s*.30
    );

    ctx.lineTo(
        x-s*.12,
        y
    );

    ctx.moveTo(
        x+s*.08,
        y-s*.30
    );

    ctx.lineTo(
        x+s*.12,
        y
    );

    ctx.stroke();


    /*
        cuerpo
    */

    ctx.fillStyle="#38464b";

    ctx.beginPath();

    ctx.roundRect(
        x-s*.19,
        y-s*.83,
        s*.38,
        s*.53,
        s*.08
    );

    ctx.fill();


    /*
        cabeza
    */

    ctx.fillStyle="#b98162";

    ctx.beginPath();

    ctx.arc(
        x,
        y-s*1.02,
        s*.17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        espada
    */

    ctx.strokeStyle="#d5d8dc";

    ctx.lineWidth=
        Math.max(
            2,
            s*.045
        );

    ctx.beginPath();

    ctx.moveTo(
        x+s*.20,
        y-s*.45
    );

    ctx.lineTo(
        x+s*.50,
        y-s*.98
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ARMA 1P
========================================================= */

function renderWeapon(){

    let swing=0;


    if(
        player.attackTimer>0
    ){

        const p=
            1-
            player.attackTimer/
            .28;

        swing=
            Math.sin(
                p*Math.PI
            )*
            100;
    }


    ctx.save();


    ctx.translate(
        W*.78+swing,
        H*.8
    );

    ctx.rotate(
        -.32+
        swing*.003
    );


    ctx.fillStyle="#9d6d4e";

    ctx.fillRect(
        -25,
        20,
        70,
        34
    );


    ctx.fillStyle="#392317";

    ctx.fillRect(
        18,
        -18,
        20,
        65
    );


    ctx.fillStyle="#c19c55";

    ctx.fillRect(
        -12,
        -23,
        70,
        11
    );


    ctx.fillStyle="#d4d8da";

    ctx.beginPath();

    ctx.moveTo(
        21,
        -23
    );

    ctx.lineTo(
        40,
        -205
    );

    ctx.lineTo(
        55,
        -23
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   MINIMAPA
========================================================= */

const mini=
    document.getElementById(
        "miniMap"
    );

const mctx=
    mini.getContext("2d");


function renderMinimap(){

    mctx.clearRect(
        0,
        0,
        130,
        130
    );


    const scale=6;


    mctx.save();

    mctx.translate(
        65-player.x*scale,
        65-player.y*scale
    );


    for(
        let y=0;
        y<MAP_H;
        y++
    ){

        for(
            let x=0;
            x<MAP_W;
            x++
        ){

            if(
                MAP[y][x]==="#"
            ){

                mctx.fillStyle=
                    "#55534b";

                mctx.fillRect(
                    x*scale,
                    y*scale,
                    scale+1,
                    scale+1
                );
            }
        }
    }


    /*
        BESTIA
    */

    if(beast.alive){

        mctx.fillStyle=
            "#b83b36";

        mctx.beginPath();

        mctx.arc(
            beast.x*scale,
            beast.y*scale,
            5,
            0,
            Math.PI*2
        );

        mctx.fill();
    }


    mctx.restore();


    /*
        jugador
    */

    mctx.fillStyle="#fff";

    mctx.beginPath();

    mctx.arc(
        65,
        65,
        4,
        0,
        Math.PI*2
    );

    mctx.fill();


    mctx.strokeStyle="#fff";

    mctx.beginPath();

    mctx.moveTo(
        65,
        65
    );

    mctx.lineTo(
        65+
        Math.cos(player.angle)*14,

        65+
        Math.sin(player.angle)*14
    );

    mctx.stroke();
}


/* =========================================================
   ESTADO DE LA BESTIA
========================================================= */

function getBeastState(){

    switch(
        beast.state
    ){

        case "normal":
            return "NORMAL";

        case "herida":
            return "HERIDA";

        case "cansada":
            return "CANSADA";

        case "noqueada":
            return "NOQUEADA";

        case "atrapada":
            return "ATRAPADA";

        case "capturada":
            return "CAPTURADA";

        case "huida":
            return "HUIDA";

        default:
            return "NORMAL";
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(dt){

    document
    .getElementById("hpBar")
    .style.width=
        (
            player.hp/
            player.maxHp*
            100
        )+"%";


    document
    .getElementById("staminaBar")
    .style.width=
        (
            player.stamina/
            player.maxStamina*
            100
        )+"%";


    document
    .getElementById("beastHpBar")
    .style.width=
        (
            beast.hp/
            beast.maxHp*
            100
        )+"%";


    document
    .getElementById("captureBar")
    .style.width=
        beast.captureProgress+
        "%";


    document
    .getElementById("playerStatus")
    .textContent=
        "CAZADOR · NIVEL "+
        player.level;


    document
    .getElementById("beastState")
    .textContent=
        "ESTADO: "+
        getBeastState();


    if(
        messageTime>0
    ){

        messageTime-=dt;

        if(
            messageTime<=0
        ){

            document
            .getElementById(
                "message"
            )
            .style.opacity="0";
        }
    }


    if(
        player.hp<=0
    ){

        player.hp=
            player.maxHp;

        player.x=2.7;
        player.y=2.7;

        showMessage(
            "HAS CAÍDO"
        );
    }
}


/* =========================================================
   MENSAJES
========================================================= */

let messageTime=0;


function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.style.opacity="1";

    messageTime=1.4;
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();


function loop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/
            1000
        );

    lastTime=time;


    updatePlayer(dt);

    updateBeast(dt);

    updateCamera(dt);

    renderWorld();

    renderMinimap();

    updateHUD(dt);


    requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

</script>
