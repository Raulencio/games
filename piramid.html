<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>MONSTER HUNTER 2.5D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b09;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#stats{
    position:absolute;
    left:12px;
    top:12px;
    width:210px;
}

.level{
    color:#fff;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    text-shadow:0 2px 4px #000;
}

.bar{
    width:100%;
    height:15px;
    margin-bottom:5px;
    border:2px solid #111;
    border-radius:9px;
    background:#242424;
    overflow:hidden;
}

.bar span{
    display:block;
    height:100%;
    width:100%;
}

.hp span{
    background:#b83232;
}

.stamina span{
    background:#c49b35;
}

.xp span{
    background:#3e79b7;
}

/* ================= MINIMAPA ================= */

#miniMap{
    position:absolute;
    right:12px;
    top:12px;
    width:130px;
    height:130px;
    border-radius:50%;
    border:3px solid #b9a46c;
    background:#182018;
    box-shadow:0 4px 15px #000;
}

/* ================= CRUZ ================= */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#fff;
    opacity:.85;
}

#crosshair::before{
    width:2px;
    height:24px;
    left:11px;
}

#crosshair::after{
    width:24px;
    height:2px;
    top:11px;
}

/* ================= JOYSTICK ================= */

#joystick{
    position:absolute;
    left:18px;
    bottom:22px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff10;
    border:2px solid #ffffff2d;
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:32px;
    top:32px;
    width:57px;
    height:57px;
    border-radius:50%;
    background:#cdbb8a55;
    border:2px solid #d8c89788;
}

/* ================= BOTONES ================= */

#buttons{
    position:absolute;
    right:16px;
    bottom:18px;
    width:200px;
    height:190px;
    pointer-events:auto;
}

.button{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    background:#151916dd;
    border:2px solid #ffffff35;
    box-shadow:0 4px 12px #000;
    font-weight:bold;
}

.button:active{
    transform:scale(.91);
    background:#725b35ee;
}

#attack{
    right:0;
    bottom:30px;
    width:82px;
    height:82px;
    border-radius:50%;
    font-size:30px;
}

#dodge{
    right:95px;
    bottom:0;
    width:60px;
    height:60px;
    border-radius:50%;
}

#camera{
    right:7px;
    top:0;
    width:70px;
    height:58px;
    border-radius:16px;
    font-size:11px;
}

/* ================= MENSAJE ================= */

#message{
    position:absolute;
    left:50%;
    top:72%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    opacity:0;
    white-space:nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">

        <div class="level" id="level">
            NIVEL 1 · CAZADOR
        </div>

        <div class="bar hp">
            <span id="hpBar"></span>
        </div>

        <div class="bar stamina">
            <span id="staminaBar"></span>
        </div>

        <div class="bar xp">
            <span id="xpBar"></span>
        </div>

    </div>

    <canvas id="miniMap"
            width="130"
            height="130"></canvas>

    <div id="crosshair"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">

        <div
            id="camera"
            class="button">
            1P / 3P
        </div>

        <div
            id="dodge"
            class="button">
            ↪
        </div>

        <div
            id="attack"
            class="button">
            ⚔
        </div>

    </div>

    <div id="message"></div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MAPA
========================================================= */

const MAP = [
"####################",
"#..................#",
"#..................#",
"#....####..........#",
"#....#.............#",
"#....#......###....#",
"#...........#......#",
"#...........#......#",
"#..................#",
"#......###.........#",
"#..................#",
"#..........####....#",
"#..................#",
"#....#.............#",
"#....#.............#",
"#..................#",
"#..................#",
"#..............#...#",
"#..................#",
"####################"
];

const MAP_W = 20;
const MAP_H = 20;


/* =========================================================
   COLISIÓN MAPA
========================================================= */

function wall(x,y){

    const gx = Math.floor(x);
    const gy = Math.floor(y);

    if(
        gx < 0 ||
        gy < 0 ||
        gx >= MAP_W ||
        gy >= MAP_H
    ){
        return true;
    }

    return MAP[gy][gx] === "#";
}


function free(x,y,r){

    return !(
        wall(x-r,y-r) ||
        wall(x+r,y-r) ||
        wall(x-r,y+r) ||
        wall(x+r,y+r)
    );
}


function moveEntity(e,dx,dy){

    const nx = e.x + dx;
    const ny = e.y + dy;

    if(
        free(
            nx,
            e.y,
            e.radius
        )
    ){
        e.x = nx;
    }

    if(
        free(
            e.x,
            ny,
            e.radius
        )
    ){
        e.y = ny;
    }
}


/* =========================================================
   JUGADOR
========================================================= */

const player = {

    x:2.7,
    y:2.7,

    angle:0,

    radius:.25,

    speed:2.7,

    hp:100,
    maxHp:100,

    stamina:100,
    maxStamina:100,

    xp:0,
    level:1,

    attackTimer:0,
    attackCooldown:0,

    dodgeTimer:0,

    moving:false
};


/* =========================================================
   CÁMARA
========================================================= */

let thirdPerson = false;

let cameraDistance = 4;

const MIN_ZOOM = 1.8;
const MAX_ZOOM = 7;

let cameraPitch = 0;

const MIN_PITCH = -0.65;
const MAX_PITCH = 0.65;

const camera = {

    x:player.x,
    y:player.y,

    angle:player.angle,

    pitch:0
};


/* =========================================================
   MONSTRUOS
========================================================= */

const monsters = [];


function addMonster(x,y){

    monsters.push({

        x:x,
        y:y,

        radius:.45,

        hp:100,
        maxHp:100,

        speed:1,

        angle:0,

        hit:0,

        attackTimer:0,

        alive:true
    });
}


addMonster(8.5,3.5);
addMonster(14.5,8.5);
addMonster(6.5,13.5);
addMonster(16,15);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joyX = 0;
let joyY = 0;

let joystickPointer = null;


joystick.addEventListener(
    "pointerdown",
    function(e){

        joystickPointer =
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId ===
            joystickPointer
        ){
            joystickMove(e);
        }
    }
);


joystick.addEventListener(
    "pointerup",
    joystickReset
);


joystick.addEventListener(
    "pointercancel",
    joystickReset
);


function joystickMove(e){

    const r =
        joystick.getBoundingClientRect();

    let x =
        e.clientX -
        (r.left+r.width/2);

    let y =
        e.clientY -
        (r.top+r.height/2);

    const max = 45;

    const distance =
        Math.hypot(x,y);

    if(distance > max){

        x =
            x/distance*
            max;

        y =
            y/distance*
            max;
    }

    joyX = x/max;
    joyY = y/max;

    stick.style.transform =
        "translate("+
        x+
        "px,"+
        y+
        "px)";
}


function joystickReset(){

    joystickPointer = null;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
        "translate(0,0)";
}


/* =========================================================
   CÁMARA TÁCTIL
========================================================= */

const cameraTouches =
    new Map();

let previousX = 0;
let previousY = 0;

let pinchDistance = 0;
let pinchZoom = 4;


/*
    Zona derecha de pantalla.

    El joystick queda completamente
    separado de la cámara.
*/

canvas.addEventListener(
    "pointerdown",
    function(e){

        cameraTouches.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        if(
            cameraTouches.size === 1
        ){

            previousX = e.clientX;
            previousY = e.clientY;
        }

        if(
            cameraTouches.size === 2
        ){

            pinchDistance =
                getPinchDistance();

            pinchZoom =
                cameraDistance;
        }
    }
);


canvas.addEventListener(
    "pointermove",
    function(e){

        if(
            !cameraTouches.has(
                e.pointerId
            )
        ){
            return;
        }

        cameraTouches.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
            DOS DEDOS = ZOOM
        */

        if(
            cameraTouches.size >= 2
        ){

            const distance =
                getPinchDistance();

            if(
                pinchDistance > 0
            ){

                const change =
                    distance -
                    pinchDistance;

                cameraDistance =
                    pinchZoom -
                    change*.012;

                cameraDistance =
                    Math.max(
                        MIN_ZOOM,
                        Math.min(
                            MAX_ZOOM,
                            cameraDistance
                        )
                    );
            }

            return;
        }


        /*
            UN DEDO = CÁMARA
        */

        const dx =
            e.clientX -
            previousX;

        const dy =
            e.clientY -
            previousY;


        /*
            Giro horizontal.
        */

        player.angle +=
            dx*.004;


        /*
            Cámara vertical.
        */

        cameraPitch +=
            dy*.005;


        cameraPitch =
            Math.max(
                MIN_PITCH,
                Math.min(
                    MAX_PITCH,
                    cameraPitch
                )
            );


        previousX =
            e.clientX;

        previousY =
            e.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    cameraTouchEnd
);

canvas.addEventListener(
    "pointercancel",
    cameraTouchEnd
);


function cameraTouchEnd(e){

    cameraTouches.delete(
        e.pointerId
    );

    if(
        cameraTouches.size < 2
    ){
        pinchDistance = 0;
    }
}


function getPinchDistance(){

    const values =
        [...cameraTouches.values()];

    if(values.length < 2)
        return 0;

    return Math.hypot(
        values[0].x -
        values[1].x,

        values[0].y -
        values[1].y
    );
}


/* =========================================================
   CAMBIO DE CÁMARA
========================================================= */

document
.getElementById("camera")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        thirdPerson =
            !thirdPerson;

        if(thirdPerson){

            showMessage(
                "TERCERA PERSONA"
            );

        }else{

            showMessage(
                "PRIMERA PERSONA"
            );
        }
    }
);


/* =========================================================
   OBJETIVO MÁS CERCANO
========================================================= */

function nearestEnemy(){

    let result = null;
    let best = Infinity;


    for(
        const enemy of monsters
    ){

        if(!enemy.alive)
            continue;


        const dx =
            enemy.x -
            player.x;

        const dy =
            enemy.y -
            player.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if(
            distance <= 2.8 &&
            distance < best
        ){

            best =
                distance;

            result =
                enemy;
        }
    }


    return result;
}


/* =========================================================
   ATAQUE
========================================================= */

document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        attack();
    }
);


function attack(){

    if(
        player.attackCooldown > 0
    ){
        return;
    }


    const enemy =
        nearestEnemy();


    /*
        EN 3ª PERSONA:

        el cazador gira automáticamente
        hacia el monstruo.
    */

    if(
        thirdPerson &&
        enemy
    ){

        player.angle =
            Math.atan2(
                enemy.y-player.y,
                enemy.x-player.x
            );
    }


    player.attackTimer =
        .28;

    player.attackCooldown =
        .48;


    if(enemy){

        enemy.hp -= 35;

        enemy.hit =
            .15;


        if(
            enemy.hp <= 0
        ){

            enemy.alive =
                false;

            player.xp += 50;

            showMessage(
                "+50 XP"
            );

            levelCheck();

        }else{

            showMessage(
                "⚔ IMPACTO"
            );
        }

    }else{

        showMessage(
            "⚔ ATAQUE"
        );
    }
}


/* =========================================================
   ESQUIVA
========================================================= */

document
.getElementById("dodge")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        if(
            player.stamina < 25
        ){
            return;
        }

        player.stamina -= 25;

        player.dodgeTimer =
            .25;
    }
);


/* =========================================================
   MOVIMIENTO
========================================================= */

function updatePlayer(dt){

    if(
        player.attackTimer > 0
    ){
        player.attackTimer -= dt;
    }


    if(
        player.attackCooldown > 0
    ){
        player.attackCooldown -= dt;
    }


    if(
        player.dodgeTimer > 0
    ){
        player.dodgeTimer -= dt;
    }


    player.stamina =
        Math.min(
            player.maxStamina,
            player.stamina+
            25*dt
        );


    let forward =
        -joyY;

    let strafe =
        joyX;


    const input =
        Math.hypot(
            forward,
            strafe
        );


    player.moving =
        input > .1;


    if(!player.moving)
        return;


    if(input > 1){

        forward /= input;
        strafe /= input;
    }


    let speed =
        player.speed;


    if(
        player.dodgeTimer > 0
    ){
        speed = 5.5;
    }


    /*
        Movimiento relativo a la cámara.
    */

    const cos =
        Math.cos(
            player.angle
        );

    const sin =
        Math.sin(
            player.angle
        );


    const dx =
        (
            cos*forward -
            sin*strafe
        )*
        speed*
        dt;


    const dy =
        (
            sin*forward +
            cos*strafe
        )*
        speed*
        dt;


    moveEntity(
        player,
        dx,
        dy
    );


    /*
        El personaje siempre mira
        hacia la dirección del desplazamiento.
    */

    if(
        thirdPerson
    ){

        const movementAngle =
            Math.atan2(
                dy,
                dx
            );


        const difference =
            normalizeAngle(
                movementAngle -
                player.angle
            );


        /*
            Rotación progresiva.
        */

        player.angle +=
            difference*
            Math.min(
                1,
                dt*8
            );
    }
}


/* =========================================================
   IA
========================================================= */

function updateMonsters(dt){

    for(
        const enemy of monsters
    ){

        if(!enemy.alive)
            continue;


        if(enemy.hit > 0)
            enemy.hit -= dt;


        const dx =
            player.x -
            enemy.x;

        const dy =
            player.y -
            enemy.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        enemy.angle =
            Math.atan2(
                dy,
                dx
            );


        if(
            distance < 8 &&
            distance > 1.25
        ){

            const speed =
                enemy.speed*dt;


            moveEntity(
                enemy,

                Math.cos(
                    enemy.angle
                )*speed,

                Math.sin(
                    enemy.angle
                )*speed
            );
        }


        if(
            distance <= 1.25
        ){

            enemy.attackTimer -= dt;


            if(
                enemy.attackTimer <= 0
            ){

                enemy.attackTimer =
                    1.15;


                if(
                    player.dodgeTimer <= 0
                ){

                    player.hp -= 10;

                    showMessage(
                        "-10 VIDA"
                    );
                }
            }
        }
    }
}


/* =========================================================
   NORMALIZAR ÁNGULO
========================================================= */

function normalizeAngle(a){

    return Math.atan2(
        Math.sin(a),
        Math.cos(a)
    );
}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(dt){

    let targetX;
    let targetY;


    if(!thirdPerson){

        /*
            Primera persona:
            cámara dentro del personaje.
        */

        targetX =
            player.x;

        targetY =
            player.y;

    }else{

        /*
            Tercera persona:
            cámara detrás del personaje.
        */

        const behind =
            player.angle +
            Math.PI;


        targetX =
            player.x +
            Math.cos(behind)*
            cameraDistance;


        targetY =
            player.y +
            Math.sin(behind)*
            cameraDistance;


        /*
            Evitar atravesar paredes.
        */

        if(
            !free(
                targetX,
                targetY,
                .18
            )
        ){

            let found = false;


            for(
                let d =
                    cameraDistance;

                d >= MIN_ZOOM;

                d -= .15
            ){

                const tx =
                    player.x +
                    Math.cos(behind)*d;

                const ty =
                    player.y +
                    Math.sin(behind)*d;


                if(
                    free(
                        tx,
                        ty,
                        .18
                    )
                ){

                    targetX = tx;
                    targetY = ty;

                    found = true;

                    break;
                }
            }


            if(!found){

                targetX =
                    player.x;

                targetY =
                    player.y;
            }
        }
    }


    const smooth =
        1 -
        Math.pow(
            .001,
            dt
        );


    camera.x +=
        (
            targetX-camera.x
        )*
        smooth;


    camera.y +=
        (
            targetY-camera.y
        )*
        smooth;


    camera.angle +=
        normalizeAngle(
            player.angle-
            camera.angle
        )*
        smooth;


    camera.pitch +=
        (
            cameraPitch-
            camera.pitch
        )*
        smooth;
}


/* =========================================================
   RAYCAST
========================================================= */

const FOV =
    Math.PI/3;

const RAYS =
    220;

const MAX_DEPTH =
    20;


function raycast(angle){

    const dx =
        Math.cos(angle);

    const dy =
        Math.sin(angle);


    let distance = 0;


    while(
        distance <
        MAX_DEPTH
    ){

        distance += .035;


        const x =
            camera.x +
            dx*distance;

        const y =
            camera.y +
            dy*distance;


        if(
            wall(x,y)
        ){

            return distance;
        }
    }


    return MAX_DEPTH;
}


/* =========================================================
   RENDER MUNDO
========================================================= */

function renderWorld(){

    const horizon =
        H/2 +
        camera.pitch*
        H*.5;


    /*
        CIELO
    */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon
        );

    sky.addColorStop(
        0,
        "#162733"
    );

    sky.addColorStop(
        1,
        "#66715b"
    );


    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );


    /*
        SUELO
    */

    const ground =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    ground.addColorStop(
        0,
        "#474a3b"
    );

    ground.addColorStop(
        1,
        "#11140f"
    );


    ctx.fillStyle =
        ground;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    const depth = [];

    const rays =
        Math.min(
            RAYS,
            Math.floor(W/3)
        );


    const column =
        W/rays;


    for(
        let i=0;
        i<rays;
        i++
    ){

        const angle =
            camera.angle -
            FOV/2 +
            (i/rays)*FOV;


        let distance =
            raycast(angle);


        distance *=
            Math.cos(
                angle-camera.angle
            );


        depth[i] =
            distance;


        const wallHeight =
            Math.min(
                H*1.7,
                H/
                (distance+.001)*
                1.15
            );


        const top =
            horizon -
            wallHeight/2;


        const shade =
            Math.max(
                20,
                120-distance*6
            );


        ctx.fillStyle =
            "rgb("+
            Math.floor(shade)+
            ","+
            Math.floor(shade*.87)+
            ","+
            Math.floor(shade*.68)+
            ")";


        ctx.fillRect(
            i*column,
            top,
            column+1,
            wallHeight
        );
    }


    renderEntities(
        depth,
        rays,
        column,
        horizon
    );


    if(!thirdPerson){

        renderWeapon();
    }
}


/* =========================================================
   ENTIDADES
========================================================= */

function renderEntities(
    depth,
    rays,
    column,
    horizon
){

    const list = [];


    for(
        const enemy of monsters
    ){

        if(!enemy.alive)
            continue;


        const dx =
            enemy.x-camera.x;

        const dy =
            enemy.y-camera.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        let relative =
            Math.atan2(
                dy,
                dx
            ) -
            camera.angle;


        relative =
            normalizeAngle(
                relative
            );


        if(
            Math.abs(relative) >
            FOV*.75
        ){
            continue;
        }


        list.push({
            enemy,
            distance,
            relative
        });
    }


    /*
        Jugador en 3P.
    */

    if(thirdPerson){

        const dx =
            player.x-camera.x;

        const dy =
            player.y-camera.y;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        let relative =
            Math.atan2(
                dy,
                dx
            ) -
            camera.angle;


        relative =
            normalizeAngle(
                relative
            );


        list.push({
            player:true,
            distance,
            relative
        });
    }


    list.sort(
        (a,b)=>
            b.distance-a.distance
    );


    for(
        const item of list
    ){

        const distance =
            item.distance;


        const screenX =
            W/2 +
            Math.tan(
                item.relative
            )/
            Math.tan(FOV/2)*
            W/2;


        if(
            screenX < -300 ||
            screenX > W+300
        ){
            continue;
        }


        const size =
            Math.min(
                H*1.4,
                H/
                (distance+.001)*
                .8
            );


        const index =
            Math.floor(
                screenX/column
            );


        if(
            index >= 0 &&
            index < rays &&
            distance >
            depth[index]+.25
        ){
            continue;
        }


        const baseY =
            horizon +
            size*.42;


        if(item.player){

            drawPlayer(
                screenX,
                baseY,
                size
            );

        }else{

            drawMonster(
                screenX,
                baseY,
                size,
                item.enemy
            );
        }
    }
}


/* =========================================================
   MONSTRUO
========================================================= */

function drawMonster(
    x,
    y,
    size,
    enemy
){

    const s =
        Math.max(
            25,
            size
        );


    ctx.save();


    /*
        sombra
    */

    ctx.fillStyle =
        "#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        s*.25,
        s*.07,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        cuerpo
    */

    ctx.fillStyle =
        enemy.hit > 0
        ? "#fff"
        : "#554431";


    ctx.beginPath();

    ctx.ellipse(
        x,
        y-s*.55,
        s*.28,
        s*.38,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        piernas
    */

    ctx.strokeStyle =
        "#282019";

    ctx.lineWidth =
        Math.max(
            4,
            s*.08
        );


    ctx.beginPath();

    ctx.moveTo(
        x-s*.1,
        y-s*.3
    );

    ctx.lineTo(
        x-s*.14,
        y
    );

    ctx.moveTo(
        x+s*.1,
        y-s*.3
    );

    ctx.lineTo(
        x+s*.14,
        y
    );

    ctx.stroke();


    /*
        cabeza
    */

    ctx.fillStyle =
        enemy.hit > 0
        ? "#fff"
        : "#806546";


    ctx.beginPath();

    ctx.arc(
        x,
        y-s*.97,
        s*.2,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        cuernos
    */

    ctx.strokeStyle =
        "#21170f";

    ctx.lineWidth =
        Math.max(
            3,
            s*.045
        );


    ctx.beginPath();

    ctx.moveTo(
        x-s*.12,
        y-s*1.08
    );

    ctx.lineTo(
        x-s*.27,
        y-s*1.3
    );

    ctx.moveTo(
        x+s*.12,
        y-s*1.08
    );

    ctx.lineTo(
        x+s*.27,
        y-s*1.3
    );

    ctx.stroke();


    /*
        ojos
    */

    ctx.fillStyle =
        "#e7c653";


    ctx.beginPath();

    ctx.arc(
        x-s*.08,
        y-s*.97,
        s*.035,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+s*.08,
        y-s*.97,
        s*.035,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        vida
    */

    const barWidth =
        s*.6;


    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x-barWidth/2,
        y-s*1.38,
        barWidth,
        7
    );


    ctx.fillStyle =
        "#c33";

    ctx.fillRect(
        x-barWidth/2,
        y-s*1.38,
        barWidth*
        Math.max(
            0,
            enemy.hp/enemy.maxHp
        ),
        7
    );


    ctx.restore();
}


/* =========================================================
   JUGADOR 3P
========================================================= */

function drawPlayer(
    x,
    y,
    size
){

    const s =
        Math.max(
            25,
            size
        );


    ctx.save();


    /*
        sombra
    */

    ctx.fillStyle =
        "#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        s*.22,
        s*.07,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        piernas
    */

    ctx.strokeStyle =
        "#24282b";

    ctx.lineWidth =
        s*.11;


    ctx.beginPath();

    ctx.moveTo(
        x-s*.08,
        y-s*.28
    );

    ctx.lineTo(
        x-s*.12,
        y
    );

    ctx.moveTo(
        x+s*.08,
        y-s*.28
    );

    ctx.lineTo(
        x+s*.12,
        y
    );

    ctx.stroke();


    /*
        cuerpo
    */

    ctx.fillStyle =
        "#35434a";


    ctx.beginPath();

    ctx.roundRect(
        x-s*.19,
        y-s*.83,
        s*.38,
        s*.53,
        s*.08
    );

    ctx.fill();


    /*
        cabeza
    */

    ctx.fillStyle =
        "#bd8b68";


    ctx.beginPath();

    ctx.arc(
        x,
        y-s*1.02,
        s*.17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        espada
    */

    ctx.strokeStyle =
        "#d6d9dc";

    ctx.lineWidth =
        Math.max(
            2,
            s*.045
        );


    ctx.beginPath();

    ctx.moveTo(
        x+s*.19,
        y-s*.45
    );

    ctx.lineTo(
        x+s*.47,
        y-s*.95
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    let swing = 0;


    if(
        player.attackTimer > 0
    ){

        const p =
            1 -
            player.attackTimer/
            .28;


        swing =
            Math.sin(
                p*Math.PI
            )*100;
    }


    ctx.save();


    ctx.translate(
        W*.78+swing,
        H*.8
    );


    ctx.rotate(
        -.32+
        swing*.003
    );


    /*
        brazo
    */

    ctx.fillStyle =
        "#9d6d4e";

    ctx.fillRect(
        -25,
        20,
        70,
        34
    );


    /*
        empuñadura
    */

    ctx.fillStyle =
        "#392317";

    ctx.fillRect(
        18,
        -18,
        20,
        65
    );


    /*
        guardia
    */

    ctx.fillStyle =
        "#c19c55";

    ctx.fillRect(
        -12,
        -23,
        70,
        11
    );


    /*
        hoja
    */

    ctx.fillStyle =
        "#d4d8da";


    ctx.beginPath();

    ctx.moveTo(
        21,
        -23
    );

    ctx.lineTo(
        40,
        -205
    );

    ctx.lineTo(
        55,
        -23
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   MINIMAPA
========================================================= */

const mini =
    document.getElementById(
        "miniMap"
    );

const mctx =
    mini.getContext("2d");


function renderMinimap(){

    mctx.clearRect(
        0,
        0,
        130,
        130
    );


    const scale = 6;


    mctx.save();


    mctx.translate(
        65-player.x*scale,
        65-player.y*scale
    );


    for(
        let y=0;
        y<MAP_H;
        y++
    ){

        for(
            let x=0;
            x<MAP_W;
            x++
        ){

            if(
                MAP[y][x] === "#"
            ){

                mctx.fillStyle =
                    "#565348";

                mctx.fillRect(
                    x*scale,
                    y*scale,
                    scale+1,
                    scale+1
                );
            }
        }
    }


    /*
        enemigos
    */

    for(
        const enemy of monsters
    ){

        if(!enemy.alive)
            continue;


        mctx.fillStyle =
            "#c33";


        mctx.beginPath();

        mctx.arc(
            enemy.x*scale,
            enemy.y*scale,
            3,
            0,
            Math.PI*2
        );

        mctx.fill();
    }


    mctx.restore();


    /*
        jugador
    */

    mctx.fillStyle =
        "#fff";


    mctx.beginPath();

    mctx.arc(
        65,
        65,
        4,
        0,
        Math.PI*2
    );

    mctx.fill();


    /*
        dirección
    */

    mctx.strokeStyle =
        "#fff";

    mctx.beginPath();

    mctx.moveTo(
        65,
        65
    );

    mctx.lineTo(
        65+
        Math.cos(player.angle)*14,

        65+
        Math.sin(player.angle)*14
    );

    mctx.stroke();
}


/* =========================================================
   NIVEL
========================================================= */

function levelCheck(){

    const required =
        player.level*100;


    if(
        player.xp >= required
    ){

        player.xp -= required;

        player.level++;

        player.maxHp += 15;

        player.hp =
            player.maxHp;


        showMessage(
            "⭐ NIVEL "+
            player.level
        );
    }
}


/* =========================================================
   MENSAJES
========================================================= */

let messageTime = 0;


function showMessage(text){

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;

    element.style.opacity =
        "1";

    messageTime = 1.1;
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(dt){

    document
    .getElementById("hpBar")
    .style.width =
        (
            player.hp/
            player.maxHp*
            100
        )+"%";


    document
    .getElementById("staminaBar")
    .style.width =
        (
            player.stamina/
            player.maxStamina*
            100
        )+"%";


    document
    .getElementById("xpBar")
    .style.width =
        (
            player.xp/
            (player.level*100)*
            100
        )+"%";


    document
    .getElementById("level")
    .textContent =
        "NIVEL "+
        player.level+
        " · CAZADOR";


    if(
        messageTime > 0
    ){

        messageTime -= dt;


        if(
            messageTime <= 0
        ){

            document
            .getElementById(
                "message"
            )
            .style.opacity =
                "0";
        }
    }


    if(
        player.hp <= 0
    ){

        player.hp =
            player.maxHp;

        player.x = 2.7;
        player.y = 2.7;

        camera.x =
            player.x;

        camera.y =
            player.y;


        showMessage(
            "HAS CAÍDO"
        );
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(time){

    const dt =
        Math.min(
            .033,
            (time-lastTime)/
            1000
        );


    lastTime =
        time;


    updatePlayer(dt);

    updateMonsters(dt);

    updateCamera(dt);

    renderWorld();

    renderMinimap();

    updateHUD(dt);


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>
