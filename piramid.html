<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pyramid of the Gods 0.3</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#171109;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   MENÚ
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 30%,
        #806b47 0%,
        #392b1b 45%,
        #120d08 100%);
    color:#ead39b;
}

.title{
    text-align:center;
    font-size:clamp(31px,9vw,60px);
    line-height:.88;
    letter-spacing:4px;
    text-shadow:0 5px 0 #090604;
}

.subtitle{
    margin-top:12px;
    font-size:10px;
    letter-spacing:4px;
}

.menuBox{
    width:min(94vw,430px);
    margin-top:25px;
    padding:18px;
    border:1px solid #a27f43;
    border-radius:18px;
    background:#17120de8;
}

.menuLabel{
    text-align:center;
    font-size:11px;
    margin-bottom:12px;
}

.gods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.godButton{
    min-height:78px;
    border-radius:10px;
    border:1px solid #59452a;
    background:#292015;
    color:#ead39a;
}

.godButton.selected{
    border-color:#e0b85e;
    background:#57431f;
}

.glyph{
    display:block;
    font-size:27px;
    line-height:34px;
}

.godButton small{
    font-size:8px;
}

#start{
    width:100%;
    margin-top:14px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#c99b49;
    color:#1c1308;
    font-size:14px;
    font-weight:bold;
}

/* =========================
   HUD
========================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.panel{
    border:1px solid #aa884d99;
    border-radius:11px;
    background:#17120dcc;
    color:#ecd7a2;
    box-shadow:0 4px 18px #0007;
}

#top{
    position:absolute;
    left:7px;
    right:7px;
    top:7px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

#stats{
    width:min(210px,49vw);
    padding:8px;
    font-size:10px;
}

.hpTrack{
    height:10px;
    margin:5px 0;
    background:#321714;
    border-radius:5px;
    overflow:hidden;
}

#hpBar{
    width:100%;
    height:100%;
    background:#c84b3c;
}

.xpTrack{
    height:5px;
    background:#292234;
    border-radius:5px;
    overflow:hidden;
}

#xpBar{
    height:100%;
    width:0;
    background:#9270d1;
}

#statLine{
    margin-top:5px;
    font-size:9px;
}

#mapPanel{
    width:min(155px,36vw);
    aspect-ratio:1;
    padding:5px;
}

#mini{
    width:100%;
    height:100%;
}

#godCurrent{
    position:absolute;
    left:7px;
    top:94px;
    padding:7px 10px;
    font-size:10px;
}

#message{
    position:absolute;
    left:50%;
    bottom:124px;
    transform:translateX(-50%);
    width:min(70vw,400px);
    min-height:40px;
    padding:8px;
    text-align:center;
    font-size:11px;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
    pointer-events:auto;
    position:absolute;
    left:13px;
    bottom:17px;
    width:116px;
    height:116px;
    border-radius:50%;
    border:2px solid #c5a76566;
    background:#211a10aa;
}

#stick{
    position:absolute;
    left:32px;
    top:32px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid #ead8a8;
    background:#d1ae6599;
}

/* =========================
   BOTONES
========================= */

#actions{
    pointer-events:auto;
    position:absolute;
    right:13px;
    bottom:18px;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.action{
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid #ad894d;
    background:#21190fcc;
    color:#ead49a;
    font-size:10px;
    font-weight:bold;
}

#attack{
    width:76px;
    height:76px;
    font-size:19px;
}

#god{
    border-color:#9872d0;
}

/* =========================
   BENDICIONES
========================= */

#blessingPanel{
    display:none;
    pointer-events:auto;
    position:absolute;
    z-index:60;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90vw,380px);
    padding:15px;
}

#blessingPanel h3{
    text-align:center;
    margin-bottom:12px;
}

.blessingGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.blessing{
    min-height:65px;
    border-radius:10px;
    border:1px solid #604b2c;
    background:#2b2115;
    color:#ead49a;
}

.blessing.active{
    border-color:#e5bc5e;
    background:#58431f;
}

.closeBlessing{
    width:100%;
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    border:1px solid #72592f;
    background:#3b2c19;
    color:#ead49a;
}

/* =========================
   PAUSA
========================= */

#pause{
    pointer-events:auto;
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #a8874d;
    background:#17120dcc;
    color:#ead49a;
}

#pauseScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:80;
    align-items:center;
    justify-content:center;
    background:#0009;
    pointer-events:auto;
}

.pauseBox{
    width:min(85vw,330px);
    padding:20px;
    text-align:center;
    border-radius:16px;
    border:1px solid #9d7b43;
    background:#21180d;
    color:#ecd6a0;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:9px;
    border:1px solid #71582f;
    background:#43321d;
    color:#ecd6a0;
}

/* =========================
   TELÉFONOS PEQUEÑOS
========================= */

@media(max-height:620px){

    #joystick{
        width:92px;
        height:92px;
        bottom:8px;
    }

    #stick{
        width:40px;
        height:40px;
        left:24px;
        top:24px;
    }

    .action{
        width:52px;
        height:52px;
    }

    #attack{
        width:65px;
        height:65px;
    }

    #message{
        bottom:90px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     MENÚ
========================= -->

<div id="menu">

    <div class="title">
        PYRAMID<br>OF THE GODS
    </div>

    <div class="subtitle">
        2.5D MOBILE ADVENTURE
    </div>

    <div class="menuBox">

        <div class="menuLabel">
            BENDICIÓN INICIAL
        </div>

        <div class="gods" id="menuGods">

            <button class="godButton selected" data-god="horus">
                <span class="glyph">𓅃</span>
                <small>HORUS<br>VELOCIDAD</small>
            </button>

            <button class="godButton" data-god="anubis">
                <span class="glyph">𓃢</span>
                <small>ANUBIS<br>EVASIÓN</small>
            </button>

            <button class="godButton" data-god="sekhmet">
                <span class="glyph">𓁛</span>
                <small>SEKHMET<br>DAÑO</small>
            </button>

            <button class="godButton" data-god="thoth">
                <span class="glyph">𓅝</span>
                <small>THOTH<br>CRÍTICO</small>
            </button>

            <button class="godButton" data-god="isis">
                <span class="glyph">𓆄</span>
                <small>ISIS<br>VIDA</small>
            </button>

            <button class="godButton" data-god="ra">
                <span class="glyph">𓂀</span>
                <small>RA<br>PODER</small>
            </button>

        </div>

        <button id="start">
            INICIAR EXPEDICIÓN
        </button>

    </div>
</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div id="top">

        <div id="stats" class="panel">

            <b id="level">NIVEL 1</b>

            <div class="hpTrack">
                <div id="hpBar"></div>
            </div>

            <div class="xpTrack">
                <div id="xpBar"></div>
            </div>

            <div id="statLine"></div>

        </div>

        <div id="mapPanel" class="panel">
            <canvas id="mini"></canvas>
        </div>

    </div>

    <div id="godCurrent" class="panel">
        𓅃 HORUS
    </div>

    <div id="message" class="panel">
        Explora la cámara.
    </div>

    <button id="pause">
        Ⅱ
    </button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">

        <button id="god" class="action">
            DIOS
        </button>

        <button id="attack" class="action">
            ⚔
        </button>

    </div>

    <div id="blessingPanel" class="panel">

        <h3>
            CAMBIAR BENDICIÓN
        </h3>

        <div class="blessingGrid">

            <button class="blessing" data-god="horus">
                𓅃 HORUS<br>
                <small>Velocidad</small>
            </button>

            <button class="blessing" data-god="anubis">
                𓃢 ANUBIS<br>
                <small>Evasión</small>
            </button>

            <button class="blessing" data-god="sekhmet">
                𓁛 SEKHMET<br>
                <small>Daño</small>
            </button>

            <button class="blessing" data-god="thoth">
                𓅝 THOTH<br>
                <small>Crítico</small>
            </button>

            <button class="blessing" data-god="isis">
                𓆄 ISIS<br>
                <small>Vida</small>
            </button>

            <button class="blessing" data-god="ra">
                𓂀 RA<br>
                <small>Poder</small>
            </button>

        </div>

        <button class="closeBlessing">
            CERRAR
        </button>

    </div>

</div>

<div id="pauseScreen">

    <div class="pauseBox">

        <h2>PAUSA</h2>

        <button id="resume">
            CONTINUAR
        </button>

        <button id="backMenu">
            MENÚ
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

const TILE=64;
const FOV=Math.PI/3;

/* =========================================================
   ESTADO
========================================================= */

let map=[];
let mapW=35;
let mapH=27;

let enemies=[];

let running=false;
let paused=false;

let last=performance.now();

/* =========================================================
   CÁMARA VERTICAL
========================================================= */

/*
    pitch:
    0 = horizonte normal.

    El jugador puede mirar arriba y abajo.

    IMPORTANTE:
    El movimiento vertical está INVERTIDO:
    dedo hacia ARRIBA -> mirada hacia ABAJO
    dedo hacia ABAJO  -> mirada hacia ARRIBA
*/

let cameraPitch=0;

const MIN_PITCH=-0.42;
const MAX_PITCH=0.42;

let lookPointer=null;

/* =========================================================
   DIOSES
========================================================= */

const GODS={

    horus:{
        name:"HORUS",
        glyph:"𓅃",
        speed:1.18,
        evade:.05,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:100
    },

    anubis:{
        name:"ANUBIS",
        glyph:"𓃢",
        speed:1.04,
        evade:.22,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:105
    },

    sekhmet:{
        name:"SEKHMET",
        glyph:"𓁛",
        speed:.99,
        evade:.05,
        damage:1.38,
        crit:.08,
        critDamage:1.8,
        hp:115
    },

    thoth:{
        name:"THOTH",
        glyph:"𓅝",
        speed:1.03,
        evade:.06,
        damage:1,
        crit:.26,
        critDamage:2,
        hp:96
    },

    isis:{
        name:"ISIS",
        glyph:"𓆄",
        speed:1.02,
        evade:.08,
        damage:1,
        crit:.06,
        critDamage:1.5,
        hp:140
    },

    ra:{
        name:"RA",
        glyph:"𓂀",
        speed:1.10,
        evade:.07,
        damage:1.14,
        crit:.10,
        critDamage:1.7,
        hp:106
    }
};

let selectedGod="horus";

/* =========================================================
   GUARDADO
========================================================= */

let save={
    level:1,
    xp:0,
    speed:0,
    evade:0,
    crit:0,
    critDamage:0,
    god:"horus"
};

try{

    const stored=
        JSON.parse(
            localStorage.getItem(
                "POTG_SAVE_06"
            )
        );

    if(stored){

        save={
            ...save,
            ...stored
        };

        selectedGod=
            save.god||"horus";
    }

}catch(e){}

function saveGame(){

    save.god=selectedGod;

    try{

        localStorage.setItem(
            "POTG_SAVE_06",
            JSON.stringify(save)
        );

    }catch(e){}
}

/* =========================================================
   PLAYER
========================================================= */

const player={

    x:0,
    y:0,

    angle:0,

    hp:100,

    cooldown:0,

    attacking:false,

    attackTime:0,

    attackDuration:.34
};

/* =========================================================
   COMPAÑERO
========================================================= */

const companion={

    x:0,
    y:0,

    radius:13,

    speed:145,

    bob:0
};

/* =========================================================
   PUERTA
========================================================= */

/*
    La puerta NO es una decoración flotante.

    door.wall:
      "N" = pared al norte
      "S" = pared al sur
      "E" = pared al este
      "W" = pared al oeste

    door.x/y = celda de la pared.

    El portal se dibuja en la cara de esa pared.
*/

let door={
    x:0,
    y:0,
    wall:"N"
};

/* =========================================================
   STATS
========================================================= */

function getStats(){

    const g=GODS[selectedGod];

    return{

        speed:
            g.speed+
            save.speed+
            (save.level-1)*.025,

        evade:
            Math.min(
                .70,
                g.evade+
                save.evade
            ),

        damage:
            g.damage+
            (save.level-1)*.035,

        crit:
            Math.min(
                .75,
                g.crit+
                save.crit
            ),

        critDamage:
            g.critDamage+
            save.critDamage,

        maxHp:
            g.hp+
            (save.level-1)*8
    };
}

/* =========================================================
   MAPA
========================================================= */

function generateMap(){

    /*
      Dimensiones pares para mantener
      corredores limpios.
    */

    mapW=
        35+
        Math.floor(
            Math.random()*3
        )*2;

    mapH=
        27+
        Math.floor(
            Math.random()*3
        )*2;

    map=[];

    for(let y=0;y<mapH;y++){

        map[y]=[];

        for(let x=0;x<mapW;x++){

            map[y][x]=1;
        }
    }

    const cx=
        Math.floor(mapW/2);

    const cy=
        Math.floor(mapH/2);

    /*
      Gran cámara central.
    */

    carve(
        cx-7,
        cy-5,
        cx+8,
        cy+6
    );

    /*
      Grandes zonas laterales.
      Evitamos habitaciones diminutas.
    */

    carve(
        3,
        4,
        11,
        mapH-5
    );

    carve(
        mapW-12,
        4,
        mapW-3,
        mapH-5
    );

    /*
      Estructura principal.
    */

    corridor(
        cx,
        cy,
        7,
        cy
    );

    corridor(
        cx,
        cy,
        mapW-8,
        cy
    );

    corridor(
        cx,
        cy,
        cx,
        5
    );

    corridor(
        cx,
        cy,
        cx,
        mapH-6
    );

    /*
      Cámaras amplias adicionales.
    */

    for(let i=0;i<7;i++){

        const rw=
            5+
            Math.floor(
                Math.random()*5
            );

        const rh=
            4+
            Math.floor(
                Math.random()*4
            );

        const rx=
            3+
            Math.floor(
                Math.random()*
                (mapW-rw-6)
            );

        const ry=
            3+
            Math.floor(
                Math.random()*
                (mapH-rh-6)
            );

        carve(
            rx,
            ry,
            rx+rw,
            ry+rh
        );

        /*
          Conexión directa.
          Esto evita salas cerradas.
        */

        corridor(
            cx,
            cy,
            Math.floor(rx+rw/2),
            Math.floor(ry+rh/2)
        );
    }

    /*
      Borde.
    */

    for(let x=0;x<mapW;x++){

        map[0][x]=1;
        map[1][x]=1;

        map[mapH-1][x]=1;
        map[mapH-2][x]=1;
    }

    for(let y=0;y<mapH;y++){

        map[y][0]=1;
        map[y][1]=1;

        map[y][mapW-1]=1;
        map[y][mapW-2]=1;
    }

    player.x=
        (cx+.5)*TILE;

    player.y=
        (cy+.5)*TILE;

    player.angle=0;
    cameraPitch=0;

    companion.x=
        player.x-TILE;

    companion.y=
        player.y;

    createDoor();

    spawnEnemies();

    player.hp=
        getStats().maxHp;

    message(
        "Nueva cámara generada."
    );
}

/* =========================================================
   CARVADO
========================================================= */

function carve(x1,y1,x2,y2){

    for(
        let y=Math.max(2,y1);
        y<Math.min(mapH-2,y2);
        y++
    ){

        for(
            let x=Math.max(2,x1);
            x<Math.min(mapW-2,x2);
            x++
        ){

            map[y][x]=0;
        }
    }
}

/* =========================================================
   CORREDORES
========================================================= */

function corridor(x1,y1,x2,y2){

    let x=x1;
    let y=y1;

    while(x!==x2){

        map[y][x]=0;

        if(y+1<mapH)
            map[y+1][x]=0;

        x+=
            x<x2
            ?1
            :-1;
    }

    while(y!==y2){

        map[y][x]=0;

        if(x+1<mapW)
            map[y][x+1]=0;

        y+=
            y<y2
            ?1
            :-1;
    }
}

/* =========================================================
   PARED
========================================================= */

function wallAt(x,y){

    const tx=Math.floor(x/TILE);
    const ty=Math.floor(y/TILE);

    if(
        tx<0||
        ty<0||
        tx>=mapW||
        ty>=mapH
    )
        return true;

    return map[ty][tx]===1;
}

function cellWall(x,y){

    if(
        x<0||
        y<0||
        x>=mapW||
        y>=mapH
    )
        return true;

    return map[y][x]===1;
}

/* =========================================================
   PUERTA REALMENTE PEGADA A PARED
========================================================= */

function createDoor(){

    const candidates=[];

    /*
      Buscamos una celda ABIERTA que tenga
      exactamente una pared adyacente.

      La puerta se coloca en esa frontera.
    */

    for(let y=3;y<mapH-3;y++){

        for(let x=3;x<mapW-3;x++){

            if(map[y][x]!==0)
                continue;

            const centerX=
                (x+.5)*TILE;

            const centerY=
                (y+.5)*TILE;

            if(
                Math.hypot(
                    centerX-player.x,
                    centerY-player.y
                )<
                TILE*5
            )
                continue;

            /*
              Pared al norte.
            */

            if(
                cellWall(x,y-1)&&
                !cellWall(x-1,y)&&
                !cellWall(x+1,y)
            ){

                candidates.push({
                    x,
                    y,
                    wall:"N"
                });
            }

            /*
              Pared al sur.
            */

            if(
                cellWall(x,y+1)&&
                !cellWall(x-1,y)&&
                !cellWall(x+1,y)
            ){

                candidates.push({
                    x,
                    y,
                    wall:"S"
                });
            }

            /*
              Pared al oeste.
            */

            if(
                cellWall(x-1,y)&&
                !cellWall(x,y-1)&&
                !cellWall(x,y+1)
            ){

                candidates.push({
                    x,
                    y,
                    wall:"W"
                });
            }

            /*
              Pared al este.
            */

            if(
                cellWall(x+1,y)&&
                !cellWall(x,y-1)&&
                !cellWall(x,y+1)
            ){

                candidates.push({
                    x,
                    y,
                    wall:"E"
                });
            }
        }
    }

    if(candidates.length){

        door=
            candidates[
                Math.floor(
                    Math.random()*
                    candidates.length
                )
            ];

    }else{

        /*
          Fallback seguro.
        */

        door={
            x:Math.floor(mapW/2),
            y:Math.floor(mapH/2)+7,
            wall:"N"
        };
    }
}

/* =========================================================
   POSICIÓN DE LA PUERTA
========================================================= */

function doorWorldPosition(){

    const cx=
        (door.x+.5)*TILE;

    const cy=
        (door.y+.5)*TILE;

    /*
      La puerta está exactamente sobre
      la cara de la pared.
    */

    if(door.wall==="N"){

        return{
            x:cx,
            y:cy-TILE*.48
        };
    }

    if(door.wall==="S"){

        return{
            x:cx,
            y:cy+TILE*.48
        };
    }

    if(door.wall==="W"){

        return{
            x:cx-TILE*.48,
            y:cy
        };
    }

    return{
        x:cx+TILE*.48,
        y:cy
    };
}

/* =========================================================
   COLISIÓN
========================================================= */

function collision(x,y,r){

    return(
        wallAt(x-r,y-r)||
        wallAt(x+r,y-r)||
        wallAt(x-r,y+r)||
        wallAt(x+r,y+r)
    );
}

/* =========================================================
   VISIBILIDAD
========================================================= */

function hasLineOfSight(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const distance=
        Math.hypot(dx,dy);

    const steps=
        Math.ceil(distance/3);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        if(
            wallAt(
                x1+dx*t,
                y1+dy*t
            )
        )
            return false;
    }

    return true;
}

/* =========================================================
   ENEMIGOS
========================================================= */

function spawnEnemies(){

    enemies=[];

    const amount=
        6+
        Math.floor(
            Math.random()*4
        );

    for(let i=0;i<amount;i++){

        for(let attempt=0;attempt<100;attempt++){

            const x=
                (2+
                Math.random()*
                (mapW-4))*
                TILE;

            const y=
                (2+
                Math.random()*
                (mapH-4))*
                TILE;

            if(wallAt(x,y))
                continue;

            if(
                Math.hypot(
                    x-player.x,
                    y-player.y
                )<
                TILE*4
            )
                continue;

            const hp=
                65+
                save.level*9;

            enemies.push({

                x,
                y,

                radius:15,

                hp,
                maxHp:hp,

                speed:
                    35+
                    Math.random()*13,

                angle:0,

                cooldown:
                    Math.random(),

                think:0,

                wander:
                    Math.random()*Math.PI*2,

                hit:0,

                dead:false
            });

            break;
        }
    }
}

/* =========================================================
   IA
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)
            continue;

        e.cooldown-=dt;

        e.hit=
            Math.max(
                0,
                e.hit-dt
            );

        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;

        const distance=
            Math.hypot(dx,dy);

        e.angle=
            Math.atan2(dy,dx);

        const visible=
            distance<620&&
            hasLineOfSight(
                e.x,
                e.y,
                player.x,
                player.y
            );

        if(visible){

            if(distance>78){

                const nx=
                    dx/(distance||1);

                const ny=
                    dy/(distance||1);

                const amount=
                    e.speed*dt;

                enemyMove(
                    e,
                    nx*amount,
                    ny*amount
                );

            }else if(
                e.cooldown<=0
            ){

                enemyAttack(e);

                e.cooldown=.9;
            }

        }else{

            e.think-=dt;

            if(e.think<=0){

                e.think=
                    .8+
                    Math.random()*1.5;

                e.wander+=
                    (Math.random()-.5)*2;
            }

            const amount=
                e.speed*.22*dt;

            enemyMove(
                e,
                Math.cos(e.wander)*amount,
                Math.sin(e.wander)*amount
            );
        }
    }
}

function enemyMove(e,dx,dy){

    if(
        !collision(
            e.x+dx,
            e.y,
            e.radius
        )
    )
        e.x+=dx;

    if(
        !collision(
            e.x,
            e.y+dy,
            e.radius
        )
    )
        e.y+=dy;
}

function enemyAttack(e){

    if(
        Math.random()<
        getStats().evade
    ){

        message("¡Evasión!");

        return;
    }

    player.hp-=8;

    if(player.hp<=0){

        player.hp=0;

        message("Has caído.");

        setTimeout(()=>{

            if(running){

                player.hp=
                    getStats().maxHp;

                generateMap();
            }

        },800);
    }
}

/* =========================================================
   COMPAÑERO
========================================================= */

function updateCompanion(dt){

    const dx=
        player.x-companion.x;

    const dy=
        player.y-companion.y;

    const distance=
        Math.hypot(dx,dy);

    /*
      Mantiene aproximadamente 72 px
      de separación.
    */

    if(distance>105){

        const target=72;

        const tx=
            player.x-
            dx/(distance||1)*
            target;

        const ty=
            player.y-
            dy/(distance||1)*
            target;

        const ax=
            tx-companion.x;

        const ay=
            ty-companion.y;

        const d=
            Math.hypot(ax,ay)||1;

        const amount=
            companion.speed*dt;

        const mx=
            ax/d*
            Math.min(amount,d);

        const my=
            ay/d*
            Math.min(amount,d);

        if(
            !collision(
                companion.x+mx,
                companion.y,
                companion.radius
            )
        )
            companion.x+=mx;

        if(
            !collision(
                companion.x,
                companion.y+my,
                companion.radius
            )
        )
            companion.y+=my;
    }

    companion.bob+=dt*5;
}

function movePlayer(dx,dy){

    if(

    )
        player.x+=dx;

    if(
        !collision(
            player.x,
            player.y+dy,
            r
        )
    )
        player.y+=dy;
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyActive=false;
let joyId=null;

let joyX=0;
let joyY=0;

function setJoystick(x,y){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=
        r.width*.36;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=
            dx/d*
            max;

        dy=
            dy/d*
            max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    joyActive=false;
    joyId=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joyActive=true;
        joyId=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        setJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joyActive||
            e.pointerId!==joyId
        )
            return;

        setJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   CÁMARA CON PITCH INVERTIDO
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        lookPointer={
            id:e.pointerId,
            x:e.clientX,
            y:e.clientY
        };

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            !lookPointer||
            lookPointer.id!==e.pointerId
        )
            return;

        const dx=
            e.clientX-
            lookPointer.x;

        const dy=
            e.clientY-
            lookPointer.y;

        /*
          Horizontal:
          derecha = mirar derecha.

          Vertical INVERTIDO:
          dedo arriba = pitch negativo = mirada abajo.
          dedo abajo = pitch positivo = mirada arriba.
        */

        player.angle+=
            dx*.0045;

        cameraPitch+=
            dy*.0032;

        cameraPitch=
            Math.max(
                MIN_PITCH,
                Math.min(
                    MAX_PITCH,
                    cameraPitch
                )
            );

        lookPointer.x=
            e.clientX;

        lookPointer.y=
            e.clientY;
    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{
        lookPointer=null;
    }
);

canvas.addEventListener(
    "pointercancel",
    ()=>{
        lookPointer=null;
    }
);

/* =========================================================
   ATAQUE
========================================================= */

function attack(){

    if(
        !running||
        paused||
        player.cooldown>0
    )
        return;

    player.attacking=true;
    player.attackTime=0;
    player.cooldown=.42;

    const stats=getStats();

    /*
      Alcance controlado.
    */

    const range=TILE*1.4;

    for(const e of enemies){

        if(e.dead)
            continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const distance=
            Math.hypot(dx,dy);

        if(distance>range)
            continue;

        if(
            !hasLineOfSight(
                player.x,
                player.y,
                e.x,
                e.y
            )
        )
            continue;

        const targetAngle=
            Math.atan2(dy,dx);

        const difference=
            normalizeAngle(
                targetAngle-player.angle
            );

        if(
            Math.abs(difference)<.78
        ){

            let damage=
                25*
                stats.damage;

            if(
                Math.random()<
                stats.crit
            ){

                damage*=
                    stats.critDamage;

                message(
                    "¡GOLPE CRÍTICO!"
                );
            }

            e.hp-=damage;
            e.hit=.12;

            if(e.hp<=0){

                e.hp=0;
                e.dead=true;

                gainXP(25);

                message("+25 EXP");
            }
        }
    }
}

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}

/* =========================================================
   RAYCAST
========================================================= */

function castRay(x,y,angle){

    const dx=Math.cos(angle);
    const dy=Math.sin(angle);

    let mx=Math.floor(x/TILE);
    let my=Math.floor(y/TILE);

    const deltaX=
        Math.abs(
            1/(dx||.000001)
        );

    const deltaY=
        Math.abs(
            1/(dy||.000001)
        );

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(dx<0){

        stepX=-1;

        sideX=
            (x/TILE-mx)*
            deltaX;

    }else{

        stepX=1;

        sideX=
            (mx+1-x/TILE)*
            deltaX;
    }

    if(dy<0){

        stepY=-1;

        sideY=
            (y/TILE-my)*
            deltaY;

    }else{

        stepY=1;

        sideY=
            (my+1-y/TILE)*
            deltaY;
    }

    let side=0;

    for(let i=0;i<200;i++){

        if(sideX<sideY){

            sideX+=deltaX;
            mx+=stepX;
            side=0;

        }else{

            sideY+=deltaY;
            my+=stepY;
            side=1;
        }

        /*
          La celda de puerta se sigue tratando
          como pared para que su marco quede
          exactamente integrado en ella.
        */

        if(
            isWall(mx,my)
        ){

            let distance;

            if(side===0){

                distance=
                    (
                        mx-
                        x/TILE+
                        (1-stepX)/2
                    )/dx*TILE;

            }else{

                distance=
                    (
                        my-
                        y/TILE+
                        (1-stepY)/2
                    )/dy*TILE;
            }

            return{
                distance:
                    Math.abs(distance),

                side,

                cellX:mx,
                cellY:my
            };
        }
    }

    return{
        distance:1500,
        side:0,
        cellX:mx,
        cellY:my
    };
}

function isWall(x,y){

    if(
        x<0||
        y<0||
        x>=mapW||
        y>=mapH
    )
        return true;

    return map[y][x]===1;
}

/* =========================================================
   RENDER DE PAREDES
========================================================= */

function renderWalls(){

    /*
      Pitch desplaza el horizonte.
    */

    const horizon=
        H*.47+
        cameraPitch*H*.42;

    const rays=
        Math.min(
            440,
            Math.max(
                220,
                Math.floor(W*.78)
            )
        );

    const step=W/rays;

    for(let i=0;i<rays;i++){

        const sx=i*step;

        const cameraX=
            sx/W-.5;

        const angle=
            player.angle+
            cameraX*FOV;

        const hit=
            castRay(
                player.x,
                player.y,
                angle
            );

        let distance=
            hit.distance;

        distance*=
            Math.cos(
                angle-player.angle
            );

        distance=
            Math.max(
                1,
                distance
            );

        const wallHeight=
            TILE*
            H*.72/
            distance;

        const top=
            horizon-
            wallHeight/2;

        /*
          La pared se dibuja con arena.
        */

        const shade=
            hit.side===0
            ?1
            :.72;

        const depth=
            1-
            Math.min(
                distance/1500,
                .7
            );

        const v=
            Math.floor(
                82+
                100*
                shade*
                depth
            );

        ctx.fillStyle=
            `rgb(${v},${Math.floor(v*.78)},${Math.floor(v*.51)})`;

        ctx.fillRect(
            sx,
            top,
            step+1,
            wallHeight
        );
    }
}

/* =========================================================
   PUERTA 3D INTEGRADA EN LA PARED
========================================================= */

function renderDoor(){

    const p=
        doorWorldPosition();

    const dx=
        p.x-player.x;

    const dy=
        p.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    if(distance<10)
        return;

    if(
        !hasLineOfSight(
            player.x,
            player.y,
            p.x,
            p.y
        )
    )
        return;

    const relative=
        normalizeAngle(
            Math.atan2(dy,dx)-
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.75
    )
        return;

    const projection=
        W/
        (
            2*
            Math.tan(FOV/2)
        );

    const sx=
        W/2+
        Math.tan(relative)*
        projection;

    /*
      La puerta tiene altura completa
      de una abertura humana.
    */

    const horizon=
        H*.47+
        cameraPitch*H*.42;

    const doorHeight=
        Math.min(
            H*.92,
            TILE*
            H*.70/
            distance
        );

    const doorWidth=
        doorHeight*.46;

    const top=
        horizon-
        doorHeight*.72;

    /*
      Comprobación de profundidad:
      la pared no puede tapar la puerta.
    */

    const centerHit=
        castRay(
            player.x,
            player.y,
            player.angle+
            relative
        );

    if(
        distance>
        centerHit.distance+8
    )
        return;

    /*
      MARCO.
    */

    ctx.fillStyle="#5a3d20";

    ctx.fillRect(
        sx-doorWidth*.52,
        top,
        doorWidth*.12,
        doorHeight*.73
    );

    ctx.fillRect(
        sx+doorWidth*.40,
        top,
        doorWidth*.12,
        doorHeight*.73
    );

    ctx.fillRect(
        sx-doorWidth*.52,
        top,
        doorWidth*1.04,
        doorHeight*.10
    );

    /*
      Interior oscuro.
    */

    ctx.fillStyle="#0b0907";

    ctx.fillRect(
        sx-doorWidth*.40,
        top+doorHeight*.09,
        doorWidth*.80,
        doorHeight*.64
    );

    /*
      Luz interior muy sutil.
    */

    const glow=
        ctx.createLinearGradient(
            sx,
            top,
            sx,
            top+doorHeight*.7
        );

    glow.addColorStop(
        0,
        "#6d543022"
    );

    glow.addColorStop(
        1,
        "#c08b3511"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        sx-doorWidth*.38,
        top+doorHeight*.1,
        doorWidth*.76,
        doorHeight*.61
    );

    /*
      Símbolo superior.
    */

    ctx.fillStyle="#d0a957";

    ctx.fillRect(
        sx-2,
        top+doorHeight*.18,
        4,
        doorHeight*.13
    );

    ctx.fillRect(
        sx-doorWidth*.09,
        top+doorHeight*.235,
        doorWidth*.18,
        3
    );
}

/* =========================================================
   SPRITES
========================================================= */

function renderSprites(){

    const list=[];

    for(const e of enemies){

        if(!e.dead){

            list.push({
                type:"enemy",
                object:e
            });
        }
    }

    list.push({
        type:"companion",
        object:companion
    });

    list.sort((a,b)=>{

        const da=
            Math.hypot(
                a.object.x-player.x,
                a.object.y-player.y
            );

        const db=
            Math.hypot(
                b.object.x-player.x,
                b.object.y-player.y
            );

        return db-da;
    });

    for(const item of list){

        drawSprite(
            item.type,
            item.object
        );
    }
}

function drawSprite(type,o){

    const dx=
        o.x-player.x;

    const dy=
        o.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    if(distance<10)
        return;

    /*
      Oclusión total.
    */

    if(
        !hasLineOfSight(
            player.x,
            player.y,
            o.x,
            o.y
        )
    )
        return;

    const relative=
        normalizeAngle(
            Math.atan2(dy,dx)-
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.68
    )
        return;

    const projection=
        W/
        (
            2*
            Math.tan(FOV/2)
        );

    const screenX=
        W/2+
        Math.tan(relative)*
        projection;

    const size=
        Math.min(
            H*1.1,
            TILE*
            H*.72/
            distance
        );

    /*
      La cámara vertical mueve todo el escenario
      sin modificar la altura física del personaje.
    */

    const horizon=
        H*.47+
        cameraPitch*H*.42;

    const ground=
        horizon+
        size*.50;

    const top=
        ground-size;

    const width=
        size*.48;

    const start=
        Math.floor(
            screenX-width/2
        );

    const end=
        Math.ceil(
            screenX+width/2
        );

    for(
        let x=start;
        x<=end;
        x++
    ){

        if(x<0||x>=W)
            continue;

        const cameraX=
            x/W-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const wall=
            castRay(
                player.x,
                player.y,
                rayAngle
            );

        const wallDistance=
            wall.distance*
            Math.cos(
                rayAngle-player.angle
            );

        if(distance>=wallDistance-3)
            continue;

        const nx=
            (x-screenX)/
            width;

        drawCharacterColumn(
            type,
            o,
            x,
            top,
            ground,
            size,
            nx
        );
    }
}

/* =========================================================
   PERSONAJES
========================================================= */

function drawCharacterColumn(
    type,
    o,
    x,
    top,
    ground,
    size,
    nx
){

    const a=Math.abs(nx);

    /*
      Cabeza.
    */

    if(a<.19){

        ctx.fillStyle=
            type==="enemy"
            ?(
                o.hit>0
                ?" #ffffff"
                :"#553529"
            )
            :"#d2ba83";

        ctx.fillRect(
            x,
            top+size*.105,
            1.5,
            size*.125
        );
    }

    /*
      Cuello.
    */

    if(a<.09){

        ctx.fillStyle=
            type==="enemy"
            ?"#3b251e"
            :"#9f8054";

        ctx.fillRect(
            x,
            top+size*.23,
            1.5,
            size*.055
        );
    }

    /*
      Torso.
    */

    if(a<.29){

        ctx.fillStyle=
            type==="enemy"
            ?"#673b2c"
            :"#8f7548";

        ctx.fillRect(
            x,
            top+size*.285,
            1.5,
            size*.30
        );
    }

    /*
      Brazos.
    */

    if(
        a>.25&&
        a<.47
    ){

        ctx.fillStyle=
            type==="enemy"
            ?"#4b2d24"
            :"#715a3b";

        ctx.fillRect(
            x,
            top+size*.31,
            1.5,
            size*.28
        );
    }

    /*
      Cadera.
    */

    if(a<.28){

        ctx.fillStyle=
            type==="enemy"
            ?"#3c2922"
            :"#4d3c29";

        ctx.fillRect(
            x,
            top+size*.655,
            1.5,
            size*.10
        );
    }

    /*
      Piernas.
      TERMINAN EN GROUND.
    */

    if(a<.12){

        ctx.fillStyle=
            type==="enemy"
            ?"#251a16"
            :"#3c3022";

        ctx.fillRect(
            x,
            top+size*.755,
            1.5,
            size*.245
        );
    }

    /*
      Barra de vida.
    */

    if(
        type==="enemy"&&
        a<.35
    ){

        const bw=
            Math.max(
                16,
                size*.65
            );

        const bh=
            Math.max(
                3,
                size*.035
            );

        ctx.fillStyle="#160c09";

        ctx.fillRect(
            x-bw/2,
            top-size*.065,
            bw,
            bh
        );

        ctx.fillStyle="#d1483b";

        ctx.fillRect(
            x-bw/2,
            top-size*.065,
            bw*
            Math.max(
                0,
                o.hp/o.maxHp
            ),
            bh
        );
    }
}

/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    const p=
        player.attacking
        ?
        Math.min(
            1,
            player.attackTime/
            player.attackDuration
        )
        :0;

    /*
      Barrido horizontal.
    */

    const sweep=
        Math.sin(
            p*Math.PI
        );

    ctx.save();

    /*
      Mano derecha.
    */

    ctx.translate(
        W*.72,
        H*1.02
    );

    ctx.rotate(
        -.27+
        sweep*.92
    );

    const scale=
        Math.min(W,H)/650;

    ctx.scale(
        scale,
        scale
    );

    /*
      Brazo.
    */

    ctx.fillStyle="#ad7954";

    ctx.fillRect(
        -8,
        -55,
        68,
        23
    );

    /*
      Mango.
    */

    ctx.fillStyle="#382317";

    ctx.fillRect(
        31,
        -96,
        14,
        106
    );

    /*
      Guarda.
    */

    ctx.fillStyle="#c6a14e";

    ctx.fillRect(
        9,
        -92,
        57,
        10
    );

    /*
      Hoja.
    */

    ctx.fillStyle="#d9c99e";

    ctx.beginPath();

    ctx.moveTo(37,-91);
    ctx.lineTo(51,-91);
    ctx.lineTo(58,-275);
    ctx.lineTo(45,-304);
    ctx.lineTo(30,-275);

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#f0dfb3";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   MIRA
========================================================= */

function renderCrosshair(){

    const x=W/2;

    const y=
        H*.47+
        cameraPitch*H*.42;

    ctx.strokeStyle="#f5e5bb";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x-10,y);
    ctx.lineTo(x-3,y);

    ctx.moveTo(x+3,y);
    ctx.lineTo(x+10,y);

    ctx.moveTo(x,y-10);
    ctx.lineTo(x,y-3);

    ctx.moveTo(x,y+3);
    ctx.lineTo(x,y+10);

    ctx.stroke();
}

/* =========================================================
   MINIMAPA COMPLETO
========================================================= */

function renderMiniMap(){

    const r=
        mini.getBoundingClientRect();

    const mw=r.width;
    const mh=r.height;

    if(mw<=0||mh<=0)
        return;

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    mini.width=
        Math.floor(mw*dpr);

    mini.height=
        Math.floor(mh*dpr);

    mctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    mctx.fillStyle="#100d09";

    mctx.fillRect(
        0,
        0,
        mw,
        mh
    );

    /*
      ESCALA PARA MOSTRAR TODO EL MAPA.
    */

    const scale=
        Math.min(
            (mw-8)/
            (mapW*TILE),

            (mh-8)/
            (mapH*TILE)
        );

    const ox=
        (
            mw-
            mapW*TILE*scale
        )/2;

    const oy=
        (
            mh-
            mapH*TILE*scale
        )/2;

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            mctx.fillStyle=
                map[y][x]===0
                ?" #bda06a"
                :"#33271a";

            mctx.fillRect(
                ox+
                x*TILE*scale,
                oy+
                y*TILE*scale,
                TILE*scale+.5,
                TILE*scale+.5
            );
        }
    }

    /*
      Puerta.
    */

    mctx.fillStyle="#e3bb53";

    mctx.fillRect(
        ox+
        door.x*TILE*scale,
        oy+
        door.y*TILE*scale,
        TILE*scale,
        TILE*scale
    );

    /*
      Enemigos.
    */

    for(const e of enemies){

        if(e.dead)
            continue;

        mctx.fillStyle="#c84639";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(
                2,
                3*scale
            ),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
      Compañero.
    */

    mctx.fillStyle="#58bec9";

    mctx.beginPath();

    mctx.arc(
        ox+companion.x*scale,
        oy+companion.y*scale,
        Math.max(
            2,
            3*scale
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      Jugador.
    */

    const px=
        ox+
        player.x*scale;

    const py=
        oy+
        player.y*scale;

    mctx.fillStyle="#f2d77b";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(
            3,
            4*scale
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      Dirección.
    */

    mctx.strokeStyle="#f2d77b";
    mctx.lineWidth=2;

    mctx.beginPath();

    mctx.moveTo(
        px,
        py
    );

    mctx.lineTo(
        px+
        Math.cos(player.angle)*13,
        py+
        Math.sin(player.angle)*13
    );

    mctx.stroke();
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const stats=
        getStats();

    document.getElementById(
        "level"
    ).textContent=
        "NIVEL "+
        save.level;

    document.getElementById(
        "hpBar"
    ).style.width=
        Math.max(
            0,
            player.hp/
            stats.maxHp*
            100
        )+"%";

    const needed=
        100+
        (save.level-1)*60;

    document.getElementById(
        "xpBar"
    ).style.width=
        Math.min(
            100,
            save.xp/
            needed*
            100
        )+"%";

    document.getElementById(
        "statLine"
    ).textContent=
        "VEL "+
        stats.speed.toFixed(2)+
        " · EVA "+
        Math.round(
            stats.evade*100
        )+
        "% · CRIT "+
        Math.round(
            stats.crit*100
        )+
        "%";

    document.getElementById(
        "godCurrent"
    ).textContent=
        GODS[selectedGod].glyph+
        " "+
        GODS[selectedGod].name;
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !running||
        paused
    )
        return;

    player.cooldown=
        Math.max(
            0,
            player.cooldown-dt
        );

    skillCooldown=
        Math.max(
            0,
            skillCooldown-dt
        );

    if(player.attacking){

        player.attackTime+=dt;

        if(
            player.attackTime>
            player.attackDuration
        ){

            player.attacking=false;
        }
    }

    /*
      Movimiento joystick.
    */

    let mx=joyX;
    let my=joyY;

    const length=
        Math.hypot(
            mx,
            my
        );

    if(length>1){

        mx/=length;
        my/=length;
    }

    const speed=
        112*
        getStats().speed;

    const forwardX=
        Math.cos(
            player.angle
        );

    const forwardY=
        Math.sin(
            player.angle
        );

    const rightX=
        Math.cos(
            player.angle+
            Math.PI/2
        );

    const rightY=
        Math.sin(
            player.angle+
            Math.PI/2
        );

    const dx=
        (
            forwardX*(-my)+
            rightX*mx
        )*
        speed*
        dt;

    const dy=
        (
            forwardY*(-my)+
            rightY*mx
        )*
        speed*
        dt;

    movePlayer(
        dx,
        dy
    );

    updateCompanion(dt);

    updateEnemies(dt);

    checkDoor();

    if(messageTimer>0)
        messageTimer-=dt;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    W=innerWidth;
    H=innerHeight;

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    canvas.width=
        Math.floor(W*dpr);

    canvas.height=
        Math.floor(H*dpr);

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    const horizon=
        H*.47+
        cameraPitch*H*.42;

    /*
      CIELO.
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            Math.max(
                1,
                horizon
            )
        );

    sky.addColorStop(
        0,
        "#69553c"
    );

    sky.addColorStop(
        1,
        "#c4a56b"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        Math.max(0,horizon)
    );

    /*
      SUELO ARENA.
      Sin reflejos.
    */

    const floor=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    floor.addColorStop(
        0,
        "#ad874d"
    );

    floor.addColorStop(
        1,
        "#d0ad70"
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        horizon,
        W,
        Math.max(
            0,
            H-horizon
        )
    );

    /*
      Paredes.
    */

    renderWalls();

    /*
      Puerta:
      se dibuja ANTES de sprites,
      pero después de paredes,
      respetando su profundidad.
    */

    renderDoor();

    /*
      Personajes.
    */

    renderSprites();

    /*
      Arma.
    */

    renderWeapon();

    renderCrosshair();

    renderMiniMap();

    updateHUD();
}

/* =========================================================
   MENÚ
========================================================= */

document.querySelectorAll(
    "#menuGods .godButton"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document.querySelectorAll(
                "#menuGods .godButton"
            ).forEach(
                b=>
                    b.classList.remove(
                        "selected"
                    )
            );

            button.classList.add(
                "selected"
            );

            selectedGod=
                button.dataset.god;
        }
    );
});

/* =========================================================
   BENDICIONES
========================================================= */

document.querySelectorAll(
    ".blessing"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            changeGod(
                button.dataset.god
            );
        }
    );
});

document.querySelector(
    ".closeBlessing"
).addEventListener(
    "click",
    closeBlessings
);

document.getElementById(
    "god"
).addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        openBlessings();
    }
);

/* =========================================================
   INICIO
========================================================= */

document.getElementById(
    "start"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="block";

        running=true;
        paused=false;

        generateMap();

        last=
            performance.now();
    }
);

/* =========================================================
   ATAQUE
========================================================= */

document.getElementById(
    "attack"
).addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();
    }
);

/* =========================================================
   PAUSA
========================================================= */

document.getElementById(
    "pause"
).addEventListener(
    "click",
    ()=>{

        paused=true;

        document.getElementById(
            "pauseScreen"
        ).style.display="flex";
    }
);

document.getElementById(
    "resume"
).addEventListener(
    "click",
    ()=>{

        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";
    }
);

document.getElementById(
    "backMenu"
).addEventListener(
    "click",
    ()=>{

        running=false;
        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="none";

        document.getElementById(
            "menu"
        ).style.display="flex";
    }
);

/* =========================================================
   LOOP
========================================================= */

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );

    last=now;

    update(dt);

    if(running)
        render();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(loop);

</script>
