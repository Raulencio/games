<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Monster Hunter 2.5D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080a09;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#stats{
    position:absolute;
    top:12px;
    left:12px;
    width:220px;
}

.stat{
    height:18px;
    margin-bottom:5px;
    border:2px solid #111;
    border-radius:10px;
    overflow:hidden;
    background:#252525;
    box-shadow:0 2px 8px #000;
}

.stat i{
    display:block;
    width:100%;
    height:100%;
}

#hp i{
    background:#c52e32;
}

#stamina i{
    background:#c29b35;
}

#xp i{
    background:#397bc2;
}

#level{
    color:white;
    font-size:13px;
    margin-bottom:4px;
    text-shadow:0 2px 4px #000;
}

#map{
    position:absolute;
    right:12px;
    top:12px;
    width:130px;
    height:130px;
    border:3px solid #b9a06a;
    border-radius:50%;
    background:#182018;
    box-shadow:0 4px 15px #000;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
    opacity:.85;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
}

#crosshair:before{
    width:2px;
    height:22px;
    left:10px;
}

#crosshair:after{
    width:22px;
    height:2px;
    top:10px;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:24px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff14;
    border:2px solid #ffffff30;
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:33px;
    top:33px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#d5c59a55;
    border:2px solid #d5c59a99;
}

#actions{
    position:absolute;
    right:18px;
    bottom:20px;
    width:190px;
    height:190px;
    pointer-events:auto;
}

.btn{
    position:absolute;
    border:2px solid #ffffff44;
    background:#171a18cc;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    box-shadow:0 4px 12px #000;
}

.btn:active{
    transform:scale(.92);
    background:#765f36dd;
}

#attack{
    width:78px;
    height:78px;
    right:0;
    bottom:40px;
    border-radius:50%;
    font-size:30px;
}

#dodge{
    width:58px;
    height:58px;
    right:90px;
    bottom:0;
    border-radius:50%;
}

#cameraBtn{
    width:65px;
    height:65px;
    right:12px;
    top:0;
    border-radius:18px;
    font-size:12px;
}

#message{
    position:absolute;
    left:50%;
    top:74%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 3px 8px #000;
    opacity:0;
    transition:.15s;
    white-space:nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="stats">

        <div id="level">
            NIVEL 1 · CAZADOR
        </div>

        <div id="hp" class="stat">
            <i></i>
        </div>

        <div id="stamina" class="stat">
            <i></i>
        </div>

        <div id="xp" class="stat">
            <i></i>
        </div>

    </div>

    <canvas id="map" width="130" height="130"></canvas>

    <div id="crosshair"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">

        <div id="cameraBtn" class="btn">
            1P / 3P
        </div>

        <div id="dodge" class="btn">
            ↪
        </div>

        <div id="attack" class="btn">
            ⚔
        </div>

    </div>

    <div id="message"></div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const FOV=Math.PI/3;

const NUM_RAYS=240;

const MAX_DEPTH=22;


/* =========================================================
   MAPA
========================================================= */

const map=[

"####################",
"#..................#",
"#..................#",
"#....####..........#",
"#....#.............#",
"#....#......###....#",
"#...........#......#",
"#...........#......#",
"#..................#",
"#......###.........#",
"#..................#",
"#..........####....#",
"#..................#",
"#....#.............#",
"#....#.............#",
"#..................#",
"#..................#",
"#..............#...#",
"#..................#",
"####################"

];

const MAP_W=20;
const MAP_H=20;

function isWall(x,y){

    const mx=Math.floor(x);
    const my=Math.floor(y);

    if(
        mx<0 ||
        my<0 ||
        mx>=MAP_W ||
        my>=MAP_H
    ){
        return true;
    }

    return map[my][mx]==="#";
}


/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:2.8,
    y:2.8,

    /*
        Dirección física del personaje.
        Siempre se intenta mantener orientada
        hacia su movimiento.
    */

    angle:0.2,

    radius:.28,

    speed:2.6,

    hp:100,
    maxHp:100,

    stamina:100,
    maxStamina:100,

    xp:0,
    level:1,

    attackTimer:0,
    attackCooldown:0,

    dodgeTimer:0,

    /*
        Dirección visual del movimiento.
    */

    moveAngle:0.2
};


/* =========================================================
   CÁMARA
========================================================= */

let cameraMode=1;

/*
    Distancia inicial de tercera persona.
*/

const THIRD_PERSON_MIN=2.0;
const THIRD_PERSON_MAX=7.0;

let thirdPersonDistance=4.2;

/*
    Altura de la cámara.
*/

const THIRD_PERSON_HEIGHT=1.25;

/*
    Pitch:

    0 = horizonte
    positivo = mirar hacia abajo
    negativo = mirar hacia arriba
*/

let cameraPitch=0;

const MIN_PITCH=-0.65;
const MAX_PITCH=0.75;


/*
    Cámara física.
*/

const camera={

    x:player.x,
    y:player.y,

    angle:player.angle,

    pitch:0,

    targetX:player.x,
    targetY:player.y,

    targetAngle:player.angle,

    targetPitch:0
};


/* =========================================================
   MONSTRUOS
========================================================= */

const monsters=[];

function spawnMonster(x,y){

    monsters.push({

        x:x,
        y:y,

        radius:.55,

        hp:100,
        maxHp:100,

        speed:1.05,

        angle:0,

        state:"idle",

        attackTimer:0,

        hitFlash:0,

        alive:true
    });
}

spawnMonster(9.5,3.5);
spawnMonster(14.5,8.5);
spawnMonster(6.5,13.5);
spawnMonster(16,15);


/* =========================================================
   COLISIONES
========================================================= */

function canMove(x,y,r=.25){

    if(isWall(x-r,y-r)) return false;
    if(isWall(x+r,y-r)) return false;
    if(isWall(x-r,y+r)) return false;
    if(isWall(x+r,y+r)) return false;

    return true;
}


function moveEntity(entity,dx,dy){

    const nx=entity.x+dx;
    const ny=entity.y+dy;

    if(
        canMove(
            nx,
            entity.y,
            entity.radius
        )
    ){
        entity.x=nx;
    }

    if(
        canMove(
            entity.x,
            ny,
            entity.radius
        )
    ){
        entity.y=ny;
    }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyPointer=null;


joystick.addEventListener("pointerdown",e=>{

    joyPointer=e.pointerId;

    joystick.setPointerCapture(
        e.pointerId
    );

    updateJoystick(e);
});


joystick.addEventListener("pointermove",e=>{

    if(e.pointerId===joyPointer){

        updateJoystick(e);
    }
});


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(e){

    const r=
        joystick.getBoundingClientRect();

    let x=
        e.clientX-
        (r.left+r.width/2);

    let y=
        e.clientY-
        (r.top+r.height/2);

    const max=45;

    const len=Math.hypot(x,y);

    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform=
        `translate(${x}px,${y}px)`;
}


function resetJoystick(){

    joyPointer=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}


/* =========================================================
   CONTROL DE CÁMARA

   1 dedo:
   - mover horizontal = girar
   - mover vertical = mirar arriba/abajo

   2 dedos:
   - pinch = zoom
========================================================= */

const touches=new Map();

let lastSingleX=0;
let lastSingleY=0;

let pinchStartDistance=0;
let pinchStartZoom=0;


function getTouchDistance(){

    const arr=[...touches.values()];

    if(arr.length<2)
        return 0;

    return Math.hypot(
        arr[0].x-arr[1].x,
        arr[0].y-arr[1].y
    );
}


canvas.addEventListener("pointerdown",e=>{

    /*
        El lado izquierdo está reservado
        para el joystick.
    */

    if(
        e.clientX<W*.42 &&
        cameraMode!==3
    ){
        return;
    }

    touches.set(
        e.pointerId,
        {
            x:e.clientX,
            y:e.clientY
        }
    );

    /*
        Dos dedos = zoom.
    */

    if(touches.size===2){

        pinchStartDistance=
            getTouchDistance();

        pinchStartZoom=
            thirdPersonDistance;

        return;
    }

    /*
        Un dedo = cámara.
    */

    lastSingleX=e.clientX;
    lastSingleY=e.clientY;

    canvas.setPointerCapture(
        e.pointerId
    );
});


canvas.addEventListener("pointermove",e=>{

    if(!touches.has(e.pointerId))
        return;

    touches.set(
        e.pointerId,
        {
            x:e.clientX,
            y:e.clientY
        }
    );


    /*
        ZOOM CON DOS DEDOS
    */

    if(touches.size>=2){

        const current=
            getTouchDistance();

        if(pinchStartDistance>0){

            /*
                Separar dedos = acercar
                Juntar dedos = alejar
            */

            const difference=
                current-pin​​chStartDistance;

            /*
                Corrección para que el zoom
                tenga una velocidad cómoda.
            */

            thirdPersonDistance=
                pinchStartZoom-
                difference*.012;

            thirdPersonDistance=
                Math.max(
                    THIRD_PERSON_MIN,
                    Math.min(
                        THIRD_PERSON_MAX,
                        thirdPersonDistance
                    )
                );
        }

        return;
    }


    /*
        CÁMARA CON UN DEDO
    */

    const dx=
        e.clientX-lastSingleX;

    const dy=
        e.clientY-lastSingleY;


    /*
        Horizontal:
        girar personaje/cámara.
    */

    player.angle+=dx*.0045;


    /*
        Vertical:
        mirar arriba/abajo.
    */

    cameraPitch+=dy*.006;

    cameraPitch=
        Math.max(
            MIN_PITCH,
            Math.min(
                MAX_PITCH,
                cameraPitch
            )
        );


    lastSingleX=e.clientX;
    lastSingleY=e.clientY;
});


function removeTouch(e){

    touches.delete(
        e.pointerId
    );

    if(touches.size<2){

        pinchStartDistance=0;
    }
}


canvas.addEventListener(
    "pointerup",
    removeTouch
);

canvas.addEventListener(
    "pointercancel",
    removeTouch
);


/* =========================================================
   BUSCAR OBJETIVO PARA ATAQUE
========================================================= */

function findAttackTarget(){

    let best=null;

    let bestDistance=Infinity;


    for(
        const m of monsters
    ){

        if(!m.alive)
            continue;


        const dx=
            m.x-player.x;

        const dy=
            m.y-player.y;


        const distance=
            Math.hypot(dx,dy);


        if(distance>2.8)
            continue;


        const direction=
            Math.atan2(
                dy,
                dx
            );


        const diff=
            normalizeAngle(
                direction-player.angle
            );


        /*
            En tercera persona damos
            una asistencia de apuntado.

            Esto permite que el personaje
            se gire hacia un monstruo cercano.
        */

        if(
            cameraMode===3 ||
            Math.abs(diff)<.65
        ){

            if(distance<bestDistance){

                best=m;

                bestDistance=
                    distance;
            }
        }
    }

    return best;
}


/* =========================================================
   ATAQUE
========================================================= */

document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();
    }
);


function attack(){

    if(player.attackCooldown>0)
        return;


    /*
        BUSCAMOS OBJETIVO ANTES DEL ATAQUE.
    */

    const target=
        findAttackTarget();


    /*
        EN TERCERA PERSONA:

        el personaje gira automáticamente
        hacia el enemigo.
    */

    if(
        cameraMode===3 &&
        target
    ){

        const dx=
            target.x-player.x;

        const dy=
            target.y-player.y;

        player.angle=
            Math.atan2(
                dy,
                dx
            );
    }


    player.attackTimer=.30;

    player.attackCooldown=.46;


    /*
        Volvemos a buscar después de orientar
        al personaje.
    */

    let best=
        target;


    if(
        cameraMode===1 &&
        !best
    ){
        best=findAttackTarget();
    }


    if(best){

        best.hp-=35;

        best.hitFlash=.13;

        showMessage(
            "⚔ IMPACTO!"
        );


        if(best.hp<=0){

            best.alive=false;

            player.xp+=50;

            showMessage(
                "+50 XP · MONSTRUO DERROTADO"
            );

            checkLevel();
        }

    }else{

        showMessage(
            "⚔ ATAQUE"
        );
    }
}


/* =========================================================
   ESQUIVA
========================================================= */

document
.getElementById("dodge")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(player.stamina<25)
            return;

        player.stamina-=25;

        player.dodgeTimer=.25;
    }
);


/* =========================================================
   CAMBIO DE CÁMARA
========================================================= */

document
.getElementById("cameraBtn")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        cameraMode=
            cameraMode===1
            ?3
            :1;


        if(cameraMode===3){

            /*
                Cuando entramos en tercera persona
                colocamos la cámara detrás.
            */

            camera.x=
                player.x-
                Math.cos(player.angle)*
                thirdPersonDistance;

            camera.y=
                player.y-
                Math.sin(player.angle)*
                thirdPersonDistance;

            camera.angle=
                player.angle;

            showMessage(
                "TERCERA PERSONA"
            );

        }else{

            camera.x=player.x;
            camera.y=player.y;

            camera.angle=
                player.angle;

            showMessage(
                "PRIMERA PERSONA"
            );
        }
    }
);


/* =========================================================
   NORMALIZAR ÁNGULO
========================================================= */

function normalizeAngle(angle){

    return Math.atan2(
        Math.sin(angle),
        Math.cos(angle)
    );
}


/* =========================================================
   ACTUALIZACIÓN DE CÁMARA
========================================================= */

function updateCamera(dt){

    let targetX;
    let targetY;


    /*
        PRIMERA PERSONA
    */

    if(cameraMode===1){

        targetX=player.x;
        targetY=player.y;

        camera.targetAngle=
            player.angle;

    }


    /*
        TERCERA PERSONA
    */

    else{

        const behindAngle=
            player.angle+
            Math.PI;


        /*
            Cámara detrás del personaje.
        */

        targetX=
            player.x+
            Math.cos(behindAngle)*
            thirdPersonDistance;


        targetY=
            player.y+
            Math.sin(behindAngle)*
            thirdPersonDistance;


        /*
            Evitar que la cámara atraviese paredes.
        */

        if(
            !canMove(
                targetX,
                targetY,
                .18
            )
        ){

            let found=false;


            for(
                let d=
                    thirdPersonDistance;

                d>=.75;

                d-=.15
            ){

                const testX=
                    player.x+
                    Math.cos(behindAngle)*d;

                const testY=
                    player.y+
                    Math.sin(behindAngle)*d;


                if(
                    canMove(
                        testX,
                        testY,
                        .18
                    )
                ){

                    targetX=testX;
                    targetY=testY;

                    found=true;

                    break;
                }
            }


            if(!found){

                targetX=player.x;
                targetY=player.y;
            }
        }


        /*
            En tercera persona la cámara mira
            hacia delante.
        */

        camera.targetAngle=
            player.angle;
    }


    camera.targetPitch=
        cameraPitch;


    /*
        Suavizado.
    */

    const smooth=
        1-Math.pow(
            .0005,
            dt
        );


    camera.x+=
        (targetX-camera.x)*
        smooth;


    camera.y+=
        (targetY-camera.y)*
        smooth;


    let angleDifference=
        normalizeAngle(
            camera.targetAngle-
            camera.angle
        );


    camera.angle+=
        angleDifference*
        smooth;


    camera.pitch+=
        (
            camera.targetPitch-
            camera.pitch
        )*
        smooth;
}


/* =========================================================
   XP
========================================================= */

function checkLevel(){

    const required=
        player.level*100;


    if(
        player.xp>=required
    ){

        player.xp-=required;

        player.level++;

        player.maxHp+=15;

        player.hp=
            player.maxHp;

        showMessage(
            "⭐ NIVEL "+
            player.level
        );
    }
}


/* =========================================================
   IA MONSTRUOS
========================================================= */

function updateMonsters(dt){

    for(
        const m of monsters
    ){

        if(!m.alive)
            continue;


        if(m.hitFlash>0)
            m.hitFlash-=dt;


        const dx=
            player.x-m.x;

        const dy=
            player.y-m.y;


        const dist=
            Math.hypot(dx,dy);


        m.angle=
            Math.atan2(
                dy,
                dx
            );


        if(dist<8){

            m.state="chase";


            if(dist>1.35){

                const speed=
                    m.speed*dt;


                moveEntity(
                    m,

                    Math.cos(m.angle)*
                    speed,

                    Math.sin(m.angle)*
                    speed
                );


            }else{

                m.state="attack";

                m.attackTimer-=dt;


                if(
                    m.attackTimer<=0
                ){

                    m.attackTimer=1.2;


                    if(
                        player.dodgeTimer<=0
                    ){

                        player.hp-=10;

                        showMessage(
                            "-10 VIDA"
                        );
                    }
                }
            }

        }else{

            m.state="idle";
        }
    }
}


/* =========================================================
   MOVIMIENTO DEL JUGADOR
========================================================= */

function updatePlayer(dt){

    if(player.attackTimer>0)
        player.attackTimer-=dt;


    if(player.attackCooldown>0)
        player.attackCooldown-=dt;


    if(player.dodgeTimer>0)
        player.dodgeTimer-=dt;


    player.stamina=
        Math.min(
            player.maxStamina,
            player.stamina+
            22*dt
        );


    let forward=
        -joyY;

    let strafe=
        joyX;


    if(
        Math.abs(forward)+
        Math.abs(strafe)<.05
    ){

        return;
    }


    let speed=
        player.speed;


    if(player.dodgeTimer>0)
        speed=5.5;


    const cos=
        Math.cos(player.angle);

    const sin=
        Math.sin(player.angle);


    const dx=
        (
            cos*forward-
            sin*strafe
        )*
        speed*
        dt;


    const dy=
        (
            sin*forward+
            cos*strafe
        )*
        speed*
        dt;


    moveEntity(
        player,
        dx,
        dy
    );


    /*
        DIRECCIÓN AUTOMÁTICA DEL PERSONAJE

        Si existe movimiento real,
        el personaje gira hacia la dirección
        en la que se desplaza.

        Esto funciona especialmente bien
        en tercera persona.
    */

    if(
        Math.abs(forward)+
        Math.abs(strafe)>.1
    ){

        const movementAngle=
            Math.atan2(
                dy,
                dx
            );


        /*
            Suavizamos la orientación.
        */

        const difference=
            normalizeAngle(
                movementAngle-
                player.moveAngle
            );


        player.moveAngle+=
            difference*
            Math.min(
                1,
                dt*12
            );


        /*
            La orientación real acompaña
            al movimiento.
        */

        if(cameraMode===3){

            const turnDifference=
                normalizeAngle(
                    player.moveAngle-
                    player.angle
                );


            player.angle+=
                turnDifference*
                Math.min(
                    1,
                    dt*7
                );
        }
    }
}


/* =========================================================
   RAYCASTER
========================================================= */

function castRay(angle){

    const cos=
        Math.cos(angle);

    const sin=
        Math.sin(angle);


    let distance=0;


    while(
        distance<MAX_DEPTH
    ){

        distance+=.035;


        const x=
            camera.x+
            cos*distance;

        const y=
            camera.y+
            sin*distance;


        if(isWall(x,y)){

            return {

                distance,
                x,
                y
            };
        }
    }


    return {

        distance:MAX_DEPTH,

        x:
            camera.x+
            cos*MAX_DEPTH,

        y:
            camera.y+
            sin*MAX_DEPTH
    };
}


/* =========================================================
   RENDER DEL MUNDO
========================================================= */

function renderWorld(){

    /*
        El pitch mueve el horizonte.
    */

    const horizon=
        H/2+
        camera.pitch*
        H*.55;


    /*
        CIELO
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H*.65
        );


    sky.addColorStop(
        0,
        "#172b38"
    );


    sky.addColorStop(
        1,
        "#536451"
    );


    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        SUELO
    */

    const ground=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );


    ground.addColorStop(
        0,
        "#3d4033"
    );


    ground.addColorStop(
        1,
        "#151813"
    );


    ctx.fillStyle=ground;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    const depth=[];


    const rayCount=
        Math.min(
            NUM_RAYS,
            Math.floor(W/3)
        );


    const strip=
        W/rayCount;


    for(
        let i=0;
        i<rayCount;
        i++
    ){

        const rayAngle=
            camera.angle-
            FOV/2+
            (i/rayCount)*FOV;


        const ray=
            castRay(rayAngle);


        const corrected=
            ray.distance*
            Math.cos(
                rayAngle-
                camera.angle
            );


        /*
            El pitch modifica la altura
            aparente del muro.
        */

        const wallHeight=
            Math.min(
                H*1.8,
                H/
                (corrected+.001)*
                1.15
            );


        const top=
            horizon-
            wallHeight/2;


        const shade=
            Math.max(
                20,
                115-
                corrected*6
            );


        ctx.fillStyle=
            `rgb(${shade},${shade*.88},${shade*.68})`;


        ctx.fillRect(
            i*strip,
            top,
            strip+1,
            wallHeight
        );


        depth[i]=corrected;
    }


    renderObjects(
        depth,
        rayCount,
        strip,
        horizon
    );
}


/* =========================================================
   OBJETOS
========================================================= */

function renderObjects(
    depth,
    rayCount,
    strip,
    horizon
){

    const objects=[];


    /*
        MONSTRUOS
    */

    for(
        const m of monsters
    ){

        if(!m.alive)
            continue;


        const dx=
            m.x-camera.x;

        const dy=
            m.y-camera.y;


        const distance=
            Math.hypot(
                dx,
                dy
            );


        let relative=
            Math.atan2(
                dy,
                dx
            )-
            camera.angle;


        relative=
            normalizeAngle(
                relative
            );


        if(
            Math.abs(relative)>
            FOV*.7
        ){
            continue;
        }


        objects.push({

            entity:m,

            distance,

            relative
        });
    }


    /*
        JUGADOR EN TERCERA PERSONA
    */

    if(cameraMode===3){

        const dx=
            player.x-camera.x;

        const dy=
            player.y-camera.y;


        const distance=
            Math.hypot(
                dx,
                dy
            );


        let relative=
            Math.atan2(
                dy,
                dx
            )-
            camera.angle;


        relative=
            normalizeAngle(
                relative
            );


        objects.push({

            player:true,

            entity:player,

            distance,

            relative
        });
    }


    objects.sort(
        (a,b)=>
            b.distance-a.distance
    );


    for(
        const o of objects
    ){

        const d=
            Math.max(
                .1,
                o.distance
            );


        const screenX=
            W/2+
            Math.tan(
                o.relative
            )/
            Math.tan(FOV/2)*
            W/2;


        if(
            screenX<-250 ||
            screenX>W+250
        ){
            continue;
        }


        const size=
            Math.min(
                H*1.5,
                H/d*.85
            );


        const rayIndex=
            Math.floor(
                screenX/strip
            );


        if(
            rayIndex>=0 &&
            rayIndex<rayCount &&
            d>
            depth[rayIndex]+.3
        ){
            continue;
        }


        /*
            Pitch también desplaza
            verticalmente los objetos.
        */

        const baseY=
            horizon+
            size*.42;


        if(o.player){

            drawPlayer(
                screenX,
                baseY,
                size
            );

        }else{

            drawMonster(
                screenX,
                baseY,
                size,
                o.entity
            );
        }
    }


    /*
        Arma solamente en primera persona.
    */

    if(cameraMode===1)
        drawWeapon();
}


/* =========================================================
   MONSTRUO
========================================================= */

function drawMonster(
    x,
    y,
    size,
    m
){

    ctx.save();


    const s=
        Math.max(
            20,
            size
        );


    /*
        SOMBRA
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+3,
        s*.25,
        s*.08,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        PIERNAS
    */

    ctx.fillStyle="#28231e";


    ctx.fillRect(
        x-s*.18,
        y-s*.38,
        s*.12,
        s*.38
    );


    ctx.fillRect(
        x+s*.06,
        y-s*.38,
        s*.12,
        s*.38
    );


    /*
        CUERPO
    */

    ctx.fillStyle=
        m.hitFlash>0
        ?"white"
        :"#51412f";


    ctx.beginPath();

    ctx.ellipse(
        x,
        y-s*.55,
        s*.27,
        s*.38,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        BRAZOS
    */

    ctx.strokeStyle="#342a20";

    ctx.lineWidth=
        Math.max(
            4,
            s*.08
        );


    ctx.beginPath();


    ctx.moveTo(
        x-s*.22,
        y-s*.65
    );


    ctx.lineTo(
        x-s*.43,
        y-s*.35
    );


    ctx.moveTo(
        x+s*.22,
        y-s*.65
    );


    ctx.lineTo(
        x+s*.43,
        y-s*.35
    );


    ctx.stroke();


    /*
        CABEZA
    */

    ctx.fillStyle=
        m.hitFlash>0
        ?"white"
        :"#705c42";


    ctx.beginPath();

    ctx.arc(
        x,
        y-s*.93,
        s*.21,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CUERNOS
    */

    ctx.strokeStyle="#18130e";

    ctx.lineWidth=
        Math.max(
            3,
            s*.05
        );


    ctx.beginPath();


    ctx.moveTo(
        x-s*.13,
        y-s*1.08
    );


    ctx.lineTo(
        x-s*.27,
        y-s*1.3
    );


    ctx.moveTo(
        x+s*.13,
        y-s*1.08
    );


    ctx.lineTo(
        x+s*.27,
        y-s*1.3
    );


    ctx.stroke();


    /*
        OJOS
    */

    ctx.fillStyle="#e9c55a";


    ctx.beginPath();


    ctx.arc(
        x-s*.08,
        y-s*.96,
        s*.035,
        0,
        Math.PI*2
    );


    ctx.arc(
        x+s*.08,
        y-s*.96,
        s*.035,
        0,
        Math.PI*2
    );


    ctx.fill();


    /*
        VIDA
    */

    const barW=
        s*.55;


    ctx.fillStyle="#000";


    ctx.fillRect(
        x-barW/2,
        y-s*1.38,
        barW,
        7
    );


    ctx.fillStyle="#b52e2e";


    ctx.fillRect(
        x-barW/2,
        y-s*1.38,
        barW*
        Math.max(
            0,
            m.hp/m.maxHp
        ),
        7
    );


    ctx.restore();
}


/* =========================================================
   JUGADOR 3RA PERSONA
========================================================= */

function drawPlayer(
    x,
    y,
    size
){

    ctx.save();


    const s=
        Math.max(
            25,
            size
        );


    /*
        SOMBRA
    */

    ctx.fillStyle="#0008";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+4,
        s*.22,
        s*.07,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CUERPO
    */

    ctx.fillStyle="#39454b";


    ctx.beginPath();

    ctx.roundRect(
        x-s*.18,
        y-s*.82,
        s*.36,
        s*.52,
        s*.08
    );


    ctx.fill();


    /*
        PIERNAS
    */

    ctx.strokeStyle="#24262a";

    ctx.lineWidth=
        s*.11;


    ctx.beginPath();


    ctx.moveTo(
        x-s*.08,
        y-s*.28
    );


    ctx.lineTo(
        x-s*.12,
        y
    );


    ctx.moveTo(
        x+s*.08,
        y-s*.28
    );


    ctx.lineTo(
        x+s*.12,
        y
    );


    ctx.stroke();


    /*
        CABEZA
    */

    ctx.fillStyle="#c18e6d";


    ctx.beginPath();

    ctx.arc(
        x,
        y-s*1.02,
        s*.16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        CABEZA / DIRECCIÓN

        Indicador visual de orientación.
    */

    ctx.strokeStyle="#d7dce0";

    ctx.lineWidth=
        Math.max(
            2,
            s*.035
        );


    ctx.beginPath();

    ctx.moveTo(
        x,
        y-s*.8
    );

    ctx.lineTo(
        x,
        y-s*1.22
    );

    ctx.stroke();


    /*
        ESPADA
    */

    ctx.strokeStyle="#d7dce0";

    ctx.lineWidth=
        s*.045;


    ctx.beginPath();


    ctx.moveTo(
        x+s*.2,
        y-s*.45
    );


    ctx.lineTo(
        x+s*.48,
        y-s*.95
    );


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ARMA 1RA PERSONA
========================================================= */

function drawWeapon(){

    let swing=0;


    if(player.attackTimer>0){

        const p=
            1-
            player.attackTimer/
            .30;


        swing=
            Math.sin(
                p*Math.PI
            )*
            120;
    }


    ctx.save();


    ctx.translate(
        W*.76+swing,
        H*.76
    );


    ctx.rotate(
        -.3+
        swing*.004
    );


    /*
        BRAZO
    */

    ctx.fillStyle="#9c6d4e";


    ctx.beginPath();

    ctx.roundRect(
        -30,
        20,
        70,
        35,
        12
    );

    ctx.fill();


    /*
        EMPUÑADURA
    */

    ctx.fillStyle="#3c2517";


    ctx.fillRect(
        15,
        -20,
        22,
        70
    );


    /*
        GUARDIA
    */

    ctx.fillStyle="#c19a54";


    ctx.fillRect(
        -10,
        -25,
        70,
        12
    );


    /*
        HOJA
    */

    ctx.fillStyle="#cdd2d5";


    ctx.beginPath();

    ctx.moveTo(
        20,
        -25
    );

    ctx.lineTo(
        40,
        -210
    );

    ctx.lineTo(
        55,
        -25
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   MINIMAPA
========================================================= */

const mini=
    document.getElementById("map");

const mctx=
    mini.getContext("2d");


function renderMinimap(){

    mctx.clearRect(
        0,
        0,
        130,
        130
    );


    const scale=6;


    mctx.save();


    mctx.translate(
        65-player.x*scale,
        65-player.y*scale
    );


    for(
        let y=0;
        y<MAP_H;
        y++
    ){

        for(
            let x=0;
            x<MAP_W;
            x++
        ){

            if(
                map[y][x]==="#"
            ){

                mctx.fillStyle=
                    "#555044";


                mctx.fillRect(
                    x*scale,
                    y*scale,
                    scale+1,
                    scale+1
                );
            }
        }
    }


    /*
        MONSTRUOS
    */

    for(
        const monster
        of monsters
    ){

        if(!monster.alive)
            continue;


        mctx.fillStyle="#c33";


        mctx.beginPath();


        mctx.arc(
            monster.x*scale,
            monster.y*scale,
            3,
            0,
            Math.PI*2
        );


        mctx.fill();
    }


    mctx.restore();


    /*
        JUGADOR
    */

    mctx.fillStyle="#fff";


    mctx.beginPath();


    mctx.arc(
        65,
        65,
        4,
        0,
        Math.PI*2
    );


    mctx.fill();


    /*
        DIRECCIÓN
    */

    mctx.strokeStyle="#fff";


    mctx.beginPath();


    mctx.moveTo(
        65,
        65
    );


    mctx.lineTo(
        65+
        Math.cos(player.angle)*13,

        65+
        Math.sin(player.angle)*13
    );


    mctx.stroke();
}


/* =========================================================
   MENSAJES
========================================================= */

let messageTimer=0;


function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );


    el.textContent=text;

    el.style.opacity=1;

    messageTimer=1.2;
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(dt){

    document
    .querySelector("#hp i")
    .style.width=
        Math.max(
            0,
            player.hp/
            player.maxHp*
            100
        )+
        "%";


    document
    .querySelector("#stamina i")
    .style.width=
        player.stamina/
        player.maxStamina*
        100+
        "%";


    document
    .querySelector("#xp i")
    .style.width=
        player.xp/
        (player.level*100)*
        100+
        "%";


    document
    .getElementById("level")
    .textContent=
        "NIVEL "+
        player.level+
        " · CAZADOR";


    if(messageTimer>0){

        messageTimer-=dt;


        if(messageTimer<=0){

            document
            .getElementById("message")
            .style.opacity=0;
        }
    }


    if(player.hp<=0){

        player.hp=
            player.maxHp;


        player.x=2.8;
        player.y=2.8;


        camera.x=player.x;
        camera.y=player.y;


        showMessage(
            "HAS CAÍDO · REGRESAS AL CAMPAMENTO"
        );
    }
}


/* =========================================================
   BUCLE PRINCIPAL
========================================================= */

let last=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );


    last=now;


    updatePlayer(dt);

    updateMonsters(dt);

    updateCamera(dt);

    renderWorld();

    renderMinimap();

    updateHUD(dt);


    requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

</script>
