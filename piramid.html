<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>PYRAMID OF THE GODS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090807;
    touch-action:none;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================================================
   CANVAS
========================================================= */

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        max(12px,env(safe-area-inset-top))
        12px
        max(12px,env(safe-area-inset-bottom));

    background:
        radial-gradient(
            circle at center,
            #806037 0%,
            #352516 42%,
            #0b0907 100%
        );

    overflow:auto;
}

.menuPanel{
    width:min(430px,94vw);

    max-height:96vh;
    overflow:auto;

    padding:20px 15px;

    border:
        1px solid
        rgba(232,196,105,.75);

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            rgba(29,21,14,.98),
            rgba(11,9,7,.98)
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.75);

    text-align:center;
}

.title{
    color:#e8cb78;

    font-size:
        clamp(27px,8vw,42px);

    font-weight:900;

    line-height:.9;

    letter-spacing:2px;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.8);
}

.subtitle{
    margin:
        10px 0 18px;

    color:#cdbb92;

    font-size:10px;

    letter-spacing:1px;
}

#startButton{
    width:100%;

    min-height:58px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(
            #f4d884,
            #b67827
        );

    color:#26180b;

    font-size:16px;

    font-weight:900;

    box-shadow:
        inset 0 1px rgba(255,255,255,.4),
        0 6px 18px rgba(0,0,0,.35);
}

.sectionTitle{
    margin:
        17px 0 9px;

    color:#dcb967;

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;
}

.gods{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.godCard{
    min-height:83px;

    border:
        1px solid
        #554329;

    border-radius:12px;

    background:#19130e;

    color:#ddd;

    padding:7px 3px;

    transition:
        transform .1s,
        border-color .15s;
}

.godCard:active{
    transform:scale(.96);
}

.godCard.selected{
    border-color:#e5c46e;

    box-shadow:
        0 0 14px
        rgba(229,196,110,.28);

    background:#251b11;
}

.glyph{
    width:40px;
    height:40px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border:
        1px solid
        #967536;

    border-radius:9px;

    color:#e5c46e;

    background:#302316;

    font-size:23px;
}

.godName{
    margin-top:5px;

    font-size:9px;

    font-weight:bold;
}

.godBonus{
    margin-top:3px;

    color:#a99a7b;

    font-size:7px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;
}

/* =========================================================
   TOP HUD
========================================================= */

#topHud{
    position:absolute;

    left:
        max(7px,env(safe-area-inset-left));

    right:
        max(7px,env(safe-area-inset-right));

    top:
        max(7px,env(safe-area-inset-top));

    display:flex;

    gap:6px;
}

#statsPanel{
    flex:1;

    min-width:0;

    padding:7px 9px;

    border:
        1px solid
        rgba(226,190,99,.5);

    border-radius:12px;

    background:
        rgba(12,9,6,.82);

    backdrop-filter:blur(4px);
}

#playerName{
    color:#e8cd86;

    font-size:10px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;
}

.statBar{
    height:6px;

    margin-top:4px;

    overflow:hidden;

    border-radius:8px;

    background:#251911;
}

#healthFill{
    width:100%;
    height:100%;

    background:#c54a40;

    transition:
        width .12s;
}

#xpFill{
    width:0%;
    height:100%;

    background:#4d9dc1;

    transition:
        width .15s;
}

#hudStats{
    margin-top:4px;

    color:#d9d0bb;

    font-size:8px;

    line-height:1.4;
}

#godHud{
    width:50px;
    height:50px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid
        #cba653;

    border-radius:13px;

    background:
        rgba(17,12,7,.92);

    color:#e5c46f;

    font-size:25px;
}

/* =========================================================
   MINIMAPA
========================================================= */

#mapContainer{
    position:absolute;

    top:65px;

    right:
        max(7px,env(safe-area-inset-right));

    width:
        min(31vw,125px);

    aspect-ratio:1;

    padding:3px;

    border:
        1px solid
        rgba(218,180,83,.75);

    border-radius:10px;

    background:
        rgba(8,7,5,.92);

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.45);
}

#miniMap{
    width:100%;
    height:100%;
}

/* =========================================================
   MIRA
========================================================= */

#crosshair{
    position:absolute;

    left:50%;
    top:46%;

    width:18px;
    height:18px;

    transform:
        translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";

    position:absolute;

    background:
        rgba(255,246,218,.92);

    box-shadow:
        0 0 3px #000;
}

#crosshair::before{
    width:2px;
    height:18px;

    left:8px;
    top:0;
}

#crosshair::after{
    width:18px;
    height:2px;

    left:0;
    top:8px;
}

/* =========================================================
   MENSAJES
========================================================= */

#messages{
    position:absolute;

    left:50%;

    bottom:
        calc(
            118px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    width:
        min(61vw,310px);

    height:70px;

    padding:6px 8px;

    overflow:hidden;

    border:
        1px solid
        rgba(218,180,86,.35);

    border-radius:10px;

    background:
        rgba(8,6,4,.48);

    color:#e7d5aa;

    font-size:9px;

    line-height:1.45;

    text-shadow:
        0 1px 2px #000;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:absolute;

    left:
        max(
            11px,
            env(safe-area-inset-left)
        );

    bottom:
        max(
            13px,
            env(safe-area-inset-bottom)
        );

    width:116px;
    height:116px;

    border:
        2px solid
        rgba(229,197,112,.48);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(223,189,103,.12),
            rgba(14,11,8,.55)
        );

    pointer-events:auto;

    touch-action:none;
}

#joystick::after{
    content:"";

    position:absolute;

    inset:18px;

    border:
        1px solid
        rgba(228,194,106,.13);

    border-radius:50%;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:50px;
    height:50px;

    transform:
        translate(-50%,-50%);

    border:
        2px solid
        rgba(246,215,131,.95);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f1d993,
            #a9752e
        );

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.5);

    will-change:
        transform;
}

/* =========================================================
   BOTONES
========================================================= */

#actionButtons{
    position:absolute;

    right:
        max(
            9px,
            env(safe-area-inset-right)
        );

    bottom:
        max(
            12px,
            env(safe-area-inset-bottom)
        );

    width:130px;
    height:125px;

    pointer-events:none;
}

.actionButton{
    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        2px solid
        rgba(230,195,105,.75);

    border-radius:50%;

    background:
        rgba(31,23,15,.88);

    color:#efd181;

    font-weight:900;

    pointer-events:auto;

    touch-action:none;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.4);
}

#attackButton{
    right:0;
    bottom:0;

    width:73px;
    height:73px;

    font-size:9px;
}

#abilityButton{
    left:0;
    bottom:48px;

    width:53px;
    height:53px;

    font-size:20px;
}

#switchGodButton{
    left:0;
    bottom:0;

    width:43px;
    height:43px;

    font-size:18px;
}

.actionButton:active{
    transform:scale(.91);
}

/* =========================================================
   TELÉFONOS PEQUEÑOS
========================================================= */

@media(max-width:340px){

    #joystick{
        width:98px;
        height:98px;
    }

    #stick{
        width:43px;
        height:43px;
    }

    #joystick::after{
        inset:14px;
    }

    #actionButtons{
        width:109px;
        height:108px;
    }

    #attackButton{
        width:63px;
        height:63px;
    }

    #abilityButton{
        width:47px;
        height:47px;
        bottom:42px;
    }

    #switchGodButton{
        width:39px;
        height:39px;
    }

    #messages{
        width:58vw;
        bottom:
            calc(
                103px +
                env(safe-area-inset-bottom)
            );
    }

    #mapContainer{
        width:100px;
    }
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================================================
     MENÚ
========================================================= -->

<div id="menu">

<div class="menuPanel">

<div class="title">
PYRAMID<br>
OF THE GODS
</div>

<div class="subtitle">

data-god="ISIS">

data-god="SETH">

data-god="OSIRIS">

</div>

</div>

HP 100/100 · XP 0/100
</div>

</div>

☀
</div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

"use strict";

const SAVE_KEY =
    "PYRAMID_OF_THE_GODS_SAVE_V3";

/*
    Velocidad base NORMAL.
    Los Dioses pueden modificarla.
*/

const BASE_SPEED = 2.35;

const BASE_DAMAGE = 25;

const BASE_HP = 100;

const BASE_EVASION = 5;

const BASE_CRIT_CHANCE = 5;

const BASE_CRIT_DAMAGE = 1.5;

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const miniMap =
    document.getElementById("miniMap");

const mctx =
    miniMap.getContext("2d");

let W=0;
let H=0;

function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

    const size =
        Math.min(
            180,
            Math.max(
                100,
                window.innerWidth*.30
            )
        );

    miniMap.width=size;
    miniMap.height=size;
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   UTILIDADES
========================================================= */

function randomInt(min,max){

    return Math.floor(
        Math.random()*
        (max-min+1)
    )+min;
}

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}

function distance(
    ax,
    ay,
    bx,
    by
){

    return Math.hypot(
        bx-ax,
        by-ay
    );
}

function angleDifference(
    a,
    b
){

    let d=a-b;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return d;
}

/* =========================================================
   DIOS
========================================================= */

const gods={

    RA:{
        icon:"☀",
        speed:1.00,
        damage:1.18,
        hp:1,
        evasion:0,
        critChance:2,
        critDamage:.10
    },

    ANUBIS:{
        icon:"𓃢",
        speed:1.00,
        damage:1.02,
        hp:1,
        evasion:2,
        critChance:9,
        critDamage:.65
    },

    HORUS:{
        icon:"𓅃",
        speed:1.04,
        damage:1.00,
        hp:1,
        evasion:12,
        critChance:2,
        critDamage:.10
    },

    ISIS:{
        icon:"𓊨",
        speed:.98,
        damage:.95,
        hp:1.30,
        evasion:3,
        critChance:2,
        critDamage:.10
    },

    SETH:{
        icon:"𓃩",
        speed:1.18,
        damage:1.02,
        hp:.92,
        evasion:5,
        critChance:3,
        critDamage:.15
    },

    OSIRIS:{
        icon:"𓀀",
        speed:1.03,
        damage:1.08,
        hp:1.12,
        evasion:5,
        critChance:5,
        critDamage:.25
    }

};

let selectedGod="RA";

/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:5.5,
    y:5.5,

    angle:0,

    radius:.22,

    level:1,

    xp:0,

    nextXP:100,

    baseHp:BASE_HP,

    baseDamage:BASE_DAMAGE,

    baseSpeed:BASE_SPEED,

    baseEvasion:BASE_EVASION,

    baseCritChance:BASE_CRIT_CHANCE,

    baseCritDamage:BASE_CRIT_DAMAGE,

    hp:BASE_HP,

    maxHp:BASE_HP,

    damage:BASE_DAMAGE,

    speed:BASE_SPEED,

    evasion:BASE_EVASION,

    critChance:BASE_CRIT_CHANCE,

    critDamage:BASE_CRIT_DAMAGE,

    attackCooldown:0,

    attackTimer:0
};

/* =========================================================
   ESTADÍSTICAS DE DIOS
========================================================= */

function recalculateStats(){

    const god =
        gods[selectedGod];

    player.maxHp =
        Math.round(
            player.baseHp*
            god.hp
        );

    player.damage =
        player.baseDamage*
        god.damage;

    player.speed =
        player.baseSpeed*
        god.speed;

    player.evasion =
        clamp(
            player.baseEvasion+
            god.evasion,
            0,
            65
        );

    player.critChance =
        clamp(
            player.baseCritChance+
            god.critChance,
            0,
            70
        );

    player.critDamage =
        player.baseCritDamage+
        god.critDamage;

    player.hp =
        clamp(
            player.hp,
            0,
            player.maxHp
        );

    document.getElementById(
        "godHud"
    ).textContent =
        god.icon;

    document.getElementById(
        "switchGodButton"
    ).textContent =
        god.icon;
}

/* =========================================================
   GUARDADO
========================================================= */

function saveGame(){

    const save={

        level:
            player.level,

        xp:
            player.xp,

        nextXP:
            player.nextXP,

        baseHp:
            player.baseHp,

        baseDamage:
            player.baseDamage,

        baseSpeed:
            player.baseSpeed,

        baseEvasion:
            player.baseEvasion,

        baseCritChance:
            player.baseCritChance,

        baseCritDamage:
            player.baseCritDamage,

        hp:
            player.hp,

        selectedGod:
            selectedGod
    };

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)
        );

    }catch(error){

        console.warn(
            "No se pudo guardar.",
            error
        );
    }
}

function loadGame(){

    try{

        const raw =
            localStorage.getItem(
                SAVE_KEY
            );

        if(!raw)
            return;

        const save =
            JSON.parse(raw);

        player.level =
            Number(save.level) || 1;

        player.xp =
            Number(save.xp) || 0;

        player.nextXP =
            Number(save.nextXP) || 100;

        player.baseHp =
            Number(save.baseHp) || BASE_HP;

        player.baseDamage =
            Number(save.baseDamage) || BASE_DAMAGE;

        player.baseSpeed =
            Number(save.baseSpeed) || BASE_SPEED;

        player.baseEvasion =
            Number(save.baseEvasion);

        if(
            !Number.isFinite(
                player.baseEvasion
            )
        )
            player.baseEvasion =
                BASE_EVASION;

        player.baseCritChance =
            Number(save.baseCritChance);

        if(
            !Number.isFinite(
                player.baseCritChance
            )
        )
            player.baseCritChance =
                BASE_CRIT_CHANCE;

        player.baseCritDamage =
            Number(save.baseCritDamage);

        if(
            !Number.isFinite(
                player.baseCritDamage
            )
        )
            player.baseCritDamage =
                BASE_CRIT_DAMAGE;

        player.hp =
            Number(save.hp) ||
            player.baseHp;

        if(
            gods[save.selectedGod]
        ){

            selectedGod =
                save.selectedGod;
        }

    }catch(error){

        console.warn(
            "Partida guardada inválida.",
            error
        );
    }
}

/* =========================================================
   MAPA
========================================================= */

const FLOOR=0;
const WALL=1;
const DOOR=2;

let map=[];
let mapW=0;
let mapH=0;

let rooms=[];

const door={
    x:0,
    y:0
};

function generateMap(){

    mapW =
        randomInt(52,64);

    mapH =
        randomInt(52,64);

    map =
        Array.from(
            {
                length:mapH
            },
            () =>
                Array(mapW)
                .fill(WALL)
        );

    rooms=[];

    const roomCount =
        randomInt(9,12);

    for(
        let i=0;
        i<roomCount;
        i++
    ){

        for(
            let attempt=0;
            attempt<120;
            attempt++
        ){

            const width =
                randomInt(8,13);

            const height =
                randomInt(8,13);

            const x =
                randomInt(
                    2,
                    mapW-width-3
                );

            const y =
                randomInt(
                    2,
                    mapH-height-3
                );

            let overlap=false;

            for(
                const room of rooms
            ){

                if(
                    x <
                    room.x+
                    room.w+
                    2 &&

                    x+
                    width+
                    2 >
                    room.x &&

                    y <
                    room.y+
                    room.h+
                    2 &&

                    y+
                    height+
                    2 >
                    room.y
                ){

                    overlap=true;
                    break;
                }
            }

            if(overlap)
                continue;

            const room={

                x:x,
                y:y,

                w:width,
                h:height,

                cx:
                    Math.floor(
                        x+
                        width/2
                    ),

                cy:
                    Math.floor(
                        y+
                        height/2
                    )
            };

            rooms.push(room);

            for(
                let yy=y;
                yy<y+height;
                yy++
            ){

                for(
                    let xx=x;
                    xx<x+width;
                    xx++
                ){

                    map[yy][xx]=FLOOR;
                }
            }

            break;
        }
    }

    /*
       Garantiza que exista
       al menos una estructura.
    */

    if(
        rooms.length<2
    ){

        generateMap();
        return;
    }

    /*
       Ordenamos y conectamos
       todas las salas.
    */

    rooms.sort(
        (a,b)=>
            a.cx-b.cx
    );

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        connectRooms(
            rooms[i-1],
            rooms[i]
        );
    }

    /*
       Algunas conexiones adicionales
       para evitar sensación de laberinto.
    */

    for(
        let i=0;
        i<rooms.length-2;
        i++
    ){

        if(
            Math.random()<.32
        ){

            connectRooms(
                rooms[i],
                rooms[i+2]
            );
        }
    }

    /*
       Jugador SIEMPRE en primera sala.
    */

    const startRoom =
        rooms[0];

    player.x =
        startRoom.cx+.5;

    player.y =
        startRoom.cy+.5;

    player.angle=0;

    /*
       La puerta jamás está en
       la sala inicial.
    */

    const exitRoom =
        rooms[
            rooms.length-1
        ];

    createDoor(exitRoom);
}

function connectRooms(a,b){

    if(
        Math.random()<.5
    ){

        carveHorizontal(
            a.cx,
            b.cx,
            a.cy
        );

        carveVertical(
            a.cy,
            b.cy,
            b.cx
        );

    }else{

        carveVertical(
            a.cy,
            b.cy,
            a.cx
        );

        carveHorizontal(
            a.cx,
            b.cx,
            b.cy
        );
    }
}

function carveHorizontal(
    a,
    b,
    y
){

    const min =
        Math.min(a,b);

    const max =
        Math.max(a,b);

    for(
        let x=min;
        x<=max;
        x++
    ){

        for(
            let yy=y-1;
            yy<=y+1;
            yy++
        ){

            if(
                yy>0 &&
                yy<mapH-1 &&
                x>0 &&
                x<mapW-1
            ){

                map[yy][x]=FLOOR;
            }
        }
    }
}

function carveVertical(
    a,
    b,
    x
){

    const min =
        Math.min(a,b);

    const max =
        Math.max(a,b);

    for(
        let y=min;
        y<=max;
        y++
    ){

        for(
            let xx=x-1;
            xx<=x+1;
            xx++
        ){

            if(
                y>0 &&
                y<mapH-1 &&
                xx>0 &&
                xx<mapW-1
            ){

                map[y][xx]=FLOOR;
            }
        }
    }
}

function createDoor(room){

    /*
       La puerta ocupa un tile
       de la pared.

       No queda flotando dentro
       de la entrada.
    */

    const possible=[

        {
            x:room.cx,
            y:room.y
        },

        {
            x:room.cx,
            y:
                room.y+
                room.h-1
        },

        {
            x:room.x,
            y:room.cy
        },

        {
            x:
                room.x+
                room.w-1,
            y:room.cy
        }

    ];

    const chosen =
        possible[
            randomInt(
                0,
                possible.length-1
            )
        ];

    door.x=chosen.x;
    door.y=chosen.y;

    map[
        door.y
    ][
        door.x
    ]=DOOR;
}

function tileAt(x,y){

    const tx =
        Math.floor(x);

    const ty =
        Math.floor(y);

    if(
        tx<0 ||
        ty<0 ||
        tx>=mapW ||
        ty>=mapH
    ){

        return WALL;
    }

    return map[ty][tx];
}

function solid(x,y){

    const tile =
        tileAt(x,y);

    return (
        tile===WALL ||
        tile===DOOR
    );
}

/* =========================================================
   VISIBILIDAD
========================================================= */

function lineOfSight(
    x1,
    y1,
    x2,
    y2
){

    const dx =
        x2-x1;

    const dy =
        y2-y1;

    const d =
        Math.hypot(
            dx,
            dy
        );

    const steps =
        Math.ceil(
            d/.045
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t =
            i/steps;

        const x =
            x1+
            dx*t;

        const y =
            y1+
            dy*t;

        const tile =
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return false;
        }
    }

    return true;
}

let enemies=[];

function spawnEnemies(){

    enemies=[];

    /*
       No enemigos en la sala inicial.
    */

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        const room =
            rooms[i];

        const count =
            randomInt(1,3);

        for(
            let n=0;
            n<count;
            n++
        ){

            let x =
                room.x+
                2+
                Math.random()*
                Math.max(
                    1,
                    room.w-4
                );

            let y =
                room.y+
                2+
                Math.random()*
                Math.max(
                    1,
                    room.h-4
                );

            if(
                distance(
                    x,
                    y,
                    player.x,
                    player.y
                )<7
            ){

                x=
                    room.cx+.5;

                y=
                    room.cy+.5;
            }

            const hp =
                65+
                player.level*12;

            enemies.push({

                x:x,
                y:y,

                hp:hp,
                maxHp:hp,

                speed:
                    .62+
                    Math.random()*.32,

                cooldown:
                    Math.random()*.7,

                attackRange:
                    1.15,

                hit:0,

                wanderAngle:
                    Math.random()*
                    Math.PI*2,

                wanderTimer:
                    0
            });
        }
    }
}

   GUARDIÁN
========================================================= */

const guardian={

    active:false,

    x:0,
    y:0,

    hp:150,
    maxHp:150,

    speed:1.75,

    cooldown:0
};

function summonGuardian(){

    const positions=[

        [.9,.35],
        [-.9,.35],
        [.75,-.8],
        [-.75,-.8],
        [1.1,0],
        [-1.1,0]

    ];

    for(
        const position
        of positions
    ){

        const x =
            player.x+
            position[0];

        const y =
            player.y+
            position[1];

        if(
            !solid(x,y)
        ){

            guardian.x=x;
            guardian.y=y;

            guardian.active=true;

            guardian.hp=
                guardian.maxHp;

            return;
        }
    }

    guardian.x=
        player.x+1;

    guardian.y=
        player.y;

    guardian.active=true;
}

/* =========================================================
   MOVIMIENTO
========================================================= */

function moveEntity(
    entity,
    dx,
    dy,
    radius
){

    const nextX =
        entity.x+dx;

    if(
        !solid(
            nextX-radius,
            entity.y
        ) &&
        !solid(
            nextX+radius,
            entity.y
        )
    ){

        entity.x=
            nextX;
    }

    const nextY =
        entity.y+dy;

    if(
        !solid(
            entity.x,
            nextY-radius
        ) &&
        !solid(
            entity.x,
            nextY+radius
        )
    ){

        entity.y=
            nextY;
    }
}

/* =========================================================
   IA ENEMIGOS
========================================================= */

function updateEnemies(dt){

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp<=0
        )
            continue;

        enemy.cooldown =
            Math.max(
                0,
                enemy.cooldown-dt
            );

        enemy.hit =
            Math.max(
                0,
                enemy.hit-dt
            );

        const d =
            distance(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            );

        /*
           Percepción.
        */

        if(
            d>14
        )
            continue;

        const visible =
            lineOfSight(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            );

        if(
            visible
        ){

            /*
               Persigue al jugador.
            */

            if(
                d>
                enemy.attackRange
            ){

                const dx =
                    (
                        player.x-
                        enemy.x
                    )/d;

                const dy =
                    (
                        player.y-
                        enemy.y
                    )/d;

                /*
                   Evitar que todos los enemigos
                   ocupen exactamente el mismo punto.
                */

                const separation =
                    getEnemySeparation(
                        enemy
                    );

                moveEntity(
                    enemy,

                    (
                        dx+
                        separation.x*.45
                    )*
                    enemy.speed*
                    dt,

                    (
                        dy+
                        separation.y*.45
                    )*
                    enemy.speed*
                    dt,

                    .25
                );

            }else{

                enemyAttack(
                    enemy
                );
            }

        }else{

            /*
               Si perdió al jugador,
               realiza movimiento suave.
            */

            enemy.wanderTimer-=dt;

            if(
                enemy.wanderTimer<=0
            ){

                enemy.wanderTimer =
                    1+
                    Math.random()*2;

                enemy.wanderAngle =
                    Math.random()*
                    Math.PI*2;
            }

            moveEntity(
                enemy,

                Math.cos(
                    enemy.wanderAngle
                )*
                enemy.speed*.25*
                dt,

                Math.sin(
                    enemy.wanderAngle
                )*
                enemy.speed*.25*
                dt,

                .25
            );
        }
    }
}

function getEnemySeparation(enemy){

    let sx=0;
    let sy=0;

    for(
        const other
        of enemies
    ){

        if(
            other===enemy ||
            other.hp<=0
        )
            continue;

        const dx =
            enemy.x-
            other.x;

        const dy =
            enemy.y-
            other.y;

        const d =
            Math.hypot(
                dx,
                dy
            );

        if(
            d>0 &&
            d<.8
        ){

            sx +=
                dx/d;

            sy +=
                dy/d;
        }
    }

    return {
        x:sx,
        y:sy
    };
}

function enemyAttack(enemy){

    if(
        enemy.cooldown>0
    )
        return;

    enemy.cooldown=1.15;

    /*
       Evasión del jugador.
    */

    const roll =
        Math.random()*100;

    if(
        roll<
        player.evasion
    ){

        addMessage(
            "¡EVASIÓN!"
        );

        createParticles(
            player.x,
            player.y,
            "evasion"
        );

        return;
    }

    const damage =
        8+
        player.level*.8;

    player.hp -=
        damage;

    createParticles(
        player.x,
        player.y,
        "enemyHit"
    );

    if(
        player.hp<=0
    ){

        player.hp =
            player.maxHp;

        player.x=
            rooms[0].cx+.5;

        player.y=
            rooms[0].cy+.5;

        player.angle=0;

        addMessage(
            "Has caído. Regresas a la entrada."
        );
    }
}

/* =========================================================
   IA GUARDIÁN
========================================================= */

function updateGuardian(dt){

    if(
        !guardian.active
    )
        return;

    guardian.cooldown =
        Math.max(
            0,
            guardian.cooldown-dt
        );

    const d =
        distance(
            guardian.x,
            guardian.y,
            player.x,
            player.y
        );

    /*
       Zona de seguimiento.

       Nunca se mete encima del jugador.
    */

    if(
        d>2.1
    ){

        const dx =
            (
                player.x-
                guardian.x
            )/d;

        const dy =
            (
                player.y-
                guardian.y
            )/d;

        moveEntity(
            guardian,

            dx*
            guardian.speed*
            dt,

            dy*
            guardian.speed*
            dt,

            .27
        );

    }else if(
        d<1.35
    ){

        /*
           Si está demasiado cerca,
           se separa ligeramente.
        */

        const dx =
            (
                guardian.x-
                player.x
            )/Math.max(
                d,
                .001
            );

        const dy =
            (
                guardian.y-
                player.y
            )/Math.max(
                d,
                .001
            );

        moveEntity(
            guardian,

            dx*
            .55*
            dt,

            dy*
            .55*
            dt,

            .27
        );
    }

    /*
       Busca enemigos cercanos.
    */

    let target=null;

    let nearest=999;

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp<=0
        )
            continue;

        const d2 =
            distance(
                guardian.x,
                guardian.y,
                enemy.x,
                enemy.y
            );

        if(
            d2<4 &&
            d2<nearest &&
            lineOfSight(
                guardian.x,
                guardian.y,
                enemy.x,
                enemy.y
            )
        ){

            nearest=d2;
            target=enemy;
        }
    }

    if(
        target &&
        guardian.cooldown<=0
    ){

        target.hp-=20;

        target.hit=.16;

        guardian.cooldown=.8;

        createParticles(
            target.x,
            target.y,
            "guardian"
        );

        if(
            target.hp<=0
        ){

            gainXP(30);

            addMessage(
                "El Guardián derrotó a un enemigo."
            );
        }
    }
}

/* =========================================================
   ATAQUE DEL JUGADOR
========================================================= */

function calculateDamage(){

    let damage =
        player.damage;

    const roll =
        Math.random()*100;

    let critical=false;

    if(
        roll<
        player.critChance
    ){

        critical=true;

        damage *=
            player.critDamage;
    }

    return {
        damage:damage,
        critical:critical
    };
}

function attack(){

    if(
        !gameRunning
    )
        return;

    if(
        player.attackCooldown>0
    )
        return;

    player.attackCooldown=.40;

    player.attackTimer=.30;

    /*
       Partículas del barrido.
    */

    createParticles(
        player.x+
        Math.cos(
            player.angle
        )*.8,

        player.y+
        Math.sin(
            player.angle
        )*.8,

        "attack"
    );

    let target=null;

    let nearest=
        5.2;

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp<=0
        )
            continue;

        const d =
            distance(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

        /*
           Alcance del arma.
        */

        if(
            d>
            nearest
        )
            continue;

        const targetAngle =
            Math.atan2(
                enemy.y-player.y,
                enemy.x-player.x
            );

        const difference =
            Math.abs(
                angleDifference(
                    targetAngle,
                    player.angle
                )
            );

        /*
           Área horizontal del arma.
        */

        if(
            difference>
            .58
        )
            continue;

        /*
           Las paredes bloquean el ataque.
        */

        if(
            !lineOfSight(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        )
            continue;

        nearest=d;

        target=enemy;
    }

    if(!target){

        addMessage(
            "El ataque no alcanzó ningún objetivo."
        );

        return;
    }

    const result =
        calculateDamage();

    target.hp -=
        result.damage;

    target.hit=.15;

    createParticles(
        target.x,
        target.y,
        result.critical
            ? "critical"
            : "hit"
    );

    if(
        result.critical
    ){

        addMessage(
            "¡GOLPE CRÍTICO! "+
            Math.round(
                result.damage
            )+
            " DAÑO"
        );

    }else{

        addMessage(
            "Golpe · "+
            Math.round(
                result.damage
            )+
            " daño"
        );
    }

    if(
        target.hp<=0
    ){

        gainXP(
            result.critical
                ? 50
                : 35
        );

        addMessage(
            "Enemigo derrotado."
        );
    }
}

/* =========================================================
   HABILIDADES
========================================================= */

function ability(){

    if(
        !gameRunning
    )
        return;

    const god =
        selectedGod;

    let radius=3.5;

    let damage=45;

    if(god==="RA"){

        radius=4;
        damage=65;
    }

    if(god==="ANUBIS"){

        radius=4;
        damage=60;
    }

    if(god==="HORUS"){

        radius=6;
        damage=55;
    }

    if(god==="ISIS"){

        radius=3;
        damage=30;

        player.hp =
            Math.min(
                player.maxHp,
                player.hp+35
            );

        addMessage(
            "Isis restaura tu vida."
        );
    }

    if(god==="SETH"){

        radius=4.5;
        damage=75;
    }

    if(god==="OSIRIS"){

        radius=4;
        damage=50;
    }

    createParticles(
        player.x,
        player.y,
        "ability"
    );

    let affected=0;

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp<=0
        )
            continue;

        const d =
            distance(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

        if(
            d<=radius &&
            lineOfSight(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        ){

            enemy.hp -=
                damage;

            enemy.hit=.25;

            affected++;

            createParticles(
                enemy.x,
                enemy.y,
                "abilityHit"
            );

            if(
                enemy.hp<=0
            ){

                gainXP(50);
            }
        }
    }

    addMessage(
        gods[god].ability ||
        god+
        " desata su poder · "+
        affected+
        " afectados."
    );
}

/* =========================================================
   XP / NIVEL
========================================================= */

function gainXP(amount){

    player.xp +=
        amount;

    let leveled=false;

    while(
        player.xp>=
        player.nextXP
    ){

        player.xp -=
            player.nextXP;

        player.level++;

        player.nextXP =
            Math.floor(
                player.nextXP*
                1.30
            );

        /*
           Mejoras permanentes.
        */

        player.baseHp += 10;

        player.baseDamage += 2.5;

        player.baseSpeed += .025;

        player.baseEvasion += .65;

        player.baseCritChance += .55;

        player.baseCritDamage += .025;

        leveled=true;
    }

    if(leveled){

        recalculateStats();

        player.hp =
            player.maxHp;

        addMessage(
            "NIVEL "+
            player.level+
            " · Estadísticas mejoradas."
        );

        saveGame();
    }
}

   PUERTA

function checkDoor(){

/* =========================================================
   PARTÍCULAS
========================================================= */

const particles=[];

function createParticles(
    x,
    y,
    type
){

    let amount=12;

    if(
        type==="ability" ||
        type==="abilityHit"
    )
        amount=26;

    if(
        type==="critical"
    )
        amount=22;

    if(
        type==="guardian"
    )
        amount=15;

    if(
        type==="evasion"
    )
        amount=12;

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;

        const speed =
            .45+
            Math.random()*
            2.2;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:
                .25+
                Math.random()*.5,

            max:.75,

            type:type,

            size:
                1+
                Math.random()*2
        });
    }
}

function updateParticles(dt){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.x +=
            p.vx*
            dt;

        p.y +=
            p.vy*
            dt;

        p.vx *=
            .96;

        p.vy *=
            .96;

        p.life -=
            dt;

        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}

/* =========================================================
   RAYCAST
========================================================= */

const FOV =
    Math.PI/3;

function castRay(angle){

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);

    for(
        let d=.02;
        d<35;
        d+=.035
    ){

        const x =
            player.x+
            cos*d;

        const y =
            player.y+
            sin*d;

        const tile =
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return {
                distance:d,
                type:tile
            };
        }
    }

    return {
        distance:35,
        type:WALL
    };
}

/* =========================================================
   RENDER MUNDO
========================================================= */

function renderWorld(){

    const horizon =
        H*.46;

    /*
       CIELO
    */

    ctx.fillStyle =
        "#b9a273";

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );

    /*
       SUELO ARENA.
       No refleja las paredes.
    */

    ctx.fillStyle =
        "#b98d55";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    const columns =
        Math.min(
            W,
            560
        );

    const columnWidth =
        W/columns;

    for(
        let i=0;
        i<columns;
        i++
    ){

        const cameraX =
            i/columns-.5;

        const rayAngle =
            player.angle+
            cameraX*FOV;

        const hit =
            castRay(
                rayAngle
            );

        let corrected =
            hit.distance*
            Math.cos(
                rayAngle-
                player.angle
            );

        corrected =
            Math.max(
                .01,
                corrected
            );

        const wallHeight =
            Math.min(
                H*1.55,
                H*.92/
                corrected
            );

        const top =
            horizon-
            wallHeight/2;

        if(
            hit.type===DOOR
        ){

            /*
               Puerta oscura integrada
               en la pared.
            */

            ctx.fillStyle =
                "#241910";

        }else{

            const brightness =
                clamp(
                    152-
                    corrected*7.2,
                    43,
                    145
                );

            ctx.fillStyle =
                "rgb("+
                Math.floor(
                    brightness
                )+
                ","+
                Math.floor(
                    brightness*.72
                )+
                ","+
                Math.floor(
                    brightness*.48
                )+
                ")";
        }

        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );
    }

    renderObjects();

    renderWeapon();

    renderParticles();
}

/* =========================================================
   PROYECCIÓN
========================================================= */

function projectObject(
    object
){

    const dx =
        object.x-
        player.x;

    const dy =
        object.y-
        player.y;

    const d =
        Math.hypot(
            dx,
            dy
        );

    if(
        d<.1
    )
        return null;

    /*
       El objeto queda oculto
       si una pared está delante.
    */

    if(
        !lineOfSight(
            player.x,
            player.y,
            object.x,
            object.y
        )
    ){

        return null;
    }

    const angle =
        Math.atan2(
            dy,
            dx
        );

    const relative =
        angleDifference(
            angle,
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.76
    )
        return null;

    const projection =
        W/
        (
            2*
            Math.tan(
                FOV/2
            )
        );

    const screenX =
        W/2+
        Math.tan(
            relative
        )*
        projection;

    const size =
        Math.min(
            H*.78,
            H/
            (
                d*.95
            )
        );

    return {

        x:screenX,

        ground:H*.46+
            size*.5,

        size:size,

        distance:d
    };
}

/* =========================================================
   OBJETOS
========================================================= */

function renderObjects(){

    const objects=[];

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp>0
        ){

            objects.push({
                type:"enemy",
                object:enemy
            });
        }
    }

    if(
        guardian.active
    ){

        objects.push({
            type:"guardian",
            object:guardian
        });
    }

    objects.sort(
        (a,b)=>
            distance(
                player.x,
                player.y,
                b.object.x,
                b.object.y
            )-
            distance(
                player.x,
                player.y,
                a.object.x,
                a.object.y
            )
    );

    for(
        const item
        of objects
    ){

        const projection =
            projectObject(
                item.object
            );

        if(
            !projection
        )
            continue;

        if(
            item.type==="enemy"
        ){

            drawEnemy(
                item.object,
                projection
            );

        }else{

            drawGuardian(
                projection
            );
        }
    }
}

/* =========================================================
   ENEMIGO
========================================================= */

function drawEnemy(
    enemy,
    p
){

    const size =
        p.size;

    const x =
        p.x;

    const ground =
        p.ground;

    /*
       Sombra pegada al suelo.
    */

    ctx.fillStyle =
        "rgba(24,14,7,.4)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        size*.24,
        size*.07,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Piernas.
    */

    ctx.fillStyle =
        enemy.hit>0
            ? "#ffffff"
            : "#3c251c";

    ctx.fillRect(
        x-size*.12,
        ground-size*.23,
        size*.08,
        size*.23
    );

    ctx.fillRect(
        x+size*.04,
        ground-size*.23,
        size*.08,
        size*.23
    );

    /*
       Cuerpo.
    */

    ctx.fillStyle =
        enemy.hit>0
            ? "#ffffff"
            : "#633c2d";

    ctx.fillRect(
        x-size*.17,
        ground-size*.51,
        size*.34,
        size*.30
    );

    /*
       Cabeza.
    */

    ctx.fillStyle =
        "#36221b";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-size*.61,
        size*.15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Ojos.
    */

    ctx.fillStyle =
        "#e2b448";

    ctx.fillRect(
        x-size*.075,
        ground-size*.62,
        size*.045,
        size*.026
    );

    ctx.fillRect(
        x+size*.03,
        ground-size*.62,
        size*.045,
        size*.026
    );

    /*
       BARRA DE VIDA.
    */

    const barWidth =
        size*.58;

    const barHeight =
        Math.max(
            4,
            size*.035
        );

    const barY =
        ground-
        size*.82;

    ctx.fillStyle =
        "#1c0d09";

    ctx.fillRect(
        x-barWidth/2,
        barY,
        barWidth,
        barHeight
    );

    ctx.fillStyle =
        "#d64c42";

    ctx.fillRect(
        x-barWidth/2,
        barY,
        barWidth*
        clamp(
            enemy.hp/
            enemy.maxHp,
            0,
            1
        ),
        barHeight
    );
}

/* =========================================================
   GUARDIÁN
========================================================= */

function drawGuardian(p){

    const size =
        p.size;

    const x =
        p.x;

    const ground =
        p.ground;

    const pulse =
        1+
        Math.sin(
            performance.now()*.005
        )*.06;

    ctx.fillStyle =
        "rgba(15,20,17,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        size*.27,
        size*.075,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Aura.
    */

    ctx.strokeStyle =
        "rgba(229,193,83,.72)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        x,
        ground-size*.40,
        size*.32*
        pulse,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       Cuerpo.
    */

    ctx.fillStyle =
        "#927238";

    ctx.beginPath();

    ctx.moveTo(
        x-size*.22,
        ground
    );

    ctx.lineTo(
        x-size*.16,
        ground-size*.49
    );

    ctx.lineTo(
        x,
        ground-size*.58
    );

    ctx.lineTo(
        x+size*.16,
        ground-size*.49
    );

    ctx.lineTo(
        x+size*.22,
        ground
    );

    ctx.closePath();

    ctx.fill();

    /*
       Cabeza.
    */

    ctx.fillStyle =
        "#d2ad64";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-size*.63,
        size*.14,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Vida.
    */

    const bw =
        size*.54;

    ctx.fillStyle =
        "#1c1009";

    ctx.fillRect(
        x-bw/2,
        ground-size*.80,
        bw,
        Math.max(
            4,
            size*.032
        )
    );

    ctx.fillStyle =
        "#54b7c9";

    ctx.fillRect(
        x-bw/2,
        ground-size*.80,
        bw*
        clamp(
            guardian.hp/
            guardian.maxHp,
            0,
            1
        ),
        Math.max(
            4,
            size*.032
        )
    );
}

/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    let swing=0;

    if(
        player.attackTimer>0
    ){

        const progress =
            1-
            player.attackTimer/
            .30;

        /*
           Barrido horizontal.
        */

        swing =
            Math.sin(
                progress*
                Math.PI
            );
    }

    /*
       Mano derecha.
    */

    const baseX =
        W*.79;

    const baseY =
        H*1.05;

    ctx.save();

    ctx.translate(
        baseX-
        swing*
        W*.24,

        baseY-
        swing*
        H*.11
    );

    ctx.rotate(
        -.48-
        swing*
        1.12
    );

    /*
       Brazo.
    */

    ctx.fillStyle =
        "#875736";

    ctx.fillRect(
        -13,
        -13,
        26,
        72
    );

    /*
       Mango.
    */

    ctx.fillStyle =
        "#3a2215";

    ctx.fillRect(
        -5,
        -97,
        10,
        66
    );

    /*
       Guarda.
    */

    ctx.fillStyle =
        "#d4ae59";

    ctx.fillRect(
        -13,
        -104,
        26,
        8
    );

    /*
       Hoja.
    */

    ctx.beginPath();

    ctx.moveTo(
        -4,
        -103
    );

    ctx.lineTo(
        0,
        -194
    );

    ctx.lineTo(
        5,
        -103
    );

    ctx.closePath();

    ctx.fillStyle =
        "#d7c8a2";

    ctx.fill();

    /*
       Brillo.
    */

    ctx.strokeStyle =
        "#fff2bd";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        1,
        -105
    );

    ctx.lineTo(
        1,
        -182
    );

    ctx.stroke();

    /*
       Arco del ataque.
    */

    if(
        player.attackTimer>0
    ){

        ctx.strokeStyle =
            "rgba(244,208,106,.82)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            -102,
            94,
            -.98,
            .14
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   PARTICULAS EN PANTALLA
========================================================= */

function renderParticles(){

    for(
        const particle
        of particles
    ){

        const projected =
            projectObject({
                x:particle.x,
                y:particle.y
            });

        if(
            !projected
        )
            continue;

        const alpha =
            clamp(
                particle.life/
                particle.max,
                0,
                1
            );

        let color =
            "rgba(255,215,120,"+
            alpha+
            ")";

        if(
            particle.type==="critical"
        ){

            color =
                "rgba(255,235,100,"+
                alpha+
                ")";

        }else if(
            particle.type==="guardian"
        ){

            color =
                "rgba(91,211,238,"+
                alpha+
                ")";

        }else if(
            particle.type==="evasion"
        ){

            color =
                "rgba(135,220,255,"+
                alpha+
                ")";

        }else if(
            particle.type==="ability" ||
            particle.type==="abilityHit"
        ){

            color =
                "rgba(243,190,63,"+
                alpha+
                ")";

        }else if(
            particle.type==="enemyHit"
        ){

            color =
                "rgba(225,90,67,"+
                alpha+
                ")";
        }

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            projected.x,
            projected.ground-
            projected.size*.35,
            Math.max(
                2,
                projected.size*
                .018*
                particle.size
            ),
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================================================
   MINIMAPA COMPLETO
========================================================= */

function renderMiniMap(){

    const mw =
        miniMap.width;

    const mh =
        miniMap.height;

    mctx.clearRect(
        0,
        0,
        mw,
        mh
    );

    if(
        !map.length
    )
        return;

    mctx.fillStyle =
        "#0e0b08";

    mctx.fillRect(
        0,
        0,
        mw,
        mh
    );

    /*
       Escala para que TODO
       el mapa quepa.
    */

    const scale =
        Math.min(
            mw/mapW,
            mh/mapH
        );

    const offsetX =
        (
            mw-
            mapW*scale
        )/2;

    const offsetY =
        (
            mh-
            mapH*scale
        )/2;

    for(
        let y=0;
        y<mapH;
        y++
    ){

        for(
            let x=0;
            x<mapW;
            x++
        ){

            const tile =
                map[y][x];

            if(
                tile===WALL
            ){

                mctx.fillStyle =
                    "#3e3023";

            }else if(
                tile===DOOR
            ){

                mctx.fillStyle =
                    "#e4bd51";

            }else{

                mctx.fillStyle =
                    "#a98352";
            }

            mctx.fillRect(
                offsetX+
                x*scale,

                offsetY+
                y*scale,

                Math.ceil(scale)+.25,

                Math.ceil(scale)+.25
            );
        }
    }

    /*
       Enemigos.
    */

    for(
        const enemy
        of enemies
    ){

        if(
            enemy.hp<=0
        )
            continue;

        mctx.fillStyle =
            "#d84b43";

        mctx.beginPath();

        mctx.arc(
            offsetX+
            enemy.x*scale,

            offsetY+
            enemy.y*scale,

            Math.max(
                1.4,
                scale
            ),

            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
       Guardián.
    */

    if(
        guardian.active
    ){

        mctx.fillStyle =
            "#55bfd7";

        mctx.beginPath();

        mctx.arc(
            offsetX+
            guardian.x*scale,

            offsetY+
            guardian.y*scale,

            Math.max(
                2,
                scale*1.2
            ),

            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
       Jugador.
    */

    mctx.fillStyle =
        "#fff0a3";

    mctx.beginPath();

    mctx.arc(
        offsetX+
        player.x*scale,

        offsetY+
        player.y*scale,

        Math.max(
            2,
            scale*1.5
        ),

        0,
        Math.PI*2
    );

    mctx.fill();

    /*
       Dirección.
    */

    mctx.strokeStyle =
        "#fff0a3";

    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(
        offsetX+
        player.x*scale,

        offsetY+
        player.y*scale
    );

    mctx.lineTo(
        offsetX+
        (
            player.x+
            Math.cos(
                player.angle
            )*
            2
        )*
        scale,

        offsetY+
        (
            player.y+
            Math.sin(
                player.angle
            )*
            2
        )*
        scale
    );

    mctx.stroke();
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

const joystickState={

    active:false,

    pointerId:null,

    x:0,
    y:0,

    targetX:0,
    targetY:0,

    centerX:0,
    centerY:0,

    radius:0,

    knobRadius:0
};

function prepareJoystick(){

    const rect =
        joystick.getBoundingClientRect();

    joystickState.centerX =
        rect.left+
        rect.width/2;

    joystickState.centerY =
        rect.top+
        rect.height/2;

    joystickState.knobRadius =
        stick.offsetWidth/2;

    joystickState.radius =
        rect.width/2-
        joystickState.knobRadius;
}

function updateJoystick(
    clientX,
    clientY
){

    prepareJoystick();

    let dx =
        clientX-
        joystickState.centerX;

    let dy =
        clientY-
        joystickState.centerY;

    const max =
        joystickState.radius;

    const rawDistance =
        Math.hypot(
            dx,
            dy
        );

    if(
        rawDistance>max
    ){

        dx =
            dx/
            rawDistance*
            max;

        dy =
            dy/
            rawDistance*
            max;
    }

    const normalized =
        Math.min(
            1,
            Math.hypot(
                dx,
                dy
            )/
            max
        );

    /*
       Zona muerta.
    */

    const deadZone=.07;

    let magnitude=0;

    if(
        normalized>
        deadZone
    ){

        magnitude =
            (
                normalized-
                deadZone
            )/
            (
                1-
                deadZone
            );

        /*
           Curva suave.
        */

        magnitude =
            Math.pow(
                magnitude,
                .86
            );
    }

    if(
        rawDistance>.001
    ){

        const nx =
            dx/
            rawDistance;

        const ny =
            dy/
            rawDistance;

        joystickState.targetX =
            nx*magnitude;

        joystickState.targetY =
            ny*magnitude;

    }else{

        joystickState.targetX=0;
        joystickState.targetY=0;
    }

    /*
       El knob se mantiene dentro
       del círculo.
    */

    stick.style.transform =
        "translate3d("+
        (
            dx-
            joystickState.knobRadius
        )+
        "px,"+
        (
            dy-
            joystickState.knobRadius
        )+
        "px,0)";
}

function resetJoystick(){

    joystickState.active=false;

    joystickState.pointerId=null;

    joystickState.targetX=0;
    joystickState.targetY=0;

    joystickState.x=0;
    joystickState.y=0;

    stick.style.transform =
        "translate3d(-50%,-50%,0)";
}

joystick.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();

        prepareJoystick();

        joystickState.active=true;

        joystickState.pointerId =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    function(event){

        if(
            !joystickState.active ||
            event.pointerId!==
            joystickState.pointerId
        )
            return;

        event.preventDefault();

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    function(event){

        if(
            event.pointerId===
            joystickState.pointerId
        ){

            resetJoystick();
        }
    }
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   CÁMARA TÁCTIL
========================================================= */

let cameraPointer=null;

let previousCameraX=0;

canvas.addEventListener(
    "pointerdown",
    function(event){

        if(
            !gameRunning
        )
            return;

        /*
           El lado derecho controla
           la cámara.
        */

        if(
            event.clientX<
            window.innerWidth*.43
        )
            return;

        cameraPointer =
            event.pointerId;

        previousCameraX =
            event.clientX;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    function(event){

        if(
            cameraPointer!==
            event.pointerId
        )
            return;

        const dx =
            event.clientX-
            previousCameraX;

        previousCameraX =
            event.clientX;

        player.angle +=
            dx*.0055;
    }
);

canvas.addEventListener(
    "pointerup",
    function(event){

        if(
            cameraPointer===
            event.pointerId
        ){

            cameraPointer=null;
        }
    }
);

canvas.addEventListener(
    "pointercancel",
    function(){

        cameraPointer=null;
    }
);

                    card.dataset.god===
                    selectedGod
                );
            }
        );

        recalculateStats();

        saveGame();

        addMessage(
            selectedGod+
            " seleccionado."
        );
    }
);

/* =========================================================
   SELECCIÓN DE DIOS
========================================================= */

document
.querySelectorAll(
    ".godCard"
)
.forEach(
    card=>{

        card.addEventListener(
            "click",
            function(){

                selectedGod =
                    card.dataset.god;

                document
                .querySelectorAll(
                    ".godCard"
                )
                .forEach(
                    c=>{
                        c.classList.remove(
                            "selected"
                        );
                    }
                );

                card.classList.add(
                    "selected"
                );

                recalculateStats();

                saveGame();
            }
        );
    }
);

/* =========================================================
   TECLADO
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    function(event){

        keys[
            event.key.toLowerCase()
        ]=true;

        if(
            event.key===" "
        ){

            event.preventDefault();

            attack();
        }

        if(
            event.key.toLowerCase()==="e"
        ){

            ability();
        }
    }
);

window.addEventListener(
    "keyup",
    function(event){

        keys[
            event.key.toLowerCase()
        ]=false;
    }
);

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !gameRunning
    )
        return;

    player.attackCooldown =
        Math.max(
            0,
            player.attackCooldown-dt
        );

    player.attackTimer =
        Math.max(
            0,
            player.attackTimer-dt
        );

    doorCooldown =
        Math.max(
            0,
            doorCooldown-dt
        );

    /*
       Suavizado del joystick.
    */

    const smoothing =
        1-
        Math.pow(
            .001,
            dt
        );

    joystickState.x +=
        (
            joystickState.targetX-
            joystickState.x
        )*
        smoothing;

    joystickState.y +=
        (
            joystickState.targetY-
            joystickState.y
        )*
        smoothing;

    let forward =
        -joystickState.y;

    let strafe =
        joystickState.x;

    /*
       Teclado.
    */

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    const keyboardLength =
        Math.hypot(
            forward,
            strafe
        );

    if(
        keyboardLength>1
    ){

        forward /=
            keyboardLength;

        strafe /=
            keyboardLength;
    }

    /*
       Movimiento relativo
       a la cámara.
    */

    const moveX =
        (
            Math.cos(
                player.angle
            )*
            forward
            -
            Math.sin(
                player.angle
            )*
            strafe
        )*
        player.speed*
        dt;

    const moveY =
        (
            Math.sin(
                player.angle
            )*
            forward
            +
            Math.cos(
                player.angle
            )*
            strafe
        )*
        player.speed*
        dt;

    moveEntity(
        player,
        moveX,
        moveY,
        player.radius
    );

    updateEnemies(dt);

    updateGuardian(dt);

    updateParticles(dt);

    checkDoor();

    updateHUD();
}

/* =========================================================
   LOOP
========================================================= */

let gameRunning=false;

let lastTime=0;

function gameLoop(time){

    const dt =
        Math.min(
            .033,
            (
                time-
                lastTime
            )/
            1000||
            0
        );

    lastTime=time;

    update(dt);

    renderWorld();

    renderMiniMap();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

   INICIO
========================================================= */

    }
);

</script>
