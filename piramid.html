<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080604;
    color:#ead9a0;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#111;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

/* =========================
   BARRA SUPERIOR
========================= */

#topHud{
    position:absolute;
    top:env(safe-area-inset-top,6px);
    left:8px;
    right:8px;
    height:62px;
    display:flex;
    align-items:center;
    gap:7px;
}

.panel{
    background:rgba(13,9,5,.88);
    border:1px solid rgba(218,174,76,.5);
    box-shadow:
        0 0 12px rgba(0,0,0,.7),
        inset 0 0 10px rgba(255,190,70,.04);
    border-radius:9px;
}

#playerPanel{
    width:190px;
    padding:7px;
}

#levelText{
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.bar{
    height:9px;
    background:#211710;
    border:1px solid #5f4824;
    border-radius:8px;
    overflow:hidden;
    margin-top:4px;
}

#hpFill{
    width:100%;
    height:100%;
    background:#b53627;
}

#xpFill{
    width:0%;
    height:100%;
    background:#d3a62e;
}

#statsMini{
    font-size:9px;
    margin-top:4px;
    opacity:.8;
}

#godButton{
    pointer-events:auto;
    height:54px;
    flex:1;
    min-width:0;
    color:#efd37b;
    background:rgba(22,14,7,.94);
    border:1px solid #876528;
    border-radius:9px;
    font-size:11px;
    font-weight:bold;
}

#godIcon{
    font-size:23px;
    display:block;
    line-height:23px;
}

/* =========================
   MINIMAPA
========================= */

#mapPanel{
    position:absolute;
    top:76px;
    right:8px;
    width:min(150px,34vw);
    aspect-ratio:1/1;
    padding:5px;
    pointer-events:none;
}

#miniMap{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* =========================
   MENSAJES
========================= */

#messages{
    position:absolute;
    left:50%;
    bottom:118px;
    transform:translateX(-50%);
    width:min(310px,72vw);
    min-height:42px;
    max-height:90px;
    overflow:hidden;
    padding:7px 10px;
    text-align:center;
    background:rgba(8,6,3,.76);
    border:1px solid rgba(201,158,67,.45);
    border-radius:8px;
    font-size:11px;
    line-height:15px;
    color:#dfc887;
}

/* =========================
   CONTROLES
========================= */

#leftStick,
#rightStick{
    position:absolute;
    bottom:20px;
    width:112px;
    height:112px;
    border-radius:50%;
    background:rgba(22,17,11,.47);
    border:2px solid rgba(215,176,91,.32);
    pointer-events:auto;
}

#leftStick{
    left:18px;
}

#rightStick{
    right:18px;
}

.stickCenter{
    position:absolute;
    width:48px;
    height:48px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(204,164,77,.23);
    border:1px solid rgba(235,201,125,.5);
}

.stickDot{
    position:absolute;
    width:34px;
    height:34px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(213,174,82,.6);
    border:1px solid #e3c36e;
}

#actions{
    position:absolute;
    right:143px;
    bottom:25px;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:auto;
}

.action{
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid #927034;
    background:rgba(25,17,9,.88);
    color:#e8cb7d;
    font-size:10px;
    font-weight:bold;
}

.action:active{
    transform:scale(.92);
    background:#533b17;
}

#attackBtn{
    width:70px;
    height:70px;
    border-color:#d5a93e;
    font-size:12px;
}

/* =========================
   GOD PANEL
========================= */

#godMenu{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    pointer-events:auto;
}

#godBox{
    width:min(360px,90vw);
    max-height:82vh;
    overflow:auto;
    padding:15px;
    background:#110c07;
    border:1px solid #a67d32;
    border-radius:13px;
    box-shadow:0 15px 50px #000;
}

#godBox h2{
    text-align:center;
    margin:0 0 5px;
    color:#e6c46d;
    font-size:19px;
}

#godBox p{
    text-align:center;
    font-size:10px;
    opacity:.7;
}

.god{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    margin:7px 0;
    padding:9px;
    background:#1b1209;
    border:1px solid #59431f;
    border-radius:9px;
    color:#e5cc8c;
    text-align:left;
}

.godIcon{
    width:44px;
    height:44px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    font-size:28px;
    border:1px solid #755924;
    background:#0b0805;
    border-radius:7px;
}

.god strong{
    display:block;
    font-size:12px;
}

.god small{
    display:block;
    font-size:9px;
    opacity:.75;
    margin-top:3px;
}

#closeGod{
    width:100%;
    margin-top:8px;
    height:38px;
    background:#33230e;
    color:#e6ca7d;
    border:1px solid #87672d;
    border-radius:7px;
}

/* =========================
   FLASH DAÑO
========================= */

#damageFlash{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.4);
    opacity:0;
    pointer-events:none;
}

/* =========================
   PAUSA
========================= */

#pause{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    pointer-events:auto;
}

#pauseBox{
    width:280px;
    padding:22px;
    text-align:center;
    background:#120d08;
    border:1px solid #99732e;
    border-radius:12px;
}

.pauseButton{
    width:100%;
    height:42px;
    margin-top:8px;
    background:#271a0b;
    color:#e5ca7c;
    border:1px solid #765725;
    border-radius:7px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:360px){

    #topHud{
        height:54px;
        left:5px;
        right:5px;
    }

    #playerPanel{
        width:155px;
    }

    #mapPanel{
        top:65px;
        width:112px;
    }

    #leftStick,
    #rightStick{
        width:96px;
        height:96px;
        bottom:14px;
    }

    #leftStick{
        left:10px;
    }

    #rightStick{
        right:10px;
    }

    #actions{
        right:116px;
        bottom:18px;
    }

    .action{
        width:50px;
        height:50px;
    }

    #attackBtn{
        width:62px;
        height:62px;
    }

    #messages{
        bottom:106px;
        width:64vw;
        font-size:9px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="topHud">

        <div id="playerPanel" class="panel">

            <div id="levelText">
                NIVEL 1 · TEMPLO
            </div>

            <div class="bar">
                <div id="hpFill"></div>
            </div>

            <div class="bar">
                <div id="xpFill"></div>
            </div>

            <div id="statsMini">
                ATQ 10 · EVASIÓN 5% · CRIT 5%
            </div>

        </div>

        <button id="godButton">
            <span id="godIcon">𓂀</span>
            <span id="godName">RA</span>
        </button>

    </div>

    <div id="mapPanel" class="panel">
        <canvas id="miniMap"></canvas>
    </div>

    <div id="messages">
        La puerta conduce a una nueva sala.
    </div>

    <div id="leftStick">
        <div class="stickCenter"></div>
        <div class="stickDot" id="leftDot"></div>
    </div>

    <div id="rightStick">
        <div class="stickCenter"></div>
        <div class="stickDot" id="rightDot"></div>
    </div>

    <div id="actions">

        <button class="action" id="blessBtn">
            DIOS
        </button>

        <button class="action" id="abilityBtn">
            PODER
        </button>

        <button class="action" id="attackBtn">
            ATAQUE
        </button>

    </div>

    <div id="damageFlash"></div>

    <div id="godMenu">

        <div id="godBox">

            <h2>𓂀 BENDICIONES</h2>

            <p>
                Selecciona el Dios cuya bendición quieres utilizar.
            </p>

            <button class="god" data-god="ra">
                <div class="godIcon">☀</div>
                <div>
                    <strong>RA · DIOS DEL SOL</strong>
                    <small>Pasiva: +velocidad · Activa: explosión solar</small>
                </div>
            </button>

            <button class="god" data-god="anubis">
                <div class="godIcon">𓃢</div>
                <div>
                    <strong>ANUBIS · GUARDIÁN</strong>
                    <small>Pasiva: +evasión · Activa: sombra protectora</small>
                </div>
            </button>

            <button class="god" data-god="horus">
                <div class="godIcon">𓅃</div>
                <div>
                    <strong>HORUS · OJO CELESTIAL</strong>
                    <small>Pasiva: +crítico · Activa: visión de cazador</small>
                </div>
            </button>

            <button class="god" data-god="sekhmet">
                <div class="godIcon">𓁛</div>
                <div>
                    <strong>SEKHMET · GUERRA</strong>
                    <small>Pasiva: +daño · Activa: furia</small>
                </div>
            </button>

            <button id="closeGod">
                CERRAR
            </button>

        </div>

    </div>

    <div id="pause">

        <div id="pauseBox">

            <h2>PAUSA</h2>

            <button class="pauseButton" id="resumeBtn">
                CONTINUAR
            </button>

            <button class="pauseButton" id="resetBtn">
                NUEVA PARTIDA
            </button>

        </div>

    </div>

</div>

<script>

/* ============================================================
   PYRAMID OF THE GODS
   MOTOR 2.5D RAYCASTER
============================================================ */

"use strict";

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mini = document.getElementById("miniMap");
const mctx = mini.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = Math.max(320,innerWidth);
    H = canvas.height = Math.max(320,innerHeight);

    mini.width = 240;
    mini.height = 240;

}

addEventListener("resize",resize);
resize();

/* ============================================================
   UTILIDADES
============================================================ */

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function dist(ax,ay,bx,by){
    return Math.hypot(ax-bx,ay-by);
}

function angleDiff(a,b){

    let d = a-b;

    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;

    return d;
}

/* ============================================================
   LOCAL STORAGE
============================================================ */

const SAVE_KEY = "POTG_SAVE_V3";

let save = {
    level:1,
    xp:0,
    totalXp:0,

    baseDamage:10,
    baseSpeed:2.7,
    baseEvasion:5,
    baseCrit:5,
    baseCritDamage:150,

    god:"ra"
};

function loadSave(){

    try{

        const data = JSON.parse(localStorage.getItem(SAVE_KEY));

        if(data){
            save = Object.assign(save,data);
        }

    }catch(e){
        console.warn("No se pudo cargar partida");
    }

}

function saveGame(){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(save)
    );

}

loadSave();

/* ============================================================
   DIOS
============================================================ */

const gods = {

    ra:{
        name:"RA",
        icon:"☀",
        speed:0.45,
        damage:0,
        evasion:0,
        crit:0
    },

    anubis:{
        name:"ANUBIS",
        icon:"𓃢",
        speed:0,
        damage:0,
        evasion:10,
        crit:0
    },

    horus:{
        name:"HORUS",
        icon:"𓅃",
        speed:0,
        damage:0,
        evasion:0,
        crit:12
    },

    sekhmet:{
        name:"SEKHMET",
        icon:"𓁛",
        speed:0,
        damage:7,
        evasion:0,
        crit:0
    }

};

let currentGod = gods[save.god];

function selectGod(id){

    if(!gods[id])return;

    save.god=id;
    currentGod=gods[id];

    saveGame();

    updateGodHUD();

    message(
        "Bendición de "+currentGod.name+" equipada."
    );

}

function updateGodHUD(){

    document.getElementById("godName").textContent =
        currentGod.name;

    document.getElementById("godIcon").textContent =
        currentGod.icon;

}

/* ============================================================
   MAPA
============================================================ */

const TILE = 1;

let map = [];
let mapW = 31;
let mapH = 31;

let door = {
    x:1,
    y:1,
    side:"north"
};

/*
    El mapa se genera como un laberinto de corredores.

    Importante:
    nunca usamos habitaciones completamente cerradas.
    Todos los espacios transitables quedan conectados.
*/

function createMap(){

    mapW = randInt(25,35);
    mapH = randInt(25,35);

    if(mapW%2===0)mapW++;
    if(mapH%2===0)mapH++;

    map = [];

    for(let y=0;y<mapH;y++){

        map[y]=[];

        for(let x=0;x<mapW;x++){

            map[y][x]=1;

        }

    }

    /*
        DFS maze.
        Esto garantiza conectividad.
    */

    const stack = [];

    let sx = 1;
    let sy = 1;

    map[sy][sx]=0;

    stack.push([sx,sy]);

    const dirs=[
        [2,0],
        [-2,0],
        [0,2],
        [0,-2]
    ];

    while(stack.length){

        const current =
            stack[stack.length-1];

        const x=current[0];
        const y=current[1];

        let options=[];

        for(const d of dirs){

            const nx=x+d[0];
            const ny=y+d[1];

            if(
                nx>0 &&
                ny>0 &&
                nx<mapW-1 &&
                ny<mapH-1 &&
                map[ny][nx]===1
            ){

                options.push(d);

            }

        }

        if(options.length){

            const d =
                options[randInt(0,options.length-1)];

            const nx=x+d[0];
            const ny=y+d[1];

            map[y+d[1]/2][x+d[0]/2]=0;
            map[ny][nx]=0;

            stack.push([nx,ny]);

        }else{

            stack.pop();

        }

    }

    /*
        Abrimos corredores adicionales para
        evitar sensación de laberinto excesivamente
        cerrado.
    */

    for(let i=0;i<Math.floor(mapW*mapH*.025);i++){

        const x=randInt(1,mapW-2);
        const y=randInt(1,mapH-2);

        if(map[y][x]===1){

            let horizontal =
                map[y][x-1]===0 &&
                map[y][x+1]===0;

            let vertical =
                map[y-1][x]===0 &&
                map[y+1][x]===0;

            if(horizontal || vertical){

                map[y][x]=0;

            }

        }

    }

    /*
        Puerta.
        Siempre se coloca en un borde de corredor
        y forma parte visual de una pared.
    */

    const possibleDoors=[];

    for(let y=1;y<mapH-1;y++){

        for(let x=1;x<mapW-1;x++){

            if(map[y][x]!==0)continue;

            const north=map[y-1][x]===1;
            const south=map[y+1][x]===1;
            const west=map[y][x-1]===1;
            const east=map[y][x+1]===1;

            if(north||south||west||east){

                possibleDoors.push({
                    x,y,
                    side:
                        north?"north":
                        south?"south":
                        west?"west":"east"
                });

            }

        }

    }

    /*
        Alejamos la puerta del inicio.
    */

    const candidates =
        possibleDoors.filter(p =>
            dist(
                p.x+.5,
                p.y+.5,
                1.5,
                1.5
            )>8
        );

    door =
        candidates.length
        ? candidates[randInt(0,candidates.length-1)]
        : possibleDoors[possibleDoors.length-1];

}

/* ============================================================
   COLISIONES
============================================================ */

function wallAt(x,y){

    const ix=Math.floor(x);
    const iy=Math.floor(y);

    if(
        iy<0 ||
        ix<0 ||
        iy>=mapH ||
        ix>=mapW
    ){

        return true;

    }

    return map[iy][ix]===1;

}

function canMove(x,y,r=.2){

    return (
        !wallAt(x-r,y-r) &&
        !wallAt(x+r,y-r) &&
        !wallAt(x-r,y+r) &&
        !wallAt(x+r,y+r)
    );

}

function moveEntity(e,dx,dy){

    const nx=e.x+dx;

    if(canMove(nx,e.y,.20)){
        e.x=nx;
    }

    const ny=e.y+dy;

    if(canMove(e.x,ny,.20)){
        e.y=ny;
    }

}

/* ============================================================
   PLAYER
============================================================ */

const player={

    x:1.5,
    y:1.5,

    angle:0,

    /*
        Cámara vertical.
        La variable miraY aumenta hacia abajo.
    */

    pitch:0,

    eyeHeight:.62,

    radius:.18,

    hp:100,
    maxHp:100,

    attackCooldown:0,
    attackTimer:0,

    hitFlash:0

};

function resetPlayer(){

    player.x=1.5;
    player.y=1.5;
    player.angle=0;
    player.pitch=0;
    player.hp=player.maxHp;
    player.attackCooldown=0;
    player.attackTimer=0;

}

/* ============================================================
   ENEMIGOS
============================================================ */

let enemies=[];

function spawnEnemies(){

    enemies=[];

    const count =
        clamp(
            3+
            Math.floor(save.level*.55)+
            randInt(0,2),
            3,
            13
        );

    let tries=0;

    while(
        enemies.length<count &&
        tries<3000
    ){

        tries++;

        const x=
            randInt(1,mapW-2)+.5;

        const y=
            randInt(1,mapH-2)+.5;

        if(
            !canMove(x,y,.22) ||
            wallAt(x,y)
        )continue;

        if(
            dist(x,y,player.x,player.y)<6
        )continue;

        enemies.push({

            x,
            y,

            hp:40+
                save.level*8,

            maxHp:40+
                save.level*8,

            radius:.23,

            speed:.65+

                save.level*.015,

            damage:5+
                save.level*.8,

            attack:0,

            hurt:0,

            dead:false,

            type:
                randInt(0,2)

        });

    }

}

/* ============================================================
   ALIADO
============================================================ */

const ally={

    x:1.9,
    y:1.8,

    radius:.18,

    speed:2.25

};

function updateAlly(dt){

    /*
        El aliado mantiene una distancia de seguimiento.

        Nunca intenta ocupar la misma posición
        que el jugador.
    */

    const d=
        dist(
            ally.x,
            ally.y,
            player.x,
            player.y
        );

    if(d<1.25)return;

    const a=
        Math.atan2(
            player.y-ally.y,
            player.x-ally.x
        );

    const speed =
        ally.speed*dt;

    const nx =
        ally.x+
        Math.cos(a)*speed;

    const ny =
        ally.y+
        Math.sin(a)*speed;

    if(canMove(nx,ally.y,.18))
        ally.x=nx;

    if(canMove(ally.x,ny,.18))
        ally.y=ny;

}

/* ============================================================
   RAYCAST
============================================================ */

const FOV=Math.PI/3;

function castRay(angle){

    const sin=Math.sin(angle);
    const cos=Math.cos(angle);

    let distance=0;

    const step=.025;

    while(distance<40){

        distance+=step;

        const x=
            player.x+
            cos*distance;

        const y=
            player.y+
            sin*distance;

        if(wallAt(x,y)){

            return distance;

        }

    }

    return 40;

}

/* ============================================================
   VISIBILIDAD
============================================================ */

function visibleFromPlayer(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const d=Math.hypot(dx,dy);

    const steps=
        Math.ceil(d/.08);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        if(
            wallAt(
                player.x+dx*t,
                player.y+dy*t
            )
        ){

            return false;

        }

    }

    return true;

}

/* ============================================================
   ATAQUE
============================================================ */

function attack(){

    if(player.attackCooldown>0)return;

    player.attackCooldown=.42;
    player.attackTimer=.22;

    let best=null;
    let bestDist=999;

    /*
        Alcance deliberadamente reducido.
    */

    const RANGE=1.65;

    for(const e of enemies){

        if(e.dead)continue;

        const d=
            dist(
                player.x,
                player.y,
                e.x,
                e.y
            );

        if(d>RANGE)continue;

        if(!visibleFromPlayer(e.x,e.y))
            continue;

        const a=
            Math.atan2(
                e.y-player.y,
                e.x-player.x
            );

        /*
            Barrido horizontal.
        */

        const diff=
            Math.abs(
                angleDiff(
                    a,
                    player.angle
                )
            );

        if(diff<.72 && d<bestDist){

            best=e;
            bestDist=d;

        }

    }

    if(best){

        let damage =
            save.baseDamage+
            currentGod.damage;

        const critChance =
            save.baseCrit+
            currentGod.crit;

        const critical =
            Math.random()*100<critChance;

        if(critical){

            damage *=
                save.baseCritDamage/100;

        }

        best.hp-=damage;
        best.hurt=.15;

        floatingDamage(
            best.x,
            best.y,
            Math.round(damage),
            critical
        );

        if(best.hp<=0){

            best.dead=true;

            gainXP(
                20+
                save.level*5
            );

        }

    }

}

/* ============================================================
   XP
============================================================ */

function xpNeeded(){

    return 100+
        (save.level-1)*65;
}

function gainXP(amount){

    save.xp+=amount;
    save.totalXp+=amount;

    while(save.xp>=xpNeeded()){

        save.xp-=xpNeeded();

        save.level++;

        /*
            Mejoras permanentes.
        */

        save.baseDamage+=2;
        save.baseSpeed+=.025;
        save.baseEvasion+=.7;
        save.baseCrit+=.5;

        player.maxHp+=5;
        player.hp=player.maxHp;

        message(
            "NIVEL "+save.level+
            " · Tus estadísticas base han mejorado."
        );

    }

    saveGame();

    updateHUD();

}

/* ============================================================
   DAÑO AL JUGADOR
============================================================ */

function damagePlayer(amount){

    const evasion =
        save.baseEvasion+
        currentGod.evasion;

    if(Math.random()*100<evasion){

        message("Evasión.");

        return;

    }

    player.hp-=amount;

    player.hitFlash=.28;

    if(player.hp<=0){

        player.hp=player.maxHp;

        createMap();
        resetPlayer();
        spawnEnemies();

        message(
            "Has caído. El templo ha cambiado."
        );

    }

}

/* ============================================================
   IA ENEMIGOS
============================================================ */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)continue;

        if(e.hurt>0)
            e.hurt-=dt;

        if(e.attack>0)
            e.attack-=dt;

        const d=
            dist(
                e.x,
                e.y,
                player.x,
                player.y
            );

        if(d>12)continue;

        /*
            Solo persiguen si existe línea de visión.
        */

        if(visibleFromPlayer(e.x,e.y)){

            const a=
                Math.atan2(
                    player.y-e.y,
                    player.x-e.x
                );

            if(d>1.15){

                const speed=
                    e.speed*dt;

                const nx=
                    e.x+
                    Math.cos(a)*speed;

                const ny=
                    e.y+
                    Math.sin(a)*speed;

                if(canMove(nx,e.y,.19))
                    e.x=nx;

                if(canMove(e.x,ny,.19))
                    e.y=ny;

            }else{

                if(e.attack<=0){

                    damagePlayer(e.damage);

                    e.attack=.9;

                }

            }

        }

    }

}

/* ============================================================
   DAÑO FLOTANTE
============================================================ */

let damageTexts=[];

function floatingDamage(x,y,value,crit){

    damageTexts.push({

        x,
        y,

        value,

        crit,

        life:1,

        offset:0

    });

}

function updateDamageTexts(dt){

    for(const t of damageTexts){

        t.life-=dt;
        t.offset+=dt*.6;

    }

    damageTexts=
        damageTexts.filter(t=>t.life>0);

}

/* ============================================================
   PROYECCIÓN DE OBJETOS
============================================================ */

function projectObject(x,y,size){

    const dx=x-player.x;
    const dy=y-player.y;

    const distance=
        Math.hypot(dx,dy);

    let angle=
        Math.atan2(dy,dx)-
        player.angle;

    while(angle>Math.PI)
        angle-=Math.PI*2;

    while(angle<-Math.PI)
        angle+=Math.PI*2;

    const corrected=
        distance*
        Math.cos(angle);

    if(corrected<=.1)return null;

    const screenX=
        W/2+
        Math.tan(angle)*
        (W/2)/Math.tan(FOV/2);

    /*
        Cámara vertical.
        El pitch desplaza el horizonte.
    */

    const horizon=
        H/2+
        player.pitch*H*.42;

    const screenSize=
        size*H/corrected;

    const bottom=
        horizon+
        player.eyeHeight*H/corrected;

    return {

        x:screenX,
        y:bottom-screenSize,
        w:screenSize,
        h:screenSize,

        distance:corrected

    };

}

/* ============================================================
   RENDER ENEMIGOS
============================================================ */

function renderEnemies(){

    const list=[];

    for(const e of enemies){

        if(e.dead)continue;

        /*
            Culling de visión.
            Un enemigo detrás de una pared
            jamás se renderiza.
        */

        if(!visibleFromPlayer(e.x,e.y))
            continue;

        const p=
            projectObject(
                e.x,
                e.y,
                .72
            );

        if(!p)continue;

        list.push({
            e,
            p
        });

    }

    /*
        Primero los lejanos.
    */

    list.sort(
        (a,b)=>
            b.p.distance-a.p.distance
    );

    for(const item of list){

        drawEnemy(
            item.e,
            item.p
        );

    }

}

/* ============================================================
   ENEMIGO VISUAL
============================================================ */

function drawEnemy(e,p){

    const x=p.x;
    const y=p.y;
    const w=p.w;
    const h=p.h;

    ctx.save();

    /*
        Sombra.
    */

    ctx.globalAlpha=.55;

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h,
        w*.28,
        h*.055,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

    /*
        Destello de daño.
    */

    if(e.hurt>0){

        ctx.shadowBlur=18;
        ctx.shadowColor="#ff2b1c";

    }

    /*
        Piernas.
        Se dibujan separadas del suelo.
    */

    const legY=
        y+h*.62;

    ctx.fillStyle=
        e.hurt>0
        ?"#ff4438"
        :"#39271a";

    ctx.fillRect(
        x-w*.18,
        legY,
        w*.12,
        h*.35
    );

    ctx.fillRect(
        x+w*.06,
        legY,
        w*.12,
        h*.35
    );

    /*
        Torso.
    */

    ctx.fillStyle=
        e.type===0
        ?"#70542f"
        :e.type===1
        ?"#514433"
        :"#673b2e";

    ctx.fillRect(
        x-w*.28,
        y+h*.32,
        w*.56,
        h*.36
    );

    /*
        Brazos.
    */

    ctx.fillRect(
        x-w*.39,
        y+h*.34,
        w*.11,
        h*.29
    );

    ctx.fillRect(
        x+w*.28,
        y+h*.34,
        w*.11,
        h*.29
    );

    /*
        Cabeza.
    */

    ctx.fillStyle=
        e.type===2
        ?"#9b7350"
        :"#a9835d";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.22,
        w*.23,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Máscara/casco.
    */

    ctx.fillStyle="#241a12";

    ctx.fillRect(
        x-w*.22,
        y+h*.13,
        w*.44,
        h*.12
    );

    /*
        Ojos.
    */

    ctx.fillStyle="#e8b840";

    ctx.fillRect(
        x-w*.12,
        y+h*.21,
        w*.07,
        h*.035
    );

    ctx.fillRect(
        x+w*.05,
        y+h*.21,
        w*.07,
        h*.035
    );

    ctx.shadowBlur=0;

    /*
        Barra de vida.
    */

    const barW=w*.82;
    const barH=Math.max(3,h*.025);

    const hpRatio=
        clamp(e.hp/e.maxHp,0,1);

    ctx.fillStyle="#120a06";

    ctx.fillRect(
        x-barW/2,
        y-h*.045,
        barW,
        barH
    );

    ctx.fillStyle="#c52f24";

    ctx.fillRect(
        x-barW/2,
        y-h*.045,
        barW*hpRatio,
        barH
    );

    ctx.restore();

}

/* ============================================================
   RENDER ALIADO
============================================================ */

function renderAlly(){

    if(!visibleFromPlayer(ally.x,ally.y))
        return;

    const p=
        projectObject(
            ally.x,
            ally.y,
            .66
        );

    if(!p)return;

    const x=p.x;
    const y=p.y;
    const w=p.w;
    const h=p.h;

    ctx.save();

    ctx.fillStyle="rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h,
        w*.27,
        h*.05,
        0,0,Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#294f62";

    ctx.fillRect(
        x-w*.23,
        y+h*.32,
        w*.46,
        h*.42
    );

    ctx.fillStyle="#a8794e";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.2,
        w*.22,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#e4ca7c";

    ctx.fillRect(
        x-w*.1,
        y+h*.12,
        w*.2,
        h*.07
    );

    ctx.restore();

}

/* ============================================================
   RENDER PUERTA
============================================================ */

function renderDoor(){

    if(!visibleFromPlayer(
        door.x+.5,
        door.y+.5
    ))return;

    const p=
        projectObject(
            door.x+.5,
            door.y+.5,
            1.05
        );

    if(!p)return;

    const x=p.x;
    const y=p.y;
    const w=p.w;
    const h=p.h;

    ctx.save();

    /*
        La puerta comienza desde el suelo.
    */

    ctx.fillStyle="#0b0907";

    ctx.fillRect(
        x-w*.35,
        y+h*.05,
        w*.7,
        h*.95
    );

    ctx.strokeStyle="#a78038";
    ctx.lineWidth=Math.max(1,w*.035);

    ctx.strokeRect(
        x-w*.37,
        y+h*.03,
        w*.74,
        h*.97
    );

    /*
        Jeroglífico.
    */

    ctx.fillStyle="#d1a94f";

    ctx.font=
        Math.max(8,w*.16)+
        "px serif";

    ctx.textAlign="center";

    ctx.fillText(
        "𓂀",
        x,
        y+h*.43
    );

    ctx.fillText(
        "𓆣",
        x,
        y+h*.65
    );

    ctx.restore();

}

/* ============================================================
   ARMA
============================================================ */

function renderWeapon(){

    const attack=
        player.attackTimer>0
        ?player.attackTimer/.22
        :0;

    /*
        Barrido horizontal:
        comienza a la derecha,
        cruza hacia el centro
        y termina a la izquierda.
    */

    const sweep=
        attack>0
        ?Math.sin(
            (1-attack)*Math.PI
        )
        :0;

    ctx.save();

    const baseX=
        W*.70;

    const baseY=
        H*.90+
        player.pitch*H*.12;

    ctx.translate(
        baseX,
        baseY
    );

    ctx.rotate(
        -.18+
        sweep*1.05
    );

    /*
        Mano derecha.
    */

    ctx.fillStyle="#9a6847";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        Math.max(8,W*.025),
        0,Math.PI*2
    );

    ctx.fill();

    /*
        Empuñadura.
    */

    ctx.fillStyle="#352317";

    ctx.fillRect(
        -W*.025,
        -W*.13,
        W*.05,
        W*.18
    );

    /*
        Hoja.
    */

    ctx.fillStyle="#b9aa83";

    ctx.beginPath();

    ctx.moveTo(
        -W*.03,
        -W*.13
    );

    ctx.lineTo(
        W*.025,
        -W*.47
    );

    ctx.lineTo(
        W*.07,
        -W*.13
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#e2d5ad";

    ctx.stroke();

    /*
        Brillo de ataque.
    */

    if(attack>0){

        ctx.globalAlpha=.25;

        ctx.strokeStyle="#f0d071";
        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            W*.30,
            -1.8,
            -.15
        );

        ctx.stroke();

    }

    ctx.restore();

}

/* ============================================================
   RENDER MUNDO
============================================================ */

function renderWorld(){

    /*
        Cielo.
    */

    const horizon=
        H/2+
        player.pitch*H*.42;

    ctx.fillStyle="#15100c";

    ctx.fillRect(
        0,
        0,
        W,
        Math.max(0,horizon)
    );

    /*
        Suelo arena.
        No refleja las paredes.
    */

    ctx.fillStyle="#a78352";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    /*
        Rayos.
    */

    const columns=
        Math.min(
            W,
            520
        );

    const columnWidth=
        W/columns;

    for(let i=0;i<columns;i++){

        const cameraX=
            i/columns-.5;

        const rayAngle=
            player.angle+
            Math.atan(
                cameraX*
                Math.tan(FOV/2)*2
            );

        const raw=
            castRay(rayAngle);

        const corrected=
            raw*
            Math.cos(
                rayAngle-player.angle
            );

        const wallHeight=
            H/corrected;

        const top=
            horizon-
            wallHeight*.50;

        /*
            Color arena fijo.
            No usamos reflejo del cielo.
        */

        const shade=
            clamp(
                1-
                corrected/18,
                .15,
                1
            );

        const r=Math.floor(112*shade);
        const g=Math.floor(78*shade);
        const b=Math.floor(42*shade);

        ctx.fillStyle=
            `rgb(${r},${g},${b})`;

        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );

    }

    /*
        Objetos 2.5D.
    */

    renderDoor();
    renderEnemies();
    renderAlly();

    /*
        Arma siempre en mano derecha.
    */

    renderWeapon();

}

/* ============================================================
   MINIMAPA COMPLETO
============================================================ */

function renderMiniMap(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,0,mw,mh
    );

    /*
        El mapa completo siempre se ajusta
        al cuadrado disponible.
    */

    const scale=
        Math.min(
            mw/mapW,
            mh/mapH
        );

    const ox=
        (mw-mapW*scale)/2;

    const oy=
        (mh-mapH*scale)/2;

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            if(map[y][x]===1){

                mctx.fillStyle="#241a0e";

            }else{

                mctx.fillStyle="#a8895b";

            }

            mctx.fillRect(
                ox+x*scale,
                oy+y*scale,
                Math.ceil(scale),
                Math.ceil(scale)
            );

        }

    }

    /*
        Puerta.
    */

    mctx.fillStyle="#d5a73d";

    mctx.fillRect(
        ox+door.x*scale,
        oy+door.y*scale,
        Math.max(2,scale),
        Math.max(2,scale)
    );

    /*
        Enemigos.
    */

    for(const e of enemies){

        if(e.dead)continue;

        mctx.fillStyle="#d93b2f";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(2,scale*.25),
            0,
            Math.PI*2
        );

        mctx.fill();

    }

    /*
        Aliado.
    */

    mctx.fillStyle="#43a4c8";

    mctx.beginPath();

    mctx.arc(
        ox+ally.x*scale,
        oy+ally.y*scale,
        Math.max(2,scale*.32),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
        Jugador.
    */

    const px=
        ox+player.x*scale;

    const py=
        oy+player.y*scale;

    mctx.fillStyle="#fff0a3";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(2,scale*.38),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
        Dirección.
    */

    mctx.strokeStyle="#fff0a3";
    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(px,py);

    mctx.lineTo(
        px+
        Math.cos(player.angle)*
        scale*1.5,

        py+
        Math.sin(player.angle)*
        scale*1.5
    );

    mctx.stroke();

}

/* =========================
   JOYSTICKS
========================= */

const leftStick=
    document.getElementById("leftStick");

const rightStick=
    document.getElementById("rightStick");

const leftDot=
    document.getElementById("leftDot");

const rightDot=
    document.getElementById("rightDot");

const joystick={

    left:{
        active:false,
        id:null,
        x:0,
        y:0
    },

    right:{
        active:false,
        id:null,
        x:0,
        y:0
    }

};

function setupJoystick(element,dot,type){

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            element.setPointerCapture(e.pointerId);

            joystick[type].active=true;
            joystick[type].id=e.pointerId;

            updateStick(
                element,
                dot,
                type,
                e
            );

        }
    );

    element.addEventListener(
        "pointermove",
        e=>{

            if(
                !joystick[type].active ||
                joystick[type].id!==e.pointerId
            )return;

            updateStick(
                element,
                dot,
                type,
                e
            );

        }
    );

    function release(e){

        if(
            joystick[type].id!==e.pointerId
        )return;

        joystick[type].active=false;
        joystick[type].x=0;
        joystick[type].y=0;

        dot.style.transform=
            "translate(-50%,-50%)";

    }

    element.addEventListener(
        "pointerup",
        release
    );

    element.addEventListener(
        "pointercancel",
        release
    );

}

function updateStick(
    element,
    dot,
    type,
    e
){

    const r=
        element.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;

    const max=
        r.width*.36;

    const length=
        Math.hypot(dx,dy);

    if(length>max){

        dx=
            dx/length*max;

        dy=
            dy/length*max;

    }

    joystick[type].x=
        clamp(dx/max,-1,1);

    joystick[type].y=
        clamp(dy/max,-1,1);

    dot.style.transform=
        `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

}

setupJoystick(
    leftStick,
    leftDot,
    "left"
);

setupJoystick(
    rightStick,
    rightDot,
    "right"
);

    );

/* ============================================================
   PODERES DE LOS DIOSES
============================================================ */

let abilityCooldown=0;

function activateGod(){

    if(abilityCooldown>0){

        message(
            "Poder recargando."
        );

        return;

    }

    abilityCooldown=8;

    if(save.god==="ra"){

        /*
            Explosión solar.
        */

        for(const e of enemies){

            if(e.dead)continue;

            const d=
                dist(
                    player.x,
                    player.y,
                    e.x,
                    e.y
                );

            if(
                d<3.3 &&
                visibleFromPlayer(e.x,e.y)
            ){

                const damage=
                    35+
                    save.level*4;

                e.hp-=damage;
                e.hurt=.3;

                floatingDamage(
                    e.x,
                    e.y,
                    damage,
                    true
                );

                if(e.hp<=0){

                    e.dead=true;

                    gainXP(25);

                }

            }

        }

        message(
            "RA desata una explosión solar."
        );

    }

    else if(save.god==="anubis"){

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+35
            );

        message(
            "ANUBIS protege tu alma."
        );

    }

    else if(save.god==="horus"){

        /*
            Daño aumentado temporal.
        */

        for(const e of enemies){

            if(
                !e.dead &&
                dist(
                    player.x,
                    player.y,
                    e.x,
                    e.y
                )<5 &&
                visibleFromPlayer(e.x,e.y)
            ){

                e.hp-=20;

                floatingDamage(
                    e.x,
                    e.y,
                    20,
                    true
                );

            }

        }

        message(
            "HORUS revela a tus enemigos."
        );

    }

    else if(save.god==="sekhmet"){

        for(const e of enemies){

            if(
                !e.dead &&
                dist(
                    player.x,
                    player.y,
                    e.x,
                    e.y
                )<2.8 &&
                visibleFromPlayer(e.x,e.y)
            ){

                e.hp-=45;

                floatingDamage(
                    e.x,
                    e.y,
                    45,
                    true
                );

            }

        }

        message(
            "SEKHMET desata su furia."
        );

    }

}

/* ============================================================
   PAUSA
============================================================ */

let paused=false;

function togglePause(){

    paused=!paused;

    document.getElementById("pause")
        .style.display=
            paused
            ?"flex"
            :"none";

}

document.getElementById("resumeBtn")
    .addEventListener(
        "click",
        togglePause
    );

document.getElementById("resetBtn")
    .addEventListener(
        "click",
        ()=>{

            save={
                level:1,
                xp:0,
                totalXp:0,
                baseDamage:10,
                baseSpeed:2.7,
                baseEvasion:5,
                baseCrit:5,
                baseCritDamage:150,
                god:"ra"
            };

            currentGod=gods.ra;

            saveGame();

            createMap();
            resetPlayer();
            spawnEnemies();

            paused=false;

            document.getElementById("pause")
                .style.display="none";

            updateGodHUD();
            updateHUD();

            message(
                "Nueva partida."
            );

        }
    );

/* ============================================================
   MOVIMIENTO
============================================================ */

function updatePlayer(dt){

    /*
        Movimiento FPS.

        WASD:
        W = adelante
        S = atrás
        A/D = strafe

        El joystick izquierdo utiliza
        exactamente la misma lógica.
    */

    let forward=0;
    let strafe=0;

    if(keys["w"])forward+=1;
    if(keys["s"])forward-=1;
    if(keys["a"])strafe-=1;
    if(keys["d"])strafe+=1;

    if(joystick.left.active){

        forward+=
            -joystick.left.y;

        strafe+=
            joystick.left.x;

    }

    const magnitude=
        Math.hypot(
            forward,
            strafe
        );

    if(magnitude>1){

        forward/=magnitude;
        strafe/=magnitude;

    }

    const speed=
        save.baseSpeed+
        currentGod.speed;

    const move=
        speed*dt;

    const dx=
        (
            Math.cos(player.angle)*
            forward-
            Math.sin(player.angle)*
            strafe
        )*move;

    const dy=
        (
            Math.sin(player.angle)*
            forward+
            Math.cos(player.angle)*
            strafe
        )*move;

    moveEntity(
        player,
        dx,
        dy
    );

    /*
        Cámara horizontal y vertical.

        Vertical invertida:
        mover dedo hacia arriba
        hace mirar hacia abajo,
        mover dedo hacia abajo
        hace mirar hacia arriba.
    */

    if(joystick.right.active){

        player.angle+=
            joystick.right.x*
            2.45*
            dt;

        player.pitch+=
            joystick.right.y*
            1.8*
            dt;

    }

    /*
        Pitch limitado.
    */

    player.pitch=
        clamp(
            player.pitch,
            -.85,
            .85
        );

    if(player.attackCooldown>0)
        player.attackCooldown-=dt;

    if(player.attackTimer>0)
        player.attackTimer-=dt;

    /*
        Poder.
    */

    if(abilityCooldown>0)
        abilityCooldown-=dt;

}

/* ============================================================
   LOOP
============================================================ */

let lastTime=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime=now;

    if(!paused){

        updatePlayer(dt);
        updateAlly(dt);
        updateEnemies(dt);
        updateDamageTexts(dt);

        if(player.hitFlash>0)
            player.hitFlash-=dt;

        if(messageTimer>0){

            messageTimer-=dt;

            if(messageTimer<=0){

                document.getElementById(
                    "messages"
                ).textContent=
                    nearDoor()
                    ?"Acércate a la puerta para cambiar de sala."
                    :"Explora el templo.";

            }

        }

        /*
            Puerta.
        */

        if(nearDoor()){

            message(
                "Puerta · entra para generar una nueva sala."
            );

            if(
                keys["e"] ||
                joystick.left.active &&
                dist(
                    player.x,
                    player.y,
                    door.x+.5,
                    door.y+.5
                )<.55
            ){

                nextRoom();

            }

        }

        renderWorld();
        renderMiniMap();

        const flash=
            document.getElementById(
                "damageFlash"
            );

        flash.style.opacity=
            player.hitFlash>0
            ?Math.min(
                .65,
                player.hitFlash*2.5
            )
            :0;

        updateHUD();

    }

    requestAnimationFrame(loop);

}

/* ============================================================
   INICIO
============================================================ */

createMap();
resetPlayer();
spawnEnemies();

updateGodHUD();
updateHUD();

message(
    "Explora el templo. La puerta genera una nueva sala."
);

requestAnimationFrame(loop);

</script>
