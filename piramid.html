<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>RESIDENT RAYCASTER 0.2</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:#fff;
}

.panel{
    background:rgba(7,8,8,.82);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(6px);
}

/* jugador */

#playerPanel{
    position:absolute;
    top:12px;
    left:12px;
    width:190px;
    padding:10px;
    border-radius:13px;
}

.smallTitle{
    font-size:9px;
    letter-spacing:1.5px;
    color:#aaa;
}

#playerName{
    margin-top:3px;
    font-size:13px;
    font-weight:bold;
}

.bar{
    width:100%;
    height:8px;
    margin-top:7px;
    border-radius:8px;
    background:#202020;
    overflow:hidden;
}

#playerHealthFill{
    width:100%;
    height:100%;
    background:#c33;
}

/* superviviente */

#survivorPanel{
    display:none;

    position:absolute;
    top:100px;
    left:12px;

    width:190px;
    padding:10px;

    border-radius:13px;
}

#survivorName{
    margin-top:4px;
    font-size:12px;
    font-weight:bold;
}

#survivorHealthFill{
    width:100%;
    height:100%;
    background:#4ac477;
}

/* minimapa */

#mapPanel{
    position:absolute;
    top:12px;
    right:12px;

    width:190px;
    height:190px;

    padding:7px;
    border-radius:14px;
}

#mapCanvas{
    width:100%;
    height:100%;
    display:block;
    background:#0b0b0b;
    border-radius:8px;
}

/* objetivo */

#objective{
    position:absolute;

    top:14px;
    left:50%;

    transform:translateX(-50%);

    padding:8px 16px;

    border-radius:20px;

    background:rgba(5,5,5,.75);
    border:1px solid rgba(255,255,255,.15);

    font-size:10px;
    letter-spacing:.5px;

    text-align:center;
}

/* mira */

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:22px;
    height:22px;

    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    opacity:.85;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:10px;
    top:1px;
}

#crosshair:after{
    height:2px;
    width:20px;
    left:1px;
    top:10px;
}

/* mensaje */

#message{
    position:absolute;

    left:50%;
    bottom:180px;

    transform:translateX(-50%);

    padding:9px 16px;

    min-width:210px;

    border-radius:10px;

    background:rgba(0,0,0,.82);

    border:1px solid rgba(255,255,255,.15);

    text-align:center;

    font-size:11px;

    opacity:0;
    transition:.2s;
}

/* munición */

#ammo{
    position:absolute;

    right:15px;
    bottom:15px;

    min-width:100px;

    padding:8px 12px;

    border-radius:12px;

    background:rgba(5,5,5,.76);

    text-align:right;
}

#ammoMain{
    font-size:28px;
    font-weight:bold;
}

#ammoReserve{
    color:#aaa;
    font-size:10px;
}

/* =========================================================
BOTONES
========================================================= */

button{
    font-family:Arial,sans-serif;
}

.ctrl{
    position:absolute;

    pointer-events:auto;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(10,10,10,.72);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;

    box-shadow:
        0 5px 18px rgba(0,0,0,.35);

    backdrop-filter:blur(7px);
}

.ctrl:active{
    transform:scale(.92);
}

/* joystick */

#moveZone{
    position:absolute;

    left:8px;
    bottom:8px;

    width:155px;
    height:155px;

    pointer-events:auto;
}

#moveBase{
    position:absolute;

    left:10px;
    bottom:10px;

    width:125px;
    height:125px;

    border-radius:50%;

    background:rgba(255,255,255,.055);

    border:2px solid rgba(255,255,255,.18);
}

#moveStick{
    position:absolute;

    left:72px;
    top:72px;

    width:52px;
    height:52px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(255,255,255,.19);

    border:2px solid rgba(255,255,255,.3);
}

/* disparo */

#fireBtn{
    right:18px;
    bottom:102px;

    width:78px;
    height:78px;

    font-size:11px;
}

/* recarga */

#reloadBtn{
    right:110px;
    bottom:22px;

    width:64px;
    height:64px;

    font-size:9px;
}

/* cura */

#medBtn{
    right:182px;
    bottom:25px;

    width:59px;
    height:59px;

    font-size:27px;
}

/* seguir */

#followBtn{
    display:none;

    left:162px;
    bottom:24px;

    width:64px;
    height:64px;

    font-size:8px;
}

/* acción */

#actionBtn{
    display:none;

    position:absolute;

    left:50%;
    bottom:87px;

    transform:translateX(-50%);

    width:130px;
    height:50px;

    border-radius:13px;

    border:1px solid rgba(95,220,130,.5);

    background:rgba(25,95,52,.9);

    color:white;

    font-size:11px;
    font-weight:bold;

    pointer-events:auto;
}

#actionBtn:active{
    transform:
        translateX(-50%)
        scale(.94);
}

/* zona cámara */

#lookZone{
    position:absolute;

    right:0;
    top:0;

    width:62%;
    height:100%;

    pointer-events:auto;
}

/* móvil */

@media(max-width:600px){

    #mapPanel{
        width:150px;
        height:150px;
    }

    #playerPanel,
    #survivorPanel{
        width:170px;
    }

    #survivorPanel{
        top:91px;
    }

    #objective{
        top:168px;
        font-size:8px;
        max-width:240px;
    }

    #followBtn{
        left:150px;
    }

    #medBtn{
        right:180px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div id="playerPanel" class="panel">

        <div class="smallTitle">
            ESTADO
        </div>

        <div id="playerName">
            LEON
        </div>

        <div class="bar">
            <div id="playerHealthFill"></div>
        </div>

        <div style="
            margin-top:5px;
            font-size:9px;
            color:#aaa;
        ">
            VIDA <span id="playerHealthText">100</span>
        </div>

    </div>


    <div id="survivorPanel" class="panel">

        <div class="smallTitle">
            SUPERVIVIENTE RESCATADO
        </div>

        <div id="survivorName">
            —
        </div>

        <div class="bar">
            <div id="survivorHealthFill"></div>
        </div>

        <div style="
            margin-top:5px;
            font-size:9px;
            color:#aaa;
        ">
            VIDA <span id="survivorHealthText">100</span>
        </div>

    </div>


    <div id="mapPanel" class="panel">
        <canvas id="mapCanvas"></canvas>
    </div>


    <div id="objective">
        ENCUENTRA AL SUPERVIVIENTE
    </div>


    <div id="crosshair"></div>


    <div id="message"></div>


    <div id="ammo">

        <div id="ammoMain">
            12
        </div>

        <div id="ammoReserve">
            RESERVA 48
        </div>

    </div>


    <div id="moveZone">

        <div id="moveBase"></div>

        <div id="moveStick"></div>

    </div>


    <div id="lookZone"></div>


    <button id="fireBtn" class="ctrl">
        DISPARAR
    </button>


    <button id="reloadBtn" class="ctrl">
        RECARGAR
    </button>


    <button id="medBtn" class="ctrl">
        +
    </button>


    <button id="followBtn" class="ctrl">
        SEGUIR
    </button>


    <button id="actionBtn">
        RESCATAR
    </button>

</div>

<script>
"use strict";

/* =========================================================
RESIDENT RAYCASTER 0.2
MOTOR
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mapCanvas =
    document.getElementById("mapCanvas");

const mapCtx =
    mapCanvas.getContext("2d");


let W=0;
let H=0;

function resize(){

    W=canvas.width=
        Math.floor(innerWidth*
        devicePixelRatio);

    H=canvas.height=
        Math.floor(innerHeight*
        devicePixelRatio);

    canvas.style.width=
        innerWidth+"px";

    canvas.style.height=
        innerHeight+"px";

    mapCanvas.width=
        190*devicePixelRatio;

    mapCanvas.height=
        190*devicePixelRatio;
}

addEventListener("resize",resize);
resize();


/* =========================================================
CONFIGURACIÓN
========================================================= */

const TILE=64;

const FOV=Math.PI/3;

const MAX_DEPTH=1300;

const PLAYER_RADIUS=15;

const PLAYER_HEIGHT=1.7;

const CAMERA_HEIGHT=1.65;


/* =========================================================
JUGADOR
========================================================= */

const player={

    x:2.5*TILE,
    y:2.5*TILE,

    angle:0,

    pitch:0,

    health:100,

    ammo:12,

    reserve:48,

    medkits:3,

    speed:155,

    turnSensitivity:.0026,

    moving:false

};


/* =========================================================
PISO
========================================================= */

let floorNumber=1;

let world=[];

let mapW=0;
let mapH=0;


/* =========================================================
ENTIDADES
========================================================= */

let zombies=[];

let items=[];

let survivor=null;

let stairs=null;

let door=null;


/* =========================================================
MISIÓN
========================================================= */

let mission=0;


/*
0 = encontrar superviviente
1 = llevar superviviente
2 = llegar escalera
3 = completada
*/


/* =========================================================
INPUT
========================================================= */

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="r")
        reload();

    if(e.key.toLowerCase()==="f")
        action();
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


/* =========================================================
JOYSTICK MOVIMIENTO
========================================================= */

const moveZone=
    document.getElementById("moveZone");

const moveStick=
    document.getElementById("moveStick");

let movePointer=null;

let moveX=0;
let moveY=0;

function resetMove(){

    moveX=0;
    moveY=0;

    moveStick.style.left="72px";
    moveStick.style.top="72px";
}

function updateJoystick(x,y){

    const rect=
        moveZone.getBoundingClientRect();

    const cx=
        rect.left+72;

    const cy=
        rect.top+72;

    let dx=x-cx;
    let dy=y-cy;

    const max=52;

    const len=
        Math.hypot(dx,dy);

    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;
    }

    moveX=dx/max;
    moveY=dy/max;

    moveStick.style.left=
        (72+dx)+"px";

    moveStick.style.top=
        (72+dy)+"px";
}

moveZone.addEventListener(
    "pointerdown",
    e=>{

        movePointer=e.pointerId;

        moveZone.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

moveZone.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId!==movePointer)
            return;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

moveZone.addEventListener(
    "pointerup",
    resetMove
);

moveZone.addEventListener(
    "pointercancel",
    resetMove
);


/* =========================================================
CÁMARA FPS TÁCTIL
========================================================= */

const lookZone=
    document.getElementById("lookZone");

let lookPointer=null;

let lastLookX=0;
let lastLookY=0;

lookZone.addEventListener(
    "pointerdown",
    e=>{

        lookPointer=e.pointerId;

        lastLookX=e.clientX;
        lastLookY=e.clientY;

        lookZone.setPointerCapture(
            e.pointerId
        );
    }
);

lookZone.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId!==lookPointer)
            return;

        const dx=
            e.clientX-lastLookX;

        const dy=
            e.clientY-lastLookY;

        lastLookX=e.clientX;
        lastLookY=e.clientY;

        /*
        Cámara suave:
        no demasiado sensible.
        */

        player.angle +=
            dx*player.turnSensitivity;

        player.pitch +=
            dy*.0018;

        player.pitch=
            Math.max(
                -.42,
                Math.min(
                    .42,
                    player.pitch
                )
            );
    }
);

lookZone.addEventListener(
    "pointerup",
    ()=>{
        lookPointer=null;
    }
);

lookZone.addEventListener(
    "pointercancel",
    ()=>{
        lookPointer=null;
    }
);


/* =========================================================
BOTONES
========================================================= */

document
.getElementById("fireBtn")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        shoot();
    }
);


document
.getElementById("reloadBtn")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        reload();
    }
);


document
.getElementById("medBtn")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        useMedkit();
    }
);


document
.getElementById("actionBtn")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        action();
    }
);


document
.getElementById("followBtn")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();

        if(!survivor)
            return;

        survivor.following=
            !survivor.following;

        document.getElementById(
            "followBtn"
        ).textContent=
            survivor.following
            ? "DETENER"
            : "SEGUIR";
    }
);


/* =========================================================
UTILIDADES
========================================================= */

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}


function dist(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function normAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}


function random(arr){

    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];
}


/* =========================================================
GENERADOR DE MAPA
========================================================= */

/*
El mapa se construye como una red de corredores
y espacios abiertos.

Nunca se generan habitaciones aisladas sin salida.
*/

function generateMap(){

    mapW=25;
    mapH=25;

    world=
        Array.from(
            {length:mapH},
            ()=>Array(mapW).fill(1)
        );

    /*
    Corredor principal
    */

    for(let y=1;y<mapH-1;y++)
        world[y][12]=0;

    for(let x=1;x<mapW-1;x++)
        world[12][x]=0;


    /*
    Brazos secundarios.
    */

    const branches=[
        [4,12,4,6],
        [8,12,8,4],
        [16,12,16,6],
        [20,12,20,4],

        [12,4,18,4],
        [12,20,18,20],
        [6,12,6,19],
        [18,12,18,19]
    ];

    for(const b of branches){

        let [x1,y1,x2,y2]=b;

        if(x1===x2){

            const a=Math.min(y1,y2);
            const c=Math.max(y1,y2);

            for(
                let y=a;
                y<=c;
                y++
            ){

                world[y][x1]=0;

                if(x1+1<mapW)
                    world[y][x1+1]=0;

                if(x1-1>=0)
                    world[y][x1-1]=0;
            }

        }else{

            const a=Math.min(x1,x2);
            const c=Math.max(x1,x2);

            for(
                let x=a;
                x<=c;
                x++
            ){

                world[y1][x]=0;

                if(y1+1<mapH)
                    world[y1+1][x]=0;

                if(y1-1>=0)
                    world[y1-1][x]=0;
            }
        }
    }


    /*
    Abrimos pequeñas zonas laterales.
    */

    for(let i=0;i<18;i++){

        const x=
            2+
            Math.floor(
                Math.random()*(mapW-4)
            );

        const y=
            2+
            Math.floor(
                Math.random()*(mapH-4)
            );

        /*
        Solo crear si ya está cerca
        de una zona transitable.
        */

        if(world[y][x]===1){

            let near=false;

            for(let yy=-2;yy<=2;yy++)
            for(let xx=-2;xx<=2;xx++){

                const nx=x+xx;
                const ny=y+yy;

                if(
                    nx>=0 &&
                    ny>=0 &&
                    nx<mapW &&
                    ny<mapH &&
                    world[ny][nx]===0
                )
                    near=true;
            }

            if(near){

                world[y][x]=0;

                if(x+1<mapW)
                    world[y][x+1]=0;

                if(y+1<mapH)
                    world[y+1][x]=0;
            }
        }
    }


    /*
    Borde exterior.
    */

    for(let x=0;x<mapW;x++){

        world[0][x]=1;
        world[mapH-1][x]=1;
    }

    for(let y=0;y<mapH;y++){

        world[y][0]=1;
        world[y][mapW-1]=1;
    }
}


/* =========================================================
COLISIÓN
========================================================= */

function wallAtPixel(x,y){

    const gx=
        Math.floor(x/TILE);

    const gy=
        Math.floor(y/TILE);

    if(
        gx<0 ||
        gy<0 ||
        gx>=mapW ||
        gy>=mapH
    )
        return true;

    return world[gy][gx]===1;
}


function canMove(x,y,r=PLAYER_RADIUS){

    return !(
        wallAtPixel(x-r,y-r) ||
        wallAtPixel(x+r,y-r) ||
        wallAtPixel(x-r,y+r) ||
        wallAtPixel(x+r,y+r)
    );
}


function moveEntity(ent,dx,dy){

    const nx=
        ent.x+dx;

    const ny=
        ent.y+dy;

    const r=
        ent.radius || 14;

    if(canMove(nx,ent.y,r))
        ent.x=nx;

    if(canMove(ent.x,ny,r))
        ent.y=ny;
}


/* =========================================================
POSICIONES VÁLIDAS
========================================================= */

function randomOpenPosition(
    minDistance=0
){

    for(let i=0;i<1000;i++){

        const x=
            1+
            Math.floor(
                Math.random()*
                (mapW-2)
            );

        const y=
            1+
            Math.floor(
                Math.random()*
                (mapH-2)
            );

        if(world[y][x]!==0)
            continue;

        const px=
            (x+.5)*TILE;

        const py=
            (y+.5)*TILE;

        if(
            Math.hypot(
                px-player.x,
                py-player.y
            )<minDistance
        )
            continue;

        return {
            x:px,
            y:py
        };
    }

    return {
        x:12.5*TILE,
        y:12.5*TILE
    };
}


/* =========================================================
ZOMBIES
========================================================= */

function createZombie(){

    const p=
        randomOpenPosition(
            TILE*5
        );

    return {

        x:p.x,
        y:p.y,

        z:0,

        radius:17,

        height:1.82,

        health:100,

        alive:true,

        speed:
            34+
            Math.random()*15,

        attackTimer:0,

        hitFlash:0,

        phase:
            Math.random()*10

    };
}


function spawnZombies(){

    zombies=[];

    const count=
        8+
        Math.floor(
            Math.random()*5
        );

    for(let i=0;i<count;i++)
        zombies.push(
            createZombie()
        );
}


/* =========================================================
SUPERVIVIENTE
========================================================= */

const survivorNames=[
    "MATEO",
    "VALENTINA",
    "DANIEL",
    "SOFÍA",
    "NICOLÁS",
    "CAMILA",
    "MARTÍN",
    "EMILIA"
];


function createSurvivor(){

    const p=
        randomOpenPosition(
            TILE*7
        );

    return {

        x:p.x,
        y:p.y,

        z:0,

        radius:15,

        height:1.72,

        health:100,

        name:random(
            survivorNames
        ),

        rescued:false,

        following:false,

        escaping:false,

        speed:48,

        safeTimer:0

    };
}


/* =========================================================
OBJETOS
========================================================= */

function spawnItems(){

    items=[];

    for(let i=0;i<12;i++){

        const p=
            randomOpenPosition(
                TILE*2
            );

        items.push({

            x:p.x,
            y:p.y,

            type:
                Math.random()<.68
                ? "ammo"
                : "med",

            amount:
                Math.random()<.68
                ? 12
                : 1,

            collected:false

        });
    }
}


/* =========================================================
ESCALERA
========================================================= */

function spawnStairs(){

    const p=
        randomOpenPosition(
            TILE*4
        );

    stairs={

        x:p.x,
        y:p.y,

        type:"stairs"

    };
}


/* =========================================================
PUERTA
========================================================= */

function spawnDoor(){

    /*
    La puerta siempre se coloca sobre
    un corredor existente, no flotando
    en medio del mapa.
    */

    for(let i=0;i<500;i++){

        const x=
            2+
            Math.floor(
                Math.random()*
                (mapW-4)
            );

        const y=
            2+
            Math.floor(
                Math.random()*
                (mapH-4)
            );

        if(world[y][x]!==0)
            continue;

        const horizontal=
            world[y][x-1]===0 &&
            world[y][x+1]===0;

        const vertical=
            world[y-1][x]===0 &&
            world[y+1][x]===0;

        if(horizontal||vertical){

            door={

                x:(x+.5)*TILE,
                y:(y+.5)*TILE,

                open:false
            };

            return;
        }
    }

    door={
        x:12.5*TILE,
        y:8.5*TILE,
        open:false
    };
}

/* =========================================================
OBJETOS AUTOMÁTICOS
========================================================= */

function collectItems(){

    for(const item of items){

        if(item.collected)
            continue;

        const d=
            Math.hypot(
                player.x-item.x,
                player.y-item.y
            );

        if(d<45){

            item.collected=true;

            if(item.type==="ammo"){

                player.reserve+=
                    item.amount;

                showMessage(
                    "+"+
                    item.amount+
                    " MUNICIÓN"
                );

            }else{

                player.medkits+=
                    item.amount;

                showMessage(
                    "+1 BOTIQUÍN"
                );
            }

            updateAmmo();
        }
    }
}


/* =========================================================
BOTIQUÍN
========================================================= */

function useMedkit(){

    if(player.health>=100){

        showMessage(
            "VIDA AL MÁXIMO"
        );

        return;
    }

    if(player.medkits<=0){

        showMessage(
            "NO TIENES BOTIQUINES"
        );

        return;
    }

    player.medkits--;

    player.health=
        Math.min(
            100,
            player.health+45
        );

    showMessage(
        "BOTIQUÍN UTILIZADO"
    );
}


/* =========================================================
RECARGA
========================================================= */

let reloading=false;

function reload(){

    if(reloading)
        return;

    if(player.ammo>=12)
        return;

    if(player.reserve<=0){

        showMessage(
            "SIN MUNICIÓN DE RESERVA"
        );

        return;
    }

    reloading=true;

    showMessage("RECARGANDO...");

    setTimeout(()=>{

        const needed=
            12-player.ammo;

        const amount=
            Math.min(
                needed,
                player.reserve
            );

        player.ammo+=amount;

        player.reserve-=amount;

        reloading=false;

        updateAmmo();

    },650);
}


/* =========================================================
PARTÍCULAS
========================================================= */

const particles=[];


function createParticles(
    x,
    y,
    count=8
){

    for(let i=0;i<count;i++){

        particles.push({

            x,
            y,

            life:.25+
                Math.random()*.25,

            max:.5,

            angle:
                Math.random()*
                Math.PI*2,

            speed:
                30+
                Math.random()*100

        });
    }
}


function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.life-=dt;

        p.x+=
            Math.cos(p.angle)*
            p.speed*
            dt;

        p.y+=
            Math.sin(p.angle)*
            p.speed*
            dt;

        if(p.life<=0)
            particles.splice(i,1);
    }
}


/* =========================================================
DISPARO
========================================================= */

let lastShot=0;

function shoot(){

    const now=
        performance.now();

    if(reloading)
        return;

    if(now-lastShot<180)
        return;

    if(player.ammo<=0){

        showMessage(
            "SIN MUNICIÓN"
        );

        return;
    }

    lastShot=now;

    player.ammo--;

    updateAmmo();

    /*
    Retroceso del arma.
    */

    weaponKick=.12;

    /*
    Partículas de boca.
    */

    createParticles(
        player.x+
        Math.cos(player.angle)*30,

        player.y+
        Math.sin(player.angle)*30,

        10
    );

    /*
    Raycast central.
    */

    const rayAngle=
        player.angle;

    const dirX=
        Math.cos(rayAngle);

    const dirY=
        Math.sin(rayAngle);

    let hit=null;

    for(
        let d=5;
        d<MAX_DEPTH;
        d+=4
    ){

        const bx=
            player.x+
            dirX*d;

        const by=
            player.y+
            dirY*d;

        if(wallAtPixel(bx,by))
            break;

        for(const z of zombies){

            if(!z.alive)
                continue;

            const dx=
                z.x-bx;

            const dy=
                z.y-by;

            if(
                Math.hypot(dx,dy)
                <=z.radius+8
            ){

                hit=z;
                break;
            }
        }

        if(hit)
            break;
    }

    if(hit){

        hit.health-=45;

        hit.hitFlash=.12;

        createParticles(
            hit.x,
            hit.y,
            12
        );

        if(hit.health<=0){

            hit.health=0;

            hit.alive=false;

            showMessage(
                "ZOMBIE ELIMINADO"
            );
        }
    }
}


/* =========================================================
ARMAS
========================================================= */

let weaponKick=0;


function updateWeapon(dt){

    weaponKick=
        Math.max(
            0,
            weaponKick-
            dt*.65
        );
}


/* =========================================================
IA ZOMBIES
========================================================= */

function updateZombies(dt){

    for(const z of zombies){

        if(!z.alive)
            continue;

        z.hitFlash=
            Math.max(
                0,
                z.hitFlash-dt
            );

        z.attackTimer=
            Math.max(
                0,
                z.attackTimer-dt
            );

        /*
        Objetivo:
        jugador o superviviente.
        */

        let target=player;

        if(
            survivor &&
            survivor.rescued &&
            survivor.health>0
        ){

            const dp=
                Math.hypot(
                    z.x-survivor.x,
                    z.y-survivor.y
                );

            const du=
                Math.hypot(
                    z.x-player.x,
                    z.y-player.y
                );

            if(dp<du*1.2)
                target=survivor;
        }

        const dx=
            target.x-z.x;

        const dy=
            target.y-z.y;

        const d=
            Math.hypot(dx,dy);

        if(d<260){

            if(d>32){

                moveEntity(
                    z,
                    dx/d*
                    z.speed*dt,

                    dy/d*
                    z.speed*dt
                );
            }else{

                if(z.attackTimer<=0){

                    target.health=
                        Math.max(
                            0,
                            target.health-8
                        );

                    z.attackTimer=.8;
                }
            }
        }
    }
}


/* =========================================================
IA SUPERVIVIENTE
========================================================= */

function updateSurvivor(dt){

    if(!survivor)
        return;

    if(!survivor.rescued)
        return;

    let danger=null;

    let nearest=Infinity;

    for(const z of zombies){

        if(!z.alive)
            continue;

        const d=
            dist(
                survivor,
                z
            );

        if(d<nearest){

            nearest=d;
            danger=z;
        }
    }

    /*
    Si un zombie está demasiado cerca,
    huye.
    */

    if(
        danger &&
        nearest<210
    ){

        survivor.escaping=true;
        survivor.safeTimer=0;

        const dx=
            survivor.x-danger.x;

        const dy=
            survivor.y-danger.y;

        const d=
            Math.hypot(dx,dy)||1;

        moveEntity(
            survivor,
            dx/d*
            survivor.speed*
            1.8*
            dt,

            dy/d*
            survivor.speed*
            1.8*
            dt
        );

        return;
    }

    if(survivor.escaping){

        survivor.safeTimer+=dt;

        if(
            survivor.safeTimer>2
        ){

            survivor.escaping=false;
            survivor.safeTimer=0;
        }
    }

    /*
    Seguir al jugador.
    */

    if(
        survivor.following &&
        !survivor.escaping
    ){

        const dx=
            player.x-
            survivor.x;

        const dy=
            player.y-
            survivor.y;

        const d=
            Math.hypot(dx,dy);

        if(d>75){

            moveEntity(
                survivor,
                dx/d*
                survivor.speed*
                dt,

                dy/d*
                survivor.speed*
                dt
            );
        }
    }
}

/* =========================================================
MOVIMIENTO JUGADOR
========================================================= */

function updatePlayer(dt){

    let forward=0;
    let strafe=0;

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    forward-=moveY;
    strafe+=moveX;

    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>1){

        forward/=len;
        strafe/=len;
    }

    player.moving=
        Math.abs(forward)+
        Math.abs(strafe)>.05;

    if(!player.moving)
        return;

    const speed=
        player.speed*
        dt;

    const dx=
        (
            Math.cos(player.angle)*
            forward -
            Math.sin(player.angle)*
            strafe
        )*speed;

    const dy=
        (
            Math.sin(player.angle)*
            forward +
            Math.cos(player.angle)*
            strafe
        )*speed;

    const nx=
        player.x+dx;

    const ny=
        player.y+dy;

    if(canMove(
        nx,
        player.y,
        PLAYER_RADIUS
    ))
        player.x=nx;

    if(canMove(
        player.x,
        ny,
        PLAYER_RADIUS
    ))
        player.y=ny;
}


/* =========================================================
RAYCAST
========================================================= */

function castRay(angle){

    const dirX=
        Math.cos(angle);

    const dirY=
        Math.sin(angle);

    let distance=0;

    while(distance<MAX_DEPTH){

        distance+=4;

        const x=
            player.x+
            dirX*distance;

        const y=
            player.y+
            dirY*distance;

        if(wallAtPixel(x,y))
            return distance;
    }

    return MAX_DEPTH;
}


/* =========================================================
RENDER DEL MUNDO
========================================================= */

function renderWorld(){

    /*
    Cielo
    */

    const horizon=
        H/2+
        player.pitch*
        H*.7;

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H/2
        );

    sky.addColorStop(
        0,
        "#111820"
    );

    sky.addColorStop(
        1,
        "#252525"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        Math.max(
            0,
            horizon
        )
    );


    /*
    Suelo
    */

    const ground=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    ground.addColorStop(
        0,
        "#28251f"
    );

    ground.addColorStop(
        1,
        "#090909"
    );

    ctx.fillStyle=ground;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /*
    Rayos.
    */

    const rayCount=
        Math.floor(
            Math.min(
                W,
                800
            )*.75
        );

    const strip=
        W/rayCount;

    const depthBuffer=
        new Array(rayCount);


    for(let i=0;i<rayCount;i++){

        const cameraX=
            i/rayCount-.5;

        const rayAngle=
            player.angle+
            Math.atan(
                cameraX*
                Math.tan(FOV/2)*2
            );

        let distance=
            castRay(rayAngle);

        /*
        Corrección fish-eye.
        */

        distance*=
            Math.cos(
                rayAngle-
                player.angle
            );

        depthBuffer[i]=distance;

        const wallHeight=
            (TILE*1.7/
            distance)*
            H;

        const top=
            horizon-
            wallHeight/2;

        const shade=
            clamp(
                1-distance/900,
                .15,
                1
            );

        /*
        Color por distancia.
        */

        const v=
            Math.floor(
                85*shade
            );

        ctx.fillStyle=
            `rgb(${v+25},
                 ${v+22},
                 ${v+18})`;

        ctx.fillRect(
            i*strip,
            top,
            strip+1,
            wallHeight
        );
    }


    /*
    Entidades.
    */

    renderEntities(
        depthBuffer,
        rayCount
    );


    /*
    Objetos.
    */

    renderObjects(
        depthBuffer,
        rayCount
    );


    /*
    Arma.
    */

    renderWeapon();
}


/* =========================================================
PROYECCIÓN DE ENTIDADES
========================================================= */

function projectEntity(ent){

    const dx=
        ent.x-player.x;

    const dy=
        ent.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    let angle=
        Math.atan2(dy,dx)-
        player.angle;

    angle=
        normAngle(angle);

    const corrected=
        distance*
        Math.cos(angle);

    if(corrected<=3)
        return null;

    if(
        Math.abs(angle)>
        FOV*.75
    )
        return null;

    const screenX=
        W/2+
        (
            Math.tan(angle)/
            Math.tan(FOV/2)
        )*
        W/2;

    /*
    Pies SIEMPRE se proyectan
    sobre el suelo.

    No centramos el sprite.
    */

    const feetY=
        H/2+
        player.pitch*H*.7+
        (
            CAMERA_HEIGHT*
            H*.55/
            corrected
        );

    const height=
        ent.height*
        H*.55/
        corrected;

    return {

        x:screenX,

        top:
            feetY-height,

        bottom:
            feetY,

        width:
            height*.52,

        distance:corrected
    };
}


/* =========================================================
ENTIDADES
========================================================= */

function renderEntities(
    depthBuffer,
    rayCount
){

    const list=[];

    for(const z of zombies){

        if(!z.alive)
            continue;

        const p=
            projectEntity(z);

        if(p)
            list.push({
                ent:z,
                p,
                type:"zombie"
            });
    }


    if(
        survivor &&
        survivor.health>0
    ){

        const p=
            projectEntity(
                survivor
            );

        if(p)
            list.push({
                ent:survivor,
                p,
                type:"survivor"
            });
    }


    list.sort(
        (a,b)=>
            b.p.distance-
            a.p.distance
    );


    for(const item of list){

        const p=item.p;

        /*
        Comprobamos si está detrás
        de una pared usando una
        aproximación de depth buffer.
        */

        const screenIndex=
            Math.floor(
                p.x/
                W*
                rayCount
            );

        if(
            screenIndex>=0 &&
            screenIndex<rayCount
        ){

            if(
                p.distance>
                depthBuffer[
                    screenIndex
                ]+10
            )
                continue;
        }


        if(item.type==="zombie")
            drawZombie(
                item.ent,
                p
            );
        else
            drawSurvivor(
                item.ent,
                p
            );
    }
}


/* =========================================================
ZOMBIE VISUAL CSS/CANVAS
========================================================= */

function drawZombie(z,p){

    const x=
        p.x;

    const y=
        p.top;

    const w=
        p.width;

    const h=
        p.height;

    ctx.save();

    if(z.hitFlash>0)
        ctx.globalAlpha=.65;

    /*
    sombra
    */

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        p.bottom,
        w*.45,
        h*.08,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    cuerpo
    */

    ctx.fillStyle="#505050";

    ctx.fillRect(
        x-w*.28,
        y+h*.28,
        w*.56,
        h*.48
    );


    /*
    cabeza
    */

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.17,
        w*.18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    ojos
    */

    ctx.fillStyle="#b33";

    ctx.fillRect(
        x-w*.11,
        y+h*.15,
        w*.055,
        w*.055
    );

    ctx.fillRect(
        x+w*.055,
        y+h*.15,
        w*.055,
        w*.055
    );


    /*
    brazos
    */

    ctx.strokeStyle="#555";

    ctx.lineWidth=
        Math.max(
            3,
            w*.09
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.27,
        y+h*.34
    );

    ctx.lineTo(
        x-w*.45,
        y+h*.55
    );

    ctx.moveTo(
        x+w*.27,
        y+h*.34
    );

    ctx.lineTo(
        x+w*.45,
        y+h*.55
    );

    ctx.stroke();


    /*
    piernas
    */

    ctx.strokeStyle="#303030";

    ctx.lineWidth=
        Math.max(
            4,
            w*.11
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.12,
        y+h*.72
    );

    ctx.lineTo(
        x-w*.18,
        p.bottom
    );

    ctx.moveTo(
        x+w*.12,
        y+h*.72
    );

    ctx.lineTo(
        x+w*.18,
        p.bottom
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
SUPERVIVIENTE
========================================================= */

function drawSurvivor(s,p){

    const x=p.x;
    const y=p.top;
    const w=p.width;
    const h=p.height;

    ctx.save();

    /*
    sombra de pies
    */

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        p.bottom,
        w*.45,
        h*.08,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    cuerpo
    */

    ctx.fillStyle=
        s.escaping
        ? "#b68a39"
        : "#315c83";

    ctx.fillRect(
        x-w*.26,
        y+h*.28,
        w*.52,
        h*.45
    );


    /*
    cabeza
    */

    ctx.fillStyle="#bd8967";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.17,
        w*.17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    pelo
    */

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.12,
        w*.18,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
    piernas
    */

    ctx.strokeStyle="#202020";

    ctx.lineWidth=
        Math.max(
            4,
            w*.11
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.1,
        y+h*.7
    );

    ctx.lineTo(
        x-w*.15,
        p.bottom
    );

    ctx.moveTo(
        x+w*.1,
        y+h*.7
    );

    ctx.lineTo(
        x+w*.15,
        p.bottom
    );

    ctx.stroke();


    /*
    nombre.
    */

    ctx.font=
        "bold "+
        Math.max(
            9,
            w*.22
        )+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.fillText(
        s.name,
        x,
        y-5
    );

    ctx.restore();
}


/* =========================================================
OBJETOS
========================================================= */

function renderObjects(
    depthBuffer,
    rayCount
){

    for(const item of items){

        if(item.collected)
            continue;

        const p=
            projectEntity({
                x:item.x,
                y:item.y,

                height:.28
            });

        if(!p)
            continue;

        const idx=
            Math.floor(
                p.x/W*rayCount
            );

        if(
            idx>=0 &&
            idx<rayCount &&
            p.distance>
            depthBuffer[idx]
        )
            continue;

        ctx.save();

        ctx.fillStyle=
            item.type==="ammo"
            ? "#d0ad4a"
            : "#53bd6e";

        ctx.fillRect(
            p.x-p.width*.25,
            p.bottom-p.height,
            p.width*.5,
            p.height
        );

        ctx.restore();
    }


    /*
    Escalera
    */

    if(stairs){

        const p=
            projectEntity({
                x:stairs.x,
                y:stairs.y,
                height:.35
            });

        if(p){

            ctx.strokeStyle=
                "#aaa";

            ctx.lineWidth=
                Math.max(
                    2,
                    p.width*.08
                );

            for(let i=0;i<4;i++){

                const yy=
                    p.bottom-
                    i*
                    p.height/3;

                ctx.beginPath();

                ctx.moveTo(
                    p.x-p.width*.4,
                    yy
                );

                ctx.lineTo(
                    p.x+p.width*.4,
                    yy
                );

                ctx.stroke();
            }
        }
    }
}


/* =========================================================
ARMA
========================================================= */

function renderWeapon(){

    const scale=
        Math.min(
            innerWidth,
            innerHeight
        );

    const baseX=
        W*.68;

    const baseY=
        H*.77+
        weaponKick*H;

    /*
    arma estilizada
    */

    ctx.save();

    /*
    brazo
    */

    ctx.fillStyle="#9b765f";

    ctx.beginPath();

    ctx.moveTo(
        baseX-50,
        baseY+80
    );

    ctx.lineTo(
        baseX+25,
        baseY+10
    );

    ctx.lineTo(
        baseX+60,
        baseY+70
    );

    ctx.lineTo(
        baseX-10,
        baseY+115
    );

    ctx.closePath();

    ctx.fill();


    /*
    arma
    */

    ctx.fillStyle="#222";

    ctx.fillRect(
        baseX-12,
        baseY-40,
        26,
        130
    );

    ctx.fillStyle="#555";

    ctx.fillRect(
        baseX-8,
        baseY-75,
        18,
        42
    );

    ctx.fillStyle="#111";

    ctx.fillRect(
        baseX-15,
        baseY-87,
        32,
        18
    );

    ctx.restore();
}


/* =========================================================
MINIMAPA
========================================================= */

function renderMiniMap(){

    const mw=
        mapCanvas.width;

    const mh=
        mapCanvas.height;

    mapCtx.clearRect(
        0,
        0,
        mw,
        mh
    );

    const cell=
        Math.min(
            mw/mapW,
            mh/mapH
        );


    /*
    mapa completo
    */

    for(let y=0;y<mapH;y++)
    for(let x=0;x<mapW;x++){

        if(world[y][x]===1){

            mapCtx.fillStyle=
                "#252525";

        }else{

            mapCtx.fillStyle=
                "#8c8c8c";
        }

        mapCtx.fillRect(
            x*cell,
            y*cell,
            cell+.5,
            cell+.5
        );
    }


    /*
    objetos
    */

    for(const item of items){

        if(item.collected)
            continue;

        mapCtx.fillStyle=
            item.type==="ammo"
            ? "#e1bd45"
            : "#49c878";

        mapCtx.fillRect(
            item.x/TILE*cell-2,
            item.y/TILE*cell-2,
            4,
            4
        );
    }


    /*
    escalera
    */

    if(stairs){

        mapCtx.fillStyle="#fff";

        mapCtx.fillRect(
            stairs.x/TILE*cell-3,
            stairs.y/TILE*cell-3,
            6,
            6
        );
    }


    /*
    puerta
    */

    if(door){

        mapCtx.fillStyle="#38a7ff";

        mapCtx.fillRect(
            door.x/TILE*cell-3,
            door.y/TILE*cell-3,
            6,
            6
        );
    }


    /*
    zombies
    */

    for(const z of zombies){

        if(!z.alive)
            continue;

        mapCtx.fillStyle="#d33";

        mapCtx.beginPath();

        mapCtx.arc(
            z.x/TILE*cell,
            z.y/TILE*cell,
            3.5,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }


    /*
    superviviente
    */

    if(
        survivor &&
        survivor.health>0
    ){

        mapCtx.fillStyle="#45dc82";

        mapCtx.beginPath();

        mapCtx.arc(
            survivor.x/TILE*cell,
            survivor.y/TILE*cell,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }


    /*
    jugador
    */

    const px=
        player.x/TILE*cell;

    const py=
        player.y/TILE*cell;

    mapCtx.save();

    mapCtx.translate(
        px,
        py
    );

    mapCtx.rotate(
        player.angle
    );

    /*
    dirección de mirada
    */

    mapCtx.strokeStyle="#fff";

    mapCtx.lineWidth=2;

    mapCtx.beginPath();

    mapCtx.moveTo(0,0);

    mapCtx.lineTo(
        13,
        0
    );

    mapCtx.stroke();


    /*
    jugador
    */

    mapCtx.fillStyle="#fff";

    mapCtx.beginPath();

    mapCtx.moveTo(
        6,
        0
    );

    mapCtx.lineTo(
        -5,
        -4
    );

    mapCtx.lineTo(
        -5,
        4
    );

    mapCtx.closePath();

    mapCtx.fill();

    mapCtx.restore();
}


/* =========================================================
UPDATE
========================================================= */

let lastTime=
    performance.now();


function update(){

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );


    updatePlayer(dt);

    updateZombies(dt);

    updateSurvivor(dt);

    collectItems();

    updateParticles(dt);

    updateWeapon(dt);

    updateMessage(dt);

    updateAction();

    updateHealthHUD();
}


/* =========================================================
RENDER
========================================================= */

function render(){

    renderWorld();

    renderMiniMap();
}


/* =========================================================
GAME LOOP
========================================================= */

function loop(){

    update();

    render();

    requestAnimationFrame(loop);
}


/* =========================================================
INICIAR
========================================================= */

newFloor();

updateAmmo();

loop();

</script>
