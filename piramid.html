<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#b98d52;
}

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:
        radial-gradient(circle at center,#704d29 0,#251a12 55%,#090807 100%);
}

.menuBox{
    width:min(94vw,430px);
    max-height:94vh;
    overflow:auto;
    padding:24px 18px;
    border:2px solid #d7ad57;
    border-radius:22px;
    background:rgba(20,15,11,.96);
    box-shadow:0 0 40px rgba(0,0,0,.8);
    text-align:center;
}

.logo{
    font-size:clamp(25px,8vw,42px);
    font-weight:900;
    letter-spacing:2px;
    color:#e6c477;
    text-shadow:0 3px 0 #5d3b18;
}

.subtitle{
    color:#c8b28b;
    font-size:12px;
    margin:8px 0 18px;
}

.start{
    width:100%;
    min-height:58px;
    border:0;
    border-radius:15px;
    color:#24170b;
    background:linear-gradient(#f3d17a,#b77c28);
    font-size:19px;
    font-weight:900;
    margin-bottom:18px;
}

.godTitle{
    color:#d9bd76;
    font-weight:bold;
    margin-bottom:10px;
}

.godsMenu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.godCard{
    min-width:0;
    padding:10px 5px;
    border:1px solid #634a2c;
    border-radius:12px;
    background:#1d1711;
    color:#ddd;
}

.godCard.selected{
    border-color:#e3bf62;
    box-shadow:0 0 12px rgba(226,185,91,.35);
}

.glyph{
    width:42px;
    height:42px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    border:1px solid #9c7838;
    background:#302317;
    color:#e3c06c;
    font-size:24px;
}

.godName{
    font-size:11px;
    margin-top:6px;
    font-weight:bold;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#topHud{
    position:absolute;
    top:max(8px,env(safe-area-inset-top));
    left:8px;
    right:8px;
    display:flex;
    align-items:center;
    gap:7px;
}

#playerPanel{
    flex:1;
    min-width:0;
    padding:7px 9px;
    border:1px solid rgba(225,192,109,.65);
    border-radius:12px;
    background:rgba(17,13,9,.78);
    backdrop-filter:blur(4px);
}

#playerName{
    color:#e6ca83;
    font-size:10px;
    font-weight:bold;
}

.bar{
    height:7px;
    margin-top:4px;
    overflow:hidden;
    border-radius:5px;
    background:#281c15;
}

.fill{
    width:100%;
    height:100%;
    transition:width .2s;
}

#hpFill{background:#c84c3e}
#xpFill{background:#55a9d4}

#level{
    color:#eee;
    font-size:10px;
    margin-top:3px;
}

#godHUD{
    width:51px;
    height:51px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #d1aa58;
    border-radius:13px;
    background:rgba(22,16,11,.9);
    color:#e8c774;
    font-size:27px;
}

/* minimap */

#mapWrap{
    position:absolute;
    top:72px;
    right:8px;
    width:min(31vw,125px);
    aspect-ratio:1;
    padding:3px;
    border:1px solid #d2a952;
    border-radius:10px;
    background:rgba(10,8,6,.82);
}

#minimap{
    width:100%;
    height:100%;
    display:block;
}

/* messages */

#messages{
    position:absolute;
    left:50%;
    bottom:118px;
    transform:translateX(-50%);
    width:min(66vw,310px);
    height:76px;
    padding:7px;
    overflow:hidden;
    border:1px solid rgba(216,178,88,.42);
    border-radius:10px;
    background:rgba(13,10,7,.48);
    color:#e7d5a7;
    font-size:10px;
    line-height:1.35;
}

.msg{
    opacity:.8;
    margin-bottom:2px;
}

.msg:last-child{
    opacity:1;
    color:#fff0bf;
}

/* =========================================================
   CONTROLES
========================================================= */

#joystick{
    position:absolute;
    left:max(12px,env(safe-area-inset-left));
    bottom:max(18px,env(safe-area-inset-bottom));
    width:112px;
    height:112px;
    border-radius:50%;
    border:2px solid rgba(220,184,101,.42);
    background:rgba(26,20,15,.45);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:49px;
    height:49px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(216,178,90,.68);
    border:2px solid #e8c875;
}

#buttons{
    position:absolute;
    right:max(12px,env(safe-area-inset-right));
    bottom:max(18px,env(safe-area-inset-bottom));
    width:125px;
    height:120px;
    pointer-events:none;
}

.action{
    position:absolute;
    border-radius:50%;
    border:2px solid rgba(229,194,104,.8);
    background:rgba(35,25,17,.82);
    color:#efd185;
    font-weight:900;
    pointer-events:auto;
}

#attack{
    right:0;
    bottom:0;
    width:72px;
    height:72px;
    font-size:13px;
}

#ability{
    left:0;
    bottom:48px;
    width:53px;
    height:53px;
    font-size:20px;
}

#godSelect{
    left:0;
    bottom:0;
    width:42px;
    height:42px;
    font-size:15px;
}

.action:active,
.start:active{
    transform:scale(.94);
}

/* landscape fallback */
@media (min-width:700px){
    #mapWrap{width:145px}
    #messages{bottom:100px}
}

/* very small phones */
@media (max-width:340px){
    #joystick{
        width:94px;
        height:94px;
    }

    #stick{
        width:42px;
        height:42px;
    }

    #buttons{
        width:110px;
    }

    #attack{
        width:64px;
        height:64px;
    }

    #messages{
        width:62vw;
        bottom:105px;
    }

    #mapWrap{
        top:67px;
        width:105px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =======================================================
     MENU
======================================================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">PYRAMID<br>OF THE GODS</div>
        <div class="subtitle">
            FPS 2.5D · TEMPLOS · DIOSES · COMBATE
        </div>

        <button class="start" id="startBtn">
            INICIAR EXPLORACIÓN
        </button>

        <div class="godTitle">ELIGE TU DIOS</div>

        <div class="godsMenu">

            <div class="godCard selected" data-god="RA">
                <div class="glyph">☀</div>
                <div class="godName">RA</div>
            </div>

            <div class="godCard" data-god="ANUBIS">
                <div class="glyph">𓃢</div>
                <div class="godName">ANUBIS</div>
            </div>

            <div class="godCard" data-god="HORUS">
                <div class="glyph">𓅃</div>
                <div class="godName">HORUS</div>
            </div>

            <div class="godCard" data-god="ISIS">
                <div class="glyph">𓊨</div>
                <div class="godName">ISIS</div>
            </div>

            <div class="godCard" data-god="SETH">
                <div class="glyph">𓃩</div>
                <div class="godName">SETH</div>
            </div>

            <div class="godCard" data-god="OSIRIS">
                <div class="glyph">𓀀</div>
                <div class="godName">OSIRIS</div>
            </div>

        </div>

    </div>

</div>

<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div id="topHud">

        <div id="playerPanel">
            <div id="playerName">EXPLORADOR · NIVEL 1</div>

            <div class="bar">
                <div class="fill" id="hpFill"></div>
            </div>

            <div class="bar">
                <div class="fill" id="xpFill"></div>
            </div>

            <div id="level">HP 100 / 100 · XP 0 / 100</div>
        </div>

        <div id="godHUD">☀</div>

    </div>

    <div id="mapWrap">
        <canvas id="minimap"></canvas>
    </div>

    <div id="messages"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">
        <button class="action" id="ability">✦</button>
        <button class="action" id="godSelect">☀</button>
        <button class="action" id="attack">ATAQUE</button>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {alpha:false});

const mini = document.getElementById("minimap");
const mctx = mini.getContext("2d");

let W=0,H=0;

function resize(){

    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;

    const s=Math.min(180,Math.max(100,window.innerWidth*.31));
    mini.width=s;
    mini.height=s;
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   UTILS
========================================================= */

function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function dist(ax,ay,bx,by){
    return Math.hypot(ax-bx,ay-by);
}

function angleDiff(a,b){
    let d=a-b;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    return d;
}

/* =========================================================
   MAP
========================================================= */

const TILE=1;

let map=[];
let mapW=0;
let mapH=0;

const FLOOR=0;
const WALL=1;
const DOOR=2;

function emptyMap(w,h){

    mapW=w;
    mapH=h;

    map=Array.from(
        {length:h},
        ()=>Array(w).fill(WALL)
    );
}

/*
    Generación por "salas + corredores".

    Cada sala queda conectada mediante corredores.
    Después se comprueba que no existan regiones interiores
    inaccesibles.
*/

function generateMap(){

    emptyMap(
        randomInt(46,58),
        randomInt(46,58)
    );

    const rooms=[];

    const roomCount=randomInt(8,11);

    for(let i=0;i<roomCount;i++){

        let placed=false;

        for(let tries=0;tries<80 && !placed;tries++){

            const rw=randomInt(7,12);
            const rh=randomInt(7,12);

            const rx=randomInt(2,mapW-rw-3);
            const ry=randomInt(2,mapH-rh-3);

            const room={
                x:rx,
                y:ry,
                w:rw,
                h:rh,
                cx:Math.floor(rx+rw/2),
                cy:Math.floor(ry+rh/2)
            };

            let overlap=false;

            for(const r of rooms){

                if(
                    rx < r.x+r.w+2 &&
                    rx+rw+2 > r.x &&
                    ry < r.y+r.h+2 &&
                    ry+rh+2 > r.y
                ){
                    overlap=true;
                    break;
                }
            }

            if(overlap)continue;

            rooms.push(room);

            for(let y=ry;y<ry+rh;y++){
                for(let x=rx;x<rx+rw;x++){
                    map[y][x]=FLOOR;
                }
            }

            placed=true;
        }
    }

    /*
       Conecta todas las habitaciones en cadena.
       Así no quedan salas aisladas.
    */

    rooms.sort((a,b)=>a.cx-b.cx);

    for(let i=1;i<rooms.length;i++){

        const a=rooms[i-1];
        const b=rooms[i];

        carveCorridor(a.cx,a.cy,b.cx,b.cy);
    }

    /*
       Añadimos conexiones adicionales para que el mapa
       no sea un simple laberinto lineal.
    */

    for(let i=0;i<rooms.length-2;i++){

        if(Math.random()<.38){

            const a=rooms[i];
            const b=rooms[i+2];

            carveCorridor(a.cx,a.cy,b.cx,b.cy);
        }
    }

    /*
       Borde sólido.
    */

    for(let x=0;x<mapW;x++){
        map[0][x]=WALL;
        map[mapH-1][x]=WALL;
    }

    for(let y=0;y<mapH;y++){
        map[y][0]=WALL;
        map[y][mapW-1]=WALL;
    }

    /*
       Inicio en primera sala.
    */

    const start=rooms[0];

    player.x=start.cx+.5;
    player.y=start.cy+.5;
    player.angle=0;

    /*
       Puerta únicamente en otra sala.
       Nunca aparece en la sala inicial.
    */

    const exitRoom=rooms[rooms.length-1];

    placeDoor(exitRoom);

    currentRooms=rooms;

    return rooms;
}

function carveCorridor(x1,y1,x2,y2){

    if(Math.random()<.5){

        carveHorizontal(x1,x2,y1);
        carveVertical(y1,y2,x2);

    }else{

        carveVertical(y1,y2,x1);
        carveHorizontal(x1,x2,y2);
    }
}

function carveHorizontal(a,b,y){

    const min=Math.min(a,b);
    const max=Math.max(a,b);

    for(let x=min;x<=max;x++){

        for(let yy=y-1;yy<=y+1;yy++){

            if(
                yy>0 &&
                yy<mapH-1 &&
                x>0 &&
                x<mapW-1
            ){
                map[yy][x]=FLOOR;
            }
        }
    }
}

function carveVertical(a,b,x){

    const min=Math.min(a,b);
    const max=Math.max(a,b);

    for(let y=min;y<=max;y++){

        for(let xx=x-1;xx<=x+1;xx++){

            if(
                y>0 &&
                y<mapH-1 &&
                xx>0 &&
                xx<mapW-1
            ){
                map[y][xx]=FLOOR;
            }
        }
    }
}

let door={
    x:0,
    y:0,
    side:"N"
};

function placeDoor(room){

    const choices=[
        {x:room.cx,y:room.y,side:"N"},
        {x:room.cx,y:room.y+room.h-1,side:"S"},
        {x:room.x,y:room.cy,side:"W"},
        {x:room.x+room.w-1,y:room.cy,side:"E"}
    ];

    const c=choices[randomInt(0,choices.length-1)];

    /*
       La puerta ocupa una celda de pared,
       por lo que visualmente pertenece al muro.
    */

    if(c.side==="N"){
        map[c.y][c.x]=DOOR;
    }
    else if(c.side==="S"){
        map[c.y][c.x]=DOOR;
    }
    else if(c.side==="W"){
        map[c.y][c.x]=DOOR;
    }
    else{
        map[c.y][c.x]=DOOR;
    }

    door=c;
}

function tileAt(x,y){

    const tx=Math.floor(x);
    const ty=Math.floor(y);

    if(
        tx<0 ||
        ty<0 ||
        tx>=mapW ||
        ty>=mapH
    ){
        return WALL;
    }

    return map[ty][tx];
}

function solid(x,y){

    const t=tileAt(x,y);

    return t===WALL;
}

/* =========================================================
   PLAYER
========================================================= */

const player={
    x:5,
    y:5,
    angle:0,

    radius:.22,

    hp:100,
    maxHp:100,

    xp:0,
    nextXP:100,

    level:1,

    speed:2.5,

    damage:25,
    range:5.0,

    attackTime:0,
    attackDuration:.28,
    attackCooldown:0
};

function movePlayer(dx,dy){

    const nx=player.x+dx;
    const ny=player.y+dy;

    if(
        !solid(nx-player.radius,player.y) &&
        !solid(nx+player.radius,player.y)
    ){
        player.x=nx;
    }

    if(
        !solid(player.x,ny-player.radius) &&
        !solid(player.x,ny+player.radius)
    ){
        player.y=ny;
    }
}

/* =========================================================
   GODS
========================================================= */

const gods={

    RA:{
        icon:"☀",
        speed:1,
        damage:1.1,
        hp:1,
        cooldown:4,
        ability:"Lanza solar"
    },

    ANUBIS:{
        icon:"𓃢",
        speed:1.05,
        damage:1.25,
        hp:1,
        cooldown:5,
        ability:"Juicio del chacal"
    },

    HORUS:{
        icon:"𓅃",
        speed:1.15,
        damage:1.0,
        hp:1,
        cooldown:4,
        ability:"Ojo de Horus"
    },

    ISIS:{
        icon:"𓊨",
        speed:1,
        damage:.9,
        hp:1.3,
        cooldown:6,
        ability:"Bendición"
    },

    SETH:{
        icon:"𓃩",
        speed:1.25,
        damage:1.3,
        hp:.9,
        cooldown:5,
        ability:"Tormenta"
    },

    OSIRIS:{
        icon:"𓀀",
        speed:.9,
        damage:1.15,
        hp:1.45,
        cooldown:7,
        ability:"Renacimiento"
    }
};

let selectedGod="RA";

function applyGod(){

    const g=gods[selectedGod];

    player.speed=2.5*g.speed;
    player.damage=25*g.damage;

    player.maxHp=Math.round(100*g.hp);

    player.hp=clamp(
        player.hp,
        0,
        player.maxHp
    );

    document.getElementById("godHUD").textContent=g.icon;
    document.getElementById("godSelect").textContent=g.icon;

    addMessage(
        selectedGod+" seleccionado · "+g.ability
    );
}

document.querySelectorAll(".godCard").forEach(card=>{

    card.addEventListener("click",()=>{

        selectedGod=card.dataset.god;

        document.querySelectorAll(".godCard")
            .forEach(c=>c.classList.remove("selected"));

        card.classList.add("selected");

        applyGod();
    });
});

/* =========================================================
   ENEMIES
========================================================= */

let enemies=[];

function spawnEnemies(rooms){

    enemies=[];

    /*
       No aparecen dentro de la sala inicial.
       Se colocan en habitaciones posteriores.
    */

    for(let i=1;i<rooms.length;i++){

        const r=rooms[i];

        const count=randomInt(1,Math.min(3,Math.floor(r.w/4)));

        for(let n=0;n<count;n++){

            enemies.push({

                x:r.x+1.5+Math.random()*(r.w-3),
                y:r.y+1.5+Math.random()*(r.h-3),

                radius:.28,

                hp:60+player.level*10,
                maxHp:60+player.level*10,

                speed:.7+Math.random()*.3,

                state:"idle",
                attackCooldown:0,

                hitFlash:0
            });
        }
    }
}

function updateEnemies(dt){

    for(const e of enemies){

        if(e.hp<=0)continue;

        e.attackCooldown=Math.max(
            0,
            e.attackCooldown-dt
        );

        e.hitFlash=Math.max(
            0,
            e.hitFlash-dt
        );

        const d=dist(
            e.x,e.y,
            player.x,player.y
        );

        /*
           IA:
           - cerca al jugador
           - mantiene cierta distancia
           - comprueba obstáculos mediante movimiento
        */

        if(d<9){

            e.state="chase";

            const dx=(player.x-e.x)/Math.max(d,.001);
            const dy=(player.y-e.y)/Math.max(d,.001);

            if(d>1.15){

                const speed=e.speed*dt;

                const oldX=e.x;
                const oldY=e.y;

                if(!solid(e.x+dx*speed,e.y)){
                    e.x+=dx*speed;
                }

                if(!solid(e.x,e.y+dy*speed)){
                    e.y+=dy*speed;
                }

                /*
                   Si está bloqueado, intenta rodear.
                */

                if(
                    Math.abs(e.x-oldX)<.001 &&
                    Math.abs(e.y-oldY)<.001
                ){

                    const sx=-dy;
                    const sy=dx;

                    if(!solid(e.x+sx*speed,e.y)){
                        e.x+=sx*speed;
                    }

                    if(!solid(e.x,e.y+sy*speed)){
                        e.y+=sy*speed;
                    }
                }

            }else{

                e.state="attack";

                if(e.attackCooldown<=0){

                    player.hp-=8;

                    e.attackCooldown=1.1;

                    addMessage(
                        "Un guardián enemigo te ha herido."
                    );

                    if(player.hp<=0){

                        player.hp=player.maxHp;

                        player.x=5.5;
                        player.y=5.5;

                        addMessage(
                            "Has caído... el templo te devuelve al camino."
                        );
                    }
                }
            }

        }else{

            e.state="idle";
        }
    }
}

/* =========================================================
   ALLY / GOD
========================================================= */

const guardian={
    active:false,

    x:0,
    y:0,

    angle:0,

    hp:140,
    maxHp:140,

    speed:2.0,

    attackCooldown:0,

    summonTime:0
};

function summonGuardian(){

    /*
       Se invoca SIEMPRE junto al jugador.
       Busca una posición libre cercana.
    */

    const spots=[
        [ .9, .4],
        [-.9, .4],
        [ .7,-.8],
        [-.7,-.8]
    ];

    let found=false;

    for(const s of spots){

        const x=player.x+s[0];
        const y=player.y+s[1];

        if(!solid(x,y)){

            guardian.x=x;
            guardian.y=y;

            found=true;
            break;
        }
    }

    if(!found){

        guardian.x=player.x+.8;
        guardian.y=player.y+.8;
    }

    guardian.active=true;
    guardian.summonTime=1;

    addMessage(
        selectedGod+" ha invocado a su guardián."
    );
}

function updateGuardian(dt){

    if(!guardian.active)return;

    guardian.attackCooldown=Math.max(
        0,
        guardian.attackCooldown-dt
    );

    guardian.summonTime=Math.max(
        0,
        guardian.summonTime-dt
    );

    const d=dist(
        guardian.x,
        guardian.y,
        player.x,
        player.y
    );

    /*
       Mantiene una distancia de seguimiento.
       Nunca se coloca encima del jugador.
    */

    if(d>2.0){

        const dx=(player.x-guardian.x)/d;
        const dy=(player.y-guardian.y)/d;

        const speed=guardian.speed*dt;

        if(!solid(
            guardian.x+dx*speed,
            guardian.y
        )){
            guardian.x+=dx*speed;
        }

        if(!solid(
            guardian.x,
            guardian.y+dy*speed
        )){
            guardian.y+=dy*speed;
        }
    }

    /*
       IA ofensiva.
    */

    let target=null;
    let best=999;

    for(const e of enemies){

        if(e.hp<=0)continue;

        const de=dist(
            guardian.x,
            guardian.y,
            e.x,e.y
        );

        if(de<best){

            best=de;
            target=e;
        }
    }

    if(target && best<3.2){

        guardian.angle=Math.atan2(
            target.y-guardian.y,
            target.x-guardian.x
        );

        if(guardian.attackCooldown<=0){

            target.hp-=18;

            target.hitFlash=.16;

            guardian.attackCooldown=.85;

            createBurst(
                target.x,
                target.y,
                "ally"
            );

            if(target.hp<=0){

                gainXP(30);
            }
        }
    }
}

/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

function createBurst(x,y,type="attack"){

    const count=type==="attack"?15:25;

    for(let i=0;i<count;i++){

        const a=Math.random()*Math.PI*2;
        const speed=.5+Math.random()*2;

        particles.push({

            x,y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            life:.35+Math.random()*.45,
            maxLife:.8,

            type
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }
}

/* =========================================================
   COMBAT
========================================================= */

function attack(){

    if(player.attackCooldown>0)return;

    player.attackTime=player.attackDuration;
    player.attackCooldown=.42;

    createBurst(
        player.x+Math.cos(player.angle)*.9,
        player.y+Math.sin(player.angle)*.9,
        "attack"
    );

    let best=null;
    let bestDist=player.range;

    for(const e of enemies){

        if(e.hp<=0)continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const d=Math.hypot(dx,dy);

        if(d>player.range)continue;

        const a=Math.atan2(dy,dx);
        const diff=Math.abs(angleDiff(a,player.angle));

        /*
           Alcance y arco frontal.
        */

        if(diff<.42 && d<bestDist){

            best=e;
            bestDist=d;
        }
    }

    if(best){

        best.hp-=player.damage;
        best.hitFlash=.16;

        createBurst(
            best.x,
            best.y,
            "hit"
        );

        addMessage(
            "Golpe acertado · "+Math.round(player.damage)+" daño"
        );

        if(best.hp<=0){

            gainXP(35);

            addMessage(
                "Enemigo derrotado · +35 XP"
            );
        }
    }
}

function useAbility(){

    const g=gods[selectedGod];

    /*
       Habilidad simple pero distinta por Dios.
    */

    const radius=
        selectedGod==="SETH"?4:
        selectedGod==="HORUS"?6:
        3.5;

    let hits=0;

    for(const e of enemies){

        if(e.hp<=0)continue;

        const d=dist(
            player.x,
            player.y,
            e.x,e.y
        );

        if(d<=radius){

            let damage=45;

            if(selectedGod==="ANUBIS")damage=60;
            if(selectedGod==="HORUS")damage=38;
            if(selectedGod==="SETH")damage=70;
            if(selectedGod==="OSIRIS")damage=42;

            e.hp-=damage;
            e.hitFlash=.3;

            createBurst(
                e.x,e.y,
                "ability"
            );

            hits++;

            if(e.hp<=0){
                gainXP(50);
            }
        }
    }

    if(selectedGod==="ISIS"){

        player.hp=clamp(
            player.hp+30,
            0,
            player.maxHp
        );

        addMessage(
            "Isis restaura parte de tu vida."
        );
    }

    if(hits){

        addMessage(
            g.ability+" · "+hits+" enemigos afectados."
        );

    }else{

        addMessage(
            g.ability+" activada."
        );
    }
}

/* =========================================================
   XP / LEVEL
========================================================= */

function gainXP(amount){

    player.xp+=amount;

    while(player.xp>=player.nextXP){

        player.xp-=player.nextXP;

        player.level++;

        player.nextXP=Math.floor(
            player.nextXP*1.32
        );

        player.maxHp+=12;
        player.hp=player.maxHp;

        player.damage+=4;

        addMessage(
            "¡NIVEL "+player.level+"! Tus estadísticas han mejorado."
        );
    }
}

/* =========================================================
   RAYCASTER 2.5D
========================================================= */

const FOV=Math.PI/3;

function castRay(angle){

    const sin=Math.sin(angle);
    const cos=Math.cos(angle);

    let distToWall=0;
    let hitType=WALL;

    const step=.035;
    const max=30;

    for(
        let d=.02;
        d<max;
        d+=step
    ){

        const x=player.x+cos*d;
        const y=player.y+sin*d;

        const t=tileAt(x,y);

        if(t===WALL || t===DOOR){

            distToWall=d;
            hitType=t;

            break;
        }
    }

    return {
        dist:distToWall||max,
        type:hitType
    };
}

function renderWorld(){

    /*
       Cielo.
    */

    const horizon=H*.46;

    ctx.fillStyle="#b9a072";
    ctx.fillRect(0,0,W,horizon);

    /*
       Suelo arena uniforme.
       No refleja las paredes.
    */

    ctx.fillStyle="#b78b50";
    ctx.fillRect(0,horizon,W,H-horizon);

    const columns=Math.min(
        W,
        480
    );

    const columnWidth=W/columns;

    for(let i=0;i<columns;i++){

        const cameraX=
            (i/columns)-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const hit=castRay(rayAngle);

        let d=hit.dist;

        /*
           Corrige distorsión.
        */

        d*=Math.cos(
            rayAngle-player.angle
        );

        const wallHeight=
            Math.min(
                H*1.5,
                H*.92/d
            );

        const top=
            horizon-wallHeight/2;

        /*
           Paredes sin reflejo.
        */

        let shade=
            clamp(
                150-d*8,
                35,
                145
            );

        if(hit.type===DOOR){

            ctx.fillStyle=
                "rgb(38,27,18)";

        }else{

            ctx.fillStyle=
                "rgb("+shade+","+
                Math.floor(shade*.73)+","+
                Math.floor(shade*.48)+")";
        }

        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );

        /*
           Textura sencilla de piedra.
        */

        if(hit.type===WALL && i%9===0){

            ctx.fillStyle=
                "rgba(40,25,15,.15)";

            ctx.fillRect(
                i*columnWidth,
                top,
                1,
                wallHeight
            );
        }
    }

    renderSprites();

    renderWeapon();

    renderParticles();
}

/* =========================================================
   SPRITES 2.5D
========================================================= */

function projectSprite(obj){

    const dx=obj.x-player.x;
    const dy=obj.y-player.y;

    const distance=Math.hypot(dx,dy);

    let angle=Math.atan2(dy,dx);

    const relative=
        angleDiff(angle,player.angle);

    if(
        Math.abs(relative)>FOV*.72 ||
        distance<.15
    ){
        return null;
    }

    const screenX=
        W/2+
        Math.tan(relative)*
        (W/(2*Math.tan(FOV/2)));

    const size=
        Math.min(
            H*.75,
            H/(distance*.95)
        );

    return {
        x:screenX,
        y:H*.46,
        size,
        distance
    };
}

function renderSprites(){

    const objects=[];

    for(const e of enemies){

        if(e.hp>0){

            objects.push({
                type:"enemy",
                obj:e
            });
        }
    }

    if(guardian.active){

        objects.push({
            type:"guardian",
            obj:guardian
        });
    }

    objects.sort(
        (a,b)=>
            dist(b.obj.x,b.obj.y,player.x,player.y)-
            dist(a.obj.x,a.obj.y,player.x,player.y)
    );

    for(const item of objects){

        const p=projectSprite(item.obj);

        if(!p)continue;

        if(item.type==="enemy"){

            renderEnemy(
                item.obj,
                p
            );

        }else{

            renderGuardian(
                item.obj,
                p
            );
        }
    }
}

function renderEnemy(e,p){

    const s=p.size;

    const x=p.x;
    const ground=H*.46+s*.5;

    /*
       Sombra.
    */

    ctx.fillStyle="rgba(20,12,5,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.23,
        s*.07,
        0,0,Math.PI*2
    );

    ctx.fill();

    /*
       Cuerpo anclado al suelo.
    */

    ctx.fillStyle=
        e.hitFlash>0?
        "#fff":
        "#633b2b";

    ctx.fillRect(
        x-s*.17,
        ground-s*.48,
        s*.34,
        s*.38
    );

    /*
       Cabeza.
    */

    ctx.fillStyle="#38241d";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.57,
        s*.15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Ojos.
    */

    ctx.fillStyle="#e3b44d";

    ctx.fillRect(
        x-s*.075,
        ground-s*.59,
        s*.04,
        s*.025
    );

    ctx.fillRect(
        x+s*.035,
        ground-s*.59,
        s*.04,
        s*.025
    );

    /*
       Barra de vida.
    */

    const bw=s*.52;
    const bh=Math.max(4,s*.035);

    ctx.fillStyle="rgba(20,10,8,.8)";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw,
        bh
    );

    ctx.fillStyle="#d34c43";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw*clamp(e.hp/e.maxHp,0,1),
        bh
    );
}

function renderGuardian(g,p){

    const s=p.size*.95;

    const x=p.x;
    const ground=H*.46+s*.5;

    ctx.fillStyle="rgba(30,20,8,.3)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.28,
        s*.08,
        0,0,Math.PI*2
    );

    ctx.fill();

    /*
       Aura.
    */

    const pulse=
        1+Math.sin(performance.now()*.006)*.08;

    ctx.strokeStyle=
        "rgba(236,195,88,.7)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.38,
        s*.32*pulse,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       Túnica.
    */

    ctx.fillStyle="#a77a2f";

    ctx.beginPath();

    ctx.moveTo(x-s*.22,ground);
    ctx.lineTo(x-s*.15,ground-s*.48);
    ctx.lineTo(x,ground-s*.57);
    ctx.lineTo(x+s*.15,ground-s*.48);
    ctx.lineTo(x+s*.22,ground);

    ctx.closePath();

    ctx.fill();

    /*
       Cabeza.
    */

    ctx.fillStyle="#d5ad68";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.62,
        s*.14,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#201711";

    ctx.fillRect(
        x-s*.17,
        ground-s*.75,
        s*.34,
        s*.07
    );

    /*
       Bastón / arma.
    */

    ctx.strokeStyle="#e0bd62";
    ctx.lineWidth=Math.max(2,s*.025);

    ctx.beginPath();

    ctx.moveTo(
        x+s*.16,
        ground-s*.15
    );

    ctx.lineTo(
        x+s*.23,
        ground-s*.68
    );

    ctx.stroke();
}

/* =========================================================
   WEAPON
========================================================= */

function renderWeapon(){

    const attacking=
        player.attackTime>0;

    /*
       Arma en mano derecha.

       Barrido horizontal:
       empieza abajo/derecha y se desplaza hacia
       el centro durante el ataque.
    */

    let swing=0;

    if(attacking){

        const t=
            1-player.attackTime/
            player.attackDuration;

        swing=Math.sin(
            t*Math.PI
        );
    }

    const baseX=W*.78;
    const baseY=H*1.04;

    const handX=
        baseX-
        swing*W*.24;

    const handY=
        baseY-
        swing*H*.13;

    ctx.save();

    ctx.translate(
        handX,
        handY
    );

    ctx.rotate(
        -.48-
        swing*1.18
    );

    /*
       Brazo derecho.
    */

    ctx.fillStyle="#8d5c39";

    ctx.fillRect(
        -13,
        -15,
        26,
        72
    );

    /*
       Mango.
    */

    ctx.fillStyle="#3d2417";

    ctx.fillRect(
        -5,
        -98,
        10,
        65
    );

    /*
       Hoja.
    */

    ctx.beginPath();

    ctx.moveTo(-4,-100);
    ctx.lineTo(0,-190);
    ctx.lineTo(5,-100);
    ctx.closePath();

    ctx.fillStyle="#d4c59a";
    ctx.fill();

    /*
       Destello durante ataque.
    */

    if(attacking){

        ctx.strokeStyle=
            "rgba(239,205,105,.85)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            -100,
            95,
            -.95,
            .15
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   PARTICLES RENDER
========================================================= */

function renderParticles(){

    for(const p of particles){

        const projected=projectSprite({
            x:p.x,
            y:p.y
        });

        if(!projected)continue;

        const alpha=
            clamp(p.life/p.maxLife,0,1);

        ctx.fillStyle=
            p.type==="ability"?
            "rgba(245,205,91,"+alpha+")":
            p.type==="ally"?
            "rgba(115,200,255,"+alpha+")":
            "rgba(255,220,120,"+alpha+")";

        const size=
            Math.max(2,projected.size*.025);

        ctx.beginPath();

        ctx.arc(
            projected.x,
            projected.y-
                projected.size*.25,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================================================
   MINIMAP
========================================================= */

function renderMinimap(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,0,mw,mh
    );

    /*
       Fondo.
    */

    mctx.fillStyle="#120e0a";

    mctx.fillRect(
        0,0,mw,mh
    );

    if(!map.length)return;

    const scale=Math.min(
        mw/mapW,
        mh/mapH
    );

    const ox=
        (mw-mapW*scale)/2;

    const oy=
        (mh-mapH*scale)/2;

    /*
       Mapa COMPLETO.
    */

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            const t=map[y][x];

            if(t===WALL){
                mctx.fillStyle="#3d3023";
            }
            else if(t===DOOR){
                mctx.fillStyle="#d5a63e";
            }
            else{
                mctx.fillStyle="#b48b55";
            }

            mctx.fillRect(
                ox+x*scale,
                oy+y*scale,
                Math.ceil(scale)+.3,
                Math.ceil(scale)+.3
            );
        }
    }

    /*
       Puerta.
    */

    mctx.fillStyle="#f0ca62";

    mctx.fillRect(
        ox+door.x*scale,
        oy+door.y*scale,
        Math.max(2,scale*1.5),
        Math.max(2,scale*1.5)
    );

    /*
       Enemigos.
    */

    for(const e of enemies){

        if(e.hp<=0)continue;

        mctx.fillStyle="#d64c42";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(1.5,scale*1.1),
            0,Math.PI*2
        );

        mctx.fill();
    }

    /*
       Guardián.
    */

    if(guardian.active){

        mctx.fillStyle="#59b7d6";

        mctx.beginPath();

        mctx.arc(
            ox+guardian.x*scale,
            oy+guardian.y*scale,
            Math.max(2,scale*1.3),
            0,Math.PI*2
        );

        mctx.fill();
    }

    /*
       Jugador.
    */

    mctx.fillStyle="#fff0a0";

    mctx.beginPath();

    mctx.arc(
        ox+player.x*scale,
        oy+player.y*scale,
        Math.max(2,scale*1.5),
        0,Math.PI*2
    );

    mctx.fill();

    /*
       Dirección.
    */

    mctx.strokeStyle="#fff0a0";
    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(
        ox+player.x*scale,
        oy+player.y*scale
    );

    mctx.lineTo(
        ox+
        (player.x+
        Math.cos(player.angle)*2)*scale,

        oy+
        (player.y+
        Math.sin(player.angle)*2)*scale
    );

    mctx.stroke();
}

/* =========================================================
   TOUCH JOYSTICK
========================================================= */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

const joy={
    active:false,
    x:0,
    y:0,
    id:null
};

function updateJoystick(clientX,clientY){

    const rect=
        joystick.getBoundingClientRect();

    const cx=
        rect.left+rect.width/2;

    const cy=
        rect.top+rect.height/2;

    let dx=clientX-cx;
    let dy=clientY-cy;

    const max=
        rect.width*.34;

    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=
        "calc(50% + "+dx+"px)";

    stick.style.top=
        "calc(50% + "+dy+"px)";

    joy.x=dx/max;
    joy.y=dy/max;
}

function resetJoystick(){

    joy.active=false;
    joy.x=0;
    joy.y=0;
    joy.id=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joy.active=true;
        joy.id=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            joy.active &&
            e.pointerId===joy.id
        ){

            updateJoystick(
                e.clientX,
                e.clientY
            );
        }
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

    "pointerdown",
    e=>{
        e.preventDefault();

        const keys=
            Object.keys(gods);

        const i=
            keys.indexOf(selectedGod);

        selectedGod=
            keys[(i+1)%keys.length];

        document.querySelectorAll(
            ".godCard"
        ).forEach(c=>{
            c.classList.toggle(
                "selected",
                c.dataset.god===selectedGod
            );
        });

        applyGod();
    }
);

/* =========================================================
   DESKTOP
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()]=true;

        if(e.key===" "){
            attack();
        }

        if(e.key.toLowerCase()==="e"){
            useAbility();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);

/*
   Ratón:
   mantener botón izquierdo = ataque.
*/

canvas.addEventListener(
    "pointerdown",
    e=>{
        if(gameRunning){
            attack();
        }
    }
);

/* =========================================================
   CAMERA / CONTROL
========================================================= */

let lookPointer=null;
let lastLookX=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.clientX<
            window.innerWidth*.45
        )return;

        lookPointer=e.pointerId;
        lastLookX=e.clientX;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            lookPointer!==e.pointerId
        )return;

        const dx=
            e.clientX-lastLookX;

        lastLookX=e.clientX;

        player.angle+=dx*.006;
    }
);

canvas.addEventListener(
    "pointerup",
    e=>{

        if(
            lookPointer===e.pointerId
        ){
            lookPointer=null;
        }
    }
);

/* =========================================================
   GAME LOOP
========================================================= */

let gameRunning=false;
let currentRooms=[];
let lastTime=0;

function update(dt){

    if(!gameRunning)return;

    player.attackCooldown=
        Math.max(
            0,
            player.attackCooldown-dt
        );

    player.attackTime=
        Math.max(
            0,
            player.attackTime-dt
        );

    doorCooldown=
        Math.max(
            0,
            doorCooldown-dt
        );

    let forward=0;
    let strafe=0;

    /*
       Joystick:
       arriba = avanzar
       abajo = retroceder
       izquierda/derecha = giro
    */

    if(joy.active){

        forward=-joy.y;

        /*
           Giro con el eje X.
        */

        player.angle+=
            joy.x*dt*2.8;
    }

    /*
       WASD.
    */

    if(keys["w"])forward+=1;
    if(keys["s"])forward-=1;

    if(keys["a"])strafe-=1;
    if(keys["d"])strafe+=1;

    const length=
        Math.hypot(forward,strafe);

    if(length>1){

        forward/=length;
        strafe/=length;
    }

    const speed=
        player.speed*dt;

    const dx=
        (
            Math.cos(player.angle)*forward-
            Math.sin(player.angle)*strafe
        )*speed;

    const dy=
        (
            Math.sin(player.angle)*forward+
            Math.cos(player.angle)*strafe
        )*speed;

    movePlayer(dx,dy);

    updateEnemies(dt);
    updateGuardian(dt);
    updateParticles(dt);

    checkDoor();

    updateHUD();
}

/* =========================================================
   CROSSHAIR
========================================================= */

function renderCrosshair(){

    const cx=W/2;
    const cy=H*.46;

    ctx.strokeStyle=
        "rgba(255,245,210,.9)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(cx-8,cy);
    ctx.lineTo(cx-2,cy);

    ctx.moveTo(cx+2,cy);
    ctx.lineTo(cx+8,cy);

    ctx.moveTo(cx,cy-8);
    ctx.lineTo(cx,cy-2);

    ctx.moveTo(cx,cy+2);
    ctx.lineTo(cx,cy+8);

    ctx.stroke();
}

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

    renderWorld();

    renderCrosshair();

    renderMinimap();
}

function loop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000||0
        );

    lastTime=time;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   START
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        gameRunning=true;

        generateMap();

        );

        applyGod();

        /*

           El guardián no existe automáticamente.
           Es invocado aquí junto al jugador.
        */

        addMessage(

        );

        addMessage(

        );

        addMessage(
            "Usa el joystick para moverte."
        );

        addMessage(
            "La puerta está integrada en un muro."
        );
    }
);

document.getElementById(

updateHUD();
