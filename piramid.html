
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PSYCHEDELIC LABYRINTH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#view{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transition:filter .08s linear;
}

#hud{
    position:absolute;
    inset:0;
    color:white;
    pointer-events:none;
}

#topBar{
    position:absolute;
    left:14px;
    right:200px;
    top:12px;
    height:65px;
    display:flex;
    gap:15px;
}

.stat{
    flex:1;
    max-width:300px;
}

.statTitle{
    font-size:10px;
    letter-spacing:4px;
    margin-bottom:5px;
    opacity:.8;
}

.bar{
    height:13px;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.45);
    overflow:hidden;
}

.barFill{
    height:100%;
    width:100%;
}

#hpFill{
    background:linear-gradient(
        90deg,
        #ff003c,
        #ff00cc,
        #00ffff
    );
}

#xpFill{
    background:linear-gradient(
        90deg,
        #00ffff,
        #5b00ff,
        #ff00ff
    );
}

#levelText{
    position:absolute;
    margin-top:-13px;
    right:6px;
    font-size:9px;
    letter-spacing:2px;
}

#stats{
    position:absolute;
    left:14px;
    top:88px;
    font-size:9px;
    line-height:17px;
    letter-spacing:1px;
    text-shadow:0 0 8px #000;
}

/* =========================================================
   MINIMAPA
   ========================================================= */

#miniMap{
    position:absolute;
    right:14px;
    top:12px;
    width:170px;
    height:170px;
    border:1px solid rgba(0,255,255,.7);
    background:rgba(0,0,15,.65);
    box-shadow:
        0 0 15px rgba(0,255,255,.25),
        inset 0 0 25px rgba(0,0,0,.8);
}

#mapCanvas{
    width:100%;
    height:100%;
}

/* =========================================================
   CRUCETA
   ========================================================= */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:25px;
    height:25px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 8px #fff;
}

#crosshair:before{
    width:23px;
    height:2px;
    left:1px;
    top:11px;
}

#crosshair:after{
    width:2px;
    height:23px;
    left:11px;
    top:1px;
}

/* =========================================================
   D-PAD
   ========================================================= */

#dpad{
    position:absolute;
    left:25px;
    bottom:28px;
    width:155px;
    height:155px;
    pointer-events:auto;
}

.padCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:70px;
    height:70px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.35);
    border-radius:50%;
    background:rgba(0,0,0,.25);
}

.padLine{
    position:absolute;
    background:rgba(255,255,255,.25);
}

.padLine.v{
    width:2px;
    height:130px;
    left:76px;
    top:12px;
}

.padLine.h{
    height:2px;
    width:130px;
    left:12px;
    top:76px;
}

.padBtn{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:21px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(5,0,20,.5);
    box-shadow:0 0 12px rgba(255,0,255,.2);
}

.padBtn.active{
    transform:scale(.88);
    background:rgba(255,255,255,.25);
    box-shadow:0 0 25px #fff;
}

#forward{
    left:48px;
    top:0;
}

#back{
    left:48px;
    bottom:0;
}

#turnLeft{
    left:0;
    top:48px;
}

#turnRight{
    right:0;
    top:48px;
}

/* =========================================================
   BOTONES
   ========================================================= */

#actions{
    position:absolute;
    right:22px;
    bottom:27px;
    width:185px;
    height:185px;
    pointer-events:none;
}

.action{
    position:absolute;
    width:68px;
    height:68px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,.45);
    background:rgba(10,0,25,.5);
    color:white;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 0 15px rgba(255,0,255,.2);
    pointer-events:auto;
}

.action small{
    position:absolute;
    bottom:6px;
    font-size:7px;
    letter-spacing:1px;
    opacity:.65;
}

.action.active{
    transform:scale(.84);
    background:rgba(255,255,255,.3);
    box-shadow:0 0 30px white;
}

#btnA{
    right:58px;
    top:0;
}

#btnB{
    right:0;
    top:58px;
}

#btnC{
    right:58px;
    bottom:0;
}

#btnD{
    left:0;
    top:58px;
}

/* =========================================================
   MENSAJES
   ========================================================= */

#message{
    position:absolute;
    left:50%;
    top:27%;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    transition:.25s;
    text-shadow:
        0 0 10px #000,
        0 0 30px #ff00ff;
}

#message.show{
    opacity:1;
}

#message h1{
    font-size:30px;
    letter-spacing:8px;
}

#message p{
    margin-top:10px;
    font-size:10px;
    letter-spacing:3px;
}

/* =========================================================
   EFECTOS
   ========================================================= */

#flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    mix-blend-mode:screen;
}

#vignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.18) 70%,
            rgba(0,0,0,.8) 100%
        );
}

#scanlines{
    position:absolute;
    inset:0;
    opacity:.045;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            white 3px
        );
}

@media(max-width:700px){

    #topBar{
        right:130px;
        height:55px;
    }

    #miniMap{
        width:105px;
        height:105px;
        top:73px;
    }

    #stats{
        top:65px;
        font-size:8px;
    }

    #dpad{
        left:5px;
        bottom:12px;
        transform:scale(.82);
        transform-origin:left bottom;
    }

    #actions{
        right:3px;
        bottom:10px;
        transform:scale(.82);
        transform-origin:right bottom;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="view"></canvas>

<div id="hud">

    <div id="topBar">

        <div class="stat">
            <div class="statTitle">VIDA</div>
            <div class="bar">
                <div id="hpFill" class="barFill"></div>
            </div>
        </div>

        <div class="stat">
            <div class="statTitle">NIVEL</div>
            <div class="bar">
                <div id="xpFill" class="barFill"></div>
                <div id="levelText">NIV 1</div>
            </div>
        </div>

    </div>

    <div id="stats">
        EXP: <span id="xpText">0</span><br>
        OBJETOS: <span id="objectsText">0</span><br>
        LABERINTOS: <span id="mazesText">0</span><br>
        TIEMPO: <span id="timeText">00:00</span>
    </div>

    <div id="miniMap">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div id="crosshair"></div>

    <div id="message">
        <h1 id="messageTitle"></h1>
        <p id="messageText"></p>
    </div>

    <!-- =====================================================
         CONTROLES
         ===================================================== -->

    <div id="dpad">

        <div class="padCenter"></div>

        <div class="padLine v"></div>
        <div class="padLine h"></div>

        <div class="padBtn" id="forward">▲</div>
        <div class="padBtn" id="back">▼</div>
        <div class="padBtn" id="turnLeft">◀</div>
        <div class="padBtn" id="turnRight">▶</div>

    </div>

    <div id="actions">

        <div class="action" id="btnA">
            ↑
            <small>SALTO</small>
        </div>

        <div class="action" id="btnB">
            »
            <small>DASH</small>
        </div>

        <div class="action" id="btnC">
            ◎
            <small>PULSO</small>
        </div>

        <div class="action" id="btnD">
            ✦
            <small>IMÁN</small>
        </div>

    </div>

    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="scanlines"></div>

</div>
</div>

<script>
"use strict";

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const CFG={

    FOV:Math.PI/3,

    RAYS:360,

    MAX_DEPTH:40,

    WALK_SPEED:4.8,

    ACCELERATION:13,

    FRICTION:9,

    TURN_SPEED:2.7,

    GRAVITY:19,

    JUMP_FORCE:7.2,

    DASH_SPEED:14,

    DASH_TIME:.20,

    DASH_COOLDOWN:.9,

    XP_OBJECT:25,

    XP_BASE:100,

    BASE_SIZE:15,

    SIZE_PER_LEVEL:2,

    MAX_SIZE:31,

    PICKUP_DISTANCE:.62,

    EXIT_DISTANCE:.68,

    SAVE_KEY:"PSYCHEDELIC_LABYRINTH_V3"
};


/* ============================================================
   PALETAS POR NIVEL
   Cada nivel posee una identidad visual diferente.
   ============================================================ */

const PALETTES=[

    {
        name:"NEON DREAM",
        a:300,
        b:180,
        c:40
    },

    {
        name:"ACID OCEAN",
        a:175,
        b:270,
        c:90
    },

    {
        name:"ULTRAVIOLET",
        a:265,
        b:320,
        c:190
    },

    {
        name:"MAGENTA VOID",
        a:320,
        b:20,
        c:230
    },

    {
        name:"COSMIC FIRE",
        a:20,
        b:60,
        c:280
    },

    {
        name:"TOXIC DREAM",
        a:105,
        b:180,
        c:300
    },

    {
        name:"HYPERSPACE",
        a:210,
        b:340,
        c:40
    },

    {
        name:"CHAOS",
        a:45,
        b:170,
        c:285
    }
];

function palette(){

    return PALETTES[
        (save.level-1)%
        PALETTES.length
    ];
}


/* ============================================================
   CANVAS
   ============================================================ */

const canvas=
    document.getElementById("view");

const ctx=
    canvas.getContext("2d");

const mapCanvas=
    document.getElementById("mapCanvas");

const mapCtx=
    mapCanvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=Math.max(
        480,
        Math.floor(innerWidth*.8)
    );

    H=Math.max(
        270,
        Math.floor(innerHeight*.8)
    );

    canvas.width=W;
    canvas.height=H;

    mapCanvas.width=340;
    mapCanvas.height=340;
}

addEventListener(
    "resize",
    resize
);

resize();


/* ============================================================
   GUARDADO
   ============================================================ */

const DEFAULT_SAVE={

    level:1,

    xp:0,

    totalXP:0,

    completedMazes:0,

    totalTime:0,

    totalObjects:0
};

function loadSave(){

    try{

        const saved=
            JSON.parse(
                localStorage.getItem(
                    CFG.SAVE_KEY
                )
            );

        return {
            ...DEFAULT_SAVE,
            ...(saved||{})
        };

    }catch(e){

        return {
            ...DEFAULT_SAVE
        };
    }
}

let save=loadSave();


function saveGame(){

    localStorage.setItem(
        CFG.SAVE_KEY,
        JSON.stringify(save)
    );
}


/* ============================================================
   JUGADOR
   ============================================================ */

const player={

    x:1.5,

    y:1.5,

    angle:0,

    vx:0,

    vy:0,

    /*
       z es la altura REAL de los pies
       respecto al suelo.
    */

    z:0,

    vz:0,

    grounded:true,

    health:100,

    dashTimer:0,

    dashCooldown:0,

    pulse:0,

    magnet:false,

    moveInput:0,

    turnInput:0
};


/* ============================================================
   LABERINTO
   ============================================================ */

let maze=[];

let mazeW=0;

let mazeH=0;

let objects=[];

let exit={

    x:0,

    y:0
};

let spawn={

    x:0,

    y:0
};

let levelTime=0;

let currentLevelObjects=0;


/* ============================================================
   GENERACIÓN PROCEDURAL
   ============================================================ */

function generateMaze(level){

    /*
       Tamaño impar.
       A mayor nivel, mayor laberinto.
    */

    let size=
        CFG.BASE_SIZE+
        (level-1)*
        CFG.SIZE_PER_LEVEL;

    size=
        Math.min(
            CFG.MAX_SIZE,
            size
        );

    if(size%2===0)
        size++;

    mazeW=size;
    mazeH=size;

    maze=
        Array.from(
            {length:mazeH},
            ()=>Array(
                mazeW
            ).fill(1)
        );


    /*
       DFS / Recursive Backtracker.
    */

    const stack=[];

    function carve(x,y){

        maze[y][x]=0;

        stack.push([x,y]);

        while(stack.length){

            const current=
                stack[
                    stack.length-1
                ];

            const cx=current[0];
            const cy=current[1];

            const dirs=[

                [2,0],
                [-2,0],
                [0,2],
                [0,-2]

            ];

            /*
               Mezcla las direcciones.
            */

            for(
                let i=dirs.length-1;
                i>0;
                i--
            ){

                const j=
                    Math.floor(
                        Math.random()*
                        (i+1)
                    );

                [
                    dirs[i],
                    dirs[j]
                ]=[
                    dirs[j],
                    dirs[i]
                ];
            }

            let carved=false;

            for(const d of dirs){

                const nx=
                    cx+d[0];

                const ny=
                    cy+d[1];

                if(
                    nx>0 &&
                    nx<mazeW-1 &&
                    ny>0 &&
                    ny<mazeH-1 &&
                    maze[ny][nx]===1
                ){

                    maze[
                        cy+d[1]/2
                    ][
                        cx+d[0]/2
                    ]=0;

                    carve(nx,ny);

                    carved=true;

                    break;
                }
            }

            if(!carved)
                stack.pop();
        }
    }

    carve(1,1);


    /*
       ========================================================
       NUEVO SISTEMA DE SPAWN Y SALIDA
       ========================================================

       NO se utilizan posiciones fijas.

       Se obtiene la lista completa de celdas transitables.
       Después se escogen dos puntos aleatorios.

       Pueden:
       - estar lejos
       - estar relativamente cerca
       - estar en extremos diferentes
       - quedar separados por una pared
       
       Lo importante es que ambos estén dentro del laberinto
       y que el jugador deba encontrar el recorrido.
    */

    const free=[];

    for(
        let y=1;
        y<mazeH-1;
        y++
    ){

        for(
            let x=1;
            x<mazeW-1;
            x++
        ){

            if(
                maze[y][x]===0
            ){

                free.push({
                    x,
                    y
                });
            }
        }
    }


    /*
       Spawn aleatorio.
    */

    const start=
        free[
            Math.floor(
                Math.random()*
                free.length
            )
        ];


    /*
       Salida aleatoria independiente.
       NO se fuerza una distancia mínima.
       Así pueden quedar juntas pero separadas
       por paredes.
    */

    let end=
        free[
            Math.floor(
                Math.random()*
                free.length
            )
        ];

    /*
       Evitamos exactamente la misma celda.
    */

    let safety=0;

    while(
        end.x===start.x &&
        end.y===start.y &&
        safety++<100
    ){

        end=
            free[
                Math.floor(
                    Math.random()*
                    free.length
                )
            ];
    }


    spawn.x=start.x+.5;
    spawn.y=start.y+.5;

    exit.x=end.x+.5;
    exit.y=end.y+.5;


    /*
       Posición inicial.
    */

    player.x=spawn.x;
    player.y=spawn.y;

    /*
       Dirección inicial aleatoria.
    */

    player.angle=
        Math.random()*
        Math.PI*2;

    player.vx=0;
    player.vy=0;

    player.z=0;
    player.vz=0;

    player.grounded=true;

    generateObjects(level);

    levelTime=0;

    showMessage(
        "NIVEL "+level,
        palette().name
    );
}


/* ============================================================
   OBJETOS
   ============================================================ */

function generateObjects(level){

    objects=[];

    const amount=
        Math.min(
            5+
            level*2,
            40
        );

    const occupied=[];

    /*
       Spawn y salida no reciben objetos.
    */

    occupied.push({
        x:Math.floor(player.x),
        y:Math.floor(player.y)
    });

    occupied.push({
        x:Math.floor(exit.x),
        y:Math.floor(exit.y)
    });

    let attempts=0;

    while(
        objects.length<amount &&
        attempts<5000
    ){

        attempts++;

        const x=
            Math.floor(
                Math.random()*
                (mazeW-2)
            )+1;

        const y=
            Math.floor(
                Math.random()*
                (mazeH-2)
            )+1;

        if(
            maze[y][x]!==0
        ) continue;

        let used=false;

        for(const p of occupied){

            if(
                p.x===x &&
                p.y===y
            ){

                used=true;
                break;
            }
        }

        if(used) continue;

        let near=false;

        for(const o of objects){

            if(
                Math.hypot(
                    o.x-(x+.5),
                    o.y-(y+.5)
                )<1.5
            ){

                near=true;
                break;
            }
        }

        if(near) continue;

        objects.push({

            x:x+.5,

            y:y+.5,

            z:.6,

            phase:
                Math.random()*
                Math.PI*2,

            rot:
                Math.random()*
                Math.PI*2,

            vx:0,

            vy:0,

            value:CFG.XP_OBJECT
        });
    }

    currentLevelObjects=0;
}


/* ============================================================
   COLISIÓN
   ============================================================ */

function isWall(x,y){

    const mx=Math.floor(x);
    const my=Math.floor(y);

    if(
        mx<0 ||
        my<0 ||
        mx>=mazeW ||
        my>=mazeH
    )
        return true;

    return maze[my][mx]===1;
}


function canMove(x,y){

    const r=.22;

    return (
        !isWall(x-r,y-r)&&
        !isWall(x+r,y-r)&&
        !isWall(x-r,y+r)&&
        !isWall(x+r,y+r)
    );
}


function movePlayer(dx,dy){

    const nx=
        player.x+dx;

    const ny=
        player.y+dy;

    if(
        canMove(nx,player.y)
    ){

        player.x=nx;
    }

    if(
        canMove(player.x,ny)
    ){

        player.y=ny;
    }
}


/* ============================================================
   INPUT TECLADO
   ============================================================ */

const keys={};

addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="Space"
        )
            actionJump();

        if(
            e.code==="ShiftLeft"
        )
            actionDash();

        if(
            e.code==="KeyE"
        )
            actionPulse();

        if(
            e.code==="KeyQ"
        )
            actionMagnet();
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* ============================================================
   CONTROLES TÁCTILES
   ============================================================ */

function bindHold(id,callback){

    const el=
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            el.classList.add("active");

            callback(true);
        }
    );

    function release(e){

        e.preventDefault();

        el.classList.remove("active");

        callback(false);
    }

    el.addEventListener(
        "pointerup",
        release
    );

    el.addEventListener(
        "pointercancel",
        release
    );

    el.addEventListener(
        "pointerleave",
        release
    );
}

bindHold(
    "forward",
    active=>{
        player.moveInput=
            active?1:0;
    }
);

bindHold(
    "back",
    active=>{
        player.moveInput=
            active?-1:0;
    }
);

bindHold(
    "turnLeft",
    active=>{
        player.turnInput=
            active?-1:0;
    }
);

bindHold(
    "turnRight",
    active=>{
        player.turnInput=
            active?1:0;
    }
);


function bindAction(id,fn){

    const el=
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            el.classList.add("active");

            fn();

            setTimeout(
                ()=>{
                    el.classList.remove(
                        "active"
                    );
                },
                150
            );
        }
    );
}

bindAction(
    "btnA",
    actionJump
);

bindAction(
    "btnB",
    actionDash
);

bindAction(
    "btnC",
    actionPulse
);

bindAction(
    "btnD",
    actionMagnet
);


/* ============================================================
   ACCIONES
   ============================================================ */

function actionJump(){

    if(
        !player.grounded
    )
        return;

    player.vz=
        CFG.JUMP_FORCE;

    player.grounded=false;

    flash(.25);
}


function actionDash(){

    if(
        player.dashCooldown>0
    )
        return;

    player.dashTimer=
        CFG.DASH_TIME;

    player.dashCooldown=
        CFG.DASH_COOLDOWN;

    flash(.4);
}


function actionPulse(){

    player.pulse=.6;

    flash(.55);

    for(const o of objects){

        const dx=
            o.x-player.x;

        const dy=
            o.y-player.y;

        const d=
            Math.hypot(dx,dy);

        if(
            d<4
        ){

            o.vx+=
                dx/
                Math.max(d,.01)*
                3;

            o.vy+=
                dy/
                Math.max(d,.01)*
                3;
        }
    }
}


function actionMagnet(){

    player.magnet=
        !player.magnet;

    flash(.18);
}


/* ============================================================
   MOVIMIENTO
   ============================================================ */

function updateMovement(dt){

    let move=
        player.moveInput;

    let turn=
        player.turnInput;

    if(keys["KeyW"])
        move=1;

    if(keys["KeyS"])
        move=-1;

    if(keys["KeyA"])
        turn=-1;

    if(keys["KeyD"])
        turn=1;


    /*
       Giro.
    */

    player.angle+=
        turn*
        CFG.TURN_SPEED*
        dt;


    /*
       Movimiento hacia donde mira.
    */

    const dx=
        Math.cos(player.angle)*
        move;

    const dy=
        Math.sin(player.angle)*
        move;

    const targetVX=
        dx*CFG.WALK_SPEED;

    const targetVY=
        dy*CFG.WALK_SPEED;


    /*
       Aceleración flotante.
    */

    const acceleration=
        Math.min(
            1,
            CFG.ACCELERATION*dt
        );

    player.vx+=
        (
            targetVX-
            player.vx
        )*
        acceleration;

    player.vy+=
        (
            targetVY-
            player.vy
        )*
        acceleration;


    /*
       Fricción.
    */

    if(
        move===0
    ){

        const friction=
            Math.exp(
                -CFG.FRICTION*dt
            );

        player.vx*=friction;
        player.vy*=friction;
    }


    /*
       DASH.
    */

    if(
        player.dashTimer>0
    ){

        player.dashTimer-=dt;

        player.vx=
            Math.cos(
                player.angle
            )*
            CFG.DASH_SPEED;

        player.vy=
            Math.sin(
                player.angle
            )*
            CFG.DASH_SPEED;
    }


    if(
        player.dashCooldown>0
    ){

        player.dashCooldown-=dt;
    }


    movePlayer(
        player.vx*dt,
        player.vy*dt
    );


    /*
       ========================================================
       FÍSICA DEL SALTO
       ========================================================

       z = altura del jugador.

       Al saltar:
       vz positivo.

       Durante la caída:
       gravedad reduce vz.

       El render utiliza z para desplazar
       la cámara completa.
    */

    player.vz-=
        CFG.GRAVITY*dt;

    player.z+=
        player.vz*dt;

    if(
        player.z<=0
    ){

        player.z=0;

        player.vz=0;

        player.grounded=true;
    }
}


/* ============================================================
   RAYCAST
   ============================================================ */

const zBuffer=[];

function castRay(angle){

    const sin=
        Math.sin(angle);

    const cos=
        Math.cos(angle);

    let distance=0;

    const step=.025;

    let hitX=player.x;

    let hitY=player.y;

    while(
        distance<CFG.MAX_DEPTH
    ){

        distance+=step;

        hitX=
            player.x+
            cos*distance;

        hitY=
            player.y+
            sin*distance;

        if(
            isWall(
                hitX,
                hitY
            )
        ){

            return {
                distance,
                x:hitX,
                y:hitY
            };
        }
    }

    return {
        distance:CFG.MAX_DEPTH,
        x:hitX,
        y:hitY
    };
}


/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */

function render(){

    const pal=palette();

    /*
       ========================================================
       CÁMARA
       ========================================================

       Esta es la corrección importante del salto.

       Si el jugador sube:
           player.z aumenta.

       La cámara se eleva.

       El horizonte baja en pantalla.

       Esto hace que el salto tenga una relación visual
       coherente con el mundo.
    */

    const cameraBob=
        Math.sin(time*14)*
        Math.min(
            .7,
            Math.abs(player.vz)*
            .025
        );

    const cameraHeight=
        player.z+
        cameraBob;

    /*
       Desplazamiento vertical de cámara.
    */

    const horizon=
        H*.5+
        cameraHeight*85;


    /* ========================================================
       CIELO NEBULOSO
       ======================================================== */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon
        );

    const hue=
        (
            pal.a+
            time*18+
            save.level*31
        )%360;

    sky.addColorStop(
        0,
        `hsl(
            ${hue},
            100%,
            6%
        )`
    );

    sky.addColorStop(
        .35,
        `hsl(
            ${(hue+pal.b)%360},
            100%,
            17%
        )`
    );

    sky.addColorStop(
        1,
        `hsl(
            ${(hue+pal.c)%360},
            100%,
            10%
        )`
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );


    /*
       Nebulosa animada.
    */

    ctx.save();

    ctx.globalAlpha=.15;

    for(
        let i=0;
        i<8;
        i++
    ){

        const nx=
            W*.5+
            Math.sin(
                time*.2+i*2
            )*
            W*.4;

        const ny=
            horizon*.35+
            Math.cos(
                time*.17+i
            )*
            H*.18;

        const radius=
            80+
            i*35;

        const g=
            ctx.createRadialGradient(
                nx,
                ny,
                0,
                nx,
                ny,
                radius
            );

        g.addColorStop(
            0,
            `hsla(
                ${(hue+i*45)%360},
                100%,
                65%,
                .8
            )`
        );

        g.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            nx,
            ny,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();


    /* ========================================================
       SUELO
       ======================================================== */

    const floor=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    floor.addColorStop(
        0,
        `hsl(
            ${(hue+pal.b)%360},
            100%,
            9%
        )`
    );

    floor.addColorStop(
        1,
        `hsl(
            ${(hue+pal.c)%360},
            100%,
            3%
        )`
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /* ========================================================
       RAYOS
       ======================================================== */

    for(
        let i=0;
        i<CFG.RAYS;
        i++
    ){

        const cameraX=
            i/
            (CFG.RAYS-1);

        const rayAngle=
            player.angle-
            CFG.FOV/2+
            cameraX*
            CFG.FOV;

        const ray=
            castRay(rayAngle);

        const corrected=
            ray.distance*
            Math.cos(
                rayAngle-
                player.angle
            );

        zBuffer[i]=corrected;

        const wallHeight=
            H/
            Math.max(
                corrected,
                .001
            );

        /*
           Importante:
           el muro está centrado en el horizonte
           de la cámara, no en H/2.

           Esto hace que el salto cambie realmente
           la perspectiva.
        */

        const top=
            horizon-
            wallHeight*.5;

        const bottom=
            horizon+
            wallHeight*.5;


        /*
           Textura procedural.
        */

        const tex=
            (
                ray.x+
                ray.y*.71
            )%1;

        const wave=
            Math.sin(
                tex*28+
                time*3+
                corrected*2
            );

        const wallHue=
            (
                hue+
                tex*240+
                wave*45+
                corrected*9
            )%360;

        const light=
            40+
            wave*12;

        ctx.fillStyle=
            `hsl(
                ${wallHue},
                100%,
                ${light}%
            )`;

        ctx.fillRect(
            cameraX*W,
            top,
            W/CFG.RAYS+1,
            bottom-top
        );


        /*
           Franjas de textura.
        */

        const stripe=
            Math.sin(
                ray.distance*5+
                tex*30+
                time*2
            );

        if(
            stripe>.35
        ){

            ctx.fillStyle=
                `hsla(
                    ${(wallHue+70)%360},
                    100%,
                    75%,
                    .18
                )`;

            ctx.fillRect(
                cameraX*W,
                top,
                W/CFG.RAYS+1,
                3
            );
        }
    }


    renderVortex(
        horizon,
        hue
    );

    renderObjects(
        horizon
    );

    renderExit(
        horizon
    );


    /*
       Pulso visual.
    */

    if(
        player.pulse>0
    ){

        ctx.save();

        ctx.globalAlpha=
            player.pulse*.25;

        ctx.strokeStyle=
            `hsl(
                ${(hue+100)%360},
                100%,
                80%
            )`;

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            W/2,
            horizon,
            (1-player.pulse)*650,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* ============================================================
   VÓRTICE DEL SUELO
   ============================================================ */

function renderVortex(
    horizon,
    baseHue
){

    ctx.save();

    ctx.globalAlpha=.28;

    const cx=W/2;

    const cy=horizon;

    for(
        let i=1;
        i<18;
        i++
    ){

        const radius=
            i*75+
            (
                time*55
            )%75;

        ctx.strokeStyle=
            `hsl(
                ${(baseHue+i*29)%360},
                100%,
                60%
            )`;

        ctx.lineWidth=
            i%4===0?2:1;

        ctx.beginPath();

        for(
            let a=0;
            a<Math.PI*2;
            a+=.12
        ){

            const distortion=
                Math.sin(
                    a*5+
                    time*2+
                    i
                )*
                (
                    10+
                    i*1.4
                );

            const r=
                radius+
                distortion;

            const x=
                cx+
                Math.cos(
                    a+
                    time*.22
                )*
                r;

            const y=
                cy+
                Math.sin(
                    a+
                    time*.22
                )*
                r*.38;

            if(a===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.stroke();
    }

    ctx.restore();
}


/* ============================================================
   OBJETOS
   ============================================================ */

function renderObjects(horizon){

    const list=[];

    for(const o of objects){

        const dx=
            o.x-player.x;

        const dy=
            o.y-player.y;

        const distance=
            Math.hypot(dx,dy);

        let angle=
            Math.atan2(dy,dx)-
            player.angle;

        while(
            angle>Math.PI
        )
            angle-=Math.PI*2;

        while(
            angle<-Math.PI
        )
            angle+=Math.PI*2;

        if(
            Math.abs(angle)>
            CFG.FOV*.75
        )
            continue;

        list.push({
            o,
            distance,
            angle
        });
    }


    list.sort(
        (a,b)=>
            b.distance-
            a.distance
    );


    for(const s of list){

        const o=s.o;

        const screenX=
            W/2+
            Math.tan(s.angle)*
            (
                W/2
            )/
            Math.tan(
                CFG.FOV/2
            );

        const size=
            H/
            Math.max(
                s.distance,
                .1
            )*.65;

        const rayIndex=
            Math.floor(
                screenX/W*
                CFG.RAYS
            );

        if(
            rayIndex>=0 &&
            rayIndex<CFG.RAYS &&
            zBuffer[rayIndex]<
            s.distance
        )
            continue;


        /*
           El objeto también respeta la cámara vertical.
        */

        const objectHeight=
            o.z+
            Math.sin(
                time*3+
                o.phase
            )*.12;

        const y=
            horizon-
            objectHeight*
            55-
            size*.35;


        drawEnergy(
            screenX,
            y,
            size,
            o.rot
        );
    }
}


function drawEnergy(
    x,
    y,
    size,
    rotation
){

    const p=palette();

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation+
        time
    );

    const pulse=
        1+
        Math.sin(
            time*5
        )*.13;

    ctx.scale(
        pulse,
        pulse
    );

    const hue=
        (
            p.a+
            time*100+
            x*.1
        )%360;

    ctx.shadowBlur=25;

    ctx.shadowColor=
        `hsl(
            ${hue},
            100%,
            60%
        )`;

    ctx.strokeStyle=
        `hsl(
            ${hue},
            100%,
            75%
        )`;

    ctx.fillStyle=
        `hsla(
            ${(hue+p.b)%360},
            100%,
            55%,
            .5
        )`;

    ctx.lineWidth=3;

    /*
       Octaedro.
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size*.55
    );

    ctx.lineTo(
        size*.38,
        0
    );

    ctx.lineTo(
        0,
        size*.55
    );

    ctx.lineTo(
        -size*.38,
        0
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size*.55
    );

    ctx.lineTo(
        0,
        size*.55
    );

    ctx.moveTo(
        -size*.38,
        0
    );

    ctx.lineTo(
        size*.38,
        0
    );

    ctx.stroke();

    ctx.restore();
}


/* ============================================================
   SALIDA
   ============================================================ */

function renderExit(horizon){

    const dx=
        exit.x-player.x;

    const dy=
        exit.y-player.y;

    const distance=
        Math.hypot(
            dx,
            dy
        );

    let angle=
        Math.atan2(dy,dx)-
        player.angle;

    while(
        angle>Math.PI
    )
        angle-=Math.PI*2;

    while(
        angle<-Math.PI
    )
        angle+=Math.PI*2;

    if(
        Math.abs(angle)>
        CFG.FOV*.75
    )
        return;

    const screenX=
        W/2+
        Math.tan(angle)*
        (W/2)/
        Math.tan(
            CFG.FOV/2
        );

    const size=
        H/
        Math.max(
            distance,
            .1
        );

    const rayIndex=
        Math.floor(
            screenX/W*
            CFG.RAYS
        );

    if(
        rayIndex>=0 &&
        rayIndex<CFG.RAYS &&
        zBuffer[rayIndex]<
        distance
    )
        return;


    ctx.save();

    ctx.translate(
        screenX,
        horizon-size*.45
    );

    ctx.rotate(
        time*.8
    );

    const p=palette();

    ctx.strokeStyle=
        `hsl(
            ${(p.c+time*100)%360},
            100%,
            70%
        )`;

    ctx.shadowBlur=35;

    ctx.shadowColor=
        ctx.strokeStyle;

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        size*.45,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* ============================================================
   ACTUALIZAR OBJETOS
   ============================================================ */

function updateObjects(dt){

    for(
        let i=objects.length-1;
        i>=0;
        i--
    ){

        const o=objects[i];

        o.rot+=dt;

        o.z=
            .6+
            Math.sin(
                time*3+
                o.phase
            )*.12;


        /*
           IMÁN
        */

        if(player.magnet){

            const dx=
                player.x-o.x;

            const dy=
                player.y-o.y;

            const d=
                Math.hypot(dx,dy);

            if(
                d<5
            ){

                const force=
                    (
                        1-
                        d/5
                    )*8;

                o.vx+=
                    dx/
                    Math.max(d,.01)*
                    force*
                    dt;

                o.vy+=
                    dy/
                    Math.max(d,.01)*
                    force*
                    dt;
            }
        }


        /*
           Física del pulso.
        */

        o.vx*=
            Math.exp(-4*dt);

        o.vy*=
            Math.exp(-4*dt);


        const nx=
            o.x+
            o.vx*dt;

        const ny=
            o.y+
            o.vy*dt;

        if(
            canMove(nx,ny)
        ){

            o.x=nx;
            o.y=ny;
        }


        /*
           Recoger.
        */

        const distance=
            Math.hypot(
                o.x-player.x,
                o.y-player.y
            );

        if(
            distance<
            CFG.PICKUP_DISTANCE
        ){

            collectObject(i);
        }
    }
}


/* ============================================================
   RECOGER
   ============================================================ */

function collectObject(index){

    const o=
        objects[index];

    save.xp+=o.value;

    save.totalXP+=o.value;

    save.totalObjects++;

    currentLevelObjects++;

    objects.splice(
        index,
        1
    );


    checkLevelUp();

    saveGame();

    flash(.12);
}


function xpNeeded(level){

    return Math.floor(
        CFG.XP_BASE*
        Math.pow(
            level,
            1.25
        )
    );
}


function checkLevelUp(){

    let leveled=false;

    while(
        save.xp>=
        xpNeeded(save.level)
    ){

        save.xp-=
            xpNeeded(save.level);

        save.level++;

        leveled=true;
    }

    if(leveled){

        /*
           La nueva paleta aparece inmediatamente.
        */

        showMessage(
            "NIVEL "+save.level,
            palette().name
        );

        flash(1);

        /*
           El nivel también regenera
           un nuevo laberinto.
        */

        generateMaze(
            save.level
        );
    }
}


/* ============================================================
   SALIDA
   ============================================================ */

let transitionLock=false;

function checkExit(){

    if(transitionLock)
        return;

    const distance=
        Math.hypot(
            player.x-exit.x,
            player.y-exit.y
        );

    if(
        distance<
        CFG.EXIT_DISTANCE
    ){

        completeMaze();
    }
}


function completeMaze(){

    transitionLock=true;

    save.totalTime+=
        levelTime;

    save.completedMazes++;


    /*
       Bonus de finalización.
    */

    const bonus=
        50+
        save.level*15;

    save.xp+=bonus;

    save.totalXP+=bonus;


    /*
       La salida puede provocar subida de nivel.
    */

    let leveled=false;

    while(
        save.xp>=
        xpNeeded(save.level)
    ){

        save.xp-=
            xpNeeded(save.level);

        save.level++;

        leveled=true;
    }


    saveGame();

    showMessage(
        "SALIDA",
        "NUEVO LABERINTO"
    );

    flash(1);


    setTimeout(
        ()=>{

            generateMaze(
                save.level
            );

            transitionLock=false;

        },
        1100
    );
}


/* ============================================================
   MINIMAPA
   ============================================================ */

function renderMap(){

    const mw=mapCanvas.width;
    const mh=mapCanvas.height;

    mapCtx.clearRect(
        0,
        0,
        mw,
        mh
    );


    /*
       Fondo.
    */

    mapCtx.fillStyle=
        "rgba(0,0,15,.95)";

    mapCtx.fillRect(
        0,
        0,
        mw,
        mh
    );


    const sx=
        mw/mazeW;

    const sy=
        mh/mazeH;


    /*
       Primero dibujamos todos los corredores
       para que el jugador vea CLARAMENTE
       la estructura completa.
    */

    mapCtx.strokeStyle=
        `hsla(
            ${palette().b},
            100%,
            65%,
            .75
        )`;

    mapCtx.lineWidth=
        Math.max(
            1,
            sx*.18
        );


    for(
        let y=0;
        y<mazeH;
        y++
    ){

        for(
            let x=0;
            x<mazeW;
            x++
        ){

            if(
                maze[y][x]===0
            ){

                mapCtx.strokeRect(
                    x*sx+.5,
                    y*sy+.5,
                    sx-1,
                    sy-1
                );
            }
        }
    }


    /*
       Paredes como líneas.
    */

    mapCtx.strokeStyle=
        `hsla(
            ${palette().a},
            100%,
            75%,
            .7
        )`;

    mapCtx.lineWidth=1;

    for(
        let y=0;
        y<mazeH;
        y++
    ){

        for(
            let x=0;
            x<mazeW;
            x++
        ){

            if(
                maze[y][x]!==1
            )
                continue;

            mapCtx.strokeRect(
                x*sx,
                y*sy,
                sx,
                sy
            );
        }
    }


    /*
       OBJETOS.
    */

    for(
        const o of objects
    ){

        mapCtx.fillStyle=
            "#ff00ff";

        mapCtx.shadowBlur=8;

        mapCtx.shadowColor=
            "#ff00ff";

        mapCtx.beginPath();

        mapCtx.arc(
            o.x*sx,
            o.y*sy,
            Math.max(
                2,
                sx*.25
            ),
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    mapCtx.shadowBlur=0;


    /*
       SALIDA.
    */

    mapCtx.fillStyle=
        "#ffff00";

    mapCtx.shadowBlur=12;

    mapCtx.shadowColor=
        "#ffff00";

    mapCtx.beginPath();

    mapCtx.arc(
        exit.x*sx,
        exit.y*sy,
        Math.max(
            4,
            sx*.42
        ),
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.shadowBlur=0;


    /*
       INICIO.
    */

    mapCtx.strokeStyle=
        "#00ffff";

    mapCtx.lineWidth=2;

    mapCtx.beginPath();

    mapCtx.arc(
        spawn.x*sx,
        spawn.y*sy,
        Math.max(
            4,
            sx*.45
        ),
        0,
        Math.PI*2
    );

    mapCtx.stroke();


    /*
       JUGADOR.
    */

    mapCtx.fillStyle=
        "#ffffff";

    mapCtx.shadowBlur=12;

    mapCtx.shadowColor=
        "#ffffff";

    mapCtx.beginPath();

    mapCtx.arc(
        player.x*sx,
        player.y*sy,
        Math.max(
            3,
            sx*.35
        ),
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.shadowBlur=0;


    /*
       Dirección del jugador.
    */

    mapCtx.strokeStyle=
        "#ffffff";

    mapCtx.lineWidth=1.5;

    mapCtx.beginPath();

    mapCtx.moveTo(
        player.x*sx,
        player.y*sy
    );

    mapCtx.lineTo(
        (
            player.x+
            Math.cos(player.angle)*
            1.5
        )*sx,
        (
            player.y+
            Math.sin(player.angle)*
            1.5
        )*sy
    );

    mapCtx.stroke();
}


/* ============================================================
   HUD
   ============================================================ */

function updateHUD(){

    const need=
        xpNeeded(save.level);

    const percent=
        Math.min(
            100,
            save.xp/
            need*
            100
        );

    document.getElementById(
        "hpFill"
    ).style.width=
        player.health+"%";

    document.getElementById(
        "xpFill"
    ).style.width=
        percent+"%";

    document.getElementById(
        "levelText"
    ).textContent=
        "NIV "+save.level;

    document.getElementById(
        "xpText"
    ).textContent=
        save.xp+
        " / "+
        need;

    document.getElementById(
        "objectsText"
    ).textContent=
        currentLevelObjects;

    document.getElementById(
        "mazesText"
    ).textContent=
        save.completedMazes;

    document.getElementById(
        "timeText"
    ).textContent=
        formatTime(levelTime);
}


function formatTime(seconds){

    seconds=Math.floor(seconds);

    const m=
        Math.floor(
            seconds/60
        );

    const s=
        seconds%60;

    return (
        String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0")
    );
}


/* ============================================================
   MENSAJES
   ============================================================ */

let messageTimer=0;

function showMessage(
    title,
    text
){

    document.getElementById(
        "messageTitle"
    ).textContent=
        title;

    document.getElementById(
        "messageText"
    ).textContent=
        text;

    document.getElementById(
        "message"
    ).classList.add(
        "show"
    );

    messageTimer=2;
}


/* ============================================================
   FLASH
   ============================================================ */

let flashPower=0;

function flash(power){

    flashPower=
        Math.max(
            flashPower,
            power
        );
}


/* ============================================================
   POST PROCESADO
   ============================================================ */

function updatePostProcess(){

    const speed=
        Math.min(
            1,
            Math.hypot(
                player.vx,
                player.vy
            )/
            CFG.DASH_SPEED
        );

    const hueShift=
        (
            Math.sin(
                time*1.6
            )*
            18+
            speed*35+
            save.level*11
        );

    const saturation=
        1.35+
        speed*.7;

    const contrast=
        1.05+
        speed*.25;

    canvas.style.filter=
        `
        hue-rotate(${hueShift}deg)
        saturate(${saturation})
        contrast(${contrast})
        `;


    /*
       Aberración cromática durante el dash.
    */

    if(
        player.dashTimer>0
    ){

        const offset=
            Math.sin(
                time*90
            )*
            2.5;

        canvas.style.transform=
            `
            translateX(${offset}px)
            scale(1.012)
            `;

    }else{

        canvas.style.transform=
            "translateX(0) scale(1)";
    }
}


/* ============================================================
   GAME LOOP
   ============================================================ */

let time=0;

let lastTime=
    performance.now();

function loop(now){

    let dt=
        (
            now-
            lastTime
        )/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    time+=dt;

    levelTime+=dt;

    updateMovement(dt);

    updateObjects(dt);

    checkExit();


    if(
        player.pulse>0
    ){

        player.pulse=
            Math.max(
                0,
                player.pulse-dt
            );
    }


    if(
        flashPower>0
    ){

        flashPower=
            Math.max(
                0,
                flashPower-dt*3
            );
    }


    if(
        messageTimer>0
    ){

        messageTimer-=dt;

        if(
            messageTimer<=0
        ){

            document
                .getElementById(
                    "message"
                )
                .classList.remove(
                    "show"
                );
        }
    }


    document.getElementById(
        "flash"
    ).style.opacity=
        flashPower;


    render();

    renderMap();

    updateHUD();

    updatePostProcess();

    requestAnimationFrame(loop);
}


/* ============================================================
   RECUPERACIÓN DE PESTAÑA
   ============================================================ */

document.addEventListener(
    "visibilitychange",
    ()=>{
        lastTime=
            performance.now();
    }
);


/* ============================================================
   INICIO
   ============================================================ */

generateMaze(
    save.level
);

showMessage(
    "PSYCHEDELIC LABYRINTH",
    "ENCUENTRA EL FINAL"
);

requestAnimationFrame(loop);

</script>
