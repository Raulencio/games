<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pyramid of the Gods 0.2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#15100a;
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   MENÚ
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#ead59e;
    background:
        radial-gradient(
            circle at 50% 35%,
            #715b37,
            #302414 48%,
            #100c08 100%
        );
}

.title{
    text-align:center;
    font-size:clamp(30px,9vw,58px);
    line-height:.9;
    letter-spacing:4px;
    text-shadow:
        0 4px 0 #080604,
        0 0 30px #d6aa5433;
}

.subtitle{
    margin-top:10px;
    font-size:10px;
    letter-spacing:4px;
    color:#c5a96f;
}

.menuBox{
    width:min(94vw,440px);
    margin-top:25px;
    padding:18px;
    border:1px solid #9d7b43;
    border-radius:18px;
    background:#17120de8;
    box-shadow:0 15px 50px #000b;
}

.menuLabel{
    text-align:center;
    font-size:12px;
    margin-bottom:12px;
}

.gods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.godButton{
    min-height:80px;
    border:1px solid #5c482a;
    border-radius:11px;
    background:#2a2116;
    color:#e7d19a;
}

.godButton.selected{
    border-color:#e7bd61;
    background:#594421;
    box-shadow:
        0 0 16px #d7aa4c44,
        inset 0 0 15px #e2bb6422;
}

.glyph{
    display:block;
    font-size:28px;
    line-height:36px;
}

.godButton small{
    font-size:9px;
}

#start{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#c99c48;
    color:#1a1208;
    font-weight:bold;
    font-size:15px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.panel{
    background:#17120dcc;
    border:1px solid #aa884f99;
    border-radius:11px;
    box-shadow:0 4px 18px #0007;
    color:#ecd8a4;
}

#top{
    position:absolute;
    top:7px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

#stats{
    width:min(210px,49vw);
    padding:8px;
    font-size:10px;
}

.hpTrack{
    width:100%;
    height:10px;
    margin:5px 0;
    background:#311816;
    border-radius:5px;
    overflow:hidden;
}

#hpBar{
    height:100%;
    width:100%;
    background:#c34a3c;
}

.xpTrack{
    height:5px;
    background:#292235;
    border-radius:4px;
    overflow:hidden;
}

#xpBar{
    height:100%;
    width:0;
    background:#9572d0;
}

#statLine{
    margin-top:5px;
    font-size:9px;
}

#mapPanel{
    width:min(155px,36vw);
    aspect-ratio:1;
    padding:5px;
}

#mini{
    width:100%;
    height:100%;
}

#godCurrent{
    position:absolute;
    top:95px;
    left:7px;
    padding:7px 10px;
    font-size:10px;
}

#message{
    position:absolute;
    left:50%;
    bottom:125px;
    transform:translateX(-50%);
    width:min(68vw,400px);
    min-height:40px;
    padding:8px;
    text-align:center;
    font-size:11px;
}

/* =========================================================
   BENDICIONES
========================================================= */

#blessingPanel{
    display:none;
    pointer-events:auto;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90vw,380px);
    padding:15px;
    z-index:60;
}

#blessingPanel h3{
    text-align:center;
    margin-bottom:12px;
    font-size:14px;
}

.blessingGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.blessing{
    min-height:68px;
    border-radius:10px;
    border:1px solid #624d2d;
    background:#2c2215;
    color:#e7d29d;
}

.blessing.active{
    border-color:#e5bd62;
    background:#5a4522;
}

.closeBlessing{
    width:100%;
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    border:1px solid #725a32;
    background:#3a2b19;
    color:#ead49b;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    pointer-events:auto;
    position:absolute;
    left:13px;
    bottom:17px;
    width:116px;
    height:116px;
    border-radius:50%;
    border:2px solid #c8aa6c66;
    background:#211a10aa;
}

#stick{
    position:absolute;
    left:32px;
    top:32px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid #ead9aa;
    background:#d1b16a99;
}

/* =========================================================
   BOTONES
========================================================= */

#actions{
    pointer-events:auto;
    position:absolute;
    right:13px;
    bottom:18px;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.action{
    width:61px;
    height:61px;
    border-radius:50%;
    border:2px solid #ae8b4f;
    background:#21190fcc;
    color:#ead49b;
    font-size:11px;
    font-weight:bold;
}

#attack{
    width:76px;
    height:76px;
    font-size:19px;
}

#god{
    border-color:#9b76d1;
}

/* =========================================================
   PAUSA
========================================================= */

#pause{
    pointer-events:auto;
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #a8874d;
    background:#17120dcc;
    color:#ead49c;
}

#pauseScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:80;
    align-items:center;
    justify-content:center;
    background:#0009;
}

.pauseBox{
    width:min(85vw,330px);
    padding:20px;
    text-align:center;
    border-radius:16px;
    background:#21180d;
    border:1px solid #9d7b43;
    color:#ecd6a0;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:9px;
    border:1px solid #71582f;
    background:#43321d;
    color:#ecd6a0;
}

@media(max-height:620px){

    #joystick{
        width:92px;
        height:92px;
        bottom:9px;
    }

    #stick{
        width:40px;
        height:40px;
        left:24px;
        top:24px;
    }

    .action{
        width:52px;
        height:52px;
    }

    #attack{
        width:65px;
        height:65px;
    }

    #message{
        bottom:91px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =======================================================
     MENÚ
======================================================= -->

<div id="menu">

    <div class="title">
        PYRAMID<br>OF THE GODS
    </div>

    <div class="subtitle">
        2.5D MOBILE ADVENTURE
    </div>

    <div class="menuBox">

        <div class="menuLabel">
            BENDICIÓN INICIAL
        </div>

        <div class="gods" id="menuGods">

            <button class="godButton selected" data-god="horus">
                <span class="glyph">𓅃</span>
                <small>HORUS<br>VELOCIDAD</small>

            <button class="godButton" data-god="anubis">

                <small>ANUBIS<br>EVASIÓN</small>
            </button>

            <button class="godButton" data-god="sekhmet">
                <span class="glyph">𓁛</span>
                <small>SEKHMET<br>DAÑO</small>
            </button>

            <button class="godButton" data-god="thoth">
                <span class="glyph">𓅝</span>
                <small>THOTH<br>CRÍTICO</small>
            </button>

            <button class="godButton" data-god="isis">
                <span class="glyph">𓆄</span>
                <small>ISIS<br>VIDA</small>
            </button>

            <button class="godButton" data-god="ra">
                <span class="glyph">𓂀</span>
                <small>RA<br>PODER</small>
            </button>

        </div>

        <button id="start">
            INICIAR EXPEDICIÓN
        </button>

    </div>
</div>

<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div id="top">

        <div id="stats" class="panel">

            <b id="level">NIVEL 1</b>

            <div class="hpTrack">
                <div id="hpBar"></div>
            </div>

            <div class="xpTrack">
                <div id="xpBar"></div>
            </div>

            <div id="statLine">
                VEL 1.00 · EVA 5% · CRIT 5%
            </div>

        </div>

        <div id="mapPanel" class="panel">
            <canvas id="mini"></canvas>
        </div>

    </div>

    <div id="godCurrent" class="panel">
        𓅃 HORUS
    </div>

    <div id="message" class="panel">
        Encuentra la puerta.
    </div>

    <button id="pause">
        Ⅱ
    </button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">

        <button id="god" class="action">
            DIOS
        </button>

        <button id="attack" class="action">
            ⚔
        </button>

    </div>

    <!-- SELECTOR DURANTE EL JUEGO -->

    <div id="blessingPanel" class="panel">

        <h3>
            CAMBIAR BENDICIÓN
        </h3>

        <div class="blessingGrid">

            <button class="blessing" data-god="horus">
                𓅃 HORUS<br>
                <small>Velocidad</small>
            </button>

            <button class="blessing" data-god="anubis">
                𓃢 ANUBIS<br>
                <small>Evasión</small>
            </button>

            <button class="blessing" data-god="sekhmet">
                𓁛 SEKHMET<br>
                <small>Daño</small>
            </button>

            <button class="blessing" data-god="thoth">
                𓅝 THOTH<br>
                <small>Crítico</small>
            </button>

            <button class="blessing" data-god="isis">
                𓆄 ISIS<br>
                <small>Vida</small>
            </button>

            <button class="blessing" data-god="ra">
                𓂀 RA<br>
                <small>Poder</small>
            </button>

        </div>

        <button class="closeBlessing">
            CERRAR
        </button>

    </div>

</div>

<!-- =======================================================
     PAUSA
======================================================= -->

<div id="pauseScreen">

    <div class="pauseBox">

        <h2>PAUSA</h2>

        <button id="resume">
            CONTINUAR
        </button>

        <button id="backMenu">
            MENÚ
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=
    document.getElementById("game");

const ctx=
    canvas.getContext("2d");

const mini=
    document.getElementById("mini");

const mctx=
    mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const TILE=64;

const FOV=Math.PI/3;

let map=[];
let mapW=35;
let mapH=27;

let running=false;
let paused=false;

let enemies=[];

let last=performance.now();

/* =========================================================
   DIOSES
========================================================= */

const GODS={

    horus:{
        name:"HORUS",
        glyph:"𓅃",
        speed:1.18,
        evade:.05,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:100
    },

    anubis:{
        name:"ANUBIS",
        glyph:"𓃢",
        speed:1.04,
        evade:.22,
        damage:1,
        crit:.05,
        critDamage:1.5,
        hp:105
    },

    sekhmet:{
        name:"SEKHMET",
        glyph:"𓁛",
        speed:.99,
        evade:.05,
        damage:1.38,
        crit:.08,
        critDamage:1.8,
        hp:115
    },

    thoth:{
        name:"THOTH",
        glyph:"𓅝",
        speed:1.03,
        evade:.06,
        damage:1,
        crit:.26,
        critDamage:2,
        hp:96
    },

    isis:{
        name:"ISIS",
        glyph:"𓆄",
        speed:1.02,
        evade:.08,
        damage:1,
        crit:.06,
        critDamage:1.5,
        hp:140
    },

    ra:{
        name:"RA",
        glyph:"𓂀",
        speed:1.10,
        evade:.07,
        damage:1.14,
        crit:.10,
        critDamage:1.7,
        hp:106
    }
};

let selectedGod="horus";

/* =========================================================
   PROGRESIÓN
========================================================= */

let save={
    level:1,
    xp:0,
    speed:0,
    evade:0,
    crit:0,
    critDamage:0,
    god:"horus"
};

function loadSave(){

    try{

        const data=
            JSON.parse(
                localStorage.getItem(
                    "POTG_SAVE_05"
                )
            );

        if(data){

            save={
                ...save,
                ...data
            };

            selectedGod=
                save.god||"horus";
        }

    }catch(e){}
}

function saveGame(){

    save.god=selectedGod;

    try{

        localStorage.setItem(
            "POTG_SAVE_05",
            JSON.stringify(save)
        );

    }catch(e){}
}

loadSave();

/* =========================================================
   PLAYER
========================================================= */

const player={

    x:0,
    y:0,

    angle:0,

    hp:100,

    cooldown:0,

    attacking:false,

    attackTime:0,

    attackDuration:.34
};

/* =========================================================
   COMPAÑERO
========================================================= */

const companion={

    x:0,
    y:0,

    radius:13,

    speed:145,

    bob:0
};

/* =========================================================
   PUERTA
========================================================= */

let door={
    x:0,
    y:0
};

/* =========================================================
   STATS
========================================================= */

function getStats(){

    const g=GODS[selectedGod];

    return{

        speed:
            g.speed+
            save.speed+
            (save.level-1)*.025,

        evade:
            Math.min(
                .70,
                g.evade+
                save.evade
            ),

        damage:
            g.damage+
            (save.level-1)*.035,

        crit:
            Math.min(
                .75,
                g.crit+
                save.crit
            ),

        critDamage:
            g.critDamage+
            save.critDamage,

        maxHp:
            g.hp+
            (save.level-1)*8
    };
}

/* =========================================================
   MAPA
========================================================= */

function generateMap(){

    mapW=
        35+
        Math.floor(
            Math.random()*3
        )*2;

    mapH=
        27+
        Math.floor(
            Math.random()*3
        )*2;

    map=[];

    for(let y=0;y<mapH;y++){

        map[y]=[];

        for(let x=0;x<mapW;x++){

            map[y][x]=1;
        }
    }

    const cx=
        Math.floor(mapW/2);

    const cy=
        Math.floor(mapH/2);

    /*
      Zona central grande.
    */

    carve(
        cx-8,
        cy-6,
        cx+9,
        cy+7
    );

    /*
      Grandes sectores.
    */

    carve(
        2,
        4,
        11,
        mapH-5
    );

    carve(
        mapW-11,
        4,
        mapW-2,
        mapH-5
    );

    /*
      Conexiones amplias.
    */

    corridor(
        cx,
        cy,
        5,
        cy
    );

    corridor(
        cx,
        cy,
        mapW-6,
        cy
    );

    corridor(
        cx,
        cy,
        cx,
        4
    );

    corridor(
        cx,
        cy,
        cx,
        mapH-5
    );

    /*
      Cámaras adicionales.
    */

    for(let i=0;i<8;i++){

        const rw=
            4+
            Math.floor(
                Math.random()*5
            );

        const rh=
            4+
            Math.floor(
                Math.random()*4
            );

        const rx=
            2+
            Math.floor(
                Math.random()*
                (mapW-rw-4)
            );

        const ry=
            2+
            Math.floor(
                Math.random()*
                (mapH-rh-4)
            );

        carve(
            rx,
            ry,
            rx+rw,
            ry+rh
        );

        corridor(
            cx,
            cy,
            Math.floor(rx+rw/2),
            Math.floor(ry+rh/2)
        );
    }

    /*
      Borde sólido.
    */

    for(let x=0;x<mapW;x++){

        map[0][x]=1;
        map[1][x]=1;

        map[mapH-1][x]=1;
        map[mapH-2][x]=1;
    }

    for(let y=0;y<mapH;y++){

        map[y][0]=1;
        map[y][1]=1;

        map[y][mapW-1]=1;
        map[y][mapW-2]=1;
    }

    player.x=
        (cx+.5)*TILE;

    player.y=
        (cy+.5)*TILE;

    player.angle=0;

    companion.x=
        player.x-TILE;

    companion.y=
        player.y;

    createDoor();

    spawnEnemies();

    player.hp=
        getStats().maxHp;

    message(
        "Nueva sala generada."
    );
}

function carve(x1,y1,x2,y2){

    for(
        let y=Math.max(2,y1);
        y<Math.min(mapH-2,y2);
        y++
    ){

        for(
            let x=Math.max(2,x1);
            x<Math.min(mapW-2,x2);
            x++
        ){

            map[y][x]=0;
        }
    }
}

function corridor(x1,y1,x2,y2){

    let x=x1;
    let y=y1;

    while(x!==x2){

        map[y][x]=0;

        if(y+1<mapH)
            map[y+1][x]=0;

        x+=
            x<x2
            ?1
            :-1;
    }

    while(y!==y2){

        map[y][x]=0;

        if(x+1<mapW)
            map[y][x+1]=0;

        y+=
            y<y2
            ?1
            :-1;
    }
}

function wallAt(x,y){

    const tx=
        Math.floor(x/TILE);

    const ty=
        Math.floor(y/TILE);

    if(
        tx<0||
        ty<0||
        tx>=mapW||
        ty>=mapH
    )
        return true;

    return map[ty][tx]===1;
}

/* =========================================================
   PUERTA
========================================================= */

function createDoor(){

    const candidates=[];

    for(let y=2;y<mapH-2;y++){

        for(let x=2;x<mapW-2;x++){

            if(map[y][x]!==0)
                continue;

            const px=
                (x+.5)*TILE;

            const py=
                (y+.5)*TILE;

            /*
              La puerta está en una celda abierta
              inmediatamente pegada a una pared.
            */

            if(
                wallAt(px,py-TILE)||
                wallAt(px,py+TILE)||
                wallAt(px-TILE,py)||
                wallAt(px+TILE,py)
            ){

                if(
                    Math.hypot(
                        px-player.x,
                        py-player.y
                    )>TILE*5
                ){

                    candidates.push({
                        x,
                        y
                    });
                }
            }
        }
    }

    if(candidates.length){

        door=
            candidates[
                Math.floor(
                    Math.random()*
                    candidates.length
                )
            ];
    }
}

/* =========================================================
   COLISIÓN
========================================================= */

function collision(x,y,r){

    return(
        wallAt(x-r,y-r)||
        wallAt(x+r,y-r)||
        wallAt(x-r,y+r)||
        wallAt(x+r,y+r)
    );
}

/* =========================================================
   VISIBILIDAD
========================================================= */

function hasLineOfSight(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const distance=
        Math.hypot(dx,dy);

    const steps=
        Math.ceil(distance/3);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=
            x1+dx*t;

        const y=
            y1+dy*t;

        if(wallAt(x,y))
            return false;
    }

    return true;
}

/* =========================================================
   ENEMIGOS
========================================================= */

function spawnEnemies(){

    enemies=[];

    const amount=
        6+
        Math.floor(
            Math.random()*4
        );

    for(let i=0;i<amount;i++){

        for(let attempt=0;attempt<100;attempt++){

            const x=
                (2+
                Math.random()*
                (mapW-4))*
                TILE;

            const y=
                (2+
                Math.random()*
                (mapH-4))*
                TILE;

            if(wallAt(x,y))
                continue;

            if(
                Math.hypot(
                    x-player.x,
                    y-player.y
                )<
                TILE*4
            )
                continue;

            const hp=
                65+
                save.level*9;

            enemies.push({

                x,
                y,

                radius:15,

                hp,
                maxHp:hp,

                speed:
                    35+
                    Math.random()*13,

                angle:0,

                cooldown:
                    Math.random(),

                think:0,

                wander:
                    Math.random()*Math.PI*2,

                hit:0,

                dead:false
            });

            break;
        }
    }
}

/* =========================================================
   IA
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead)
            continue;

        e.cooldown-=dt;

        e.hit=
            Math.max(
                0,
                e.hit-dt
            );

        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;

        const distance=
            Math.hypot(dx,dy);

        e.angle=
            Math.atan2(dy,dx);

        const visible=
            distance<620&&
            hasLineOfSight(
                e.x,
                e.y,
                player.x,
                player.y
            );

        if(visible){

            if(distance>78){

                const nx=
                    dx/(distance||1);

                const ny=
                    dy/(distance||1);

                const amount=
                    e.speed*dt;

                enemyMove(
                    e,
                    nx*amount,
                    ny*amount
                );

            }else if(
                e.cooldown<=0
            ){

                enemyAttack(e);

                e.cooldown=.9;
            }

        }else{

            e.think-=dt;

            if(e.think<=0){

                e.think=
                    .8+
                    Math.random()*1.5;

                e.wander+=
                    (Math.random()-.5)*2;
            }

            const amount=
                e.speed*.22*dt;

            enemyMove(
                e,
                Math.cos(e.wander)*amount,
                Math.sin(e.wander)*amount
            );
        }
    }
}

function enemyMove(e,dx,dy){

    if(
        !collision(
            e.x+dx,
            e.y,
            e.radius
        )
    )
        e.x+=dx;

    if(
        !collision(
            e.x,
            e.y+dy,
            e.radius
        )
    )
        e.y+=dy;
}

function enemyAttack(e){

    if(
        Math.random()<
        getStats().evade
    ){

        message("¡Evasión!");

        return;
    }

    player.hp-=8;

    if(player.hp<=0){

        player.hp=0;

        message("Has caído.");

        setTimeout(()=>{

            if(running){

                player.hp=
                    getStats().maxHp;

                generateMap();
            }

        },800);
    }
}

/* =========================================================
   COMPAÑERO
========================================================= */

function updateCompanion(dt){

    const dx=
        player.x-companion.x;

    const dy=
        player.y-companion.y;

    const distance=
        Math.hypot(dx,dy);

    /*
      Nunca se mete encima del jugador.
    */

    if(distance>100){

        const target=
            72;

        const tx=
            player.x-
            dx/(distance||1)*
            target;

        const ty=
            player.y-
            dy/(distance||1)*
            target;

        const ax=
            tx-companion.x;

        const ay=
            ty-companion.y;

        const d=
            Math.hypot(ax,ay)||1;

        const amount=
            companion.speed*dt;

        const mx=
            ax/d*
            Math.min(amount,d);

        const my=
            ay/d*
            Math.min(amount,d);

        if(
            !collision(
                companion.x+mx,
                companion.y,
                companion.radius
            )
        )
            companion.x+=mx;

        if(
            !collision(
                companion.x,
                companion.y+my,
                companion.radius
            )
        )
            companion.y+=my;
    }

    companion.bob+=dt*5;
}

    if(

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joyActive=false;
let joyId=null;

let joyX=0;
let joyY=0;

function setJoystick(x,y){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=
        r.width*.36;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=
            dx/d*
            max;

        dy=
            dy/d*
            max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    joyActive=false;
    joyId=null;

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joyActive=true;
        joyId=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        setJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joyActive||
            e.pointerId!==joyId
        )
            return;

        setJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   ATAQUE
========================================================= */

function attack(){

    if(
        !running||
        paused||
        player.cooldown>0
    )
        return;

    player.attacking=true;
    player.attackTime=0;

    player.cooldown=.42;

    const stats=
        getStats();

    /*
      Alcance reducido.
    */

    const range=
        TILE*1.4;

    for(const e of enemies){

        if(e.dead)
            continue;

        const dx=
            e.x-player.x;

        const dy=
            e.y-player.y;

        const distance=
            Math.hypot(dx,dy);

        if(distance>range)
            continue;

        /*
          Un enemigo detrás de una pared
          no puede recibir daño.
        */

        if(
            !hasLineOfSight(
                player.x,
                player.y,
                e.x,
                e.y
            )
        )
            continue;

        const targetAngle=
            Math.atan2(dy,dx);

        const difference=
            normalizeAngle(
                targetAngle-
                player.angle
            );

        /*
          Barrido horizontal.
        */

        if(
            Math.abs(difference)<.78
        ){

            let damage=
                25*
                stats.damage;

            if(
                Math.random()<
                stats.crit
            ){

                damage*=
                    stats.critDamage;

                message(
                    "¡GOLPE CRÍTICO!"
                );
            }

            e.hp-=damage;
            e.hit=.12;

            if(e.hp<=0){

                e.hp=0;
                e.dead=true;

                gainXP(25);

                message("+25 EXP");
            }
        }
    }
}

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}

/* =========================================================
   RAYCAST
========================================================= */

function castRay(x,y,angle){

    const dx=Math.cos(angle);
    const dy=Math.sin(angle);

    let mx=
        Math.floor(x/TILE);

    let my=
        Math.floor(y/TILE);

    const deltaX=
        Math.abs(
            1/(dx||.000001)
        );

    const deltaY=
        Math.abs(
            1/(dy||.000001)
        );

    let stepX;
    let stepY;

    let sideX;
    let sideY;

    if(dx<0){

        stepX=-1;

        sideX=
            (x/TILE-mx)*
            deltaX;

    }else{

        stepX=1;

        sideX=
            (mx+1-x/TILE)*
            deltaX;
    }

    if(dy<0){

        stepY=-1;

        sideY=
            (y/TILE-my)*
            deltaY;

    }else{

        stepY=1;

        sideY=
            (my+1-y/TILE)*
            deltaY;
    }

    let side=0;

    for(let i=0;i<200;i++){

        if(sideX<sideY){

            sideX+=deltaX;
            mx+=stepX;
            side=0;

        }else{

            sideY+=deltaY;
            my+=stepY;
            side=1;
        }

        if(isWall(mx,my)){

            let distance;

            if(side===0){

                distance=
                    (
                        mx-
                        x/TILE+
                        (1-stepX)/2
                    )/dx*TILE;

            }else{

                distance=
                    (
                        my-
                        y/TILE+
                        (1-stepY)/2
                    )/dy*TILE;
            }

            return{
                distance:
                    Math.abs(distance),
                side,
                cellX:mx,
                cellY:my
            };
        }
    }

    return{
        distance:1500,
        side:0,
        cellX:mx,
        cellY:my
    };
}

function isWall(x,y){

    if(
        x<0||
        y<0||
        x>=mapW||
        y>=mapH
    )
        return true;

    return map[y][x]===1;
}

/* =========================================================
   PAREDES
========================================================= */

function renderWalls(){

    const horizon=
        H*.47;

    const rays=
        Math.min(
            420,
            Math.max(
                220,
                Math.floor(W*.75)
            )
        );

    const step=
        W/rays;

    for(let i=0;i<rays;i++){

        const sx=
            i*step;

        const cameraX=
            sx/W-.5;

        const angle=
            player.angle+
            cameraX*FOV;

        const hit=
            castRay(
                player.x,
                player.y,
                angle
            );

        let distance=
            hit.distance;

        distance*=
            Math.cos(
                angle-player.angle
            );

        distance=
            Math.max(
                1,
                distance
            );

        const wallHeight=
            TILE*
            H*.72/
            distance;

        const top=
            horizon-
            wallHeight/2;

        const isDoor=
            hit.cellX===door.x&&
            hit.cellY===door.y;

        if(isDoor){

            ctx.fillStyle="#3b2a18";

            ctx.fillRect(
                sx,
                top,
                step+1,
                wallHeight
            );

            ctx.fillStyle="#0d0b08";

            ctx.fillRect(
                sx+step*.17,
                top+wallHeight*.08,
                step*.66,
                wallHeight*.92
            );

            ctx.fillStyle="#c19a4c";

            ctx.fillRect(
                sx,
                top,
                step*.11,
                wallHeight
            );

            ctx.fillRect(
                sx+step*.89,
                top,
                step*.11,
                wallHeight
            );

        }else{

            const shade=
                hit.side===0
                ?1
                :.72;

            const depth=
                1-
                Math.min(
                    distance/1500,
                    .7
                );

            const v=
                Math.floor(
                    82+
                    100*
                    shade*
                    depth
                );

            ctx.fillStyle=
                `rgb(${v},
                ${Math.floor(v*.78)},
                ${Math.floor(v*.51)})`;

            ctx.fillRect(
                sx,
                top,
                step+1,
                wallHeight
            );
        }
    }
}

/* =========================================================
   SPRITES
========================================================= */

function renderSprites(){

    const list=[];

    for(const e of enemies){

        if(!e.dead){

            list.push({
                type:"enemy",
                object:e
            });
        }
    }

    list.push({
        type:"companion",
        object:companion
    });

    list.sort((a,b)=>{

        const da=
            Math.hypot(
                a.object.x-player.x,
                a.object.y-player.y
            );

        const db=
            Math.hypot(
                b.object.x-player.x,
                b.object.y-player.y
            );

        return db-da;
    });

    for(const item of list){

        drawSprite(
            item.type,
            item.object
        );
    }
}

function drawSprite(type,o){

    const dx=
        o.x-player.x;

    const dy=
        o.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    if(distance<10)
        return;

    /*
      Seguridad principal.
      Si una pared está entre cámara
      y personaje, no se renderiza.
    */

    if(
        !hasLineOfSight(
            player.x,
            player.y,
            o.x,
            o.y
        )
    )
        return;

    const relative=
        normalizeAngle(
            Math.atan2(dy,dx)-
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.68
    )
        return;

    const projection=
        W/
        (
            2*
            Math.tan(FOV/2)
        );

    const screenX=
        W/2+
        Math.tan(relative)*
        projection;

    /*
      Personajes con proporción vertical.
    */

    const size=
        Math.min(
            H*1.1,
            TILE*
            H*.72/
            distance
        );

    const ground=
        H*.47+
        size*.50;

    const top=
        ground-size;

    const width=
        size*.48;

    const start=
        Math.floor(
            screenX-width/2
        );

    const end=
        Math.ceil(
            screenX+width/2
        );

    /*
      Oclusión columna por columna.
    */

    for(
        let x=start;
        x<=end;
        x++
    ){

        if(x<0||x>=W)
            continue;

        const cameraX=
            x/W-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const wall=
            castRay(
                player.x,
                player.y,
                rayAngle
            );

        const wallDistance=
            wall.distance*
            Math.cos(
                rayAngle-player.angle
            );

        /*
          La pared gana.
        */

        if(distance>=wallDistance-3)
            continue;

        const nx=
            (x-screenX)/
            width;

        drawCharacterColumn(
            type,
            o,
            x,
            top,
            ground,
            size,
            nx
        );
    }
}

/* =========================================================
   PERSONAJES
========================================================= */

function drawCharacterColumn(
    type,
    o,
    x,
    top,
    ground,
    size,
    nx
){

    const a=Math.abs(nx);

    /*
      SOMBRA DEL SUELO
    */

    if(a<.50){

        ctx.fillStyle="#0005";

        ctx.fillRect(
            x,
            ground-size*.025,
            1.5,
            Math.max(
                2,
                size*.045
            )
        );
    }

    /*
      CABEZA
      Aproximadamente 1/8 de la altura.
    */

    if(
        a<.19
    ){

        ctx.fillStyle=
            type==="enemy"
            ?(
                o.hit>0
                ?" #ffffff"
                :"#4b3025"
            )
            :"#d2ba83";

        ctx.fillRect(
            x,
            top+size*.105,
            1.5,
            size*.125
        );
    }

    /*
      CUELLO
    */

    if(a<.09){

        ctx.fillStyle=
            type==="enemy"
            ?" #3b251e"
            :"#9f8054";

        ctx.fillRect(
            x,
            top+size*.23,
            1.5,
            size*.055
        );
    }

    /*
      HOMBROS / TORSO
    */

    if(a<.29){

        ctx.fillStyle=
            type==="enemy"
            ?" #673b2c"
            :"#8f7548";

        ctx.fillRect(
            x,
            top+size*.285,
            1.5,
            size*.30
        );
    }

    /*
      CINTURA.
    */

    if(a<.20){

        ctx.fillStyle=
            type==="enemy"
            ?" #34231c"
            :"#57432c";

        ctx.fillRect(
            x,
            top+size*.585,
            1.5,
            size*.07
        );
    }

    /*
      BRAZOS.
    */

    if(
        a>.25&&
        a<.47
    ){

        ctx.fillStyle=
            type==="enemy"
            ?" #4b2d24"
            :"#715a3b";

        ctx.fillRect(
            x,
            top+size*.31,
            1.5,
            size*.28
        );
    }

    /*
      CADERA.
    */

    if(a<.28){

        ctx.fillStyle=
            type==="enemy"
            ?" #3c2922"
            :"#4d3c29";

        ctx.fillRect(
            x,
            top+size*.655,
            1.5,
            size*.10
        );
    }

    /*
      PIERNAS.

      Terminan exactamente en GROUND.
    */

    if(
        a<.12
    ){

        ctx.fillStyle=
            type==="enemy"
            ?" #251a16"
            :"#3c3022";

        ctx.fillRect(
            x,
            top+size*.755,
            1.5,
            size*.245
        );
    }

    /*
      Separación entre piernas.
    */

    if(
        a>=.12&&
        a<.23
    ){

        ctx.fillStyle=
            type==="enemy"
            ?" #241915"
            :"#3b2d20";

        ctx.fillRect(
            x,
            top+size*.77,
            1.5,
            size*.20
        );
    }

    /*
      BARRA DE VIDA.
    */

    if(
        type==="enemy"&&
        a<.35
    ){

        const bw=
            Math.max(
                16,
                size*.65
            );

        const bh=
            Math.max(
                3,
                size*.035
            );

        ctx.fillStyle="#160c09";

        ctx.fillRect(
            x-bw/2,
            top-size*.065,
            bw,
            bh
        );

        ctx.fillStyle="#d1483b";

        ctx.fillRect(
            x-bw/2,
            top-size*.065,
            bw*
            Math.max(
                0,
                o.hp/o.maxHp
            ),
            bh
        );
    }
}

/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    const p=
        player.attacking
        ?
        Math.min(
            1,
            player.attackTime/
            player.attackDuration
        )
        :0;

    /*
      Barrido horizontal.
    */

    const sweep=
        Math.sin(
            p*Math.PI
        );

    ctx.save();

    /*
      Mano derecha.
    */

    ctx.translate(
        W*.72,
        H*1.02
    );

    ctx.rotate(
        -.27+
        sweep*.92
    );

    const scale=
        Math.min(
            W,H
        )/650;

    ctx.scale(
        scale,
        scale
    );

    /*
      Brazo.
    */

    ctx.fillStyle="#ad7954";

    ctx.fillRect(
        -8,
        -55,
        68,
        23
    );

    /*
      Mango.
    */

    ctx.fillStyle="#382317";

    ctx.fillRect(
        31,
        -96,
        14,
        106
    );

    /*
      Guarda.
    */

    ctx.fillStyle="#c6a14e";

    ctx.fillRect(
        9,
        -92,
        57,
        10
    );

    /*
      Hoja.
    */

    ctx.fillStyle="#d9c99e";

    ctx.beginPath();

    ctx.moveTo(37,-91);
    ctx.lineTo(51,-91);
    ctx.lineTo(58,-275);
    ctx.lineTo(45,-304);
    ctx.lineTo(30,-275);

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#f0dfb3";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   MIRA
========================================================= */

function renderCrosshair(){

    const x=W/2;
    const y=H*.47;

    ctx.strokeStyle="#f5e5bb";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x-10,y);
    ctx.lineTo(x-3,y);

    ctx.moveTo(x+3,y);
    ctx.lineTo(x+10,y);

    ctx.moveTo(x,y-10);
    ctx.lineTo(x,y-3);

    ctx.moveTo(x,y+3);
    ctx.lineTo(x,y+10);

    ctx.stroke();

    ctx.fillStyle="#e0bd60";

    ctx.fillRect(
        x-1,
        y-1,
        2,
        2
    );
}

/* =========================================================
   MINIMAPA COMPLETO
========================================================= */

function renderMiniMap(){

    const r=
        mini.getBoundingClientRect();

    const mw=r.width;
    const mh=r.height;

    if(mw<=0||mh<=0)
        return;

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    mini.width=
        Math.floor(mw*dpr);

    mini.height=
        Math.floor(mh*dpr);

    mctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    mctx.fillStyle="#100d09";

    mctx.fillRect(
        0,
        0,
        mw,
        mh
    );

    /*
      ESCALA PARA QUE ENTRE TODO EL MAPA.
    */

    const scale=
        Math.min(
            (mw-8)/
            (mapW*TILE),

            (mh-8)/
            (mapH*TILE)
        );

    const ox=
        (
            mw-
            mapW*TILE*scale
        )/2;

    const oy=
        (
            mh-
            mapH*TILE*scale
        )/2;

    /*
      MAPA.
    */

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            mctx.fillStyle=
                map[y][x]===0
                ?" #bda06a"
                :"#33271a";

            mctx.fillRect(
                ox+
                x*TILE*scale,
                oy+
                y*TILE*scale,
                TILE*scale+.5,
                TILE*scale+.5
            );
        }
    }

    /*
      PUERTA.
    */

    mctx.fillStyle="#e1b94f";

    mctx.fillRect(
        ox+
        door.x*TILE*scale,
        oy+
        door.y*TILE*scale,
        TILE*scale,
        TILE*scale
    );

    /*
      ENEMIGOS.
    */

    for(const e of enemies){

        if(e.dead)
            continue;

        mctx.fillStyle="#c84639";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(
                2,
                3*scale
            ),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
      COMPAÑERO.
    */

    mctx.fillStyle="#5dc3cf";

    mctx.beginPath();

    mctx.arc(
        ox+companion.x*scale,
        oy+companion.y*scale,
        Math.max(
            2,
            3*scale
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      JUGADOR.
    */

    const px=
        ox+
        player.x*scale;

    const py=
        oy+
        player.y*scale;

    mctx.fillStyle="#f2d77b";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(
            3,
            4*scale
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
      Dirección.
    */

    mctx.strokeStyle="#f2d77b";
    mctx.lineWidth=2;

    mctx.beginPath();

    mctx.moveTo(
        px,
        py
    );

    mctx.lineTo(
        px+
        Math.cos(
            player.angle
        )*13,

        py+
        Math.sin(
            player.angle
        )*13
    );

    mctx.stroke();
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const stats=
        getStats();

    document.getElementById(
        "level"
    ).textContent=
        "NIVEL "+
        save.level;

    document.getElementById(
        "hpBar"
    ).style.width=
        Math.max(
            0,
            player.hp/
            stats.maxHp*
            100
        )+"%";

    const needed=
        100+
        (save.level-1)*60;

    document.getElementById(
        "xpBar"
    ).style.width=
        Math.min(
            100,
            save.xp/
            needed*
            100
        )+"%";

    document.getElementById(
        "statLine"
    ).textContent=
        "VEL "+
        stats.speed.toFixed(2)+
        " · EVA "+
        Math.round(
            stats.evade*100
        )+
        "% · CRIT "+
        Math.round(
            stats.crit*100
        )+
        "%";

    document.getElementById(
        "godCurrent"
    ).textContent=
        GODS[selectedGod].glyph+
        " "+
        GODS[selectedGod].name;
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !running||
        paused
    )
        return;

    player.cooldown=
        Math.max(
            0,
            player.cooldown-dt
        );

    skillCooldown=
        Math.max(
            0,
            skillCooldown-dt
        );

    if(player.attacking){

        player.attackTime+=dt;

        if(
            player.attackTime>
            player.attackDuration
        ){

            player.attacking=false;
        }
    }

    /*
      Movimiento.
    */

    let mx=joyX;
    let my=joyY;

    const length=
        Math.hypot(
            mx,
            my
        );

    if(length>1){

        mx/=length;
        my/=length;
    }

    const speed=
        112*
        getStats().speed;

    const forwardX=
        Math.cos(
            player.angle
        );

    const forwardY=
        Math.sin(
            player.angle
        );

    const rightX=
        Math.cos(
            player.angle+
            Math.PI/2
        );

    const rightY=
        Math.sin(
            player.angle+
            Math.PI/2
        );

    const dx=
        (
            forwardX*(-my)+
            rightX*mx
        )*
        speed*
        dt;

    const dy=
        (
            forwardY*(-my)+
            rightY*mx
        )*
        speed*
        dt;

    movePlayer(
        dx,
        dy
    );

    updateCompanion(dt);

    updateEnemies(dt);

    checkDoor();

    if(messageTimer>0)
        messageTimer-=dt;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    W=innerWidth;
    H=innerHeight;

    const dpr=
        Math.min(
            2,
            devicePixelRatio||1
        );

    canvas.width=
        Math.floor(W*dpr);

    canvas.height=
        Math.floor(H*dpr);

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    const horizon=
        H*.47;

    /*
      CIELO.
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon
        );

    sky.addColorStop(
        0,
        "#776247"
    );

    sky.addColorStop(
        1,
        "#c5a66b"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );

    /*
      SUELO ARENA SIN REFLEJO.
    */

    const floor=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    floor.addColorStop(
        0,
        "#b18b50"
    );

    floor.addColorStop(
        1,
        "#d0ae72"
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    renderWalls();

    renderSprites();

    renderWeapon();

    renderCrosshair();

    renderMiniMap();

    updateHUD();
}

/* =========================================================
   MENÚ DIOS
========================================================= */

document.querySelectorAll(
    "#menuGods .godButton"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document.querySelectorAll(
                "#menuGods .godButton"
            ).forEach(
                b=>
                    b.classList.remove(
                        "selected"
                    )
            );

            button.classList.add(
                "selected"
            );

            selectedGod=
                button.dataset.god;
        }
    );
});

/* =========================================================
   BENDICIONES IN-GAME
========================================================= */

document.querySelectorAll(
    ".blessing"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            changeGod(
                button.dataset.god
            );
        }
    );
});

document.querySelector(
    ".closeBlessing"
).addEventListener(
    "click",
    closeBlessings
);

document.getElementById(
    "god"
).addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        openBlessings();
    }
);

/* =========================================================
   START
========================================================= */

document.getElementById(
    "start"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="block";

        running=true;
        paused=false;

        generateMap();

        last=
            performance.now();
    }
);

/* =========================================================
   BOTONES
========================================================= */

document.getElementById(
    "attack"
).addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        attack();
    }
);

document.getElementById(
    "pause"
).addEventListener(
    "click",
    ()=>{

        paused=true;

        document.getElementById(
            "pauseScreen"
        ).style.display="flex";
    }
);

document.getElementById(
    "resume"
).addEventListener(
    "click",
    ()=>{

        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";
    }
);

document.getElementById(
    "backMenu"
).addEventListener(
    "click",
    ()=>{

        running=false;
        paused=false;

        document.getElementById(
            "pauseScreen"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="none";

        document.getElementById(
            "menu"
        ).style.display="flex";
    }
);

/* =========================================================
   LOOP
========================================================= */

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/1000
        );

    last=now;

    update(dt);

    if(running)
        render();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);

</script>
