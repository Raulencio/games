<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Resident Raycaster 0.3</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

/* =========================
   HUD SUPERIOR IZQUIERDO
========================= */

#status{
    position:absolute;
    top:10px;
    left:10px;
    width:185px;
    padding:9px;
    border-radius:12px;
    background:rgba(8,8,8,.82);
    border:1px solid rgba(255,255,255,.14);
}

.label{
    color:#999;
    font-size:9px;
    letter-spacing:1px;
}

.name{
    font-size:13px;
    font-weight:bold;
    margin-top:3px;
}

.health{
    height:8px;
    margin-top:6px;
    background:#242424;
    border-radius:10px;
    overflow:hidden;
}

#healthFill{
    width:100%;
    height:100%;
    background:#b83b3b;
}

#healthText{
    margin-top:4px;
    font-size:9px;
    color:#aaa;
}

/* =========================
   RESCATADO
========================= */

#rescue{
    display:none;

    position:absolute;
    top:92px;
    left:10px;

    width:185px;
    padding:9px;

    border-radius:12px;
    background:rgba(8,8,8,.82);
    border:1px solid rgba(255,255,255,.14);
}

#survivorHealth{
    width:100%;
    height:100%;
    background:#4dbb70;
}

/* =========================
   MINIMAPA
========================= */

#mapBox{
    position:absolute;
    top:10px;
    right:10px;

    width:180px;
    height:180px;

    padding:6px;

    border-radius:13px;

    background:rgba(8,8,8,.85);
    border:1px solid rgba(255,255,255,.14);
}

#mini{
    width:100%;
    height:100%;
    display:block;
    background:#111;
    border-radius:7px;
}

/* =========================
   OBJETIVO
========================= */

#mission{
    position:absolute;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    max-width:250px;

    padding:8px 13px;

    border-radius:20px;

    background:rgba(0,0,0,.7);

    font-size:9px;
    text-align:center;

    border:1px solid rgba(255,255,255,.12);
}

/* =========================
   MIRA
========================= */

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:20px;
    height:20px;

    transform:translate(-50%,-50%);
}

#crosshair i{
    position:absolute;
    background:#fff;
}

#crosshair .v{
    width:2px;
    height:18px;
    left:9px;
    top:1px;
}

#crosshair .h{
    width:18px;
    height:2px;
    left:1px;
    top:9px;
}

/* =========================
   MUNICIÓN
========================= */

#ammo{
    position:absolute;

    right:12px;
    bottom:12px;

    padding:8px 12px;

    min-width:105px;

    border-radius:12px;

    text-align:right;

    background:rgba(8,8,8,.82);

    border:1px solid rgba(255,255,255,.14);
}

#ammoNumber{
    font-size:27px;
    font-weight:bold;
}

#ammoReserve{
    color:#999;
    font-size:9px;
}

/* =========================
   MENSAJES
========================= */

#message{
    position:absolute;

    left:50%;
    bottom:180px;

    transform:translateX(-50%);

    padding:9px 15px;

    min-width:180px;

    text-align:center;

    font-size:10px;

    background:rgba(0,0,0,.82);

    border-radius:9px;

    opacity:0;

    transition:opacity .15s;
}

/* =========================
   ZONA CÁMARA
========================= */

#look{
    position:absolute;
    right:0;
    top:0;

    width:63%;
    height:100%;

    pointer-events:auto;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
    position:absolute;

    left:9px;
    bottom:9px;

    width:145px;
    height:145px;

    pointer-events:auto;
}

#joyBase{
    position:absolute;

    left:8px;
    bottom:8px;

    width:120px;
    height:120px;

    border-radius:50%;

    background:rgba(255,255,255,.055);

    border:2px solid rgba(255,255,255,.16);
}

#joyStick{
    position:absolute;

    width:52px;
    height:52px;

    left:68px;
    top:68px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(255,255,255,.17);

    border:2px solid rgba(255,255,255,.26);
}

/* =========================
   BOTONES
========================= */

.btn{
    position:absolute;

    pointer-events:auto;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(8,8,8,.78);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    font-size:9px;
    font-weight:bold;
}

.btn:active{
    transform:scale(.92);
}

#fire{
    width:78px;
    height:78px;

    right:16px;
    bottom:105px;
}

#reload{
    width:61px;
    height:61px;

    right:105px;
    bottom:20px;
}

#med{
    width:58px;
    height:58px;

    right:175px;
    bottom:22px;

    font-size:27px;
}

#follow{
    display:none;

    width:61px;
    height:61px;

    left:158px;
    bottom:22px;
}

#action{
    display:none;

    pointer-events:auto;

    position:absolute;

    left:50%;
    bottom:82px;

    transform:translateX(-50%);

    width:125px;
    height:47px;

    border:1px solid rgba(90,200,120,.5);

    border-radius:12px;

    background:rgba(30,105,55,.9);

    color:white;

    font-size:10px;
    font-weight:bold;
}

@media(max-width:600px){

    #mapBox{
        width:145px;
        height:145px;
    }

    #status,
    #rescue{
        width:165px;
    }

    #rescue{
        top:85px;
    }

    #mission{
        top:160px;
    }

    #med{
        right:174px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="status">

        <div class="label">JUGADOR</div>

        <div class="name">
            LEON
        </div>

        <div class="health">
            <div id="healthFill"></div>
        </div>

        <div id="healthText">
            VIDA 100
        </div>

    </div>


    <div id="rescue">

        <div class="label">
            SUPERVIVIENTE
        </div>

        <div class="name"
             id="survivorName">
            —
        </div>

        <div class="health">
            <div id="survivorHealth"></div>
        </div>

        <div id="survivorHealthText"
             style="font-size:9px;color:#aaa;margin-top:4px">
            VIDA 100
        </div>

    </div>


    <div id="mapBox">
        <canvas id="mini"></canvas>
    </div>


    <div id="mission">
        ENCUENTRA AL SUPERVIVIENTE
    </div>


    <div id="crosshair">
        <i class="v"></i>
        <i class="h"></i>
    </div>


    <div id="message"></div>


    <div id="ammo">

        <div id="ammoNumber">
            12
        </div>

        <div id="ammoReserve">
            RESERVA 48
        </div>

    </div>


    <div id="look"></div>


    <div id="joystick">

        <div id="joyBase"></div>

        <div id="joyStick"></div>

    </div>


    <button id="fire"
            class="btn">
        DISPARAR
    </button>


    <button id="reload"
            class="btn">
        RECARGAR
    </button>


    <button id="med"
            class="btn">
        +
    </button>


    <button id="follow"
            class="btn">
        SEGUIR
    </button>


    <button id="action">
        RESCATAR
    </button>

</div>

<script>
"use strict";

/* =========================================================
   RESIDENT RAYCASTER 0.3
   MOTOR 2.5D
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mini =
    document.getElementById("mini");

const mctx =
    mini.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

    DPR=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=
        canvas.width=
        Math.floor(
            innerWidth*DPR
        );

    H=
        canvas.height=
        Math.floor(
            innerHeight*DPR
        );

    canvas.style.width=
        innerWidth+"px";

    canvas.style.height=
        innerHeight+"px";

    mini.width=
        180*DPR;

    mini.height=
        180*DPR;
}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   CONFIG
========================================================= */

const TILE=64;

const MAP_W=29;
const MAP_H=29;

const FOV=Math.PI/3;

const MAX_DISTANCE=1200;

const PLAYER_RADIUS=15;

const PLAYER_HEIGHT=1.7;

const CAMERA_HEIGHT=1.62;


/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:14.5*TILE,

    y:14.5*TILE,

    angle:0,

    pitch:0,

    health:100,

    ammo:12,

    reserve:48,

    medkits:3,

    speed:145,

    moving:false
};


/* =========================================================
   MUNDO
========================================================= */

let map=[];

let zombies=[];

let items=[];

let survivor=null;

let stairs=null;

let door=null;

let floorNumber=1;

let mission=0;


/* =========================================================
   NOMBRES
========================================================= */

const names=[
    "MATEO",
    "SOFIA",
    "DANIEL",
    "VALENTINA",
    "MARTIN",
    "CAMILA",
    "NICOLAS",
    "EMILIA"
];


/* =========================================================
   RANDOM
========================================================= */

function rnd(a,b){

    return a+
        Math.random()*
        (b-a);
}

function rndi(a,b){

    return Math.floor(
        rnd(a,b+1)
    );
}

function choose(arr){

    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];
}


/* =========================================================
   MAPA PROCEDURAL
========================================================= */

function generateMap(){

    map=
        Array.from(
            {length:MAP_H},
            ()=>Array(
                MAP_W
            ).fill(1)
        );


    /*
    El edificio empieza con
    corredores conectados.
    */

    const corridors=[
        [2,14,26,14],
        [14,2,14,26],

        [5,14,5,5],
        [23,14,23,5],

        [5,5,14,5],
        [14,5,23,5],

        [5,14,5,23],
        [5,23,14,23],

        [23,14,23,23],
        [14,23,23,23],

        [9,14,9,8],
        [19,14,19,8],

        [9,8,19,8],

        [9,14,9,20],
        [19,14,19,20]
    ];


    for(
        const c of corridors
    ){

        const x1=c[0];
        const y1=c[1];

        const x2=c[2];
        const y2=c[3];

        if(x1===x2){

            for(
                let y=
                    Math.min(
                        y1,y2
                    );
                y<=
                    Math.max(
                        y1,y2
                    );
                y++
            ){

                openCell(
                    x1,
                    y
                );

                openCell(
                    x1+1,
                    y
                );

                openCell(
                    x1-1,
                    y
                );
            }

        }else{

            for(
                let x=
                    Math.min(
                        x1,x2
                    );
                x<=
                    Math.max(
                        x1,x2
                    );
                x++
            ){

                openCell(
                    x,
                    y1
                );

                openCell(
                    x,
                    y1+1
                );

                openCell(
                    x,
                    y1-1
                );
            }
        }
    }


    /*
    Generamos zonas abiertas
    conectadas al corredor.
    */

    for(let i=0;i<25;i++){

        const x=
            rndi(3,25);

        const y=
            rndi(3,25);

        if(map[y][x]!==1)
            continue;

        let connected=false;

        for(
            let yy=-2;
            yy<=2;
            yy++
        )
        for(
            let xx=-2;
            xx<=2;
            xx++
        ){

            const nx=x+xx;
            const ny=y+yy;

            if(
                nx>=0 &&
                ny>=0 &&
                nx<MAP_W &&
                ny<MAP_H &&
                map[ny][nx]===0
            ){

                connected=true;
            }
        }

        if(!connected)
            continue;

        /*
        Pequeña zona abierta.
        */

        for(
            let yy=-1;
            yy<=1;
            yy++
        )
        for(
            let xx=-1;
            xx<=1;
            xx++
        ){

            openCell(
                x+xx,
                y+yy
            );
        }
    }


    /*
    Pared exterior.
    */

    for(let x=0;x<MAP_W;x++){

        map[0][x]=1;
        map[MAP_H-1][x]=1;
    }

    for(let y=0;y<MAP_H;y++){

        map[y][0]=1;
        map[y][MAP_W-1]=1;
    }


    /*
    Abrimos la zona inicial.
    */

    for(
        let y=12;
        y<=16;
        y++
    )
    for(
        let x=12;
        x<=16;
        x++
    ){

        map[y][x]=0;
    }
}


function openCell(x,y){

    if(
        x>0 &&
        y>0 &&
        x<MAP_W-1 &&
        y<MAP_H-1
    ){

        map[y][x]=0;
    }
}


/* =========================================================
   COLISIONES
========================================================= */

function isWall(x,y){

    const gx=
        Math.floor(x/TILE);

    const gy=
        Math.floor(y/TILE);

    if(
        gx<0 ||
        gy<0 ||
        gx>=MAP_W ||
        gy>=MAP_H
    )
        return true;

    return map[gy][gx]===1;
}


function circleFree(
    x,
    y,
    radius
){

    /*
    Cuatro puntos + centro.
    */

    return !(
        isWall(
            x-radius,
            y-radius
        ) ||
        isWall(
            x+radius,
            y-radius
        ) ||
        isWall(
            x-radius,
            y+radius
        ) ||
        isWall(
            x+radius,
            y+radius
        ) ||
        isWall(x,y)
    );
}


function moveEntity(
    e,
    dx,
    dy
){

    const r=
        e.radius||15;

    if(
        circleFree(
            e.x+dx,
            e.y,
            r
        )
    ){

        e.x+=dx;
    }

    if(
        circleFree(
            e.x,
            e.y+dy,
            r
        )
    ){

        e.y+=dy;
    }
}


/* =========================================================
   POSICIONES
========================================================= */

function openPosition(
    minimum
){

    for(let i=0;i<1000;i++){

        const gx=
            rndi(2,MAP_W-3);

        const gy=
            rndi(2,MAP_H-3);

        if(map[gy][gx]!==0)
            continue;

        const x=
            (gx+.5)*TILE;

        const y=
            (gy+.5)*TILE;

        if(
            Math.hypot(
                x-player.x,
                y-player.y
            )<minimum
        )
            continue;

        return {x,y};
    }

    return {
        x:player.x+TILE*3,
        y:player.y
    };
}


/* =========================================================
   CREAR ZOMBIES
========================================================= */

function createZombie(){

    const p=
        openPosition(
            TILE*4
        );

    return {

        x:p.x,
        y:p.y,

        z:0,

        radius:17,

        height:1.8,

        health:100,

        alive:true,

        speed:rnd(27,42),

        attack:0,

        flash:0,

        wander:Math.random()*10
    };
}


function spawnZombies(){

    zombies=[];

    const amount=
        9+
        Math.floor(
            Math.random()*5
        );

    for(
        let i=0;
        i<amount;
        i++
    ){

        zombies.push(
            createZombie()
        );
    }
}


/* =========================================================
   SUPERVIVIENTE
========================================================= */

function createSurvivor(){

    const p=
        openPosition(
            TILE*7
        );

    return {

        x:p.x,

        y:p.y,

        z:0,

        radius:15,

        height:1.72,

        health:100,

        name:choose(names),

        rescued:false,

        following:false,

        escaping:false,

        speed:47,

        safeTime:0
    };
}


/* =========================================================
   ITEMS
========================================================= */

function spawnItems(){

    items=[];

    for(let i=0;i<13;i++){

        const p=
            openPosition(
                TILE*2
            );

        items.push({

            x:p.x,

            y:p.y,

            type:
                Math.random()<.7
                ?"ammo"
                :"med",

            amount:
                Math.random()<.7
                ?12
                :1,

            collected:false
        });
    }
}


/* =========================================================
   ESCALERA
========================================================= */

function spawnStairs(){

    const p=
        openPosition(
            TILE*5
        );

    stairs={
        x:p.x,
        y:p.y
    };
}


/* =========================================================
   PUERTA
========================================================= */

function spawnDoor(){

    /*
    Busca una pared con espacio
    transitable a ambos lados.
    */

    for(let i=0;i<500;i++){

        const x=
            rndi(2,MAP_W-3);

        const y=
            rndi(2,MAP_H-3);

        if(map[y][x]!==0)
            continue;

        if(
            map[y][x-1]===0 &&
            map[y][x+1]===0
        ){

            door={
                x:(x+.5)*TILE,
                y:(y+.5)*TILE,
                open:false
            };

            return;
        }

        if(
            map[y-1][x]===0 &&
            map[y+1][x]===0
        ){

            door={
                x:(x+.5)*TILE,
                y:(y+.5)*TILE,
                open:false
            };

            return;
        }
    }
}


/* =========================================================
   NUEVO PISO
========================================================= */

function createFloor(){

    generateMap();

    player.x=
        14.5*TILE;

    player.y=
        14.5*TILE;

    player.angle=
        Math.random()*
        Math.PI*2;

    player.pitch=0;

    spawnZombies();

    spawnItems();

    spawnStairs();

    spawnDoor();

    survivor=
        createSurvivor();

    mission=0;

    updateMission();

    showMessage(
        "PISO "+floorNumber
    );
}


/* =========================================================
   DISTANCIA
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================================================
   RECOGIDA AUTOMÁTICA
========================================================= */

function collectItems(){

    for(
        const item of items
    ){

        if(item.collected)
            continue;

        if(
            Math.hypot(
                player.x-item.x,
                player.y-item.y
            )<42
        ){

            item.collected=true;

            if(
                item.type==="ammo"
            ){

                player.reserve+=
                    item.amount;

                showMessage(
                    "+"+
                    item.amount+
                    " MUNICIÓN"
                );

            }else{

                player.medkits++;

                showMessage(
                    "+1 BOTIQUÍN"
                );
            }

            updateAmmo();
        }
    }
}


/* =========================================================
   CURA
========================================================= */

function useMedkit(){

    if(player.health>=100){

        showMessage(
            "VIDA AL MÁXIMO"
        );

        return;
    }

    if(player.medkits<=0){

        showMessage(
            "SIN BOTIQUINES"
        );

        return;
    }

    player.medkits--;

    player.health=
        Math.min(
            100,
            player.health+45
        );

    showMessage(
        "BOTIQUÍN UTILIZADO"
    );

    updateHUD();
}


/* =========================================================
   RECARGAR
========================================================= */

let reloading=false;

function reload(){

    if(reloading)
        return;

    if(player.ammo>=12){

        showMessage(
            "CARGADOR COMPLETO"
        );

        return;
    }

    if(player.reserve<=0){

        showMessage(
            "SIN MUNICIÓN"
        );

        return;
    }

    reloading=true;

    showMessage(
        "RECARGANDO..."
    );

    setTimeout(
        ()=>{

            const need=
                12-player.ammo;

            const amount=
                Math.min(
                    need,
                    player.reserve
                );

            player.ammo+=amount;

            player.reserve-=amount;

            reloading=false;

            updateAmmo();

        },
        650
    );
}


/* =========================================================
   DISPARO
========================================================= */

let lastShot=0;

let weaponKick=0;

function shoot(){

    const now=
        performance.now();

    if(reloading)
        return;

    if(
        now-lastShot<
        190
    )
        return;

    if(player.ammo<=0){

        showMessage(
            "SIN MUNICIÓN"
        );

        return;
    }

    lastShot=now;

    player.ammo--;

    weaponKick=.13;

    updateAmmo();

    muzzleFlash=.08;

    /*
    El disparo se hace exactamente
    desde el centro de la cámara.
    */

    const angle=
        player.angle;

    const dx=
        Math.cos(angle);

    const dy=
        Math.sin(angle);

    let hit=null;

    let hitDistance=
        MAX_DISTANCE;


    /*
    Avance de la bala.
    */

    for(
        let d=5;
        d<MAX_DISTANCE;
        d+=3
    ){

        const x=
            player.x+dx*d;

        const y=
            player.y+dy*d;

        if(isWall(x,y))
            break;

        /*
        Hitbox circular.
        */

        for(
            const z of zombies
        ){

            if(!z.alive)
                continue;

            const zx=
                z.x-x;

            const zy=
                z.y-y;

            if(
                Math.hypot(
                    zx,
                    zy
                )<=
                z.radius+6
            ){

                if(d<hitDistance){

                    hit=z;
                    hitDistance=d;
                }
            }
        }
    }


    if(hit){

        hit.health-=45;

        hit.flash=.12;

        createImpact(
            hit.x,
            hit.y
        );

        if(hit.health<=0){

            hit.health=0;

            hit.alive=false;

            showMessage(
                "ZOMBIE ELIMINADO"
            );
        }

    }else{

        /*
        Impacto visual aproximado
        al final del disparo.
        */

        createMuzzleParticles();
    }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

const particles=[];

let muzzleFlash=0;


function createImpact(x,y){

    for(let i=0;i<12;i++){

        particles.push({

            x:x,

            y:y,

            life:rnd(.15,.4),

            speed:rnd(35,100),

            angle:rnd(
                0,
                Math.PI*2
            )
        });
    }
}


function createMuzzleParticles(){

    for(let i=0;i<9;i++){

        particles.push({

            x:
                player.x+
                Math.cos(
                    player.angle
                )*25,

            y:
                player.y+
                Math.sin(
                    player.angle
                )*25,

            life:rnd(.1,.3),

            speed:rnd(30,100),

            angle:
                player.angle+
                rnd(-.8,.8)
        });
    }
}


function updateParticles(dt){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.life-=dt;

        p.x+=
            Math.cos(
                p.angle
            )*
            p.speed*
            dt;

        p.y+=
            Math.sin(
                p.angle
            )*
            p.speed*
            dt;

        if(p.life<=0)
            particles.splice(
                i,
                1
            );
    }

    muzzleFlash=
        Math.max(
            0,
            muzzleFlash-dt
        );

    weaponKick=
        Math.max(
            0,
            weaponKick-dt*.7
        );
}


/* =========================================================
   IA ZOMBIES
========================================================= */

function updateZombies(dt){

    for(
        const z of zombies
    ){

        if(!z.alive)
            continue;

        z.attack=
            Math.max(
                0,
                z.attack-dt
            );

        z.flash=
            Math.max(
                0,
                z.flash-dt
            );


        let target=
            player;


        /*
        El superviviente se convierte
        en objetivo prioritario.
        */

        if(
            survivor &&
            survivor.rescued &&
            survivor.health>0
        ){

            const ds=
                distance(
                    z,
                    survivor
                );

            const dp=
                distance(
                    z,
                    player
                );

            if(ds<dp*1.15)
                target=survivor;
        }


        const dx=
            target.x-z.x;

        const dy=
            target.y-z.y;

        const d=
            Math.hypot(dx,dy);


        if(d<310){

            if(d>34){

                moveEntity(
                    z,

                    dx/d*
                    z.speed*
                    dt,

                    dy/d*
                    z.speed*
                    dt
                );

            }else{

                if(
                    z.attack<=0
                ){

                    target.health=
                        Math.max(
                            0,
                            target.health-8
                        );

                    z.attack=.8;
                }
            }
        }
    }
}


/* =========================================================
   IA SUPERVIVIENTE
========================================================= */

function updateSurvivor(dt){

    if(!survivor)
        return;

    if(!survivor.rescued)
        return;


    /*
    Buscar peligro.
    */

    let danger=null;

    let nearest=
        Infinity;

    for(
        const z of zombies
    ){

        if(!z.alive)
            continue;

        const d=
            distance(
                survivor,
                z
            );

        if(d<nearest){

            nearest=d;
            danger=z;
        }
    }


    /*
    Huir.
    */

    if(
        danger &&
        nearest<210
    ){

        survivor.escaping=true;

        survivor.safeTime=0;

        const dx=
            survivor.x-
            danger.x;

        const dy=
            survivor.y-
            danger.y;

        const d=
            Math.hypot(
                dx,
                dy
            )||1;

        moveEntity(
            survivor,

            dx/d*
            survivor.speed*
            1.9*
            dt,

            dy/d*
            survivor.speed*
            1.9*
            dt
        );

        return;
    }


    if(survivor.escaping){

        survivor.safeTime+=dt;

        if(
            survivor.safeTime>2
        ){

            survivor.escaping=false;
            survivor.safeTime=0;
        }
    }


    /*
    Seguir jugador.
    */

    if(
        survivor.following &&
        !survivor.escaping
    ){

        const dx=
            player.x-
            survivor.x;

        const dy=
            player.y-
            survivor.y;

        const d=
            Math.hypot(
                dx,
                dy
            );

        if(d>70){

            moveEntity(
                survivor,

                dx/d*
                survivor.speed*
                dt,

                dy/d*
                survivor.speed*
                dt
            );
        }
    }
}

let moveX=0;
let moveY=0;

const joy=
    document.getElementById(
        "joystick"
    );

const joyStick=
    document.getElementById(
        "joyStick"
    );

let joyPointer=null;


function updateJoy(x,y){

    const r=
        joy.getBoundingClientRect();

    const cx=
        r.left+68;

    const cy=
        r.top+68;

    let dx=x-cx;
    let dy=y-cy;

    const max=48;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=
            dx/d*max;

        dy=
            dy/d*max;
    }

    moveX=dx/max;
    moveY=dy/max;

    joyStick.style.left=
        (68+dx)+"px";

    joyStick.style.top=
        (68+dy)+"px";
}


function resetJoy(){

    joyPointer=null;

    moveX=0;
    moveY=0;

    joyStick.style.left="68px";
    joyStick.style.top="68px";
}


joy.addEventListener(
    "pointerdown",
    e=>{

        joyPointer=e.pointerId;

        joy.setPointerCapture(
            e.pointerId
        );

        updateJoy(
            e.clientX,
            e.clientY
        );
    }
);


joy.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId===
            joyPointer
        ){

            updateJoy(
                e.clientX,
                e.clientY
            );
        }
    }
);


joy.addEventListener(
    "pointerup",
    resetJoy
);

joy.addEventListener(
    "pointercancel",
    resetJoy
);

function action(){

    if(
        mission===0 &&
        !survivor.rescued &&
        distance(
            player,
            survivor
        )<90
    ){

        survivor.rescued=true;

        survivor.following=true;

        mission=1;

        document.getElementById(
            "rescue"
        ).style.display=
            "block";

        document.getElementById(
            "follow"
        ).style.display=
            "flex";

        document.getElementById(
            "survivorName"
        ).textContent=
            survivor.name;

        showMessage(
            survivor.name+
            " · TE SEGUIRÉ"
        );

        updateMission();

        return;
    }


    if(
        mission>=1 &&
        stairs &&
        distance(
            player,
            stairs
        )<90
    ){

        floorNumber++;

        createFloor();

        survivor.rescued=true;

        survivor.following=true;

        mission=1;

        /*
        Aparece junto al jugador,
        con los pies en el suelo.
        */

        survivor.x=
            player.x+
            Math.cos(
                player.angle+
                Math.PI
            )*65;

        survivor.y=
            player.y+
            Math.sin(
                player.angle+
                Math.PI
            )*65;

        if(
            !circleFree(
                survivor.x,
                survivor.y,
                survivor.radius
            )
        ){

            survivor.x=
                player.x;

            survivor.y=
                player.y+
                60;
        }

        document.getElementById(
            "rescue"
        ).style.display=
            "block";

        document.getElementById(
            "follow"
        ).style.display=
            "flex";

        document.getElementById(
            "survivorName"
        ).textContent=
            survivor.name;

        updateMission();
    }
}

/* =========================================================
   MOVIMIENTO
========================================================= */

function updatePlayer(dt){

    let forward=
        moveY*-1;

    let strafe=
        moveX;

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>1){

        forward/=len;
        strafe/=len;
    }

    player.moving=
        Math.abs(forward)+
        Math.abs(strafe)>.05;

    if(!player.moving)
        return;

    const speed=
        player.speed*dt;

    const dx=
        (
            Math.cos(
                player.angle
            )*forward -

            Math.sin(
                player.angle
            )*strafe
        )*speed;

    const dy=
        (
            Math.sin(
                player.angle
            )*forward +

            Math.cos(
                player.angle
            )*strafe
        )*speed;

    if(
        circleFree(
            player.x+dx,
            player.y,
            PLAYER_RADIUS
        )
    ){

        player.x+=dx;
    }

    if(
        circleFree(
            player.x,
            player.y+dy,
            PLAYER_RADIUS
        )
    ){

        player.y+=dy;
    }
}


/* =========================================================
   RAYCAST
========================================================= */

function rayDistance(angle){

    const dx=
        Math.cos(angle);

    const dy=
        Math.sin(angle);

    let d=0;

    while(
        d<MAX_DISTANCE
    ){

        d+=4;

        if(
            isWall(
                player.x+dx*d,
                player.y+dy*d
            )
        ){

            return d;
        }
    }

    return MAX_DISTANCE;
}


/* =========================================================
   PROYECCIÓN
========================================================= */

function project(e){

    const dx=
        e.x-player.x;

    const dy=
        e.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    let angle=
        Math.atan2(
            dy,
            dx
        )-
        player.angle;


    while(angle>Math.PI)
        angle-=Math.PI*2;

    while(angle<-Math.PI)
        angle+=Math.PI*2;


    const corrected=
        distance*
        Math.cos(angle);

    if(
        corrected<=2 ||
        Math.abs(angle)>FOV*.8
    )
        return null;


    const sx=
        W/2+
        (
            Math.tan(angle)/
            Math.tan(FOV/2)
        )*
        W/2;


    /*
    MUY IMPORTANTE:
    bottom = suelo.
    */

    const horizon=
        H/2+
        player.pitch*
        H*.72;


    const feet=
        horizon+
        CAMERA_HEIGHT*
        H*.52/
        corrected;


    const height=
        e.height*
        H*.52/
        corrected;


    return {

        x:sx,

        top:
            feet-height,

        bottom:
            feet,

        width:
            height*.52,

        distance:corrected
    };
}


/* =========================================================
   RENDER MUNDO
========================================================= */

function render(){

    const horizon=
        H/2+
        player.pitch*
        H*.72;


    /*
    CIELO
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            horizon
        );

    sky.addColorStop(
        0,
        "#0c1217"
    );

    sky.addColorStop(
        1,
        "#282525"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        Math.max(
            0,
            horizon
        )
    );


    /*
    SUELO
    */

    const floor=
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    floor.addColorStop(
        0,
        "#302c27"
    );

    floor.addColorStop(
        1,
        "#090909"
    );

    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /*
    RAYCAST
    */

    const rays=
        Math.floor(
            Math.min(
                W,
                900
            )*.72
        );

    const strip=
        W/rays;

    const depth=
        new Float32Array(
            rays
        );


    for(
        let i=0;
        i<rays;
        i++
    ){

        const cameraX=
            i/rays-.5;

        const angle=
            player.angle+
            Math.atan(
                cameraX*
                Math.tan(
                    FOV/2
                )*2
            );


        let d=
            rayDistance(
                angle
            );


        d*=
            Math.cos(
                angle-
                player.angle
            );


        depth[i]=d;


        const wallHeight=
            TILE*
            1.7*
            H/
            d;


        const top=
            horizon-
            wallHeight/2;


        const light=
            Math.max(
                .12,
                1-d/950
            );


        const v=
            Math.floor(
                100*light
            );


        ctx.fillStyle=
            `rgb(
                ${v+20},
                ${v+18},
                ${v+16}
            )`;


        ctx.fillRect(
            i*strip,
            top,
            strip+1,
            wallHeight
        );
    }


    renderEntities(
        depth,
        rays
    );


    renderItems(
        depth,
        rays
    );


    renderWeapon();
}


/* =========================================================
   ENTIDADES
========================================================= */

function renderEntities(
    depth,
    rays
){

    const list=[];


    for(
        const z of zombies
    ){

        if(!z.alive)
            continue;

        const p=
            project(z);

        if(p){

            list.push({
                entity:z,
                projection:p,
                type:"zombie"
            });
        }
    }


    if(
        survivor &&
        survivor.health>0
    ){

        const p=
            project(
                survivor
            );

        if(p){

            list.push({
                entity:survivor,
                projection:p,
                type:"survivor"
            });
        }
    }


    /*
    Más lejos primero.
    */

    list.sort(
        (a,b)=>
            b.projection.distance-
            a.projection.distance
    );


    for(
        const item of list
    ){

        const p=
            item.projection;

        const idx=
            Math.floor(
                p.x/W*rays
            );


        if(
            idx>=0 &&
            idx<rays &&
            p.distance>
            depth[idx]+12
        )
            continue;


        if(
            item.type==="zombie"
        ){

            drawZombie(
                item.entity,
                p
            );

        }else{

            drawSurvivor(
                item.entity,
                p
            );
        }
    }
}


/* =========================================================
   ZOMBIE
========================================================= */

function drawZombie(
    z,
    p
){

    const x=p.x;
    const y=p.top;
    const w=p.width;
    const h=p.height;


    ctx.save();


    /*
    sombra
    */

    ctx.fillStyle=
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        p.bottom,
        w*.46,
        h*.065,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    piernas
    */

    ctx.strokeStyle="#292929";

    ctx.lineWidth=
        Math.max(
            4,
            w*.11
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.1,
        y+h*.68
    );

    ctx.lineTo(
        x-w*.15,
        p.bottom
    );

    ctx.moveTo(
        x+w*.1,
        y+h*.68
    );

    ctx.lineTo(
        x+w*.15,
        p.bottom
    );

    ctx.stroke();


    /*
    cuerpo
    */

    ctx.fillStyle=
        z.flash>0
        ?"white"
        :"#505050";

    ctx.fillRect(
        x-w*.27,
        y+h*.28,
        w*.54,
        h*.45
    );


    /*
    cabeza
    */

    ctx.fillStyle=
        z.flash>0
        ?"white"
        :"#777";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.17,
        w*.18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    ojos
    */

    ctx.fillStyle="#c52e2e";

    ctx.fillRect(
        x-w*.105,
        y+h*.15,
        w*.055,
        w*.055
    );

    ctx.fillRect(
        x+w*.05,
        y+h*.15,
        w*.055,
        w*.055
    );


    /*
    brazos
    */

    ctx.strokeStyle=
        z.flash>0
        ?"white"
        :"#555";

    ctx.lineWidth=
        Math.max(
            3,
            w*.09
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.27,
        y+h*.35
    );

    ctx.lineTo(
        x-w*.45,
        y+h*.56
    );

    ctx.moveTo(
        x+w*.27,
        y+h*.35
    );

    ctx.lineTo(
        x+w*.45,
        y+h*.56
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   SUPERVIVIENTE
========================================================= */

function drawSurvivor(
    s,
    p
){

    const x=p.x;
    const y=p.top;
    const w=p.width;
    const h=p.height;


    ctx.save();


    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        p.bottom,
        w*.45,
        h*.065,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    piernas
    */

    ctx.strokeStyle="#252525";

    ctx.lineWidth=
        Math.max(
            4,
            w*.1
        );

    ctx.beginPath();

    ctx.moveTo(
        x-w*.1,
        y+h*.7
    );

    ctx.lineTo(
        x-w*.15,
        p.bottom
    );

    ctx.moveTo(
        x+w*.1,
        y+h*.7
    );

    ctx.lineTo(
        x+w*.15,
        p.bottom
    );

    ctx.stroke();


    /*
    cuerpo
    */

    ctx.fillStyle=
        s.escaping
        ?" #9d7438"
        :"#315b80";

    ctx.fillRect(
        x-w*.26,
        y+h*.28,
        w*.52,
        h*.45
    );


    /*
    cabeza
    */

    ctx.fillStyle="#b9876a";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.17,
        w*.17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    cabello
    */

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.12,
        w*.18,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
    nombre
    */

    ctx.font=
        "bold "+
        Math.max(
            9,
            w*.22
        )+
        "px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.fillText(
        s.name,
        x,
        y-6
    );


    ctx.restore();
}


/* =========================================================
   ITEMS
========================================================= */

function renderItems(
    depth,
    rays
){

    for(
        const item of items
    ){

        if(item.collected)
            continue;


        const p=
            project({

                x:item.x,

                y:item.y,

                height:.28
            });


        if(!p)
            continue;


        const idx=
            Math.floor(
                p.x/W*rays
            );


        if(
            idx>=0 &&
            idx<rays &&
            p.distance>
            depth[idx]+8
        )
            continue;


        ctx.fillStyle=
            item.type==="ammo"
            ?" #d3ad45"
            :"#4fc779";


        ctx.fillRect(
            p.x-p.width*.25,
            p.bottom-p.height,
            p.width*.5,
            p.height
        );
    }


    /*
    Escalera
    */

    if(stairs){

        const p=
            project({

                x:stairs.x,

                y:stairs.y,

                height:.4
            });


        if(p){

            ctx.strokeStyle=
                "#aaa";

            ctx.lineWidth=
                Math.max(
                    2,
                    p.width*.08
                );

            for(
                let i=0;
                i<5;
                i++
            ){

                const yy=
                    p.bottom-
                    i*
                    p.height/4;

                ctx.beginPath();

                ctx.moveTo(
                    p.x-p.width*.42,
                    yy
                );

                ctx.lineTo(
                    p.x+p.width*.42,
                    yy
                );

                ctx.stroke();
            }
        }
    }
}


/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    const x=
        W*.70;

    const y=
        H*.80+
        weaponKick*
        H;


    ctx.save();


    /*
    brazo
    */

    ctx.fillStyle="#9c7862";

    ctx.beginPath();

    ctx.moveTo(
        x-55,
        y+75
    );

    ctx.lineTo(
        x+20,
        y+10
    );

    ctx.lineTo(
        x+60,
        y+70
    );

    ctx.lineTo(
        x-8,
        y+110
    );

    ctx.closePath();

    ctx.fill();


    /*
    arma
    */

    ctx.fillStyle="#202020";

    ctx.fillRect(
        x-13,
        y-48,
        27,
        130
    );


    ctx.fillStyle="#555";

    ctx.fillRect(
        x-8,
        y-82,
        17,
        42
    );


    ctx.fillStyle="#111";

    ctx.fillRect(
        x-15,
        y-94,
        31,
        17
    );


    /*
    flash
    */

    if(muzzleFlash>0){

        ctx.fillStyle=
            "rgba(255,210,100,.8)";

        ctx.beginPath();

        ctx.arc(
            x,
            y-100,
            17+
            Math.random()*8,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =========================================================
   MINIMAPA
========================================================= */

function renderMini(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,
        0,
        mw,
        mh
    );


    const cell=
        Math.min(
            mw/MAP_W,
            mh/MAP_H
        );


    /*
    mapa completo.
    */

    for(
        let y=0;
        y<MAP_H;
        y++
    )
    for(
        let x=0;
        x<MAP_W;
        x++
    ){

        mctx.fillStyle=
            map[y][x]===1
            ?" #222"
            :"#888";


        mctx.fillRect(
            x*cell,
            y*cell,
            cell+.5,
            cell+.5
        );
    }


    /*
    Items
    */

    for(
        const item of items
    ){

        if(item.collected)
            continue;

        mctx.fillStyle=
            item.type==="ammo"
            ?" #e0bc4c"
            :"#45ca77";

        mctx.fillRect(
            item.x/TILE*cell-2,
            item.y/TILE*cell-2,
            4,
            4
        );
    }


    /*
    escalera
    */

    if(stairs){

        mctx.fillStyle=
            "white";

        mctx.fillRect(
            stairs.x/TILE*cell-3,
            stairs.y/TILE*cell-3,
            6,
            6
        );
    }


    /*
    puerta
    */

    if(door){

        mctx.fillStyle=
            "#42a9ff";

        mctx.fillRect(
            door.x/TILE*cell-3,
            door.y/TILE*cell-3,
            6,
            6
        );
    }


    /*
    zombies
    */

    for(
        const z of zombies
    ){

        if(!z.alive)
            continue;

        mctx.fillStyle="#d53d3d";

        mctx.beginPath();

        mctx.arc(
            z.x/TILE*cell,
            z.y/TILE*cell,
            3.2,
            0,
            Math.PI*2
        );

        mctx.fill();
    }


    /*
    superviviente
    */

    if(
        survivor &&
        survivor.health>0
    ){

        mctx.fillStyle=
            "#45dc82";

        mctx.beginPath();

        mctx.arc(
            survivor.x/TILE*cell,
            survivor.y/TILE*cell,
            4,
            0,
            Math.PI*2
        );

        mctx.fill();
    }


    /*
    jugador + dirección.
    */

    const px=
        player.x/TILE*cell;

    const py=
        player.y/TILE*cell;


    mctx.save();

    mctx.translate(
        px,
        py
    );

    mctx.rotate(
        player.angle
    );


    mctx.strokeStyle=
        "white";

    mctx.lineWidth=2;

    mctx.beginPath();

    mctx.moveTo(
        0,
        0
    );

    mctx.lineTo(
        14,
        0
    );

    mctx.stroke();


    mctx.fillStyle=
        "white";

    mctx.beginPath();

    mctx.moveTo(
        7,
        0
    );

    mctx.lineTo(
        -5,
        -5
    );

    mctx.lineTo(
        -5,
        5
    );

    mctx.closePath();

    mctx.fill();

    mctx.restore();
}


/* =========================================================
   GAME UPDATE
========================================================= */

let last=
    performance.now();


function update(){

    const now=
        performance.now();

    let dt=
        (now-last)/1000;

    last=now;

    dt=
        Math.min(
            dt,
            .033
        );


    updatePlayer(dt);

    updateZombies(dt);

    updateSurvivor(dt);

    collectItems();

    updateParticles(dt);

    updateMessage(dt);

    updateAction();

    updateHUD();
}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    update();

    render();

    renderMini();

    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   INICIO
========================================================= */

createFloor();

updateAmmo();

updateHUD();

loop();

</script>
