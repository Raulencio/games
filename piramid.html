<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#b88b50;
}

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:
        radial-gradient(circle at center,#70502c 0,#251a11 55%,#080706 100%);
}

.menuBox{
    width:min(94vw,430px);
    max-height:94vh;
    overflow:auto;
    padding:22px 17px;
    border:2px solid #d5ac58;
    border-radius:22px;
    background:rgba(19,14,10,.97);
    box-shadow:0 0 45px rgba(0,0,0,.8);
    text-align:center;
}

.logo{
    color:#e5c474;
    font-size:clamp(25px,8vw,42px);
    line-height:.95;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 3px 0 #553617;
}

.subtitle{
    margin:10px 0 18px;
    color:#c8b28b;
    font-size:11px;
}

.start{
    width:100%;
    min-height:57px;
    margin-bottom:18px;
    border:0;
    border-radius:15px;
    background:linear-gradient(#f2d47e,#b77b28);
    color:#24170b;
    font-size:17px;
    font-weight:900;
}

.godTitle{
    margin-bottom:10px;
    color:#e0c47c;
    font-weight:bold;
    font-size:14px;
}

.godsMenu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.godCard{
    padding:9px 4px;
    border:1px solid #594127;
    border-radius:12px;
    background:#1b1510;
    color:#ddd;
}

.godCard.selected{
    border-color:#e6c26c;
    box-shadow:0 0 14px rgba(230,194,108,.35);
}

.glyph{
    width:42px;
    height:42px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #9c793b;
    border-radius:10px;
    background:#302317;
    color:#e5c16a;
    font-size:24px;
}

.godName{
    margin-top:5px;
    font-size:10px;
    font-weight:bold;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#topHud{
    position:absolute;
    top:max(7px,env(safe-area-inset-top));
    left:7px;
    right:7px;
    display:flex;
    gap:7px;
    align-items:center;
}

#playerPanel{
    flex:1;
    min-width:0;
    padding:7px 9px;
    border:1px solid rgba(225,192,109,.6);
    border-radius:12px;
    background:rgba(17,13,9,.78);
}

#playerName{
    color:#e6ca83;
    font-size:10px;
    font-weight:bold;
}

.bar{
    height:7px;
    margin-top:4px;
    overflow:hidden;
    border-radius:5px;
    background:#261a12;
}

.fill{
    height:100%;
    width:100%;
    transition:width .15s;
}

#hpFill{
    background:#c94e42;
}

#xpFill{
    background:#4ea6d0;
}

#level{
    margin-top:3px;
    color:#eee;
    font-size:9px;
}

#godHUD{
    width:50px;
    height:50px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #d1aa58;
    border-radius:13px;
    background:rgba(22,16,11,.9);
    color:#e8c774;
    font-size:27px;
}

/* =========================================================
   MINIMAPA
========================================================= */

#mapWrap{
    position:absolute;
    top:68px;
    right:7px;
    width:min(31vw,125px);
    aspect-ratio:1;
    padding:3px;
    border:1px solid #d2a952;
    border-radius:10px;
    background:rgba(10,8,6,.88);
}

#minimap{
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   MENSAJES
========================================================= */

#messages{
    position:absolute;
    left:50%;
    bottom:117px;
    transform:translateX(-50%);
    width:min(67vw,310px);
    height:75px;
    padding:7px;
    overflow:hidden;
    border:1px solid rgba(216,178,88,.4);
    border-radius:10px;
    background:rgba(13,10,7,.48);
    color:#e7d5a7;
    font-size:10px;
    line-height:1.35;
}

.msg{
    opacity:.78;
    margin-bottom:2px;
}

.msg:last-child{
    opacity:1;
    color:#fff0bf;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick{
    position:absolute;
    left:max(12px,env(safe-area-inset-left));
    bottom:max(17px,env(safe-area-inset-bottom));
    width:112px;
    height:112px;
    border:2px solid rgba(220,184,101,.42);
    border-radius:50%;
    background:rgba(26,20,15,.45);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:49px;
    height:49px;
    transform:translate(-50%,-50%);
    border:2px solid #e8c875;
    border-radius:50%;
    background:rgba(216,178,90,.68);
}

/* =========================================================
   BOTONES
========================================================= */

#buttons{
    position:absolute;
    right:max(11px,env(safe-area-inset-right));
    bottom:max(17px,env(safe-area-inset-bottom));
    width:125px;
    height:120px;
    pointer-events:none;
}

.action{
    position:absolute;
    border:2px solid rgba(229,194,104,.8);
    border-radius:50%;
    background:rgba(35,25,17,.84);
    color:#efd185;
    font-weight:900;
    pointer-events:auto;
}

#attack{
    right:0;
    bottom:0;
    width:72px;
    height:72px;
    font-size:12px;
}

#ability{
    left:0;
    bottom:48px;
    width:53px;
    height:53px;
    font-size:20px;
}

#godSelect{
    left:0;
    bottom:0;
    width:42px;
    height:42px;
    font-size:15px;
}

.action:active,
.start:active{
    transform:scale(.94);
}

/* =========================================================
   TELÉFONOS PEQUEÑOS
========================================================= */

@media(max-width:340px){

    #joystick{
        width:94px;
        height:94px;
    }

    #stick{
        width:42px;
        height:42px;
    }

    #buttons{
        width:108px;
    }

    #attack{
        width:63px;
        height:63px;
        font-size:10px;
    }

    #messages{
        bottom:103px;
        width:61vw;
        height:67px;
        font-size:9px;
    }

    #mapWrap{
        width:104px;
        top:65px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =======================================================
     MENÚ
======================================================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            PYRAMID<br>OF THE GODS
        </div>

        <div class="subtitle">
            FPS 2.5D · TEMPLOS · DIOSES · EXPLORACIÓN
        </div>

        <button class="start" id="startBtn">
            INICIAR EXPLORACIÓN
        </button>

        <div class="godTitle">
            ELIGE TU DIOS
        </div>

        <div class="godsMenu">

            <div class="godCard selected" data-god="RA">
                <div class="glyph">☀</div>
                <div class="godName">RA</div>
            </div>

            <div class="godCard" data-god="ANUBIS">
                <div class="glyph">𓃢</div>
                <div class="godName">ANUBIS</div>
            </div>

            <div class="godCard" data-god="HORUS">
                <div class="glyph">𓅃</div>
                <div class="godName">HORUS</div>
            </div>

            <div class="godCard" data-god="ISIS">
                <div class="glyph">𓊨</div>
                <div class="godName">ISIS</div>
            </div>

            <div class="godCard" data-god="SETH">
                <div class="glyph">𓃩</div>
                <div class="godName">SETH</div>
            </div>

            <div class="godCard" data-god="OSIRIS">
                <div class="glyph">𓀀</div>
                <div class="godName">OSIRIS</div>
            </div>

        </div>
    </div>
</div>

<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div id="topHud">

        <div id="playerPanel">

            <div id="playerName">
                EXPLORADOR · NIVEL 1
            </div>

            <div class="bar">
                <div class="fill" id="hpFill"></div>
            </div>

            <div class="bar">
                <div class="fill" id="xpFill"></div>
            </div>

            <div id="level">
                HP 100 / 100 · XP 0 / 100
            </div>

        </div>

        <div id="godHUD">☀</div>

    </div>

    <div id="mapWrap">
        <canvas id="minimap"></canvas>
    </div>

    <div id="messages"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">

        <button class="action" id="ability">✦</button>

        <button class="action" id="godSelect">☀</button>

        <button class="action" id="attack">
            ATAQUE
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d",{alpha:false});

const mini =
    document.getElementById("minimap");

const mctx =
    mini.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;

    const size =
        Math.min(
            180,
            Math.max(
                100,
                window.innerWidth*.31
            )
        );

    mini.width=size;
    mini.height=size;
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   UTILIDADES
========================================================= */

function randomInt(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;
}

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );
}

function dist(ax,ay,bx,by){

    return Math.hypot(
        ax-bx,
        ay-by
    );
}

function angleDiff(a,b){

    let d=a-b;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return d;
}

/* =========================================================
   MAPA
========================================================= */

const FLOOR=0;
const WALL=1;
const DOOR=2;

let map=[];
let mapW=0;
let mapH=0;

let currentRooms=[];

const TILE_SIZE=1;

function emptyMap(w,h){

    mapW=w;
    mapH=h;

    map=
        Array.from(
            {length:h},
            ()=>Array(w).fill(WALL)
        );
}

/*
   El mapa utiliza celdas reales.

   1 celda = 1 unidad de distancia.

   El arma utiliza exactamente esta misma escala.
*/

function generateMap(){

    emptyMap(
        randomInt(48,60),
        randomInt(48,60)
    );

    const rooms=[];

    const roomCount=
        randomInt(8,11);

    for(
        let i=0;
        i<roomCount;
        i++
    ){

        let placed=false;

        for(
            let attempt=0;
            attempt<100 && !placed;
            attempt++
        ){

            const rw=
                randomInt(7,12);

            const rh=
                randomInt(7,12);

            const rx=
                randomInt(
                    2,
                    mapW-rw-3
                );

            const ry=
                randomInt(
                    2,
                    mapH-rh-3
                );

            const room={
                x:rx,
                y:ry,
                w:rw,
                h:rh,
                cx:Math.floor(
                    rx+rw/2
                ),
                cy:Math.floor(
                    ry+rh/2
                )
            };

            let overlap=false;

            for(const r of rooms){

                if(
                    rx < r.x+r.w+2 &&
                    rx+rw+2 > r.x &&
                    ry < r.y+r.h+2 &&
                    ry+rh+2 > r.y
                ){
                    overlap=true;
                    break;
                }
            }

            if(overlap)
                continue;

            rooms.push(room);

            for(
                let y=ry;
                y<ry+rh;
                y++
            ){

                for(
                    let x=rx;
                    x<rx+rw;
                    x++
                ){

                    map[y][x]=FLOOR;
                }
            }

            placed=true;
        }
    }

    /*
       Ordenamos para crear una estructura
       de habitaciones y pasillos.
    */

    rooms.sort(
        (a,b)=>a.cx-b.cx
    );

    /*
       Conexión principal.
    */

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        connectRooms(
            rooms[i-1],
            rooms[i]
        );
    }

    /*
       Algunas conexiones adicionales.
       Esto evita convertir el mapa en un laberinto.
    */

    for(
        let i=0;
        i<rooms.length-2;
        i++
    ){

        if(Math.random()<.38){

            connectRooms(
                rooms[i],
                rooms[i+2]
            );
        }
    }

    /*
       Bordes sólidos.
    */

    for(
        let x=0;
        x<mapW;
        x++
    ){

        map[0][x]=WALL;
        map[mapH-1][x]=WALL;
    }

    for(
        let y=0;
        y<mapH;
        y++
    ){

        map[y][0]=WALL;
        map[y][mapW-1]=WALL;
    }

    /*
       Sala inicial.
    */

    const start=rooms[0];

    player.x=start.cx+.5;
    player.y=start.cy+.5;
    player.angle=0;

    /*
       Puerta únicamente en una sala posterior.
    */

    const exitRoom=
        rooms[
            rooms.length-1
        ];

    placeDoor(exitRoom);

    currentRooms=rooms;
}

function connectRooms(a,b){

    if(Math.random()<.5){

        carveHorizontal(
            a.cx,
            b.cx,
            a.cy
        );

        carveVertical(
            a.cy,
            b.cy,
            b.cx
        );

    }else{

        carveVertical(
            a.cy,
            b.cy,
            a.cx
        );

        carveHorizontal(
            a.cx,
            b.cx,
            b.cy
        );
    }
}

function carveHorizontal(a,b,y){

    const min=Math.min(a,b);
    const max=Math.max(a,b);

    for(
        let x=min;
        x<=max;
        x++
    ){

        for(
            let yy=y-1;
            yy<=y+1;
            yy++
        ){

            if(
                yy>0 &&
                yy<mapH-1 &&
                x>0 &&
                x<mapW-1
            ){

                map[yy][x]=FLOOR;
            }
        }
    }
}

function carveVertical(a,b,x){

    const min=Math.min(a,b);
    const max=Math.max(a,b);

    for(
        let y=min;
        y<=max;
        y++
    ){

        for(
            let xx=x-1;
            xx<=x+1;
            xx++
        ){

            if(
                y>0 &&
                y<mapH-1 &&
                xx>0 &&
                xx<mapW-1
            ){

                map[y][xx]=FLOOR;
            }
        }
    }
}

/* =========================================================
   PUERTA
========================================================= */

let door={
    x:0,
    y:0,
    side:"N"
};

function placeDoor(room){

    const options=[
        {
            x:room.cx,
            y:room.y,
            side:"N"
        },
        {
            x:room.cx,
            y:room.y+room.h-1,
            side:"S"
        },
        {
            x:room.x,
            y:room.cy,
            side:"W"
        },
        {
            x:room.x+room.w-1,
            y:room.cy,
            side:"E"
        }
    ];

    const selected=
        options[
            randomInt(
                0,
                options.length-1
            )
        ];

    /*
       La puerta ocupa una celda de pared.
       Por eso forma parte del muro.
    */

    map[
        selected.y
    ][
        selected.x
    ]=DOOR;

    door=selected;
}

function tileAt(x,y){

    const tx=Math.floor(x);
    const ty=Math.floor(y);

    if(
        tx<0 ||
        ty<0 ||
        tx>=mapW ||
        ty>=mapH
    ){
        return WALL;
    }

    return map[ty][tx];
}

function solid(x,y){

    const t=tileAt(x,y);

    return (
        t===WALL ||
        t===DOOR
    );
}

/* =========================================================
   VISIBILIDAD
========================================================= */

/*
   Esta es una de las partes importantes:

   Antes de dibujar un enemigo comprobamos cada pequeño
   tramo entre jugador y enemigo.

   Si aparece WALL o DOOR:
       enemigo NO visible.

   Esto evita enemigos atravesando paredes.
*/

function hasLineOfSight(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const distance=
        Math.hypot(dx,dy);

    if(distance<.05){
        return true;
    }

    /*
       0.06 unidades por comprobación.
       Suficiente para detectar paredes
       incluso en ángulos diagonales.
    */

    const steps=
        Math.ceil(
            distance/.06
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=
            x1+dx*t;

        const y=
            y1+dy*t;

        const tile=
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return false;
        }
    }

    return true;
}

/* =========================================================
   JUGADOR
========================================================= */

const player={

    x:5.5,
    y:5.5,

    angle:0,

    radius:.22,

    hp:100,
    maxHp:100,

    xp:0,
    nextXP:100,

    level:1,

    speed:2.5,

    damage:25,

    /*
       IMPORTANTE:
       5 = cinco celdas reales del mapa.
    */

    range:5,

    attackTime:0,

    attackDuration:.28,

    attackCooldown:0
};

function movePlayer(dx,dy){

    const nx=
        player.x+dx;

    const ny=
        player.y+dy;

    /*
       Colisión X.
    */

    if(
        !solid(
            nx-player.radius,
            player.y
        ) &&
        !solid(
            nx+player.radius,
            player.y
        )
    ){

        player.x=nx;
    }

    /*
       Colisión Y.
    */

    if(
        !solid(
            player.x,
            ny-player.radius
        ) &&
        !solid(
            player.x,
            ny+player.radius
        )
    ){

        player.y=ny;
    }
}

/* =========================================================
   DIOSES
========================================================= */

const gods={

    RA:{
        icon:"☀",
        speed:1,
        damage:1.1,
        hp:1,
        ability:"Lanza solar"
    },

    ANUBIS:{
        icon:"𓃢",
        speed:1.05,
        damage:1.25,
        hp:1,
        ability:"Juicio"
    },

    HORUS:{
        icon:"𓅃",
        speed:1.15,
        damage:1,
        hp:1,
        ability:"Ojo de Horus"
    },

    ISIS:{
        icon:"𓊨",
        speed:1,
        damage:.9,
        hp:1.3,
        ability:"Bendición"
    },

    SETH:{
        icon:"𓃩",
        speed:1.25,
        damage:1.3,
        hp:.9,
        ability:"Tormenta"
    },

    OSIRIS:{
        icon:"𓀀",
        speed:.9,
        damage:1.15,
        hp:1.45,
        ability:"Renacimiento"
    }
};

let selectedGod="RA";

function applyGod(){

    const god=
        gods[selectedGod];

    player.speed=
        2.5*god.speed;

    player.damage=
        25*god.damage;

    player.maxHp=
        Math.round(
            100*god.hp
        );

    player.hp=
        clamp(
            player.hp,
            0,
            player.maxHp
        );

    document.getElementById(
        "godHUD"
    ).textContent=god.icon;

    document.getElementById(
        "godSelect"
    ).textContent=god.icon;
}

document
.querySelectorAll(".godCard")
.forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            selectedGod=
                card.dataset.god;

            document
            .querySelectorAll(".godCard")
            .forEach(c=>{
                c.classList.remove(
                    "selected"
                );
            });

            card.classList.add(
                "selected"
            );

            applyGod();

            addMessage(
                selectedGod+
                " seleccionado."
            );
        }
    );
});

/* =========================================================
   ENEMIGOS
========================================================= */

let enemies=[];

function spawnEnemies(rooms){

    enemies=[];

    /*
       No colocamos enemigos en la primera sala.
    */

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        const room=rooms[i];

        const count=
            randomInt(
                1,
                Math.min(
                    3,
                    Math.floor(room.w/4)
                )
            );

        for(
            let n=0;
            n<count;
            n++
        ){

            let x;
            let y;

            /*
               Buscamos una posición libre.
            */

            for(
                let attempt=0;
                attempt<40;
                attempt++
            ){

                x=
                    room.x+
                    1.5+
                    Math.random()*
                    (room.w-3);

                y=
                    room.y+
                    1.5+
                    Math.random()*
                    (room.h-3);

                if(
                    !solid(x,y) &&
                    dist(
                        x,y,
                        player.x,
                        player.y
                    )>5
                ){
                    break;
                }
            }

            const maxHp=
                60+
                player.level*10;

            enemies.push({

                x,
                y,

                radius:.28,

                hp:maxHp,
                maxHp:maxHp,

                speed:
                    .65+
                    Math.random()*.35,

                attackCooldown:0,

                hitFlash:0
            });
        }
    }
}

/* =========================================================
   IA ENEMIGOS
========================================================= */

function updateEnemies(dt){

    for(const enemy of enemies){

        if(enemy.hp<=0){
            continue;
        }

        enemy.attackCooldown=
            Math.max(
                0,
                enemy.attackCooldown-dt
            );

        enemy.hitFlash=
            Math.max(
                0,
                enemy.hitFlash-dt
            );

        const distance=
            dist(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            );

        /*
           El enemigo solamente entra en persecución
           cuando tiene visión del jugador.
        */

        const visible=
            distance<12 &&
            hasLineOfSight(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            );

        if(!visible){
            continue;
        }

        if(distance>1.15){

            const dx=
                (player.x-enemy.x)/
                Math.max(distance,.001);

            const dy=
                (player.y-enemy.y)/
                Math.max(distance,.001);

            const speed=
                enemy.speed*dt;

            /*
               Movimiento con colisión.
            */

            if(
                !solid(
                    enemy.x+dx*speed,
                    enemy.y
                )
            ){
                enemy.x+=dx*speed;
            }

            if(
                !solid(
                    enemy.x,
                    enemy.y+dy*speed
                )
            ){
                enemy.y+=dy*speed;
            }

        }else{

            if(
                enemy.attackCooldown<=0
            ){

                player.hp-=8;

                enemy.attackCooldown=1.1;

                addMessage(
                    "Has recibido daño."
                );

                if(player.hp<=0){

                    player.hp=
                        player.maxHp;

                    player.x=5.5;
                    player.y=5.5;

                    addMessage(
                        "Has caído. Regresas al inicio."
                    );
                }
            }
        }
    }
}

/* =========================================================
   GUARDIÁN
========================================================= */

const guardian={

    active:false,

    x:0,
    y:0,

    angle:0,

    hp:140,
    maxHp:140,

    speed:2,

    attackCooldown:0
};

function summonGuardian(){

    /*
       El guardián siempre aparece cerca del jugador.
    */

    const spots=[
        [.9,.4],
        [-.9,.4],
        [.7,-.8],
        [-.7,-.8]
    ];

    let found=false;

    for(const s of spots){

        const x=
            player.x+s[0];

        const y=
            player.y+s[1];

        if(!solid(x,y)){

            guardian.x=x;
            guardian.y=y;

            found=true;

            break;
        }
    }

    if(!found){

        guardian.x=
            player.x+.8;

        guardian.y=
            player.y+.8;
    }

    guardian.active=true;

    addMessage(
        selectedGod+
        " ha invocado al guardián."
    );
}

function updateGuardian(dt){

    if(!guardian.active){
        return;
    }

    guardian.attackCooldown=
        Math.max(
            0,
            guardian.attackCooldown-dt
        );

    const distance=
        dist(
            guardian.x,
            guardian.y,
            player.x,
            player.y
        );

    /*
       Sigue al jugador sin pegarse a él.
    */

    if(distance>2){

        const dx=
            (player.x-guardian.x)/
            distance;

        const dy=
            (player.y-guardian.y)/
            distance;

        const speed=
            guardian.speed*dt;

        if(
            !solid(
                guardian.x+dx*speed,
                guardian.y
            )
        ){
            guardian.x+=dx*speed;
        }

        if(
            !solid(
                guardian.x,
                guardian.y+dy*speed
            )
        ){
            guardian.y+=dy*speed;
        }
    }

    /*
       Busca enemigo visible.
    */

    let target=null;
    let best=999;

    for(const enemy of enemies){

        if(enemy.hp<=0){
            continue;
        }

        const d=
            dist(
                guardian.x,
                guardian.y,
                enemy.x,
                enemy.y
            );

        if(
            d<3.4 &&
            d<best &&
            hasLineOfSight(
                guardian.x,
                guardian.y,
                enemy.x,
                enemy.y
            )
        ){

            target=enemy;
            best=d;
        }
    }

    if(target){

        guardian.angle=
            Math.atan2(
                target.y-guardian.y,
                target.x-guardian.x
            );

        if(
            guardian.attackCooldown<=0
        ){

            target.hp-=18;

            target.hitFlash=.16;

            guardian.attackCooldown=.85;

            createBurst(
                target.x,
                target.y,
                "ally"
            );

            if(target.hp<=0){

                gainXP(30);
            }
        }
    }
}

/* =========================================================
   PARTICULAS
========================================================= */

const particles=[];

function createBurst(
    x,
    y,
    type="attack"
){

    const count=
        type==="ability"
        ?25
        :15;

    for(
        let i=0;
        i<count;
        i++
    ){

        const a=
            Math.random()*
            Math.PI*2;

        const speed=
            .5+
            Math.random()*2;

        particles.push({

            x,
            y,

            vx:
                Math.cos(a)*
                speed,

            vy:
                Math.sin(a)*
                speed,

            life:
                .35+
                Math.random()*.45,

            maxLife:.8,

            type
        });
    }
}

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        if(p.life<=0){

            particles.splice(
                i,
                1
            );
        }
    }
}

/* =========================================================
   COMBATE
========================================================= */

function attack(){

    if(
        player.attackCooldown>0
    ){
        return;
    }

    player.attackTime=
        player.attackDuration;

    player.attackCooldown=.42;

    createBurst(

        player.x+
        Math.cos(player.angle)*.8,

        player.y+
        Math.sin(player.angle)*.8,

        "attack"
    );

    let best=null;

    /*
       IMPORTANTE:
       El máximo es exactamente el alcance
       definido en celdas del mapa.
    */

    let bestDistance=
        player.range;

    for(const enemy of enemies){

        if(enemy.hp<=0){
            continue;
        }

        const distance=
            dist(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

        /*
           FUERA DEL ALCANCE REAL.
        */

        if(
            distance>
            player.range
        ){
            continue;
        }

        /*
           Ángulo del objetivo.
        */

        const targetAngle=
            Math.atan2(
                enemy.y-player.y,
                enemy.x-player.x
            );

        const difference=
            Math.abs(
                angleDiff(
                    targetAngle,
                    player.angle
                )
            );

        /*
           El barrido tiene un arco frontal.
        */

        if(difference>.50){
            continue;
        }

        /*
           NO atraviesa paredes.
        */

        if(
            !hasLineOfSight(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        ){
            continue;
        }

        if(
            distance<
            bestDistance
        ){

            best=enemy;

            bestDistance=
                distance;
        }
    }

    if(best){

        best.hp-=player.damage;

        best.hitFlash=.16;

        createBurst(
            best.x,
            best.y,
            "hit"
        );

        addMessage(
            "Golpe · "+
            Math.round(
                player.damage
            )+
            " daño · "+
            bestDistance.toFixed(1)+
            " celdas"
        );

        if(best.hp<=0){

            gainXP(35);

            addMessage(
                "Enemigo derrotado · +35 XP"
            );
        }

    }else{

        addMessage(
            "Ataque sin objetivo."
        );
    }
}

   HABILIDADES
========================================================= */

function useAbility(){

    const god=
        gods[selectedGod];

    const radius=
        selectedGod==="SETH"
        ?4
        :selectedGod==="HORUS"
        ?6
        :3.5;

    let hits=0;

    for(const enemy of enemies){

        if(enemy.hp<=0){
            continue;
        }

        const d=
            dist(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

        /*
           La habilidad tampoco atraviesa paredes.
        */

        if(
            d<=radius &&
            hasLineOfSight(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        ){

            let damage=45;

            if(
                selectedGod==="ANUBIS"
            ){
                damage=60;
            }

            if(
                selectedGod==="HORUS"
            ){
                damage=38;
            }

            if(
                selectedGod==="SETH"
            ){
                damage=70;
            }

            if(
                selectedGod==="OSIRIS"
            ){
                damage=42;
            }

            enemy.hp-=damage;

            enemy.hitFlash=.3;

            createBurst(
                enemy.x,
                enemy.y,
                "ability"
            );

            hits++;

            if(enemy.hp<=0){

                gainXP(50);
            }
        }
    }

    if(
        selectedGod==="ISIS"
    ){

        player.hp=
            clamp(
                player.hp+30,
                0,
                player.maxHp
            );

        addMessage(
            "Isis restaura tu vida."
        );
    }

    addMessage(
        god.ability+
        " · "+
        hits+
        " objetivo(s)."
    );
}

/* =========================================================
   XP
========================================================= */

function gainXP(amount){

    player.xp+=amount;

    while(
        player.xp>=player.nextXP
    ){

        player.xp-=
            player.nextXP;

        player.level++;

        player.nextXP=
            Math.floor(
                player.nextXP*1.32
            );

        player.maxHp+=12;

        player.hp=
            player.maxHp;

        player.damage+=4;

        addMessage(
            "¡NIVEL "+
            player.level+
            "! Estadísticas mejoradas."
        );
    }
}

/* =========================================================
   RAYCASTER
========================================================= */

const FOV=
    Math.PI/3;

function castRay(angle){

    const sin=
        Math.sin(angle);

    const cos=
        Math.cos(angle);

    const step=.035;

    const maxDistance=30;

    for(
        let d=.02;
        d<maxDistance;
        d+=step
    ){

        const x=
            player.x+
            cos*d;

        const y=
            player.y+
            sin*d;

        const tile=
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return {
                dist:d,
                type:tile
            };
        }
    }

    return {
        dist:maxDistance,
        type:WALL
    };
}

/* =========================================================
   RENDER DEL MUNDO
========================================================= */

function renderWorld(){

    const horizon=
        H*.46;

    /*
       CIELO.
    */

    ctx.fillStyle="#b9a072";

    ctx.fillRect(
        0,
        0,
        W,
        horizon
    );

    /*
       SUELO ARENA.

       No tiene reflejos de las paredes.
    */

    ctx.fillStyle="#b78b50";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    /*
       Cantidad de columnas adaptada
       al teléfono.
    */

    const columns=
        Math.min(
            W,
            520
        );

    const columnWidth=
        W/columns;

    for(
        let i=0;
        i<columns;
        i++
    ){

        const cameraX=
            i/columns-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const hit=
            castRay(rayAngle);

        let distance=
            hit.dist;

        /*
           Corrección de perspectiva.
        */

        distance*=
            Math.cos(
                rayAngle-player.angle
            );

        const wallHeight=
            Math.min(
                H*1.5,
                H*.92/
                Math.max(
                    distance,
                    .001
                )
            );

        const top=
            horizon-
            wallHeight/2;

        /*
           Puerta oscura integrada
           en la pared.
        */

        if(
            hit.type===DOOR
        ){

            ctx.fillStyle=
                "#241a12";

        }else{

            const shade=
                clamp(
                    150-
                    distance*8,
                    35,
                    145
                );

            ctx.fillStyle=
                "rgb("+
                shade+
                ","+
                Math.floor(
                    shade*.73
                )+
                ","+
                Math.floor(
                    shade*.48
                )+
                ")";
        }

        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );
    }

    renderSprites();

    renderWeapon();

    renderParticles();
}

/* =========================================================
   SPRITES
========================================================= */

function projectSprite(obj){

    const dx=
        obj.x-player.x;

    const dy=
        obj.y-player.y;

    const distance=
        Math.hypot(dx,dy);

    if(
        distance<.15
    ){
        return null;
    }

    /*
       SEGUNDA comprobación de seguridad:
       jamás proyectamos un objeto detrás de un muro.
    */

    if(
        !hasLineOfSight(
            player.x,
            player.y,
            obj.x,
            obj.y
        )
    ){

        return null;
    }

    const targetAngle=
        Math.atan2(
            dy,
            dx
        );

    const relative=
        angleDiff(
            targetAngle,
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.72
    ){

        return null;
    }

    const screenX=
        W/2+
        Math.tan(relative)*
        (
            W/
            (
                2*
                Math.tan(
                    FOV/2
                )
            )
        );

    const size=
        Math.min(
            H*.75,
            H/
            (distance*.95)
        );

    return {
        x:screenX,
        y:H*.46,
        size,
        distance
    };
}

/* =========================================================
   RENDER SPRITES
========================================================= */

function renderSprites(){

    const objects=[];

    /*
       ENEMIGOS
    */

    for(
        const enemy of enemies
    ){

        if(enemy.hp<=0){
            continue;
        }

        /*
           No entra en la lista si hay pared.
        */

        if(
            !hasLineOfSight(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            )
        ){
            continue;
        }

        objects.push({
            type:"enemy",
            obj:enemy
        });
    }

    /*
       GUARDIÁN
    */

    if(
        guardian.active &&
        hasLineOfSight(
            player.x,
            player.y,
            guardian.x,
            guardian.y
        )
    ){

        objects.push({
            type:"guardian",
            obj:guardian
        });
    }

    /*
       Profundidad.
    */

    objects.sort(
        (a,b)=>{

            const da=
                dist(
                    b.obj.x,
                    b.obj.y,
                    player.x,
                    player.y
                );

            const db=
                dist(
                    a.obj.x,
                    a.obj.y,
                    player.x,
                    player.y
                );

            return da-db;
        }
    );

    for(
        const item of objects
    ){

        const p=
            projectSprite(
                item.obj
            );

        if(!p){
            continue;
        }

        if(
            item.type==="enemy"
        ){

            renderEnemy(
                item.obj,
                p
            );

        }else{

            renderGuardian(
                item.obj,
                p
            );
        }
    }
}

/* =========================================================
   ENEMIGO
========================================================= */

function renderEnemy(
    enemy,
    p
){

    const s=p.size;

    const x=p.x;

    /*
       Punto del suelo.
       Esto mantiene al enemigo anclado.
    */

    const ground=
        H*.46+s*.5;

    /*
       SOMBRA.
    */

    ctx.fillStyle=
        "rgba(20,12,5,.38)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.23,
        s*.07,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       CUERPO.
    */

    ctx.fillStyle=
        enemy.hitFlash>0
        ?"#fff"
        :"#633b2b";

    ctx.fillRect(
        x-s*.17,
        ground-s*.48,
        s*.34,
        s*.38
    );

    /*
       CABEZA.
    */

    ctx.fillStyle="#38241d";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.57,
        s*.15,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       OJOS.
    */

    ctx.fillStyle="#e3b44d";

    ctx.fillRect(
        x-s*.075,
        ground-s*.59,
        s*.04,
        s*.025
    );

    ctx.fillRect(
        x+s*.035,
        ground-s*.59,
        s*.04,
        s*.025
    );

    /*
       BARRA DE VIDA.

       Se dibuja encima del enemigo.
    */

    const bw=
        s*.52;

    const bh=
        Math.max(
            4,
            s*.035
        );

    ctx.fillStyle=
        "rgba(20,10,8,.85)";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw,
        bh
    );

    ctx.fillStyle="#d34c43";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw*
        clamp(
            enemy.hp/
            enemy.maxHp,
            0,
            1
        ),
        bh
    );
}

/* =========================================================
   GUARDIÁN
========================================================= */

function renderGuardian(
    g,
    p
){

    const s=
        p.size*.95;

    const x=p.x;

    const ground=
        H*.46+s*.5;

    ctx.fillStyle=
        "rgba(30,20,8,.3)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.28,
        s*.08,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       AURA.
    */

    const pulse=
        1+
        Math.sin(
            performance.now()*.006
        )*.08;

    ctx.strokeStyle=
        "rgba(236,195,88,.72)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.38,
        s*.32*pulse,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       CUERPO.
    */

    ctx.fillStyle="#a77a2f";

    ctx.beginPath();

    ctx.moveTo(
        x-s*.22,
        ground
    );

    ctx.lineTo(
        x-s*.15,
        ground-s*.48
    );

    ctx.lineTo(
        x,
        ground-s*.57
    );

    ctx.lineTo(
        x+s*.15,
        ground-s*.48
    );

    ctx.lineTo(
        x+s*.22,
        ground
    );

    ctx.closePath();

    ctx.fill();

    /*
       CABEZA.
    */

    ctx.fillStyle="#d5ad68";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.62,
        s*.14,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       TOCADO.
    */

    ctx.fillStyle="#201711";

    ctx.fillRect(
        x-s*.17,
        ground-s*.75,
        s*.34,
        s*.07
    );

    /*
       BASTÓN.
    */

    ctx.strokeStyle="#e0bd62";

    ctx.lineWidth=
        Math.max(
            2,
            s*.025
        );

    ctx.beginPath();

    ctx.moveTo(
        x+s*.16,
        ground-s*.15
    );

    ctx.lineTo(
        x+s*.23,
        ground-s*.68
    );

    ctx.stroke();
}

/* =========================================================
   ARMA
========================================================= */

function renderWeapon(){

    const attacking=
        player.attackTime>0;

    let swing=0;

    if(attacking){

        const t=
            1-
            player.attackTime/
            player.attackDuration;

        /*
           Movimiento suave de barrido.
        */

        swing=
            Math.sin(
                t*Math.PI
            );
    }

    /*
       Mano derecha.
    */

    const baseX=
        W*.78;

    const baseY=
        H*1.04;

    const handX=
        baseX-
        swing*W*.24;

    const handY=
        baseY-
        swing*H*.13;

    ctx.save();

    ctx.translate(
        handX,
        handY
    );

    /*
       Barrido horizontal.
    */

    ctx.rotate(
        -.48-
        swing*1.18
    );

    /*
       BRAZO.
    */

    ctx.fillStyle="#8d5c39";

    ctx.fillRect(
        -13,
        -15,
        26,
        72
    );

    /*
       MANGO.
    */

    ctx.fillStyle="#3d2417";

    ctx.fillRect(
        -5,
        -98,
        10,
        65
    );

    /*
       HOJA.
    */

    ctx.beginPath();

    ctx.moveTo(
        -4,
        -100
    );

    ctx.lineTo(
        0,
        -190
    );

    ctx.lineTo(
        5,
        -100
    );

    ctx.closePath();

    ctx.fillStyle="#d4c59a";

    ctx.fill();

    /*
       Destello.
    */

    if(attacking){

        ctx.strokeStyle=
            "rgba(239,205,105,.85)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            -100,
            95,
            -.95,
            .15
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   PARTICULAS
========================================================= */

function renderParticles(){

    for(
        const p of particles
    ){

        const projected=
            projectSprite({
                x:p.x,
                y:p.y
            });

        if(!projected){
            continue;
        }

        const alpha=
            clamp(
                p.life/
                p.maxLife,
                0,
                1
            );

        let color;

        if(
            p.type==="ability"
        ){

            color=
                "rgba(245,205,91,"+
                alpha+
                ")";

        }else if(
            p.type==="ally"
        ){

            color=
                "rgba(115,200,255,"+
                alpha+
                ")";

        }else{

            color=
                "rgba(255,220,120,"+
                alpha+
                ")";
        }

        ctx.fillStyle=color;

        const size=
            Math.max(
                2,
                projected.size*.025
            );

        ctx.beginPath();

        ctx.arc(
            projected.x,
            projected.y-
                projected.size*.25,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================================================
   MINIMAPA COMPLETO
========================================================= */

function renderMinimap(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,
        0,
        mw,
        mh
    );

    if(!map.length){
        return;
    }

    mctx.fillStyle="#100c08";

    mctx.fillRect(
        0,
        0,
        mw,
        mh
    );

    /*
       Escala para mostrar TODO el mapa.
    */

    const scale=
        Math.min(
            mw/mapW,
            mh/mapH
        );

    const ox=
        (mw-mapW*scale)/2;

    const oy=
        (mh-mapH*scale)/2;

    /*
       TODO EL MAPA.
    */

    for(
        let y=0;
        y<mapH;
        y++
    ){

        for(
            let x=0;
            x<mapW;
            x++
        ){

            const tile=
                map[y][x];

            if(
                tile===WALL
            ){

                mctx.fillStyle=
                    "#3d3023";

            }else if(
                tile===DOOR
            ){

                mctx.fillStyle=
                    "#e0b849";

            }else{

                mctx.fillStyle=
                    "#b48b55";
            }

            mctx.fillRect(
                ox+x*scale,
                oy+y*scale,
                Math.ceil(scale)+.3,
                Math.ceil(scale)+.3
            );
        }
    }

    /*
       PUERTA.
    */

    mctx.fillStyle="#f4d06a";

    mctx.fillRect(
        ox+door.x*scale,
        oy+door.y*scale,
        Math.max(2,scale*1.5),
        Math.max(2,scale*1.5)
    );

    /*
       ENEMIGOS.

       Se muestran en el minimapa aunque estén detrás
       de una pared porque el minimapa representa
       la posición completa del mapa.
    */

    for(
        const enemy of enemies
    ){

        if(enemy.hp<=0){
            continue;
        }

        mctx.fillStyle="#d64c42";

        mctx.beginPath();

        mctx.arc(
            ox+enemy.x*scale,
            oy+enemy.y*scale,
            Math.max(
                1.5,
                scale*1.1
            ),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
       GUARDIÁN.
    */

    if(guardian.active){

        mctx.fillStyle="#59b7d6";

        mctx.beginPath();

        mctx.arc(
            ox+guardian.x*scale,
            oy+guardian.y*scale,
            Math.max(
                2,
                scale*1.3
            ),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /*
       JUGADOR.
    */

    mctx.fillStyle="#fff0a0";

    mctx.beginPath();

    mctx.arc(
        ox+player.x*scale,
        oy+player.y*scale,
        Math.max(
            2,
            scale*1.5
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
       DIRECCIÓN.
    */

    mctx.strokeStyle="#fff0a0";

    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(
        ox+player.x*scale,
        oy+player.y*scale
    );

    mctx.lineTo(
        ox+
        (
            player.x+
            Math.cos(player.angle)*2
        )*scale,

        oy+
        (
            player.y+
            Math.sin(player.angle)*2
        )*scale
    );

    mctx.stroke();
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

const joy={
    active:false,
    x:0,
    y:0,
    id:null
};

function updateJoystick(
    clientX,
    clientY
){

    const rect=
        joystick.getBoundingClientRect();

    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;

    let dx=
        clientX-cx;

    let dy=
        clientY-cy;

    const max=
        rect.width*.34;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=
            dx/d*max;

        dy=
            dy/d*max;
    }

    stick.style.left=
        "calc(50% + "+
        dx+
        "px)";

    stick.style.top=
        "calc(50% + "+
        dy+
        "px)";

    joy.x=dx/max;
    joy.y=dy/max;
}

function resetJoystick(){

    joy.active=false;

    joy.x=0;
    joy.y=0;

    joy.id=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joy.active=true;
        joy.id=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            joy.active &&
            e.pointerId===joy.id
        ){

            updateJoystick(
                e.clientX,
                e.clientY
            );
        }
    }
);

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   CONTROL DE CÁMARA TÁCTIL
========================================================= */

let lookPointer=null;
let lastLookX=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(!gameRunning){
            return;
        }

        /*
           La mitad derecha controla cámara.
        */

        if(
            e.clientX<
            window.innerWidth*.45
        ){
            return;
        }

        lookPointer=
            e.pointerId;

        lastLookX=
            e.clientX;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            lookPointer!==e.pointerId
        ){
            return;
        }

        const dx=
            e.clientX-
            lastLookX;

        lastLookX=
            e.clientX;

        player.angle+=
            dx*.006;
    }
);

canvas.addEventListener(
    "pointerup",
    e=>{

        if(
            lookPointer===
            e.pointerId
        ){

            lookPointer=null;
        }
    }
);

/* =========================================================
   CROSSHAIR
========================================================= */

function renderCrosshair(){

    const cx=W/2;
    const cy=H*.46;

    ctx.strokeStyle=
        "rgba(255,245,210,.92)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        cx-8,
        cy
    );

    ctx.lineTo(
        cx-2,
        cy
    );

    ctx.moveTo(
        cx+2,
        cy
    );

    ctx.lineTo(
        cx+8,
        cy
    );

    ctx.moveTo(
        cx,
        cy-8
    );

    ctx.lineTo(
        cx,
        cy-2
    );

    ctx.moveTo(
        cx,
        cy+2
    );

    ctx.lineTo(
        cx,
        cy+8
    );

    ctx.stroke();
}

/* =========================================================
   ACTUALIZACIÓN
========================================================= */

let gameRunning=false;
let lastTime=0;

function update(dt){

    if(!gameRunning){
        return;
    }

    player.attackCooldown=
        Math.max(
            0,
            player.attackCooldown-dt
        );

    player.attackTime=
        Math.max(
            0,
            player.attackTime-dt
        );

    doorCooldown=
        Math.max(
            0,
            doorCooldown-dt
        );

    let forward=0;
    let strafe=0;

    /*
       JOYSTICK:

       arriba = avanzar
       abajo = retroceder
       izquierda = girar
       derecha = girar
    */

    if(joy.active){

        forward=-joy.y;

        player.angle+=
            joy.x*
            dt*
            2.8;
    }

    /*
       WASD.
    */

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>1){

        forward/=length;
        strafe/=length;
    }

    const speed=
        player.speed*dt;

    const dx=
        (
            Math.cos(
                player.angle
            )*forward
            -
            Math.sin(
                player.angle
            )*strafe
        )*speed;

    const dy=
        (
            Math.sin(
                player.angle
            )*forward
            +
            Math.cos(
                player.angle
            )*strafe
        )*speed;

    movePlayer(
        dx,
        dy
    );

    updateEnemies(dt);

    updateGuardian(dt);

    updateParticles(dt);

    checkDoor();

    updateHUD();
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    renderWorld();

    renderCrosshair();

    renderMinimap();
}

/* =========================================================
   LOOP
========================================================= */

function loop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000 || 0
        );

    lastTime=time;

    update(dt);

    render();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);
