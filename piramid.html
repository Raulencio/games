<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#17130e;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#c9a56a;
}

#menu{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#574323 0%,#241b10 55%,#100d09 100%);
    color:#f6dfaa;
}

#menu h1{
    font-size:clamp(28px,8vw,62px);
    letter-spacing:4px;
    text-align:center;
    text-shadow:0 4px 0 #17110a;
}

#menu .subtitle{
    margin-top:8px;
    color:#d2b477;
    font-size:13px;
    letter-spacing:3px;
}

.menuBox{
    width:min(88vw,430px);
    margin-top:28px;
    padding:20px;
    border:1px solid #947442;
    border-radius:18px;
    background:rgba(24,18,10,.9);
    box-shadow:0 12px 50px #000;
}

.menuTitle{
    text-align:center;
    margin-bottom:14px;
    color:#e8c879;
    font-weight:bold;
}

.gods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.god{
    min-height:82px;
    border:1px solid #70582f;
    border-radius:12px;
    background:#302415;
    color:#e7d09a;
    padding:8px;
    cursor:pointer;
}

.god.selected{
    border-color:#e9c15d;
    background:#59451f;
    box-shadow:0 0 15px rgba(231,188,79,.25);
}

.glyph{
    display:block;
    font-size:30px;
    line-height:35px;
}

.god small{
    font-size:10px;
}

#startBtn{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#c89b3c;
    color:#171109;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#startBtn:active{
    transform:scale(.97);
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    display:none;
}

#topHud{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    border:1px solid rgba(222,185,105,.7);
    background:rgba(23,18,11,.78);
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
    color:#ead59d;
}

#stats{
    width:min(210px,48vw);
    padding:8px;
    font-size:11px;
}

.hpOuter{
    width:100%;
    height:10px;
    margin:4px 0;
    overflow:hidden;
    border-radius:5px;
    background:#39221d;
}

#hpBar{
    width:100%;
    height:100%;
    background:#b83d2d;
}

#xpOuter{
    width:100%;
    height:6px;
    overflow:hidden;
    border-radius:4px;
    background:#282334;
}

#xpBar{
    width:0%;
    height:100%;
    background:#9270dc;
}

#mapPanel{
    width:min(155px,35vw);
    aspect-ratio:1;
    padding:5px;
}

#map{
    width:100%;
    height:100%;
    display:block;
}

#messageBox{
    position:absolute;
    left:50%;
    bottom:126px;
    transform:translateX(-50%);
    width:min(62vw,390px);
    min-height:42px;
    padding:7px 10px;
    text-align:center;
    font-size:11px;
    color:#e9d8aa;
    background:rgba(20,15,9,.78);
    border:1px solid rgba(211,175,93,.45);
    border-radius:10px;
}

#godInfo{
    position:absolute;
    top:96px;
    left:8px;
    padding:7px 10px;
    font-size:10px;
}

#joystick{
    pointer-events:auto;
    position:absolute;
    left:15px;
    bottom:18px;
    width:116px;
    height:116px;
    border-radius:50%;
    background:rgba(32,25,15,.48);
    border:2px solid rgba(225,193,117,.4);
}

#stick{
    position:absolute;
    width:48px;
    height:48px;
    left:32px;
    top:32px;
    border-radius:50%;
    background:rgba(222,187,103,.65);
    border:2px solid #ead29a;
    box-shadow:0 3px 10px #0008;
}

#actions{
    pointer-events:auto;
    position:absolute;
    right:15px;
    bottom:20px;
    display:flex;
    gap:10px;
    align-items:flex-end;
}

.actionBtn{
    width:64px;
    height:64px;
    border-radius:50%;
    border:2px solid #c7a45f;
    background:rgba(39,28,15,.8);
    color:#efd898;
    font-size:12px;
    font-weight:bold;
}

#attackBtn{
    width:78px;
    height:78px;
    font-size:14px;
}

.actionBtn:active{
    transform:scale(.91);
    background:#705322;
}

#skillBtn{
    border-color:#9270d4;
}

#pauseBtn{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:auto;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #b89858;
    background:#221a10cc;
    color:#e9d39a;
}

#pauseScreen{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0009;
}

.pauseBox{
    width:min(86vw,350px);
    padding:24px;
    border-radius:18px;
    background:#21190f;
    border:1px solid #a27f3e;
    color:#ecd49a;
    text-align:center;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    border:1px solid #94713a;
    background:#49371d;
    color:#ecd49a;
}

@media(max-height:620px){
    #joystick{
        width:92px;
        height:92px;
        bottom:10px;
    }

    #stick{
        width:40px;
        height:40px;
        left:24px;
        top:24px;
    }

    .actionBtn{
        width:53px;
        height:53px;
    }

    #attackBtn{
        width:65px;
        height:65px;
    }

    #messageBox{
        bottom:90px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <h1>PYRAMID<br>OF THE GODS</h1>
    <div class="subtitle">2.5D MOBILE ADVENTURE</div>

    <div class="menuBox">
        <div class="menuTitle">ELIGE TU DIOS</div>

        <div class="gods">
            <button class="god selected" data-god="horus">
                <span class="glyph">𓅃</span>
                <small>HORUS<br>VEL.</small>
            </button>

            <button class="god" data-god="anubis">
                <span class="glyph">𓃢</span>
                <small>ANUBIS<br>EVASIÓN</small>
            </button>

            <button class="god" data-god="sekhmet">
                <span class="glyph">𓁛</span>
                <small>SEKHMET<br>DAÑO</small>
            </button>

            <button class="god" data-god="thoth">
                <span class="glyph">𓅝</span>
                <small>THOTH<br>CRÍTICO</small>
            </button>

            <button class="god" data-god="isis">
                <span class="glyph">𓆄</span>
                <small>ISIS<br>VIDA</small>
            </button>

            <button class="god" data-god="ra">
                <span class="glyph">𓂀</span>
                <small>RA<br>HABILIDAD</small>
            </button>
        </div>

        <button id="startBtn">INICIAR EXPEDICIÓN</button>
    </div>
</div>

<div id="hud">

    <div id="topHud">

        <div id="stats" class="panel">
            <b id="levelText">NIVEL 1</b>
            <div class="hpOuter">
                <div id="hpBar"></div>
            </div>
            <div id="xpOuter">
                <div id="xpBar"></div>
            </div>
            <div id="statText">VEL 1.00 · EVA 5% · CRIT 5%</div>
        </div>

        <div id="mapPanel" class="panel">
            <canvas id="map"></canvas>
        </div>
    </div>

    <div id="godInfo" class="panel">
        DIOS: HORUS
    </div>

    <div id="messageBox">
        Encuentra la puerta para continuar.
    </div>

    <button id="pauseBtn">Ⅱ</button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="actions">
        <button class="actionBtn" id="skillBtn">DIOS</button>
        <button class="actionBtn" id="attackBtn">⚔</button>
    </div>
</div>

<div id="pauseScreen">
    <div class="pauseBox">
        <h2>PAUSA</h2>
        <p style="margin-top:8px;font-size:12px">
            La expedición está detenida.
        </p>
        <button id="resumeBtn">CONTINUAR</button>
        <button id="menuBtn">MENÚ PRINCIPAL</button>
    </div>
</div>

<script>
"use strict";

/* ============================================================
   PYRAMID OF THE GODS
   MOTOR 2.5D RAYCASTER
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mini = document.getElementById("map");
const mctx = mini.getContext("2d");

let W=0,H=0;
let running=false;
let paused=false;
let lastTime=0;

/* ------------------------------------------------------------
   CONFIGURACIÓN
------------------------------------------------------------ */

const TILE = 64;

const FOV = Math.PI / 3;
const MAX_DEPTH = 1300;

const PLAYER_RADIUS = 15;

const GODS = {

    horus:{
        name:"HORUS",
        speed:1.16,
        evade:0.05,
        damage:1,
        crit:0.05,
        critDamage:1.5,
        hp:100,
        skill:"IMPULSO",
        glyph:"𓅃"
    },

    anubis:{
        name:"ANUBIS",
        speed:1.05,
        evade:0.20,
        damage:1,
        crit:0.05,
        critDamage:1.5,
        hp:100,
        skill:"EVASIÓN",
        glyph:"𓃢"
    },

    sekhmet:{
        name:"SEKHMET",
        speed:.98,
        evade:0.04,
        damage:1.35,
        crit:0.08,
        critDamage:1.8,
        hp:115,
        skill:"FURIA",
        glyph:"𓁛"
    },

    thoth:{
        name:"THOTH",
        speed:1.02,
        evade:.06,
        damage:1.0,
        crit:.25,
        critDamage:2.0,
        hp:95,
        skill:"PRECISIÓN",
        glyph:"𓅝"
    },

    isis:{
        name:"ISIS",
        speed:1.02,
        evade:.08,
        damage:1,
        crit:.06,
        critDamage:1.5,
        hp:140,
        skill:"CURACIÓN",
        glyph:"𓆄"
    },

    ra:{
        name:"RA",
        speed:1.10,
        evade:.07,
        damage:1.12,
        crit:.10,
        critDamage:1.7,
        hp:105,
        skill:"SOL",
        glyph:"𓂀"
    }
};

let selectedGod="horus";

/* ------------------------------------------------------------
   PERSISTENCIA
------------------------------------------------------------ */

const SAVE_KEY="pyramid_gods_save_v3";

let save={
    level:1,
    xp:0,
    god:"horus",
    stats:{
        speed:1,
        evade:0,
        crit:0,
        critDamage:0
    }
};

function loadSave(){

    try{

        const raw=localStorage.getItem(SAVE_KEY);

        if(raw){

            const parsed=JSON.parse(raw);

            save=Object.assign(save,parsed);

            save.stats=Object.assign({
                speed:1,
                evade:0,
                crit:0,
                critDamage:0
            },parsed.stats||{});

            selectedGod=save.god||"horus";
        }

    }catch(e){

        console.warn("No se pudo cargar el progreso",e);
    }
}

function saveGame(){

    save.god=selectedGod;

    try{
        localStorage.setItem(SAVE_KEY,JSON.stringify(save));
    }catch(e){}
}

loadSave();

/* ------------------------------------------------------------
   MAPA
------------------------------------------------------------ */

let map=[];
let mapW=31;
let mapH=23;

let door={
    x:0,
    y:0,
    side:"north",
    open:false
};

function makeEmptyMap(w,h){

    const a=[];

    for(let y=0;y<h;y++){

        a[y]=[];

        for(let x=0;x<w;x++){

            a[y][x]=1;
        }
    }

    return a;
}

/*
   Generador:
   no crea laberintos.
   Primero abre una gran zona central y luego
   añade sectores conectados.
*/

function generateMap(){

    mapW=31+Math.floor(Math.random()*8)*2;
    mapH=23+Math.floor(Math.random()*6)*2;

    map=makeEmptyMap(mapW,mapH);

    /* zona principal abierta */

    const cx=Math.floor(mapW/2);
    const cy=Math.floor(mapH/2);

    for(let y=2;y<mapH-2;y++){

        for(let x=2;x<mapW-2;x++){

            const dx=Math.abs(x-cx);
            const dy=Math.abs(y-cy);

            if(dx<9 && dy<6){
                map[y][x]=0;
            }
        }
    }

    /* alas laterales */

    carveRect(
        2,
        5,
        Math.floor(mapW*.28),
        mapH-10
    );

    carveRect(
        Math.floor(mapW*.72),
        5,
        mapW-3,
        mapH-10
    );

    /* pasillos anchos */

    for(let x=3;x<mapW-3;x++){
        map[cy][x]=0;
        if(cy+1<mapH) map[cy+1][x]=0;
    }

    for(let y=4;y<mapH-4;y++){
        map[y][cx]=0;
        if(cx+1<mapW) map[y][cx+1]=0;
    }

    /* cámaras adicionales */

    for(let i=0;i<7;i++){

        const rw=4+Math.floor(Math.random()*5);
        const rh=3+Math.floor(Math.random()*4);

        const rx=2+Math.floor(Math.random()*(mapW-rw-4));
        const ry=2+Math.floor(Math.random()*(mapH-rh-4));

        carveRect(rx,ry,rx+rw,ry+rh);

        /* conectar con el centro mediante corredores */

        const tx=Math.floor(rx+rw/2);
        const ty=Math.floor(ry+rh/2);

        carveCorridor(cx,cy,tx,ty);
    }

    /* bordes siempre cerrados */

    for(let x=0;x<mapW;x++){
        map[0][x]=1;
        map[1][x]=1;
        map[mapH-1][x]=1;
        map[mapH-2][x]=1;
    }

    for(let y=0;y<mapH;y++){
        map[y][0]=1;
        map[y][1]=1;
        map[y][mapW-1]=1;
        map[y][mapW-2]=1;
    }

    /* posición inicial */

    player.x=(cx+.5)*TILE;
    player.y=(cy+.5)*TILE;

    /* puerta integrada en una pared */

    createDoor();

    spawnEnemies();

    companion.x=player.x-TILE*.9;
    companion.y=player.y;

    messages("Sala generada. Explora y encuentra la puerta.");
}

function carveRect(x1,y1,x2,y2){

    x1=Math.max(2,Math.floor(x1));
    y1=Math.max(2,Math.floor(y1));
    x2=Math.min(mapW-2,Math.floor(x2));
    y2=Math.min(mapH-2,Math.floor(y2));

    for(let y=y1;y<y2;y++){

        for(let x=x1;x<x2;x++){

            map[y][x]=0;
        }
    }
}

function carveCorridor(x1,y1,x2,y2){

    let x=x1;
    let y=y1;

    while(x!==x2){

        map[y][x]=0;

        if(y+1<mapH) map[y+1][x]=0;

        x+=x<x2?1:-1;
    }

    while(y!==y2){

        map[y][x]=0;

        if(x+1<mapW) map[y][x+1]=0;

        y+=y<y2?1:-1;
    }
}

function isWall(tx,ty){

    if(tx<0||ty<0||tx>=mapW||ty>=mapH)
        return true;

    return map[ty][tx]===1;
}

function wallAt(x,y){

    return isWall(
        Math.floor(x/TILE),
        Math.floor(y/TILE)
    );
}

/* ------------------------------------------------------------
   PUERTA
------------------------------------------------------------ */

function createDoor(){

    const candidates=[];

    /*
      Buscamos una pared que tenga suelo a un lado.
      La puerta queda exactamente ocupando ese borde.
    */

    for(let y=2;y<mapH-2;y++){

        for(let x=2;x<mapW-2;x++){

            if(map[y][x]!==0) continue;

            if(isWall(x,y-1)){
                candidates.push({
                    x,y,
                    side:"north"
                });
            }

            if(isWall(x,y+1)){
                candidates.push({
                    x,y,
                    side:"south"
                });
            }

            if(isWall(x-1,y)){
                candidates.push({
                    x,y,
                    side:"west"
                });
            }

            if(isWall(x+1,y)){
                candidates.push({
                    x,y,
                    side:"east"
                });
            }
        }
    }

    if(candidates.length){

        /*
          Preferimos una zona exterior.
        */

        door=candidates[
            Math.floor(Math.random()*candidates.length)
        ];

        door.open=false;
    }
}

function doorDistance(){

    return Math.hypot(
        player.x-(door.x+.5)*TILE,
        player.y-(door.y+.5)*TILE
    );
}

/* ------------------------------------------------------------
   PLAYER
------------------------------------------------------------ */

const player={
    x:0,
    y:0,
    angle:0,
    hp:100,
    attack:false,
    attackTime:0,
    attackDuration:.28,
    cooldown:0
};

/* ------------------------------------------------------------
   COMPAÑERO
------------------------------------------------------------ */

const companion={
    x:0,
    y:0,
    angle:0,
    speed:2.5,
    radius:14,
    bob:0
};

function updateCompanion(dt){

    const dx=player.x-companion.x;
    const dy=player.y-companion.y;

    const dist=Math.hypot(dx,dy);

    /*
      Nunca se coloca encima.
      Mantiene una distancia aproximada de 55-90 px.
    */

    if(dist>100){

        const desired=68;

        let tx=
            player.x-(dx/dist)*desired;

        let ty=
            player.y-(dy/dist)*desired;

        const ddx=tx-companion.x;
        const ddy=ty-companion.y;

        const d=Math.hypot(ddx,ddy)||1;

        const speed=companion.speed*60*dt;

        const nx=companion.x+(ddx/d)*Math.min(speed,d);
        const ny=companion.y+(ddy/d)*Math.min(speed,d);

        if(!collides(nx,companion.y,companion.radius))
            companion.x=nx;

        if(!collides(companion.x,ny,companion.radius))
            companion.y=ny;
    }

    companion.angle=Math.atan2(
        player.y-companion.y,
        player.x-companion.x
    );

    companion.bob+=dt*5;
}

/* ------------------------------------------------------------
   ENEMIGOS
------------------------------------------------------------ */

let enemies=[];

function spawnEnemies(){

    enemies=[];

    const amount=5+Math.floor(Math.random()*5);

    for(let i=0;i<amount;i++){

        let p=findFreePosition(450);

        if(!p) continue;

        enemies.push({
            x:p.x,
            y:p.y,
            hp:60+save.level*8,
            maxHp:60+save.level*8,
            speed:35+Math.random()*12,
            radius:15,
            angle:0,
            attackCooldown:0,
            hitFlash:0,
            dead:false,
            wander:Math.random()*Math.PI*2,
            think:0
        });
    }
}

function findFreePosition(minDistance){

    for(let attempt=0;attempt<100;attempt++){

        const x=(2+Math.random()*(mapW-4))*TILE;
        const y=(2+Math.random()*(mapH-4))*TILE;

        if(wallAt(x,y))
            continue;

        if(Math.hypot(x-player.x,y-player.y)<minDistance)
            continue;

        return {x,y};
    }

    return null;
}

function updateEnemies(dt){

    for(const e of enemies){

        if(e.dead) continue;

        e.attackCooldown-=dt;
        e.hitFlash=Math.max(0,e.hitFlash-dt);

        const dx=player.x-e.x;
        const dy=player.y-e.y;

        const dist=Math.hypot(dx,dy);

        e.angle=Math.atan2(dy,dx);

        /*
          El enemigo SOLO persigue cuando existe
          línea de visión.
        */

        const visible=hasLineOfSight(
            e.x,e.y,
            player.x,player.y
        );

        if(visible && dist<500){

            const nx=dx/(dist||1);
            const ny=dy/(dist||1);

            if(dist>80){

                const move=e.speed*dt;

                tryMoveEnemy(e,nx*move,ny*move);
            }
            else if(e.attackCooldown<=0){

                enemyAttack(e);

                e.attackCooldown=.9;
            }

        }else{

            e.think-=dt;

            if(e.think<=0){

                e.think=.8+Math.random()*1.5;
                e.wander+=
                    (Math.random()-.5)*1.8;
            }

            const move=e.speed*.32*dt;

            tryMoveEnemy(
                e,
                Math.cos(e.wander)*move,
                Math.sin(e.wander)*move
            );
        }
    }
}

function tryMoveEnemy(e,dx,dy){

    const nx=e.x+dx;
    const ny=e.y+dy;

    if(!collides(nx,e.y,e.radius))
        e.x=nx;

    if(!collides(e.x,ny,e.radius))
        e.y=ny;
}

function enemyAttack(e){

    if(Math.random()<getStats().evade){

        messages("¡Evasión!");
        return;
    }

    player.hp-=8;

    if(player.hp<=0){

        player.hp=0;

        messages("Has caído. Reiniciando sala...");

        setTimeout(()=>{
            if(running){
                player.hp=getStats().maxHp;
                generateMap();
            }
        },900);
    }
}

/* ------------------------------------------------------------
   COLISIONES
------------------------------------------------------------ */

function collides(x,y,r){

    const pts=[
        [x-r,y-r],
        [x+r,y-r],
        [x-r,y+r],
        [x+r,y+r]
    ];

    for(const p of pts){

        if(wallAt(p[0],p[1]))
            return true;
    }

    return false;
}

function movePlayer(dx,dy){

    if(!running||paused) return;

    const r=PLAYER_RADIUS;

    if(!collides(player.x+dx,player.y,r))
        player.x+=dx;

    if(!collides(player.x,player.y+dy,r))
        player.y+=dy;
}

/* ------------------------------------------------------------
   LÍNEA DE VISIÓN
------------------------------------------------------------ */

function hasLineOfSight(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    const dist=Math.hypot(dx,dy);

    const steps=Math.ceil(dist/10);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        if(
            wallAt(
                x1+dx*t,
                y1+dy*t
            )
        ){
            return false;
        }
    }

    return true;
}

/* ------------------------------------------------------------
   STATS
------------------------------------------------------------ */

function getStats(){

    const g=GODS[selectedGod];

    return {

        speed:
            g.speed+
            (save.level-1)*.025+
            save.stats.speed,

        evade:
            Math.min(
                .65,
                g.evade+
                save.stats.evade
            ),

        damage:
            g.damage+
            (save.level-1)*.035,

        crit:
            Math.min(
                .75,
                g.crit+
                save.stats.crit
            ),

        critDamage:
            g.critDamage+
            save.stats.critDamage,

        maxHp:
            g.hp+
            (save.level-1)*8
    };
}

/* ------------------------------------------------------------
   MOVIMIENTO JOYSTICK
------------------------------------------------------------ */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joy={
    active:false,
    id:null,
    x:0,
    y:0
};

function joystickMove(clientX,clientY){

    const rect=joystick.getBoundingClientRect();

    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    let dx=clientX-cx;
    let dy=clientY-cy;

    const max=rect.width*.36;

    const len=Math.hypot(dx,dy);

    if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;
    }

    joy.x=dx/max;
    joy.y=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function joystickEnd(){

    joy.active=false;
    joy.x=0;
    joy.y=0;

    stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joy.active=true;
    joy.id=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{

    if(!joy.active||e.pointerId!==joy.id)
        return;

    joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",joystickEnd);
joystick.addEventListener("pointercancel",joystickEnd);

/* ------------------------------------------------------------
   ATAQUE
------------------------------------------------------------ */

function attack(){

    if(!running||paused)
        return;

    if(player.cooldown>0)
        return;

    player.attack=true;
    player.attackTime=0;
    player.cooldown=.42;

    const stats=getStats();

    /*
      Alcance reducido.
      2.15 tiles aproximadamente.
    */

    const range=TILE*1.45;

    for(const e of enemies){

        if(e.dead) continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const dist=Math.hypot(dx,dy);

        if(dist>range)
            continue;

        const angleTo=Math.atan2(dy,dx);

        let diff=
            normalizeAngle(
                angleTo-player.angle
            );

        /*
          Barrido horizontal.
          Se considera golpe solamente
          dentro del arco frontal.
        */

        if(Math.abs(diff)<.75 &&
           hasLineOfSight(
               player.x,
               player.y,
               e.x,
               e.y
           )){

            let damage=25*stats.damage;

            if(Math.random()<stats.crit){

                damage*=stats.critDamage;

                messages("¡GOLPE CRÍTICO!");
            }

            e.hp-=damage;
            e.hitFlash=.12;

            if(e.hp<=0){

                e.hp=0;
                e.dead=true;

                gainXP(25);
                messages("+25 EXP");
            }
        }
    }
}

function normalizeAngle(a){

    while(a>Math.PI) a-=Math.PI*2;
    while(a<-Math.PI) a+=Math.PI*2;

    return a;
}

/* ------------------------------------------------------------
   UPDATE
------------------------------------------------------------ */

function update(dt){

    if(!running||paused)
        return;

    player.cooldown=
        Math.max(0,player.cooldown-dt);

    skillCooldown=
        Math.max(0,skillCooldown-dt);

    if(player.attack){

        player.attackTime+=dt;

        if(player.attackTime>
           player.attackDuration){

            player.attack=false;
        }
    }

    /* movimiento */

    let mx=joy.x;
    let my=joy.y;

    if(keys["w"]||keys["arrowup"]) my-=1;
    if(keys["s"]||keys["arrowdown"]) my+=1;
    if(keys["a"]||keys["arrowleft"]) mx-=1;
    if(keys["d"]||keys["arrowright"]) mx+=1;

    const len=Math.hypot(mx,my);

    if(len>1){

        mx/=len;
        my/=len;
    }

    const speed=
        108*
        getStats().speed;

    /*
      El joystick vertical hacia arriba
      significa avanzar.
    */

    const forwardX=Math.cos(player.angle);
    const forwardY=Math.sin(player.angle);

    const rightX=Math.cos(player.angle+Math.PI/2);
    const rightY=Math.sin(player.angle+Math.PI/2);

    const dx=
        (forwardX*(-my)+rightX*mx)*
        speed*dt;

    const dy=
        (forwardY*(-my)+rightY*mx)*
        speed*dt;

    movePlayer(dx,dy);

    updateCompanion(dt);
    updateEnemies(dt);

    if(doorDistance()<TILE*1.4){

        messages("Acércate a la puerta para entrar.");
    }

    if(doorDistance()<TILE*.9){

        nextRoom();
    }

    if(messageTimer>0){

        messageTimer-=dt;
    }
}

/* ------------------------------------------------------------
   RENDER 2.5D
------------------------------------------------------------ */

function render(){

    resizeIfNeeded();

    /*
      Cielo
    */

    const horizon=H*.47;

    ctx.fillStyle="#a88658";
    ctx.fillRect(0,0,W,horizon);

    /*
      ligera gradación manual
    */

    const sky=ctx.createLinearGradient(
        0,0,0,horizon
    );

    sky.addColorStop(0,"#8b704b");
    sky.addColorStop(1,"#c7a66d");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,horizon);

    /*
      Suelo arena.
      NO refleja las paredes.
    */

    const floor=ctx.createLinearGradient(
        0,horizon,0,H
    );

    floor.addColorStop(0,"#b9935a");
    floor.addColorStop(1,"#c9a76b");

    ctx.fillStyle=floor;
    ctx.fillRect(0,horizon,W,H-horizon);

    renderWalls(horizon);
    renderSprites();
    renderWeapon();
    renderCrosshair();
    renderHUD();
}

function renderWalls(horizon){

    const rays=Math.min(
        320,
        Math.max(180,Math.floor(W*.65))
    );

    const step=W/rays;

    for(let i=0;i<rays;i++){

        const screenX=i*step;

        const cameraX=
            screenX/W-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const hit=castRay(
            player.x,
            player.y,
            rayAngle
        );

        let distance=hit.distance;

        /*
          Corrección fisheye
        */

        distance*=
            Math.cos(rayAngle-player.angle);

        distance=Math.max(1,distance);

        const wallHeight=
            (TILE*H*.72)/distance;

        const top=
            horizon-wallHeight/2;

        const bottom=
            horizon+wallHeight/2;

        /*
          Puerta:
          se dibuja como parte de la pared.
        */

        const tileX=Math.floor(
            hit.x/TILE
        );

        const tileY=Math.floor(
            hit.y/TILE
        );

        const isDoorTile=
            tileX===door.x &&
            tileY===door.y;

        if(isDoorTile){

            ctx.fillStyle="#30251b";

            ctx.fillRect(
                screenX,
                top,
                step+1,
                wallHeight
            );

            /*
              marco
            */

            ctx.fillStyle="#17120e";

            ctx.fillRect(
                screenX,
                top,
                step*.13,
                wallHeight
            );

            ctx.fillRect(
                screenX+step*.87,
                top,
                step*.13,
                wallHeight
            );

            ctx.fillStyle="#0d0b08";

            ctx.fillRect(
                screenX+step*.16,
                top+wallHeight*.12,
                step*.68,
                wallHeight*.88
            );

        }else{

            /*
              sombreado según cara
            */

            const shade=
                hit.side===0 ? 1 : .72;

            const value=
                Math.max(
                    35,
                    Math.floor(
                        145*shade*
                        (1-Math.min(distance/MAX_DEPTH,.65))
                        +45
                    )
                );

            ctx.fillStyle=
                `rgb(${value},${Math.floor(value*.76)},${Math.floor(value*.48)})`;

            ctx.fillRect(
                screenX,
                top,
                step+1,
                wallHeight
            );
        }
    }
}

function castRay(x,y,angle){

    const dx=Math.cos(angle);
    const dy=Math.sin(angle);

    let mapX=Math.floor(x/TILE);
    let mapY=Math.floor(y/TILE);

    const deltaX=
        Math.abs(1/(dx||.000001));

    const deltaY=
        Math.abs(1/(dy||.000001));

    let stepX;
    let stepY;

    let sideDistX;
    let sideDistY;

    if(dx<0){

        stepX=-1;

        sideDistX=
            (x/TILE-mapX)*deltaX;

    }else{

        stepX=1;

        sideDistX=
            (mapX+1-x/TILE)*deltaX;
    }

    if(dy<0){

        stepY=-1;

        sideDistY=
            (y/TILE-mapY)*deltaY;

    }else{

        stepY=1;

        sideDistY=
            (mapY+1-y/TILE)*deltaY;
    }

    let side=0;
    let hit=false;

    for(let i=0;i<150;i++){

        if(sideDistX<sideDistY){

            sideDistX+=deltaX;
            mapX+=stepX;
            side=0;

        }else{

            sideDistY+=deltaY;
            mapY+=stepY;
            side=1;
        }

        if(isWall(mapX,mapY)){

            hit=true;
            break;
        }
    }

    if(!hit){

        return {
            distance:MAX_DEPTH,
            side:0,
            x:x+dx*MAX_DEPTH,
            y:y+dy*MAX_DEPTH
        };
    }

    let distance;

    if(side===0){

        distance=
            (mapX-x/TILE+
            (1-stepX)/2)/dx*TILE;

    }else{

        distance=
            (mapY-y/TILE+
            (1-stepY)/2)/dy*TILE;
    }

    return {
        distance:Math.abs(distance),
        side,
        x:x+dx*Math.abs(distance),
        y:y+dy*Math.abs(distance)
    };
}

/* ------------------------------------------------------------
   SPRITES
------------------------------------------------------------ */

function renderSprites(){

    const objects=[];

    for(const e of enemies){

        if(e.dead) continue;

        objects.push({
            type:"enemy",
            obj:e
        });
    }

    objects.push({
        type:"companion",
        obj:companion
    });

    objects.sort((a,b)=>{

        const da=
            Math.hypot(
                a.obj.x-player.x,
                a.obj.y-player.y
            );

        const db=
            Math.hypot(
                b.obj.x-player.x,
                b.obj.y-player.y
            );

        return db-da;
    });

    for(const item of objects){

        drawSprite(
            item.type,
            item.obj
        );
    }
}

function drawSprite(type,o){

    const dx=o.x-player.x;
    const dy=o.y-player.y;

    const dist=Math.hypot(dx,dy);

    let angle=
        normalizeAngle(
            Math.atan2(dy,dx)-player.angle
        );

    /*
      No se dibuja si está fuera del FOV.
    */

    if(Math.abs(angle)>FOV*.7)
        return;

    /*
      comprobación de pared.
      Esto evita enemigos atravesando paredes.
    */

    if(!hasLineOfSight(
        player.x,
        player.y,
        o.x,
        o.y
    ))
        return;

    const screenX=
        W/2+
        Math.tan(angle)*
        (W/(2*Math.tan(FOV/2)));

    const size=
        Math.min(
            H*1.1,
            TILE*H*.72/dist
        );

    const bottom=
        H*.47+size*.50;

    const top=
        bottom-size;

    if(type==="enemy")
        drawEnemy(o,screenX,top,size,bottom);

    else
        drawCompanion(o,screenX,top,size,bottom);
}

function drawEnemy(e,x,y,size,bottom){

    /*
      cuerpo anclado al suelo:
      bottom nunca depende de la distancia
      de forma que los pies coinciden con el suelo.
    */

    const w=size*.45;

    if(e.hitFlash>0){

        ctx.fillStyle="#fff";
    }else{

        ctx.fillStyle="#4a2922";
    }

    ctx.fillRect(
        x-w/2,
        y+size*.27,
        w,
        size*.55
    );

    ctx.fillStyle="#1d1714";

    ctx.beginPath();

    ctx.arc(
        x,
        y+size*.17,
        size*.16,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* brazos */

    ctx.fillStyle="#633b2d";

    ctx.fillRect(
        x-w*.8,
        y+size*.3,
        w*.25,
        size*.38
    );

    ctx.fillRect(
        x+w*.55,
        y+size*.3,
        w*.25,
        size*.38
    );

    /* barra de vida */

    const barW=size*.62;
    const barH=Math.max(4,size*.045);

    const hp=Math.max(
        0,
        e.hp/e.maxHp
    );

    ctx.fillStyle="#190e0c";

    ctx.fillRect(
        x-barW/2,
        y-size*.07,
        barW,
        barH
    );

    ctx.fillStyle="#d5483b";

    ctx.fillRect(
        x-barW/2,
        y-size*.07,
        barW*hp,
        barH
    );
}

function drawCompanion(o,x,y,size,bottom){

    const w=size*.43;

    ctx.fillStyle="#d9c28a";

    ctx.fillRect(
        x-w/2,
        y+size*.27,
        w,
        size*.55
    );

    ctx.fillStyle="#5e482b";

    ctx.beginPath();

    ctx.arc(
        x,
        y+size*.16,
        size*.16,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      aura del aliado
    */

    ctx.strokeStyle="#d8ba65";
    ctx.globalAlpha=.4;

    ctx.beginPath();

    ctx.arc(
        x,
        y+size*.5,
        size*.35+
        Math.sin(companion.bob)*3,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha=1;
}

/* ------------------------------------------------------------
   ARMA
------------------------------------------------------------ */

function renderWeapon(){

    const attackProgress=
        player.attack
        ?
        Math.min(
            1,
            player.attackTime/player.attackDuration
        )
        :0;

    /*
      Barrido horizontal:
      0 -> izquierda
      0.5 -> centro
      1 -> derecha
    */

    let sweep=
        Math.sin(
            attackProgress*Math.PI
        );

    if(!player.attack)
        sweep=0;

    ctx.save();

    const baseX=W*.70;
    const baseY=H*1.01;

    ctx.translate(
        baseX,
        baseY
    );

    /*
      movimiento de ataque suave
    */

    ctx.rotate(
        -.22+
        sweep*.9
    );

    const scale=
        Math.min(W,H)/650;

    ctx.scale(scale,scale);

    /* brazo derecho */

    ctx.fillStyle="#b47c55";

    ctx.beginPath();

    ctx.roundRect(
        -5,
        -50,
        62,
        22,
        9
    );

    ctx.fill();

    /* mango */

    ctx.fillStyle="#38251a";

    ctx.fillRect(
        30,
        -90,
        14,
        100
    );

    /* guarda */

    ctx.fillStyle="#c49c4e";

    ctx.fillRect(
        12,
        -86,
        50,
        10
    );

    /* hoja */

    const blade=
        ctx.createLinearGradient(
            44,-285,
            44,-85
        );

    blade.addColorStop(0,"#f1dfb4");
    blade.addColorStop(.5,"#bca97c");
    blade.addColorStop(1,"#79694d");

    ctx.fillStyle=blade;

    ctx.beginPath();

    ctx.moveTo(38,-88);
    ctx.lineTo(50,-88);
    ctx.lineTo(57,-275);
    ctx.lineTo(44,-302);
    ctx.lineTo(31,-275);
    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#e9d49a";
    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();
}

/* ------------------------------------------------------------
   MIRA
------------------------------------------------------------ */

function renderCrosshair(){

    const x=W/2;
    const y=H*.47;

    ctx.strokeStyle="rgba(245,231,193,.92)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x-10,y);
    ctx.lineTo(x-3,y);

    ctx.moveTo(x+3,y);
    ctx.lineTo(x+10,y);

    ctx.moveTo(x,y-10);
    ctx.lineTo(x,y-3);

    ctx.moveTo(x,y+3);
    ctx.lineTo(x,y+10);

    ctx.stroke();

    ctx.fillStyle="#f1d47c";

    ctx.fillRect(x-1,y-1,2,2);
}

/* ------------------------------------------------------------
   MINIMAPA COMPLETO
------------------------------------------------------------ */

function renderMiniMap(){

    const rect=mini.getBoundingClientRect();

    const mw=rect.width;
    const mh=rect.height;

    if(mw<=0||mh<=0)
        return;

    mini.width=Math.floor(mw*devicePixelRatio);
    mini.height=Math.floor(mh*devicePixelRatio);

    mctx.setTransform(
        devicePixelRatio,
        0,0,
        devicePixelRatio,
        0,0
    );

    mctx.fillStyle="#17120c";
    mctx.fillRect(0,0,mw,mh);

    const scale=
        Math.min(
            (mw-8)/(mapW*TILE),
            (mh-8)/(mapH*TILE)
        );

    const ox=
        (mw-mapW*TILE*scale)/2;

    const oy=
        (mh-mapH*TILE*scale)/2;

    /*
      mapa completo siempre visible
    */

    for(let y=0;y<mapH;y++){

        for(let x=0;x<mapW;x++){

            if(map[y][x]===0){

                mctx.fillStyle="#b99b65";

            }else{

                mctx.fillStyle="#342719";
            }

            mctx.fillRect(
                ox+x*TILE*scale,
                oy+y*TILE*scale,
                TILE*scale+.5,
                TILE*scale+.5
            );
        }
    }

    /* puerta */

    mctx.fillStyle="#e1b84f";

    mctx.fillRect(
        ox+door.x*TILE*scale,
        oy+door.y*TILE*scale,
        TILE*scale,
        TILE*scale
    );

    /* enemigos */

    for(const e of enemies){

        if(e.dead) continue;

        const ex=
            ox+e.x*scale;

        const ey=
            oy+e.y*scale;

        mctx.fillStyle="#b53e32";

        mctx.beginPath();

        mctx.arc(
            ex,
            ey,
            Math.max(2,3*scale),
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /* compañero */

    mctx.fillStyle="#6fc7d2";

    mctx.beginPath();

    mctx.arc(
        ox+companion.x*scale,
        oy+companion.y*scale,
        Math.max(2,3*scale),
        0,
        Math.PI*2
    );

    mctx.fill();

    /* jugador */

    const px=
        ox+player.x*scale;

    const py=
        oy+player.y*scale;

    mctx.fillStyle="#f2dc82";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(3,4*scale),
        0,
        Math.PI*2
    );

    mctx.fill();

    /* dirección */

    mctx.strokeStyle="#f2dc82";
    mctx.lineWidth=2;

    mctx.beginPath();

    mctx.moveTo(px,py);

    mctx.lineTo(
        px+
        Math.cos(player.angle)*12,
        py+
        Math.sin(player.angle)*12
    );

    mctx.stroke();
}

/* ------------------------------------------------------------
   RESIZE
------------------------------------------------------------ */

let oldW=0;
let oldH=0;

function resizeIfNeeded(){

    if(
        W!==window.innerWidth ||
        H!==window.innerHeight
    ){

        W=window.innerWidth;
        H=window.innerHeight;

        const dpr=
            Math.min(
                2,
                window.devicePixelRatio||1
            );

        canvas.width=Math.floor(W*dpr);
        canvas.height=Math.floor(H*dpr);

        canvas.style.width=W+"px";
        canvas.style.height=H+"px";

        ctx.setTransform(
            dpr,0,0,dpr,0,0
        );

        oldW=W;
        oldH=H;
    }
}

window.addEventListener(
    "resize",
    resizeIfNeeded
);

/* ------------------------------------------------------------
   LOOP
------------------------------------------------------------ */

function gameLoop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000||0
        );

    lastTime=time;

    update(dt);

    if(running){

        render();
        renderMiniMap();
    }

    requestAnimationFrame(gameLoop);
}

/* ------------------------------------------------------------
   MENÚ DIOS
------------------------------------------------------------ */

document.querySelectorAll(".god")
.forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".god")
        .forEach(x=>
            x.classList.remove("selected")
        );

        button.classList.add("selected");

        selectedGod=
            button.dataset.god;

        save.god=selectedGod;

        saveGame();
    });
});

/* ------------------------------------------------------------
   INICIO
------------------------------------------------------------ */

document.getElementById("startBtn")
.addEventListener("click",()=>{

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("hud")
        .style.display="block";

    running=true;
    paused=false;

    player.hp=getStats().maxHp;

    generateMap();

    lastTime=performance.now();
});

/* ------------------------------------------------------------
   BOTONES
------------------------------------------------------------ */

document.getElementById("attackBtn")
.addEventListener("pointerdown",e=>{

    e.preventDefault();
    attack();
});

document.getElementById("skillBtn")
.addEventListener("pointerdown",e=>{

    e.preventDefault();
    useGodSkill();
});

document.getElementById("pauseBtn")
.addEventListener("click",()=>{

    paused=true;

    document.getElementById("pauseScreen")
        .style.display="flex";
});

document.getElementById("resumeBtn")
.addEventListener("click",()=>{

    paused=false;

    document.getElementById("pauseScreen")
        .style.display="none";
});

document.getElementById("menuBtn")
.addEventListener("click",()=>{

    paused=false;
    running=false;

    document.getElementById("pauseScreen")
        .style.display="none";

    document.getElementById("hud")
        .style.display="none";

    document.getElementById("menu")
        .style.display="flex";
});

/* ------------------------------------------------------------
   INICIO MOTOR
------------------------------------------------------------ */

resizeIfNeeded();

requestAnimationFrame(gameLoop);

</script>
