<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080604;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#topHud{
    position:absolute;
    top:max(7px,env(safe-area-inset-top));
    left:7px;
    right:7px;
    height:58px;
    display:flex;
    align-items:center;
    gap:7px;
    z-index:20;
}

.panel{
    background:rgba(13,9,5,.9);
    border:1px solid rgba(214,171,73,.55);
    border-radius:9px;
    box-shadow:
        0 4px 15px rgba(0,0,0,.55),
        inset 0 0 12px rgba(255,200,80,.04);
}

#playerPanel{
    width:190px;
    padding:6px 8px;
}

#levelText{
    color:#e8ca7b;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}

.bar{
    height:8px;
    margin-top:4px;
    overflow:hidden;
    border-radius:5px;
    background:#21150c;
    border:1px solid #604a25;
}

#hpFill{
    width:100%;
    height:100%;
    background:#b63226;
}

#xpFill{
    width:0%;
    height:100%;
    background:#d5a932;
}

#statsMini{
    margin-top:3px;
    color:#cbb77e;
    font-size:8px;
    white-space:nowrap;
}

#godButton{
    pointer-events:auto;
    flex:1;
    min-width:70px;
    height:52px;
    border:1px solid #8d6a2c;
    border-radius:9px;
    background:rgba(24,15,7,.94);
    color:#e9ca75;
    font-weight:bold;
    font-size:10px;
}

#godIcon{
    display:block;
    font-size:21px;
    line-height:21px;
}

/* =========================================================
   MINIMAPA COMPLETO
========================================================= */

#mapPanel{
    position:absolute;
    top:72px;
    right:7px;
    width:min(145px,34vw);
    aspect-ratio:1;
    padding:5px;
    z-index:20;
}

#miniMap{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* =========================================================
   MENSAJES
========================================================= */

#messages{
    position:absolute;
    left:50%;
    bottom:116px;
    transform:translateX(-50%);
    width:min(310px,68vw);
    min-height:38px;
    max-height:74px;
    overflow:hidden;
    padding:7px 9px;
    color:#e2cb8a;
    background:rgba(8,6,3,.78);
    border:1px solid rgba(195,151,60,.45);
    border-radius:8px;
    text-align:center;
    font-size:10px;
    line-height:14px;
    z-index:20;
}

/* =========================================================
   ZONA DE MIRADA FPS
   INVISIBLE Y OCUPA TODA LA PANTALLA
========================================================= */

#lookZone{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
    pointer-events:auto;
    touch-action:none;
    z-index:2;
}

/* =========================================================
   JOYSTICK MOVIMIENTO
========================================================= */

#leftStick{
    position:absolute;
    left:15px;
    bottom:max(14px,env(safe-area-inset-bottom));
    width:108px;
    height:108px;
    border-radius:50%;
    background:rgba(22,17,11,.48);
    border:2px solid rgba(215,176,91,.34);
    pointer-events:auto;
    touch-action:none;
    z-index:30;
}

.stickCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:48px;
    height:48px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(202,160,70,.2);
    border:1px solid rgba(232,197,116,.5);
}

.stickDot{
    position:absolute;
    left:50%;
    top:50%;
    width:34px;
    height:34px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(211,171,80,.62);
    border:1px solid #e0bf66;
}

/* =========================================================
   BOTONES
========================================================= */

#actions{
    position:absolute;
    right:15px;
    bottom:max(15px,env(safe-area-inset-bottom));
    display:flex;
    align-items:flex-end;
    gap:7px;
    pointer-events:auto;
    z-index:30;
}

.action{
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid #8f6c2e;
    background:rgba(24,16,9,.9);
    color:#e5c676;
    font-size:9px;
    font-weight:bold;
}

.action:active{
    transform:scale(.92);
    background:#503716;
}

#attackBtn{
    width:70px;
    height:70px;
    border-color:#d3a63b;
    font-size:11px;
}

/* =========================================================
   DAÑO
========================================================= */

#damageFlash{
    position:absolute;
    inset:0;
    background:rgba(255,0,0,.42);
    opacity:0;
    pointer-events:none;
    z-index:50;
}

/* =========================================================
   DIOS
========================================================= */

#godMenu{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.74);
    pointer-events:auto;
    z-index:100;
}

#godBox{
    width:min(360px,90vw);
    max-height:82vh;
    overflow:auto;
    padding:14px;
    border-radius:13px;
    background:#110c07;
    border:1px solid #a27a30;
    box-shadow:0 15px 50px #000;
}

#godBox h2{
    margin:0;
    text-align:center;
    color:#e4c36d;
    font-size:18px;
}

#godBox p{
    margin:5px 0 10px;
    color:#bba774;
    text-align:center;
    font-size:9px;
}

.god{
    width:100%;
    min-height:61px;
    display:flex;
    align-items:center;
    gap:9px;
    margin:6px 0;
    padding:8px;
    border-radius:9px;
    background:#1a1108;
    border:1px solid #58421f;
    color:#e4cb88;
    text-align:left;
}

.godIcon{
    width:43px;
    height:43px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:7px;
    border:1px solid #725622;
    background:#090704;
    font-size:26px;
}

.god strong{
    display:block;
    font-size:11px;
}

.god small{
    display:block;
    margin-top:3px;
    color:#ae9d78;
    font-size:8px;
}

#closeGod{
    width:100%;
    height:38px;
    margin-top:7px;
    border-radius:7px;
    background:#30200d;
    border:1px solid #85642a;
    color:#e4c775;
}

/* =========================================================
   PAUSA
========================================================= */

#pause{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
    pointer-events:auto;
    z-index:110;
}

#pauseBox{
    width:280px;
    padding:22px;
    border-radius:12px;
    text-align:center;
    background:#120d08;
    border:1px solid #9a732e;
}

#pauseBox h2{
    color:#e3c36e;
}

.pauseButton{
    width:100%;
    height:42px;
    margin-top:8px;
    border-radius:7px;
    background:#271a0b;
    border:1px solid #765725;
    color:#e5ca7c;
}

/* =========================================================
   TELEFONOS PEQUEÑOS
========================================================= */

@media(max-width:360px){

    #topHud{
        height:53px;
        left:4px;
        right:4px;
    }

    #playerPanel{
        width:153px;
    }

    #mapPanel{
        top:64px;
        width:108px;
    }

    #leftStick{
        width:94px;
        height:94px;
        left:9px;
        bottom:10px;
    }

    .stickCenter{
        width:42px;
        height:42px;
    }

    .stickDot{
        width:31px;
        height:31px;
    }

    #actions{
        right:9px;
        bottom:10px;
    }

    .action{
        width:47px;
        height:47px;
    }

    #attackBtn{
        width:60px;
        height:60px;
    }

    #messages{
        bottom:99px;
        width:62vw;
        font-size:8px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <!-- ZONA TÁCTIL FPS INVISIBLE -->
    <div id="lookZone"></div>

    <div id="topHud">

        <div id="playerPanel" class="panel">

            <div id="levelText">
                NIVEL 1 · TEMPLO
            </div>

            <div class="bar">
                <div id="hpFill"></div>
            </div>

            <div class="bar">
                <div id="xpFill"></div>
            </div>

            <div id="statsMini">
                ATQ 10 · EVASIÓN 5% · CRIT 5%
            </div>

        </div>

        <button id="godButton">
            <span id="godIcon">☀</span>
            <span id="godName">RA</span>
        </button>

    </div>

    <div id="mapPanel" class="panel">
        <canvas id="miniMap"></canvas>
    </div>

    <div id="messages">
        Explora el templo.
    </div>

    <div id="leftStick">

        <div class="stickCenter"></div>

        <div
            class="stickDot"
            id="leftDot">
        </div>

    </div>

    <div id="actions">

        <button
            class="action"
            id="blessBtn">
            DIOS
        </button>

        <button
            class="action"
            id="abilityBtn">
            PODER
        </button>

        <button
            class="action"
            id="attackBtn">
            ATAQUE
        </button>

    </div>

    <div id="damageFlash"></div>

    <!-- MENU DIOS -->

    <div id="godMenu">

        <div id="godBox">

            <h2>𓂀 BENDICIONES</h2>

            <p>
                Cambia de Dios durante la partida.
            </p>

            <button
                class="god"
                data-god="ra">

                <div class="godIcon">☀</div>

                <div>
                    <strong>RA · DIOS DEL SOL</strong>
                    <small>
                        Pasiva: velocidad · Activa: explosión solar
                    </small>
                </div>

            </button>

            <button
                class="god"
                data-god="anubis">

                <div class="godIcon">𓃢</div>

                <div>
                    <strong>ANUBIS · GUARDIÁN</strong>
                    <small>
                        Pasiva: evasión · Activa: protección
                    </small>
                </div>

            </button>

            <button
                class="god"
                data-god="horus">

                <div class="godIcon">𓅃</div>

                <div>
                    <strong>HORUS · OJO CELESTIAL</strong>
                    <small>
                        Pasiva: crítico · Activa: visión
                    </small>
                </div>

            </button>

            <button
                class="god"
                data-god="sekhmet">

                <div class="godIcon">𓁛</div>

                <div>
                    <strong>SEKHMET · GUERRA</strong>
                    <small>
                        Pasiva: daño · Activa: furia
                    </small>
                </div>

            </button>

            <button id="closeGod">
                CERRAR
            </button>

        </div>

    </div>

    <!-- PAUSA -->

    <div id="pause">

        <div id="pauseBox">

            <h2>PAUSA</h2>

            <button
                class="pauseButton"
                id="resumeBtn">
                CONTINUAR
            </button>

            <button
                class="pauseButton"
                id="resetBtn">
                NUEVA PARTIDA
            </button>

        </div>

    </div>

</div>

<script>

/* ============================================================
   PYRAMID OF THE GODS
   MOTOR 2.5D FPS
============================================================ */

"use strict";

/* ============================================================
   CANVAS
============================================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mini =
    document.getElementById("miniMap");

const mctx =
    mini.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=canvas.width=
        Math.max(320,window.innerWidth);

    H=canvas.height=
        Math.max(320,window.innerHeight);

}

window.addEventListener(
    "resize",
    resize
);

resize();

mini.width=240;
mini.height=240;

/* ============================================================
   UTILIDADES
============================================================ */

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function randInt(min,max){
    return Math.floor(
        Math.random()*(max-min+1)
    );
}

function clamp(v,min,max){
    return Math.max(
        min,
        Math.min(max,v)
    );
}

function distance(ax,ay,bx,by){
    return Math.hypot(
        ax-bx,
        ay-by
    );
}

function angleDiff(a,b){

    let d=a-b;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return d;
}

/* ============================================================
   GUARDADO
============================================================ */

const SAVE_KEY=
    "PYRAMID_OF_THE_GODS_V4";

let save={

    level:1,

    xp:0,

    totalXp:0,

    baseDamage:10,

    baseSpeed:2.7,

    baseEvasion:5,

    baseCrit:5,

    baseCritDamage:150,

    god:"ra"

};

try{

    const stored=
        localStorage.getItem(
            SAVE_KEY
        );

    if(stored){

        save=Object.assign(
            save,
            JSON.parse(stored)
        );

    }

}catch(error){

    console.warn(
        "No se pudo cargar la partida."
    );

}

function saveGame(){

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)
        );

    }catch(error){

        console.warn(
            "No se pudo guardar."
        );

    }

}

/* ============================================================
   DIOSES
============================================================ */

const gods={

    ra:{
        name:"RA",
        icon:"☀",
        speed:.45,
        damage:0,
        evasion:0,
        crit:0
    },

    anubis:{
        name:"ANUBIS",
        icon:"𓃢",
        speed:0,
        damage:0,
        evasion:10,
        crit:0
    },

    horus:{
        name:"HORUS",
        icon:"𓅃",
        speed:0,
        damage:0,
        evasion:0,
        crit:12
    },

    sekhmet:{
        name:"SEKHMET",
        icon:"𓁛",
        speed:0,
        damage:7,
        evasion:0,
        crit:0
    }

};

let currentGod=
    gods[save.god] || gods.ra;

function selectGod(id){

    if(!gods[id])
        return;

    save.god=id;

    currentGod=
        gods[id];

    saveGame();

    updateGodHUD();
    updateHUD();

    message(
        "Bendición de "+
        currentGod.name+
        " equipada."
    );

}

function updateGodHUD(){

    document.getElementById(
        "godName"
    ).textContent=
        currentGod.name;

    document.getElementById(
        "godIcon"
    ).textContent=
        currentGod.icon;

}

/* ============================================================
   MAPA
============================================================ */

let map=[];
let mapW=31;
let mapH=31;

let door={
    x:1,
    y:1,
    side:"north"
};

function createMap(){

    mapW=
        randInt(25,35);

    mapH=
        randInt(25,35);

    if(mapW%2===0)
        mapW++;

    if(mapH%2===0)
        mapH++;

    map=[];

    for(let y=0;y<mapH;y++){

        map[y]=[];

        for(let x=0;x<mapW;x++){

            map[y][x]=1;

        }

    }

    /*
        Laberinto conectado.
        Nunca se crean habitaciones aisladas.
    */

    let stack=[
        [1,1]
    ];

    map[1][1]=0;

    const dirs=[
        [2,0],
        [-2,0],
        [0,2],
        [0,-2]
    ];

    while(stack.length){

        const current=
            stack[stack.length-1];

        const x=current[0];
        const y=current[1];

        const options=[];

        for(const d of dirs){

            const nx=x+d[0];
            const ny=y+d[1];

            if(
                nx>0 &&
                ny>0 &&
                nx<mapW-1 &&
                ny<mapH-1 &&
                map[ny][nx]===1
            ){

                options.push(d);

            }

        }

        if(options.length){

            const d=
                options[
                    randInt(
                        0,
                        options.length-1
                    )
                ];

            const nx=x+d[0];
            const ny=y+d[1];

            map[
                y+d[1]/2
            ][
                x+d[0]/2
            ]=0;

            map[ny][nx]=0;

            stack.push([
                nx,
                ny
            ]);

        }else{

            stack.pop();

        }

    }

    /*
        Abrimos algunos huecos adicionales.
    */

    for(
        let i=0;
        i<Math.floor(mapW*mapH*.025);
        i++
    ){

        const x=
            randInt(1,mapW-2);

        const y=
            randInt(1,mapH-2);

        if(map[y][x]!==1)
            continue;

        const horizontal=
            map[y][x-1]===0 &&
            map[y][x+1]===0;

        const vertical=
            map[y-1][x]===0 &&
            map[y+1][x]===0;

        if(horizontal||vertical){

            map[y][x]=0;

        }

    }

    /*
        Buscar posición de puerta.
    */

    const candidates=[];

    for(
        let y=1;
        y<mapH-1;
        y++
    ){

        for(
            let x=1;
            x<mapW-1;
            x++
        ){

            if(map[y][x]!==0)
                continue;

            const north=
                map[y-1][x]===1;

            const south=
                map[y+1][x]===1;

            const west=
                map[y][x-1]===1;

            const east=
                map[y][x+1]===1;

            if(north||south||west||east){

                candidates.push({
                    x,
                    y,
                    side:
                        north
                        ?"north"
                        :south
                        ?"south"
                        :west
                        ?"west"
                        :"east"
                });

            }

        }

    }

    const farCandidates=
        candidates.filter(p=>
            distance(
                p.x+.5,
                p.y+.5,
                1.5,
                1.5
            )>8
        );

    if(farCandidates.length){

        door=
            farCandidates[
                randInt(
                    0,
                    farCandidates.length-1
                )
            ];

    }else if(candidates.length){

        door=
            candidates[
                randInt(
                    0,
                    candidates.length-1
                )
            ];

    }

}

/* ============================================================
   COLISION
============================================================ */

function wallAt(x,y){

    const ix=
        Math.floor(x);

    const iy=
        Math.floor(y);

    if(
        ix<0 ||
        iy<0 ||
        ix>=mapW ||
        iy>=mapH
    ){

        return true;

    }

    return map[iy][ix]===1;

}

function canMove(x,y,r=.18){

    return (
        !wallAt(x-r,y-r) &&
        !wallAt(x+r,y-r) &&
        !wallAt(x-r,y+r) &&
        !wallAt(x+r,y+r)
    );

}

function moveEntity(e,dx,dy){

    const nx=e.x+dx;

    if(canMove(nx,e.y,e.radius||.18))
        e.x=nx;

    const ny=e.y+dy;

    if(canMove(e.x,ny,e.radius||.18))
        e.y=ny;

}

/* ============================================================
   JUGADOR
============================================================ */

const player={

    x:1.5,

    y:1.5,

    angle:0,

    pitch:0,

    eyeHeight:.62,

    radius:.18,

    hp:100,

    maxHp:100,

    attackCooldown:0,

    attackTimer:0,

    hitFlash:0

};

function resetPlayer(){

    player.x=1.5;
    player.y=1.5;

    player.angle=0;

    player.pitch=0;

    player.hp=player.maxHp;

    player.attackCooldown=0;
    player.attackTimer=0;
    player.hitFlash=0;

}

/* ============================================================
   ENEMIGOS
============================================================ */

let enemies=[];

function spawnEnemies(){

    enemies=[];

    const amount=
        clamp(
            3+
            Math.floor(
                save.level*.55
            )+
            randInt(0,2),
            3,
            13
        );

    let tries=0;

    while(
        enemies.length<amount &&
        tries<4000
    ){

        tries++;

        const x=
            randInt(
                1,
                mapW-2
            )+.5;

        const y=
            randInt(
                1,
                mapH-2
            )+.5;

        if(!canMove(x,y,.22))
            continue;

        if(
            distance(
                x,y,
                player.x,
                player.y
            )<6
        )
            continue;

        /*
            No enemigos sobre la puerta.
        */

        if(
            distance(
                x,y,
                door.x+.5,
                door.y+.5
            )<2
        )
            continue;

        const hp=
            40+
            save.level*8;

        enemies.push({

            x,
            y,

            hp,

            maxHp:hp,

            radius:.22,

            speed:
                .65+
                save.level*.015,

            damage:
                5+
                save.level*.8,

            attack:0,

            hurt:0,

            dead:false,

            type:
                randInt(0,2)

        });

    }

}

/* ============================================================
   ALIADO
============================================================ */

const ally={

    x:1.9,

    y:1.8,

    radius:.18,

    speed:2.2

};

function updateAlly(dt){

    const d=
        distance(
            ally.x,
            ally.y,
            player.x,
            player.y
        );

    /*
        Distancia mínima.
        Así nunca se coloca encima del jugador.
    */

    if(d<1.25)
        return;

    const a=
        Math.atan2(
            player.y-ally.y,
            player.x-ally.x
        );

    const amount=
        ally.speed*dt;

    moveEntity(
        ally,
        Math.cos(a)*amount,
        Math.sin(a)*amount
    );

}

/* ============================================================
   VISIBILIDAD
============================================================ */

function visibleFromPlayer(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const d=
        Math.hypot(dx,dy);

    const steps=
        Math.ceil(d/.07);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            wallAt(
                player.x+dx*t,
                player.y+dy*t
            )
        ){

            return false;

        }

    }

    return true;

}

/* ============================================================
   RAYCAST
============================================================ */

const FOV=
    Math.PI/3;

function castRay(angle){

    const sin=Math.sin(angle);
    const cos=Math.cos(angle);

    let distanceRay=0;

    const step=.025;

    while(distanceRay<40){

        distanceRay+=step;

        const x=
            player.x+
            cos*distanceRay;

        const y=
            player.y+
            sin*distanceRay;

        if(wallAt(x,y))
            return distanceRay;

    }

    return 40;

}

/* ============================================================
   ATAQUE
============================================================ */

function attack(){

    if(player.attackCooldown>0)
        return;

    player.attackCooldown=.42;
    player.attackTimer=.22;

    const RANGE=1.65;

    let target=null;
    let nearest=999;

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        const d=
            distance(
                player.x,
                player.y,
                enemy.x,
                enemy.y
            );

        if(d>RANGE)
            continue;

        if(
            !visibleFromPlayer(
                enemy.x,
                enemy.y
            )
        )
            continue;

        const a=
            Math.atan2(
                enemy.y-player.y,
                enemy.x-player.x
            );

        const diff=
            Math.abs(
                angleDiff(
                    a,
                    player.angle
                )
            );

        /*
            Área horizontal del barrido.
        */

        if(
            diff<.72 &&
            d<nearest
        ){

            target=enemy;
            nearest=d;

        }

    }

    if(!target)
        return;

    let damage=
        save.baseDamage+
        currentGod.damage;

    const critChance=
        save.baseCrit+
        currentGod.crit;

    const critical=
        Math.random()*100<
        critChance;

    if(critical){

        damage*=
            save.baseCritDamage/100;

    }

    damage=
        Math.round(damage);

    target.hp-=damage;

    target.hurt=.18;

    floatingDamage(
        target.x,
        target.y,
        damage,
        critical
    );

    if(target.hp<=0){

        target.dead=true;

        gainXP(
            20+
            save.level*5
        );

    }

}

/* ============================================================
   TEXTO DE DAÑO
============================================================ */

let damageTexts=[];

function floatingDamage(
    x,
    y,
    value,
    critical
){

    damageTexts.push({

        x,
        y,

        value,

        critical,

        life:1,

        offset:0

    });

}

function updateDamageTexts(dt){

    for(const t of damageTexts){

        t.life-=dt;

        t.offset+=dt*.6;

    }

    damageTexts=
        damageTexts.filter(
            t=>t.life>0
        );

}

/* ============================================================
   DAÑO JUGADOR
============================================================ */

function damagePlayer(amount){

    const evasion=
        save.baseEvasion+
        currentGod.evasion;

    if(
        Math.random()*100<
        evasion
    ){

        message("Evasión.");

        return;

    }

    player.hp-=amount;

    player.hitFlash=.28;

    if(player.hp<=0){

        player.hp=player.maxHp;

        createMap();
        resetPlayer();
        spawnEnemies();

        message(
            "Has caído. El templo ha cambiado."
        );

    }

}

/* ============================================================
   IA
============================================================ */

function updateEnemies(dt){

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        if(enemy.hurt>0)
            enemy.hurt-=dt;

        if(enemy.attack>0)
            enemy.attack-=dt;

        const d=
            distance(
                enemy.x,
                enemy.y,
                player.x,
                player.y
            );

        if(d>12)
            continue;

        if(
            visibleFromPlayer(
                enemy.x,
                enemy.y
            )
        ){

            const angle=
                Math.atan2(
                    player.y-enemy.y,
                    player.x-enemy.x
                );

            if(d>1.15){

                const amount=
                    enemy.speed*dt;

                moveEntity(
                    enemy,
                    Math.cos(angle)*amount,
                    Math.sin(angle)*amount
                );

            }else if(enemy.attack<=0){

                damagePlayer(
                    enemy.damage
                );

                enemy.attack=.9;

            }

        }

    }

}

/* ============================================================
   XP
============================================================ */

function xpNeeded(){

    return 100+
        (save.level-1)*65;

}

function gainXP(amount){

    save.xp+=amount;

    save.totalXp+=amount;

    while(
        save.xp>=xpNeeded()
    ){

        save.xp-=xpNeeded();

        save.level++;

        save.baseDamage+=2;

        save.baseSpeed+=.025;

        save.baseEvasion+=.7;

        save.baseCrit+=.5;

        player.maxHp+=5;

        player.hp=player.maxHp;

        message(
            "NIVEL "+
            save.level+
            " · ESTADÍSTICAS MEJORADAS"
        );

    }

    saveGame();

    updateHUD();

}

/* ============================================================
   PROYECCIÓN 2.5D
============================================================ */

function projectObject(
    x,
    y,
    size
){

    const dx=
        x-player.x;

    const dy=
        y-player.y;

    const distanceObj=
        Math.hypot(dx,dy);

    let relative=
        Math.atan2(
            dy,
            dx
        )-
        player.angle;

    while(relative>Math.PI)
        relative-=Math.PI*2;

    while(relative<-Math.PI)
        relative+=Math.PI*2;

    const corrected=
        distanceObj*
        Math.cos(relative);

    if(corrected<=.1)
        return null;

    const screenX=
        W/2+
        Math.tan(relative)*
        (W/2)/
        Math.tan(FOV/2);

    const horizon=
        H/2+
        player.pitch*H*.42;

    const screenSize=
        size*H/corrected;

    const bottom=
        horizon+
        player.eyeHeight*
        H/corrected;

    return{

        x:screenX,

        y:bottom-screenSize,

        w:screenSize,

        h:screenSize,

        distance:corrected

    };

}

/* ============================================================
   ENEMIGOS
============================================================ */

function renderEnemies(){

    const list=[];

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        /*
            Culling por paredes.
        */

        if(
            !visibleFromPlayer(
                enemy.x,
                enemy.y
            )
        )
            continue;

        const p=
            projectObject(
                enemy.x,
                enemy.y,
                .70
            );

        if(!p)
            continue;

        list.push({
            enemy,
            p
        });

    }

    list.sort(
        (a,b)=>
            b.p.distance-
            a.p.distance
    );

    for(const item of list){

        drawEnemy(
            item.enemy,
            item.p
        );

    }

}

function drawEnemy(enemy,p){

    const x=p.x;
    const y=p.y;
    const w=p.w;
    const h=p.h;

    ctx.save();

    /*
        Sombra en suelo.
    */

    ctx.fillStyle=
        "rgba(0,0,0,.48)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+h,
        w*.27,
        h*.045,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Destello rojo.
    */

    if(enemy.hurt>0){

        ctx.shadowBlur=18;
        ctx.shadowColor="#ff261c";

    }

    /*
        Piernas separadas.
    */

    ctx.fillStyle=
        enemy.hurt>0
        ?" #ff4438"
        :"#35251a";

    ctx.fillRect(
        x-w*.17,
        y+h*.63,
        w*.12,
        h*.32
    );

    ctx.fillRect(
        x+w*.05,
        y+h*.63,
        w*.12,
        h*.32
    );

    /*
        Torso.
    */

    ctx.fillStyle=
        enemy.type===0
        ?"#73552e"
        :enemy.type===1
        ?"#4f4435"
        :"#683d2f";

    ctx.fillRect(
        x-w*.28,
        y+h*.31,
        w*.56,
        h*.38
    );

    /*
        Brazos.
    */

    ctx.fillRect(
        x-w*.39,
        y+h*.34,
        w*.11,
        h*.29
    );

    ctx.fillRect(
        x+w*.28,
        y+h*.34,
        w*.11,
        h*.29
    );

    /*
        Cabeza.
    */

    ctx.fillStyle="#a57b54";

    ctx.beginPath();

    ctx.arc(
        x,
        y+h*.20,
        w*.23,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Casco.
    */

    ctx.fillStyle="#251a11";

    ctx.fillRect(
        x-w*.22,
        y+h*.12,
        w*.44,
        h*.12
    );

    /*
        Ojos.
    */

    ctx.fillStyle="#e7b43c";

    ctx.fillRect(
        x-w*.12,
        y+h*.20,
        w*.07,
        h*.035
    );

    ctx.fillRect(
        x+w*.05,
        y+h*.20,
        w*.07,
        h*.035
    );

    ctx.shadowBlur=0;

    /*
        Vida.
    */

    const barW=
        w*.84;

    const barH=
        Math.max(
            3,
            h*.024
        );

    const hp=
        clamp(
            enemy.hp/
            enemy.maxHp,
            0,
            1
        );

    ctx.fillStyle="#120806";

    ctx.fillRect(
        x-barW/2,
        y-h*.05,
        barW,
        barH
    );

    ctx.fillStyle="#c32e24";

    ctx.fillRect(
        x-barW/2,
        y-h*.05,
        barW*hp,
        barH
    );

    ctx.restore();

}

/* ============================================================
   TEXTO DAÑO EN ESCENA
============================================================ */

function renderDamageTexts(){

    for(const t of damageTexts){

        if(
            !visibleFromPlayer(
                t.x,
                t.y
            )
        )
            continue;

        const p=
            projectObject(
                t.x,
                t.y,
                .32
            );

        if(!p)
            continue;

        const alpha=
            clamp(t.life,0,1);

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.textAlign="center";

        ctx.font=
            "bold "+
            Math.max(
                12,
                p.w*.18
            )+
            "px Arial";

        ctx.fillStyle=
            t.critical
            ?" #ffd44a"
            :"#ffffff";

        ctx.strokeStyle="#000";

        ctx.lineWidth=3;

        ctx.strokeText(
            "-" + t.value,
            p.x,
            p.y-
            t.offset*p.h*.25
        );

        ctx.fillText(
            "-" + t.value,
            p.x,
            p.y-
            t.offset*p.h*.25
        );

        ctx.restore();

    }

}

/* ============================================================
   PUERTA
============================================================ */

function renderDoor(){

        )

    );

/* ============================================================
   ARMA DERECHA
============================================================ */

function renderWeapon(){

    const attack=
        player.attackTimer>0
        ?player.attackTimer/.22
        :0;

    /*
        Barrido horizontal.
    */

    const sweep=
        attack>0
        ?Math.sin(
            (1-attack)*
            Math.PI
        )
        :0;

    ctx.save();

    const baseX=
        W*.70;

    const baseY=
        H*.90+
        player.pitch*
        H*.12;

    ctx.translate(
        baseX,
        baseY
    );

    ctx.rotate(
        -.18+
        sweep*1.05
    );

    /*
        Mano derecha.
    */

    ctx.fillStyle="#996847";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        Math.max(
            8,
            W*.025
        ),
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Empuñadura.
    */

    ctx.fillStyle="#352217";

    ctx.fillRect(
        -W*.025,
        -W*.13,
        W*.05,
        W*.18
    );

    /*
        Hoja.
    */

    ctx.fillStyle="#b8aa86";

    ctx.beginPath();

    ctx.moveTo(
        -W*.03,
        -W*.13
    );

    ctx.lineTo(
        W*.025,
        -W*.47
    );

    ctx.lineTo(
        W*.07,
        -W*.13
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#e2d5ad";

    ctx.stroke();

    /*
        Efecto del barrido.
    */

    if(attack>0){

        ctx.globalAlpha=.24;

        ctx.strokeStyle="#f1d171";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            W*.30,
            -1.8,
            -.15
        );

        ctx.stroke();

    }

    ctx.restore();

}

/* ============================================================
   MUNDO
============================================================ */

function renderWorld(){

    const horizon=
        H/2+
        player.pitch*
        H*.42;

    /*
        CIELO
    */

    ctx.fillStyle="#15100c";

    ctx.fillRect(
        0,
        0,
        W,
        Math.max(
            0,
            horizon
        )
    );

    /*
        SUELO ARENA.
        Sin reflejos.
    */

    ctx.fillStyle="#a78352";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    /*
        Raycasting.
    */

    const columns=
        Math.min(
            W,
            540
        );

    const columnWidth=
        W/columns;

    for(
        let i=0;
        i<columns;
        i++
    ){

        const cameraX=
            i/columns-.5;

        const rayAngle=
            player.angle+
            Math.atan(
                cameraX*
                Math.tan(FOV/2)*2
            );

        const raw=
            castRay(rayAngle);

        const corrected=
            raw*
            Math.cos(
                rayAngle-
                player.angle
            );

        const wallHeight=
            H/corrected;

        const top=
            horizon-
            wallHeight*.50;

        const shade=
            clamp(
                1-
                corrected/18,
                .15,
                1
            );

        const r=
            Math.floor(
                112*shade
            );

        const g=
            Math.floor(
                78*shade
            );

        const b=
            Math.floor(
                42*shade
            );

        ctx.fillStyle=
            `rgb(${r},${g},${b})`;

        ctx.fillRect(
            i*columnWidth,
            top,
            columnWidth+1,
            wallHeight
        );

    }

    renderDoor();
    renderEnemies();
    renderAlly();
    renderDamageTexts();
    renderWeapon();

}

/* ============================================================
   MINIMAPA
   MAPA COMPLETO
============================================================ */

function renderMiniMap(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,
        0,
        mw,
        mh
    );

    /*
        Siempre encaja TODO el mapa.
    */

    const scale=
        Math.min(
            mw/mapW,
            mh/mapH
        );

    const ox=
        (mw-mapW*scale)/2;

    const oy=
        (mh-mapH*scale)/2;

    for(
        let y=0;
        y<mapH;
        y++
    ){

        for(
            let x=0;
            x<mapW;
            x++
        ){

            if(map[y][x]===1){

                mctx.fillStyle="#241a0e";

            }else{

                mctx.fillStyle="#aa8959";

            }

            mctx.fillRect(
                ox+x*scale,
                oy+y*scale,
                Math.ceil(scale)+.2,
                Math.ceil(scale)+.2
            );

        }

    }

    /*
        Puerta.
    */

    mctx.fillStyle="#e0b440";

    mctx.fillRect(
        ox+door.x*scale,
        oy+door.y*scale,
        Math.max(2,scale),
        Math.max(2,scale)
    );

    /*
        Enemigos.
    */

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        mctx.fillStyle="#d83b30";

        mctx.beginPath();

        mctx.arc(
            ox+enemy.x*scale,
            oy+enemy.y*scale,
            Math.max(
                2,
                scale*.25
            ),
            0,
            Math.PI*2
        );

        mctx.fill();

    }

    /*
        Aliado.
    */

    mctx.fillStyle="#42a4c8";

    mctx.beginPath();

    mctx.arc(
        ox+ally.x*scale,
        oy+ally.y*scale,
        Math.max(
            2,
            scale*.32
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
        Jugador.
    */

    const px=
        ox+
        player.x*scale;

    const py=
        oy+
        player.y*scale;

    mctx.fillStyle="#fff0a2";

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        Math.max(
            2,
            scale*.38
        ),
        0,
        Math.PI*2
    );

    mctx.fill();

    /*
        Dirección.
    */

    mctx.strokeStyle="#fff0a2";

    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(
        px,
        py
    );

    mctx.lineTo(
        px+
        Math.cos(player.angle)*
        scale*1.5,

        py+
        Math.sin(player.angle)*
        scale*1.5
    );

    mctx.stroke();

}

/* ============================================================
   JOYSTICK IZQUIERDO
============================================================ */

const leftStick=
    document.getElementById(
        "leftStick"
    );

const leftDot=
    document.getElementById(
        "leftDot"
    );

const joystick={

    active:false,

    id:null,

    x:0,

    y:0

};

leftStick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joystick.active=true;

        joystick.id=
            e.pointerId;

        leftStick.setPointerCapture(
            e.pointerId
        );

        updateLeftJoystick(e);

    },
    {passive:false}
);

leftStick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joystick.active ||
            joystick.id!==e.pointerId
        )
            return;

        updateLeftJoystick(e);

        e.preventDefault();

    },
    {passive:false}
);

function releaseLeft(e){

    if(
        e.pointerId!==joystick.id
    )
        return;

    joystick.active=false;
    joystick.id=null;

    joystick.x=0;
    joystick.y=0;

    leftDot.style.transform=
        "translate(-50%,-50%)";

}

leftStick.addEventListener(
    "pointerup",
    releaseLeft
);

leftStick.addEventListener(
    "pointercancel",
    releaseLeft
);

function updateLeftJoystick(e){

    const rect=
        leftStick.getBoundingClientRect();

    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;

    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;

    const max=
        rect.width*.36;

    const len=
        Math.hypot(dx,dy);

    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;

    }

    joystick.x=
        clamp(
            dx/max,
            -1,
            1
        );

    joystick.y=
        clamp(
            dy/max,
            -1,
            1
        );

    leftDot.style.transform=
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}

/* ============================================================
   CÁMARA FPS TÁCTIL DIRECTA
============================================================ */

const lookZone=
    document.getElementById(
        "lookZone"
    );

let lookPointer=null;

let lastLookX=0;
let lastLookY=0;

const LOOK_X=.0042;
const LOOK_Y=.0034;

lookZone.addEventListener(
    "pointerdown",
    e=>{

        /*
            Si el toque está sobre un
            elemento de control, no tomarlo.
        */

        if(
            e.target!==lookZone
        )
            return;

        if(lookPointer!==null)
            return;

        lookPointer=
            e.pointerId;

        lastLookX=
            e.clientX;

        lastLookY=
            e.clientY;

        try{

            lookZone.setPointerCapture(
                e.pointerId
            );

        }catch(error){}

        e.preventDefault();

    },
    {passive:false}
);

lookZone.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId!==lookPointer
        )
            return;

        const dx=
            e.clientX-
            lastLookX;

        const dy=
            e.clientY-
            lastLookY;

        lastLookX=
            e.clientX;

        lastLookY=
            e.clientY;

        /*
            Horizontal.
        */

        player.angle+=
            dx*LOOK_X;

        /*
            VERTICAL INVERTIDA.

            Dedo arriba
            = mirar abajo.

            Dedo abajo
            = mirar arriba.
        */

        player.pitch+=
            dy*LOOK_Y;

        player.pitch=
            clamp(
                player.pitch,
                -.85,
                .85
            );

        e.preventDefault();

    },
    {passive:false}
);

function releaseLook(e){

    if(
        e.pointerId!==lookPointer
    )
        return;

    lookPointer=null;

}

lookZone.addEventListener(
    "pointerup",
    releaseLook
);

lookZone.addEventListener(
    "pointercancel",
    releaseLook
);

/* ============================================================
   PODERES
============================================================ */

let abilityCooldown=0;

document.getElementById(
    "abilityBtn"
).addEventListener(
    "click",
    activateGod
);

function activateGod(){

    if(abilityCooldown>0){

        message(
            "Poder recargando..."
        );

        return;

    }

    abilityCooldown=8;

    /*
        RA
    */

    if(save.god==="ra"){

        for(const enemy of enemies){

            if(enemy.dead)
                continue;

            const d=
                distance(
                    player.x,
                    player.y,
                    enemy.x,
                    enemy.y
                );

            if(
                d<3.3 &&
                visibleFromPlayer(
                    enemy.x,
                    enemy.y
                )
            ){

                const damage=
                    35+
                    save.level*4;

                enemy.hp-=damage;

                enemy.hurt=.3;

                floatingDamage(
                    enemy.x,
                    enemy.y,
                    damage,
                    true
                );

                if(enemy.hp<=0){

                    enemy.dead=true;

                    gainXP(25);

                }

            }

        }

        message(
            "RA · EXPLOSIÓN SOLAR"
        );

    }

    /*
        ANUBIS
    */

    else if(
        save.god==="anubis"
    ){

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+35
            );

        message(
            "ANUBIS · PROTECCIÓN"
        );

    }

    /*
        HORUS
    */

    else if(
        save.god==="horus"
    ){

        for(const enemy of enemies){

            if(enemy.dead)
                continue;

            const d=
                distance(
                    player.x,
                    player.y,
                    enemy.x,
                    enemy.y
                );

            if(
                d<5 &&
                visibleFromPlayer(
                    enemy.x,
                    enemy.y
                )
            ){

                enemy.hp-=20;

                floatingDamage(
                    enemy.x,
                    enemy.y,
                    20,
                    true
                );

                if(enemy.hp<=0){

                    enemy.dead=true;

                    gainXP(25);

                }

            }

        }

        message(
            "HORUS · OJO CELESTIAL"
        );

    }

    /*
        SEKHMET
    */

    else if(
        save.god==="sekhmet"
    ){

        for(const enemy of enemies){

            if(enemy.dead)
                continue;

            const d=
                distance(
                    player.x,
                    player.y,
                    enemy.x,
                    enemy.y
                );

            if(
                d<2.8 &&
                visibleFromPlayer(
                    enemy.x,
                    enemy.y
                )
            ){

                enemy.hp-=45;

                floatingDamage(
                    enemy.x,
                    enemy.y,
                    45,
                    true
                );

                if(enemy.hp<=0){

                    enemy.dead=true;

                    gainXP(30);

                }

            }

        }

        message(
            "SEKHMET · FURIA"
        );

    }

}

/* ============================================================

============================================================ */

function nearDoor(){

    return distance(
        player.x,
        player.y,
        door.x+.5,
        door.y+.5
    )<.78;

}

let doorLock=0;

function nextRoom(){

    if(!nearDoor())
        return;

    if(doorLock>0)
        return;

    doorLock=.8;

    createMap();

    resetPlayer();

    spawnEnemies();

    message(
        "NUEVA SALA · MAPA GENERADO"
    );

}

/* ============================================================
   MOVIMIENTO
============================================================ */

function updatePlayer(dt){

    let forward=0;

    let strafe=0;

    /*
        WASD
    */

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    /*
        JOYSTICK
    */

    if(joystick.active){

        forward+=
            -joystick.y;

        strafe+=
            joystick.x;

    }

    const magnitude=
        Math.hypot(
            forward,
            strafe
        );

    if(magnitude>1){

        forward/=magnitude;
        strafe/=magnitude;

    }

    const speed=
        save.baseSpeed+
        currentGod.speed;

    const amount=
        speed*dt;

    const dx=
        (
            Math.cos(player.angle)*
            forward
            -
            Math.sin(player.angle)*
            strafe
        )*amount;

    const dy=
        (
            Math.sin(player.angle)*
            forward
            +
            Math.cos(player.angle)*
            strafe
        )*amount;

    moveEntity(
        player,
        dx,
        dy
    );

    if(player.attackCooldown>0)
        player.attackCooldown-=dt;

    if(player.attackTimer>0)
        player.attackTimer-=dt;

    if(abilityCooldown>0)
        abilityCooldown-=dt;

    if(doorLock>0)
        doorLock-=dt;

}

/* ============================================================
   MENSAJES
============================================================ */

let messageTimer=0;

function message(text){

    document.getElementById(
        "messages"
    ).textContent=text;

    messageTimer=3;

}

/* ============================================================
   LOOP
============================================================ */

let lastTime=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            .033,
            (now-lastTime)/1000
        );

    lastTime=now;

    if(!paused){

        updatePlayer(dt);

        updateAlly(dt);

        updateEnemies(dt);

        updateDamageTexts(dt);

        if(player.hitFlash>0)
            player.hitFlash-=dt;

        if(messageTimer>0){

            messageTimer-=dt;

            if(messageTimer<=0){

                document.getElementById(
                    "messages"
                ).textContent=
                    nearDoor()
                    ?"PUERTA · ENTRA PARA CAMBIAR DE SALA"
                    :"Explora el templo.";

            }

        }

        /*
            Puerta.
        */

        if(nearDoor()){

            if(
                messageTimer<=0
            ){

                message(
                    "PUERTA · NUEVA SALA"
                );

            }

            /*
                En PC E.
                En móvil basta acercarse
                completamente a la puerta.
            */

            if(
                keys["e"] ||
                distance(
                    player.x,
                    player.y,
                    door.x+.5,
                    door.y+.5
                )<.48
            ){

                nextRoom();

            }

        }

        renderWorld();

        renderMiniMap();

        const flash=
            document.getElementById(
                "damageFlash"
            );

        flash.style.opacity=
            player.hitFlash>0
            ?Math.min(
                .65,
                player.hitFlash*2.5
            )
            :0;

        updateHUD();

    }

    requestAnimationFrame(loop);

}

/* ============================================================
   INICIO
============================================================ */

createMap();

resetPlayer();

spawnEnemies();

updateGodHUD();

updateHUD();

message(
    "Explora el templo. Encuentra la puerta."
);

requestAnimationFrame(loop);

</script>
