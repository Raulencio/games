<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PYRAMID OF THE GODS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   MENÚ
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:
    radial-gradient(
        circle,
        #72552f 0%,
        #281c12 55%,
        #080706 100%
    );
}

.menuBox{
    width:min(430px,94vw);
    padding:22px 16px;
    border:2px solid #d5ae5d;
    border-radius:22px;
    background:rgba(17,13,9,.97);
    box-shadow:0 0 45px rgba(0,0,0,.8);
    text-align:center;
}

.logo{
    color:#e6c879;
    font-size:clamp(27px,8vw,42px);
    font-weight:900;
    line-height:.95;
    letter-spacing:2px;
}

.subtitle{
    margin:10px 0 18px;
    color:#cbb78d;
    font-size:10px;
}

.start{
    width:100%;
    min-height:57px;
    border:0;
    border-radius:15px;
    background:linear-gradient(#f1d47d,#b67b29);
    color:#24170b;
    font-weight:900;
    font-size:17px;
}

.godTitle{
    margin:17px 0 9px;
    color:#e1c478;
    font-size:13px;
    font-weight:bold;
}

.gods{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.god{
    padding:8px 3px;
    border:1px solid #59442a;
    border-radius:12px;
    background:#1c1510;
    color:#ddd;
}

.god.selected{
    border-color:#e9c96f;
    box-shadow:0 0 13px rgba(233,201,111,.35);
}

.glyph{
    width:40px;
    height:40px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #9c7839;
    border-radius:9px;
    background:#302317;
    color:#e5c16b;
    font-size:23px;
}

.godName{
    margin-top:4px;
    font-size:9px;
    font-weight:bold;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#top{
    position:absolute;
    top:max(7px,env(safe-area-inset-top));
    left:7px;
    right:7px;
    display:flex;
    gap:7px;
}

#stats{
    flex:1;
    padding:7px 9px;
    border:1px solid rgba(225,192,109,.55);
    border-radius:12px;
    background:rgba(15,11,8,.78);
}

#name{
    color:#e8cb83;
    font-size:10px;
    font-weight:bold;
}

.bar{
    height:6px;
    margin-top:4px;
    border-radius:5px;
    overflow:hidden;
    background:#261a11;
}

#hp{
    height:100%;
    width:100%;
    background:#c64c43;
}

#xp{
    height:100%;
    width:0%;
    background:#4c9dc5;
}

#level{
    margin-top:3px;
    color:#eee;
    font-size:9px;
}

#godHud{
    width:49px;
    height:49px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #d1a94f;
    border-radius:13px;
    background:rgba(20,15,10,.9);
    color:#e6c66d;
    font-size:25px;
}

/* =========================
   MINIMAPA
========================= */

#mapBox{
    position:absolute;
    top:65px;
    right:7px;
    width:min(30vw,120px);
    aspect-ratio:1;
    padding:3px;
    border:1px solid #d2a952;
    border-radius:10px;
    background:rgba(8,7,5,.9);
}

#mini{
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   MENSAJES
========================= */

#messages{
    position:absolute;
    left:50%;
    bottom:118px;
    transform:translateX(-50%);
    width:min(64vw,300px);
    height:70px;
    padding:6px;
    overflow:hidden;
    border:1px solid rgba(216,178,88,.35);
    border-radius:10px;
    background:rgba(10,8,5,.45);
    color:#e9d6a8;
    font-size:9px;
    line-height:1.4;
}

/* =========================
   JOYSTICK PROFESIONAL
========================= */

#joystick{
    position:absolute;
    left:max(12px,env(safe-area-inset-left));
    bottom:max(15px,env(safe-area-inset-bottom));

    width:116px;
    height:116px;

    border-radius:50%;

    border:
        2px solid
        rgba(230,198,117,.48);

    background:
        radial-gradient(
            circle,
            rgba(226,192,107,.12),
            rgba(20,15,10,.5)
        );

    pointer-events:auto;

    touch-action:none;
}

#joystick::after{
    content:"";
    position:absolute;
    inset:17px;
    border:
        1px solid
        rgba(231,200,119,.15);
    border-radius:50%;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:50px;
    height:50px;

    transform:
        translate3d(-50%,-50%,0);

    border:
        2px solid
        rgba(242,210,125,.95);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ead18b,
            #a8752c
        );

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.45);

    will-change:
        transform;
}

/* =========================
   BOTONES
========================= */

#buttons{
    position:absolute;
    right:max(10px,env(safe-area-inset-right));
    bottom:max(14px,env(safe-area-inset-bottom));
    width:125px;
    height:120px;
    pointer-events:none;
}

.btn{
    position:absolute;
    border:2px solid rgba(231,196,108,.75);
    border-radius:50%;
    background:rgba(31,23,16,.85);
    color:#efd083;
    font-weight:900;
    pointer-events:auto;
    touch-action:none;
}

#attack{
    width:72px;
    height:72px;
    right:0;
    bottom:0;
}

#ability{
    width:53px;
    height:53px;
    left:0;
    bottom:48px;
    font-size:19px;
}

#godButton{
    width:42px;
    height:42px;
    left:0;
    bottom:0;
}

/* =========================
   CRUZ
========================= */

#crosshair{
    position:absolute;
    left:50%;
    top:46%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:rgba(255,245,210,.9);
}

#crosshair::before{
    left:8px;
    top:0;
    width:2px;
    height:18px;
}

#crosshair::after{
    left:0;
    top:8px;
    width:18px;
    height:2px;
}

/* =========================
   TELÉFONOS PEQUEÑOS
========================= */

@media(max-width:340px){

    #joystick{
        width:98px;
        height:98px;
    }

    #stick{
        width:43px;
        height:43px;
    }

    #joystick::after{
        inset:14px;
    }

    #buttons{
        width:108px;
    }

    #attack{
        width:64px;
        height:64px;
    }

    #messages{
        bottom:104px;
        width:59vw;
        height:65px;
    }

    #mapBox{
        width:101px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =====================================================
     MENÚ
===================================================== -->

<div id="menu">

<div class="menuBox">

<div class="logo">
PYRAMID<br>OF THE GODS
</div>

<div class="subtitle">
FPS 2.5D · TEMPLOS · EXPLORACIÓN
</div>

<button class="start" id="start">
INICIAR EXPLORACIÓN

<div class="god selected" data-god="RA">

        id="ability">
✦

ATAQUE

</div>

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const mini =
document.getElementById("mini");

const mctx =
mini.getContext("2d");

let W=0;
let H=0;

function resize(){

    W=canvas.width=
        window.innerWidth;

    H=canvas.height=
        window.innerHeight;

    const s=
        Math.min(
            180,
            Math.max(
                100,
                innerWidth*.30
            )
        );

    mini.width=s;
    mini.height=s;
}

addEventListener(
    "resize",
    resize
);

resize();

/* =====================================================
   UTILIDADES
===================================================== */

function randomInt(a,b){

    return Math.floor(
        Math.random()*
        (b-a+1)
    )+a;
}

function clamp(v,a,b){

    return Math.max(
        a,
        Math.min(b,v)
    );
}

function distance(ax,ay,bx,by){

    return Math.hypot(
        bx-ax,
        by-ay
    );
}

function angleDifference(a,b){

    let d=a-b;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    return d;
}

/* =====================================================
   MAPA
===================================================== */

const FLOOR=0;
const WALL=1;
const DOOR=2;

let map=[];
let mapW=0;
let mapH=0;

let rooms=[];

let door={
    x:0,
    y:0
};

function generateMap(){

    mapW=
        randomInt(48,60);

    mapH=
        randomInt(48,60);

    map=
        Array.from(
            {length:mapH},
            ()=>Array(
                mapW
            ).fill(WALL)
        );

    rooms=[];

    const amount=
        randomInt(8,11);

    for(
        let i=0;
        i<amount;
        i++
    ){

        for(
            let attempt=0;
            attempt<100;
            attempt++
        ){

            const w=
                randomInt(7,12);

            const h=
                randomInt(7,12);

            const x=
                randomInt(
                    2,
                    mapW-w-3
                );

            const y=
                randomInt(
                    2,
                    mapH-h-3
                );

            let overlap=false;

            for(
                const r of rooms
            ){

                if(
                    x<r.x+r.w+2 &&
                    x+w+2>r.x &&
                    y<r.y+r.h+2 &&
                    y+h+2>r.y
                ){

                    overlap=true;
                    break;
                }
            }

            if(overlap)
                continue;

            const room={
                x,
                y,
                w,
                h,
                cx:
                    Math.floor(
                        x+w/2
                    ),
                cy:
                    Math.floor(
                        y+h/2
                    )
            };

            rooms.push(room);

            for(
                let yy=y;
                yy<y+h;
                yy++
            ){

                for(
                    let xx=x;
                    xx<x+w;
                    xx++
                ){

                    map[yy][xx]=FLOOR;
                }
            }

            break;
        }
    }

    rooms.sort(
        (a,b)=>a.cx-b.cx
    );

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        connect(
            rooms[i-1],
            rooms[i]
        );
    }

    for(
        let i=0;
        i<rooms.length-2;
        i++
    ){

        if(
            Math.random()<.35
        ){

            connect(
                rooms[i],
                rooms[i+2]
            );
        }
    }

    /*
       Sala inicial.
    */

    const startRoom=
        rooms[0];

    player.x=
        startRoom.cx+.5;

    player.y=
        startRoom.cy+.5;

    player.angle=0;

    /*
       Puerta SOLO en una sala diferente.
    */

    const exitRoom=
        rooms[
            rooms.length-1
        ];

    createDoor(exitRoom);
}

function connect(a,b){

    if(
        Math.random()<.5
    ){

        horizontal(
            a.cx,
            b.cx,
            a.cy
        );

        vertical(
            a.cy,
            b.cy,
            b.cx
        );

    }else{

        vertical(
            a.cy,
            b.cy,
            a.cx
        );

        horizontal(
            a.cx,
            b.cx,
            b.cy
        );
    }
}

function horizontal(a,b,y){

    const min=
        Math.min(a,b);

    const max=
        Math.max(a,b);

    for(
        let x=min;
        x<=max;
        x++
    ){

        for(
            let yy=y-1;
            yy<=y+1;
            yy++
        ){

            if(
                yy>0 &&
                yy<mapH-1 &&
                x>0 &&
                x<mapW-1
            ){

                map[yy][x]=FLOOR;
            }
        }
    }
}

function vertical(a,b,x){

    const min=
        Math.min(a,b);

    const max=
        Math.max(a,b);

    for(
        let y=min;
        y<=max;
        y++
    ){

        for(
            let xx=x-1;
            xx<=x+1;
            xx++
        ){

            if(
                y>0 &&
                y<mapH-1 &&
                xx>0 &&
                xx<mapW-1
            ){

                map[y][xx]=FLOOR;
            }
        }
    }
}

function createDoor(room){

    const options=[
        {
            x:room.cx,
            y:room.y
        },
        {
            x:room.cx,
            y:room.y+room.h-1
        },
        {
            x:room.x,
            y:room.cy
        },
        {
            x:room.x+room.w-1,
            y:room.cy
        }
    ];

    const selected=
        options[
            randomInt(
                0,
                options.length-1
            )
        ];

    door.x=selected.x;
    door.y=selected.y;

    map[
        door.y
    ][
        door.x
    ]=DOOR;
}

function tileAt(x,y){

    const tx=
        Math.floor(x);

    const ty=
        Math.floor(y);

    if(
        tx<0 ||
        ty<0 ||
        tx>=mapW ||
        ty>=mapH
    ){

        return WALL;
    }

    return map[ty][tx];
}

function solid(x,y){

    const t=
        tileAt(x,y);

    return (
        t===WALL ||
        t===DOOR
    );
}

/* =====================================================
   VISIÓN
===================================================== */

function lineOfSight(
    x1,y1,
    x2,y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const d=
        Math.hypot(dx,dy);

    const steps=
        Math.ceil(d/.05);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=
            x1+dx*t;

        const y=
            y1+dy*t;

        const tile=
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return false;
        }
    }

    return true;
}

/* =====================================================
   JUGADOR
===================================================== */

const player={

    x:5.5,
    y:5.5,

    angle:0,

    radius:.22,

    hp:100,
    maxHp:100,

    xp:0,
    nextXP:100,

    level:1,

    speed:2.5,

    damage:25,

    range:5,

    attackCooldown:0,
    attackTimer:0
};

/* =====================================================
   DIOSES
===================================================== */

const gods={

RA:{
    icon:"☀",
    speed:1,
    damage:1.1,
    hp:1,
    ability:"Lanza solar"
},

ANUBIS:{
    icon:"𓃢",
    speed:1.05,
    damage:1.25,
    hp:1,
    ability:"Juicio"
},

HORUS:{
    icon:"𓅃",
    speed:1.15,
    damage:1,
    hp:1,
    ability:"Ojo de Horus"
},

ISIS:{
    icon:"𓊨",
    speed:1,
    damage:.9,
    hp:1.3,
    ability:"Bendición"
},

SETH:{
    icon:"𓃩",
    speed:1.25,
    damage:1.3,
    hp:.9,
    ability:"Tormenta"
},

OSIRIS:{
    icon:"𓀀",
    speed:.9,
    damage:1.15,
    hp:1.45,
    ability:"Renacimiento"
}

};

let selectedGod="RA";

function applyGod(){

    const god=
        gods[selectedGod];

    player.speed=
        2.5*god.speed;

    player.damage=
        25*god.damage;

    player.maxHp=
        Math.round(
            100*god.hp
        );

    player.hp=
        Math.min(
            player.hp,
            player.maxHp
        );

    document
    .getElementById(
        "godHud"
    )
    .textContent=
        god.icon;

    document
    .getElementById(
        "godButton"
    )
    .textContent=
        god.icon;
}

document
.querySelectorAll(".god")
.forEach(card=>{

    card.addEventListener(
        "click",
        ()=>{

            selectedGod=
                card.dataset.god;

            document
            .querySelectorAll(
                ".god"
            )
            .forEach(c=>{
                c.classList.remove(
                    "selected"
                );
            });

            card.classList.add(
                "selected"
            );

            applyGod();
        }
    );
});

/* =====================================================
   ENEMIGOS
===================================================== */

let enemies=[];

function spawnEnemies(){

    enemies=[];

    for(
        let i=1;
        i<rooms.length;
        i++
    ){

        const room=
            rooms[i];

        const amount=
            randomInt(1,3);

        for(
            let n=0;
            n<amount;
            n++
        ){

            let x=
                room.x+2+
                Math.random()*
                Math.max(
                    1,
                    room.w-4
                );

            let y=
                room.y+2+
                Math.random()*
                Math.max(
                    1,
                    room.h-4
                );

            if(
                distance(
                    x,y,
                    player.x,
                    player.y
                )<5
            ){

                x=room.cx+.5;
                y=room.cy+.5;
            }

            enemies.push({

                x,
                y,

                hp:
                    60+
                    player.level*10,

                maxHp:
                    60+
                    player.level*10,

                speed:
                    .65+
                    Math.random()*.35,

                cooldown:0,
                hit:0
            });
        }
    }
}

/* =====================================================
   GUARDIÁN
===================================================== */

const guardian={

    active:false,

    x:0,
    y:0,

    hp:140,
    maxHp:140,

    speed:1.9,

    cooldown:0
};

function summonGuardian(){

    const spots=[
        [.9,.3],
        [-.9,.3],
        [.7,-.8],
        [-.7,-.8]
    ];

    for(
        const p of spots
    ){

        const x=
            player.x+p[0];

        const y=
            player.y+p[1];

        if(
            !solid(x,y)
        ){

            guardian.x=x;
            guardian.y=y;

            guardian.active=true;

            addMessage(
                "Guardián invocado."
            );

            return;
        }
    }

    guardian.x=
        player.x+1;

    guardian.y=
        player.y;

    guardian.active=true;
}

/* =====================================================
   COLISIÓN SUAVE
===================================================== */

function moveEntity(
    entity,
    dx,
    dy,
    radius=.22
){

    const nx=
        entity.x+dx;

    if(
        !solid(nx-radius,entity.y) &&
        !solid(nx+radius,entity.y)
    ){

        entity.x=nx;
    }

    const ny=
        entity.y+dy;

    if(
        !solid(entity.x,ny-radius) &&
        !solid(entity.x,ny+radius)
    ){

        entity.y=ny;
    }
}

/* =====================================================
   IA
===================================================== */

function updateEnemies(dt){

    for(
        const e of enemies
    ){

        if(e.hp<=0)
            continue;

        e.cooldown=
            Math.max(
                0,
                e.cooldown-dt
            );

        e.hit=
            Math.max(
                0,
                e.hit-dt
            );

        const d=
            distance(
                e.x,e.y,
                player.x,player.y
            );

        if(
            d>12
        )
            continue;

        if(
            !lineOfSight(
                e.x,e.y,
                player.x,player.y
            )
        )
            continue;

        if(d>1.15){

            const dx=
                (player.x-e.x)/d;

            const dy=
                (player.y-e.y)/d;

            moveEntity(
                e,
                dx*e.speed*dt,
                dy*e.speed*dt,
                .25
            );

        }else{

            if(
                e.cooldown<=0
            ){

                player.hp-=8;

                e.cooldown=1.1;

                addMessage(
                    "Un enemigo te ha golpeado."
                );

                if(
                    player.hp<=0
                ){

                    player.hp=
                        player.maxHp;

                    player.x=5.5;
                    player.y=5.5;

                    addMessage(
                        "Has caído. Regresas al inicio."
                    );
                }
            }
        }
    }
}

function updateGuardian(dt){

    if(
        !guardian.active
    )
        return;

    guardian.cooldown=
        Math.max(
            0,
            guardian.cooldown-dt
        );

    const d=
        distance(
            guardian.x,
            guardian.y,
            player.x,
            player.y
        );

    /*
       Mantiene una distancia mínima.
       Nunca se coloca encima.
    */

    if(d>2){

        const dx=
            (player.x-guardian.x)/d;

        const dy=
            (player.y-guardian.y)/d;

        moveEntity(
            guardian,
            dx*guardian.speed*dt,
            dy*guardian.speed*dt,
            .25
        );
    }

    let target=null;
    let closest=999;

    for(
        const e of enemies
    ){

        if(e.hp<=0)
            continue;

        const d2=
            distance(
                guardian.x,
                guardian.y,
                e.x,
                e.y
            );

        if(
            d2<3.5 &&
            d2<closest &&
            lineOfSight(
                guardian.x,
                guardian.y,
                e.x,
                e.y
            )
        ){

            closest=d2;
            target=e;
        }
    }

    if(
        target &&
        guardian.cooldown<=0
    ){

        target.hp-=18;

        target.hit=.15;

        guardian.cooldown=.8;

        createParticles(
            target.x,
            target.y,
            "ally"
        );

        if(
            target.hp<=0
        ){

            gainXP(30);
        }
    }
}

/* =====================================================
   ATAQUE
===================================================== */

function attack(){

    if(
        player.attackCooldown>0
    )
        return;

    player.attackCooldown=.42;

    player.attackTimer=.30;

    createParticles(
        player.x+
        Math.cos(player.angle)*.8,
        player.y+
        Math.sin(player.angle)*.8,
        "attack"
    );

    let target=null;
    let nearest=player.range;

    for(
        const e of enemies
    ){

        if(e.hp<=0)
            continue;

        const d=
            distance(
                player.x,
                player.y,
                e.x,
                e.y
            );

        /*
           ALCANCE REAL DEL MAPA.
        */

        if(
            d>player.range
        )
            continue;

        const a=
            Math.atan2(
                e.y-player.y,
                e.x-player.x
            );

        if(
            Math.abs(
                angleDifference(
                    a,
                    player.angle
                )
            )>.52
        )
            continue;

        /*
           PARED BLOQUEA ATAQUE.
        */

        if(
            !lineOfSight(
                player.x,
                player.y,
                e.x,
                e.y
            )
        )
            continue;

        if(d<nearest){

            nearest=d;
            target=e;
        }
    }

    if(target){

        target.hp-=
            player.damage;

        target.hit=.15;

        createParticles(
            target.x,
            target.y,
            "hit"
        );

        if(
            target.hp<=0
        ){

            gainXP(35);

            addMessage(
                "Enemigo derrotado · +35 XP"
            );
        }
    }
}

/* =====================================================
   HABILIDAD
===================================================== */

function ability(){

    const radius=
        selectedGod==="SETH"
        ?4
        :selectedGod==="HORUS"
        ?6
        :3.5;

    let hits=0;

    for(
        const e of enemies
    ){

        if(e.hp<=0)
            continue;

        const d=
            distance(
                player.x,
                player.y,
                e.x,
                e.y
            );

        if(
            d<=radius &&
            lineOfSight(
                player.x,
                player.y,
                e.x,
                e.y
            )
        ){

            let damage=45;

            if(
                selectedGod==="SETH"
            )
                damage=70;

            if(
                selectedGod==="ANUBIS"
            )
                damage=60;

            e.hp-=damage;

            e.hit=.25;

            createParticles(
                e.x,
                e.y,
                "ability"
            );

            hits++;

            if(e.hp<=0)
                gainXP(50);
        }
    }

    if(
        selectedGod==="ISIS"
    ){

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+30
            );
    }

    addMessage(
        gods[selectedGod].ability+
        " · "+
        hits+
        " afectados."
    );
}

/* =====================================================
   XP
===================================================== */

function gainXP(n){

    player.xp+=n;

    while(
        player.xp>=player.nextXP
    ){

        player.xp-=player.nextXP;

        player.level++;

        player.nextXP=
            Math.floor(
                player.nextXP*1.32
            );

        player.maxHp+=12;

        player.hp=
            player.maxHp;

        player.damage+=4;

        addMessage(
            "NIVEL "+
            player.level+
            " · Estadísticas mejoradas."
        );
    }
}

/* =====================================================
   PARTICULAS
===================================================== */

const particles=[];

function createParticles(
    x,y,type
){

    const amount=
        type==="ability"
        ?25
        :15;

    for(
        let i=0;
        i<amount;
        i++
    ){

        const a=
            Math.random()*
            Math.PI*2;

        const s=
            .5+
            Math.random()*2;

        particles.push({

            x,y,

            vx:
                Math.cos(a)*s,

            vy:
                Math.sin(a)*s,

            life:
                .3+
                Math.random()*.4,

            max:.7,

            type
        });
    }
}

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

        if(
            p.life<=0
        ){

            particles.splice(i,1);
        }
    }
}

/* =====================================================
   RAYCASTER
===================================================== */

const FOV=
    Math.PI/3;

function castRay(angle){

    const cos=
        Math.cos(angle);

    const sin=
        Math.sin(angle);

    for(
        let d=.02;
        d<30;
        d+=.035
    ){

        const x=
            player.x+
            cos*d;

        const y=
            player.y+
            sin*d;

        const tile=
            tileAt(x,y);

        if(
            tile===WALL ||
            tile===DOOR
        ){

            return {
                distance:d,
                type:tile
            };
        }
    }

    return {
        distance:30,
        type:WALL
    };
}

/* =====================================================
   RENDER
===================================================== */

function renderWorld(){

    const horizon=
        H*.46;

    /*
       Cielo.
    */

    ctx.fillStyle="#b8a071";

    ctx.fillRect(
        0,0,W,horizon
    );

    /*
       Suelo arena plano.
    */

    ctx.fillStyle="#b78a4f";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );

    const columns=
        Math.min(
            W,
            520
        );

    const cw=
        W/columns;

    for(
        let i=0;
        i<columns;
        i++
    ){

        const cameraX=
            i/columns-.5;

        const angle=
            player.angle+
            cameraX*FOV;

        const hit=
            castRay(angle);

        let d=
            hit.distance*
            Math.cos(
                angle-player.angle
            );

        d=
            Math.max(
                .01,
                d
            );

        const height=
            Math.min(
                H*1.5,
                H*.92/d
            );

        const top=
            horizon-height/2;

        if(
            hit.type===DOOR
        ){

            ctx.fillStyle=
                "#241a11";

        }else{

            const shade=
                clamp(
                    150-d*8,
                    40,
                    145
                );

            ctx.fillStyle=
                "rgb("+
                shade+
                ","+
                Math.floor(
                    shade*.73
                )+
                ","+
                Math.floor(
                    shade*.48
                )+
                ")";
        }

        ctx.fillRect(
            i*cw,
            top,
            cw+1,
            height
        );
    }

    renderObjects();

    renderWeapon();

    renderParticles();
}

function project(
    obj
){

    const dx=
        obj.x-player.x;

    const dy=
        obj.y-player.y;

    const d=
        Math.hypot(dx,dy);

    if(d<.1)
        return null;

    /*
       No renderizar detrás de paredes.
    */

    if(
        !lineOfSight(
            player.x,
            player.y,
            obj.x,
            obj.y
        )
    )
        return null;

    const a=
        Math.atan2(dy,dx);

    const relative=
        angleDifference(
            a,
            player.angle
        );

    if(
        Math.abs(relative)>
        FOV*.75
    )
        return null;

    const sx=
        W/2+
        Math.tan(relative)*
        (
            W/
            (
                2*
                Math.tan(FOV/2)
            )
        );

    const size=
        Math.min(
            H*.75,
            H/(d*.95)
        );

    return {
        x:sx,
        y:H*.46,
        size,
        distance:d
    };
}

function renderObjects(){

    const objects=[];

    for(
        const e of enemies
    ){

        if(e.hp>0){

            objects.push({
                type:"enemy",
                obj:e
            });
        }
    }

    if(
        guardian.active
    ){

        objects.push({
            type:"guardian",
            obj:guardian
        });
    }

    objects.sort(
        (a,b)=>
        distance(
            player.x,
            player.y,
            b.obj.x,
            b.obj.y
        )-
        distance(
            player.x,
            player.y,
            a.obj.x,
            a.obj.y
        )
    );

    for(
        const item of objects
    ){

        const p=
            project(item.obj);

        if(!p)
            continue;

        if(
            item.type==="enemy"
        )
            drawEnemy(
                item.obj,
                p
            );
        else
            drawGuardian(
                p
            );
    }
}

/* =====================================================
   ENEMIGO VISUAL
===================================================== */

function drawEnemy(e,p){

    const s=p.size;
    const x=p.x;

    const ground=
        H*.46+s*.5;

    /*
       Sombra.
    */

    ctx.fillStyle=
        "rgba(20,12,5,.38)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.23,
        s*.07,
        0,0,Math.PI*2
    );

    ctx.fill();

    /*
       Cuerpo.
    */

    ctx.fillStyle=
        e.hit>0
        ?"#fff"
        :"#633b2b";

    ctx.fillRect(
        x-s*.17,
        ground-s*.48,
        s*.34,
        s*.38
    );

    /*
       Cabeza.
    */

    ctx.fillStyle="#38241d";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.58,
        s*.15,
        0,Math.PI*2
    );

    ctx.fill();

    /*
       Ojos.
    */

    ctx.fillStyle="#e5b74f";

    ctx.fillRect(
        x-s*.075,
        ground-s*.59,
        s*.04,
        s*.025
    );

    ctx.fillRect(
        x+s*.035,
        ground-s*.59,
        s*.04,
        s*.025
    );

    /*
       Vida.
    */

    const bw=s*.55;

    const bh=
        Math.max(
            4,
            s*.035
        );

    ctx.fillStyle="#20110c";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw,
        bh
    );

    ctx.fillStyle="#d44d42";

    ctx.fillRect(
        x-bw/2,
        ground-s*.76,
        bw*
        clamp(
            e.hp/e.maxHp,
            0,1
        ),
        bh
    );
}

/* =====================================================
   GUARDIÁN VISUAL
===================================================== */

function drawGuardian(p){

    const s=p.size;
    const x=p.x;

    const ground=
        H*.46+s*.5;

    ctx.fillStyle=
        "rgba(20,15,7,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        ground,
        s*.28,
        s*.08,
        0,0,Math.PI*2
    );

    ctx.fill();

    const pulse=
        1+
        Math.sin(
            performance.now()*.006
        )*.08;

    ctx.strokeStyle=
        "rgba(238,196,84,.7)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.38,
        s*.32*pulse,
        0,Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#a67b32";

    ctx.beginPath();

    ctx.moveTo(
        x-s*.22,
        ground
    );

    ctx.lineTo(
        x-s*.15,
        ground-s*.48
    );

    ctx.lineTo(
        x,
        ground-s*.57
    );

    ctx.lineTo(
        x+s*.15,
        ground-s*.48
    );

    ctx.lineTo(
        x+s*.22,
        ground
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#d5ad68";

    ctx.beginPath();

    ctx.arc(
        x,
        ground-s*.62,
        s*.14,
        0,Math.PI*2
    );

    ctx.fill();
}

/* =====================================================
   ARMA
===================================================== */

function renderWeapon(){

    const active=
        player.attackTimer>0;

    let swing=0;

    if(active){

        const t=
            1-
            player.attackTimer/.30;

        /*
           Barrido horizontal suave.
        */

        swing=
            Math.sin(
                t*Math.PI
            );
    }

    /*
       Mano derecha.
    */

    const baseX=
        W*.78;

    const baseY=
        H*1.04;

    ctx.save();

    ctx.translate(
        baseX-
        swing*W*.23,
        baseY-
        swing*H*.12
    );

    ctx.rotate(
        -.48-
        swing*1.15
    );

    /*
       Brazo.
    */

    ctx.fillStyle="#8c5b38";

    ctx.fillRect(
        -13,
        -15,
        26,
        72
    );

    /*
       Mango.
    */

    ctx.fillStyle="#3d2417";

    ctx.fillRect(
        -5,
        -98,
        10,
        65
    );

    /*
       Hoja.
    */

    ctx.beginPath();

    ctx.moveTo(
        -4,
        -100
    );

    ctx.lineTo(
        0,
        -190
    );

    ctx.lineTo(
        5,
        -100
    );

    ctx.closePath();

    ctx.fillStyle="#d5c59b";

    ctx.fill();

    /*
       Arco visual.
    */

    if(active){

        ctx.strokeStyle=
            "rgba(240,205,105,.8)";

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            -100,
            95,
            -.95,
            .15
        );

        ctx.stroke();
    }

    ctx.restore();
}

/* =====================================================
   PARTICULAS RENDER
===================================================== */

function renderParticles(){

    for(
        const p of particles
    ){

        const pr=
            project({
                x:p.x,
                y:p.y
            });

        if(!pr)
            continue;

        const alpha=
            clamp(
                p.life/p.max,
                0,1
            );

        if(
            p.type==="ally"
        ){

            ctx.fillStyle=
                "rgba(100,200,255,"+
                alpha+
                ")";

        }else if(
            p.type==="ability"
        ){

            ctx.fillStyle=
                "rgba(245,205,90,"+
                alpha+
                ")";

        }else{

            ctx.fillStyle=
                "rgba(255,220,120,"+
                alpha+
                ")";
        }

        ctx.beginPath();

        ctx.arc(
            pr.x,
            pr.y-pr.size*.25,
            Math.max(
                2,
                pr.size*.025
            ),
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =====================================================
   MINIMAPA COMPLETO
===================================================== */

function renderMini(){

    const mw=mini.width;
    const mh=mini.height;

    mctx.clearRect(
        0,0,mw,mh
    );

    if(!map.length)
        return;

    mctx.fillStyle="#100c08";

    mctx.fillRect(
        0,0,mw,mh
    );

    /*
       El mapa completo siempre cabe.
    */

    const scale=
        Math.min(
            mw/mapW,
            mh/mapH
        );

    const ox=
        (mw-mapW*scale)/2;

    const oy=
        (mh-mapH*scale)/2;

    for(
        let y=0;
        y<mapH;
        y++
    ){

        for(
            let x=0;
            x<mapW;
            x++
        ){

            const t=
                map[y][x];

            if(t===WALL){

                mctx.fillStyle=
                    "#403225";

            }else if(t===DOOR){

                mctx.fillStyle=
                    "#e2b94e";

            }else{

                mctx.fillStyle=
                    "#b78d56";
            }

            mctx.fillRect(
                ox+x*scale,
                oy+y*scale,
                Math.ceil(scale)+.2,
                Math.ceil(scale)+.2
            );
        }
    }

    /*
       Enemigos.
    */

    for(
        const e of enemies
    ){

        if(e.hp<=0)
            continue;

        mctx.fillStyle="#d84b42";

        mctx.beginPath();

        mctx.arc(
            ox+e.x*scale,
            oy+e.y*scale,
            Math.max(
                1.5,
                scale
            ),
            0,Math.PI*2
        );

        mctx.fill();
    }

    /*
       Guardián.
    */

    if(
        guardian.active
    ){

        mctx.fillStyle="#59b9d5";

        mctx.beginPath();

        mctx.arc(
            ox+guardian.x*scale,
            oy+guardian.y*scale,
            Math.max(
                2,
                scale*1.2
            ),
            0,Math.PI*2
        );

        mctx.fill();
    }

    /*
       Jugador.
    */

    mctx.fillStyle="#fff0a0";

    mctx.beginPath();

    mctx.arc(
        ox+player.x*scale,
        oy+player.y*scale,
        Math.max(
            2,
            scale*1.5
        ),
        0,Math.PI*2
    );

    mctx.fill();

    /*
       Dirección.
    */

    mctx.strokeStyle="#fff0a0";

    mctx.lineWidth=1.5;

    mctx.beginPath();

    mctx.moveTo(
        ox+player.x*scale,
        oy+player.y*scale
    );

    mctx.lineTo(
        ox+
        (
            player.x+
            Math.cos(
                player.angle
            )*2
        )*scale,

        oy+
        (
            player.y+
            Math.sin(
                player.angle
            )*2
        )*scale
    );

    mctx.stroke();
}

/* =====================================================
   JOYSTICK ANALÓGICO PROFESIONAL
===================================================== */

/*
   Este joystick NO mueve al jugador con saltos.

   Devuelve un vector:

       x = -1 ... +1
       y = -1 ... +1

   La magnitud indica cuánto se ha desplazado
   el dedo desde el centro.

   Se utiliza una curva suave para conseguir:
       - precisión cerca del centro
       - máxima velocidad al borde
       - movimiento progresivo
*/

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

const joystickState={

    active:false,

    pointerId:null,

    x:0,
    y:0,

    targetX:0,
    targetY:0,

    centerX:0,
    centerY:0,

    radius:0,

    knobRadius:0
};

function prepareJoystick(){

    const rect=
        joystick.getBoundingClientRect();

    joystickState.centerX=
        rect.left+
        rect.width/2;

    joystickState.centerY=
        rect.top+
        rect.height/2;

    /*
       El radio útil deja margen para
       que el knob nunca salga del círculo.
    */

    joystickState.radius=
        rect.width/2;

    joystickState.knobRadius=
        stick.offsetWidth/2;

    joystickState.radius-=
        joystickState.knobRadius;
}

function updateJoystick(
    clientX,
    clientY
){

    prepareJoystick();

    let dx=
        clientX-
        joystickState.centerX;

    let dy=
        clientY-
        joystickState.centerY;

    const max=
        joystickState.radius;

    const rawDistance=
        Math.hypot(dx,dy);

    /*
       Limitar al círculo.
    */

    if(
        rawDistance>max
    ){

        dx=
            dx/rawDistance*
            max;

        dy=
            dy/rawDistance*
            max;
    }

    const normalizedDistance=
        Math.min(
            1,
            Math.hypot(dx,dy)/max
        );

    /*
       ZONA MUERTA.

       Evita micro movimientos accidentales.
    */

    const deadZone=.08;

    let magnitude=0;

    if(
        normalizedDistance>deadZone
    ){

        magnitude=
            (
                normalizedDistance-
                deadZone
            )/
            (1-deadZone);

        /*
           Curva suave.

           Cerca del centro:
               mucho control.

           Cerca del borde:
               máxima respuesta.
        */

        magnitude=
            Math.pow(
                magnitude,
                .82
            );
    }

    if(
        rawDistance>0
    ){

        const nx=
            dx/rawDistance;

        const ny=
            dy/rawDistance;

        joystickState.targetX=
            nx*magnitude;

        joystickState.targetY=
            ny*magnitude;

    }else{

        joystickState.targetX=0;
        joystickState.targetY=0;
    }

    /*
       Posición física del knob.

       El knob sigue al dedo exactamente.
    */

    const knobX=
        dx;

    const knobY=
        dy;

    stick.style.transform=
        "translate3d("+
        (
            knobX-
            joystickState.knobRadius
        )+
        "px,"+
        (
            knobY-
            joystickState.knobRadius
        )+
        "px,0)";
}

function resetJoystick(){

    joystickState.active=false;
    joystickState.pointerId=null;

    joystickState.targetX=0;
    joystickState.targetY=0;

    joystickState.x=0;
    joystickState.y=0;

    stick.style.transform=
        "translate3d(-50%,-50%,0)";
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        prepareJoystick();

        joystickState.active=true;

        joystickState.pointerId=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joystickState.active ||
            e.pointerId!==
            joystickState.pointerId
        )
            return;

        e.preventDefault();

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    e=>{

        if(
            e.pointerId===
            joystickState.pointerId
        ){

            resetJoystick();
        }
    }
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =====================================================
   CÁMARA TÁCTIL
===================================================== */

let cameraPointer=null;
let previousCameraX=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(!gameRunning)
            return;

        /*
           Solamente la parte derecha
           controla cámara.
        */

        if(
            e.clientX<
            innerWidth*.44
        )
            return;

        cameraPointer=
            e.pointerId;

        previousCameraX=
            e.clientX;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            cameraPointer!==
            e.pointerId
        )
            return;

        const dx=
            e.clientX-
            previousCameraX;

        previousCameraX=
            e.clientX;

        /*
           Sensibilidad suave.
        */

        player.angle+=
            dx*.0055;
    }
);

canvas.addEventListener(
    "pointerup",
    e=>{

        if(
            cameraPointer===
            e.pointerId
        ){

            cameraPointer=null;
        }
    }
);

/* =====================================================
   BOTONES
===================================================== */

document.getElementById(
    "attack"
).addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        attack();
    }
);

document.getElementById(

).addEventListener(

document.getElementById(
    "godButton"
).addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        const list=
            Object.keys(gods);

        const index=
            list.indexOf(
                selectedGod
            );

        selectedGod=
            list[
                (index+1)%
                list.length
            ];

        document
        .querySelectorAll(
            ".god"
        )
        .forEach(card=>{

            card.classList.toggle(
                "selected",
                card.dataset.god===
                selectedGod
            );
        });

        applyGod();

        addMessage(
            selectedGod+
            " seleccionado."
        );
    }
);

/* =====================================================
   TECLADO
===================================================== */

const keys={};

addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(
            e.key===" "
        )
            attack();

        if(
            e.key.toLowerCase()==="e"
        )
            ability();
    }
);

addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;
    }
);

/* =====================================================
   ACTUALIZACIÓN
===================================================== */

function update(dt){

    if(!gameRunning)
        return;

    player.attackCooldown=
        Math.max(
            0,
            player.attackCooldown-dt
        );

    player.attackTimer=
        Math.max(
            0,
            player.attackTimer-dt
        );

    doorTimer=
        Math.max(
            0,
            doorTimer-dt
        );

    /*
       -------------------------------------------------
       SUAVIZADO DEL JOYSTICK
       -------------------------------------------------

       El valor real se acerca progresivamente
       al valor objetivo.

       Esto elimina tirones.
    */

    const smoothing=
        1-
        Math.pow(
            .001,
            dt
        );

    joystickState.x+=
        (
            joystickState.targetX-
            joystickState.x
        )*
        smoothing;

    joystickState.y+=
        (
            joystickState.targetY-
            joystickState.y
        )*
        smoothing;

    let forward=
        -joystickState.y;

    let strafe=
        joystickState.x;

    /*
       Teclado.
    */

    if(keys["w"])
        forward+=1;

    if(keys["s"])
        forward-=1;

    if(keys["a"])
        strafe-=1;

    if(keys["d"])
        strafe+=1;

    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>1){

        forward/=len;
        strafe/=len;
    }

    const speed=
        player.speed*dt;

    /*
       Movimiento relativo a la cámara.

       Esto es lo que hace que:

       ARRIBA =
       hacia donde mira el jugador.

       ABAJO =
       atrás.

       IZQUIERDA =
       lateral izquierda.

       DERECHA =
       lateral derecha.
    */

    const dx=
        (
            Math.cos(
                player.angle
            )*forward
            -
            Math.sin(
                player.angle
            )*strafe
        )*
        speed;

    const dy=
        (
            Math.sin(
                player.angle
            )*forward
            +
            Math.cos(
                player.angle
            )*strafe
        )*
        speed;

    moveEntity(
        player,
        dx,
        dy,
        player.radius
    );

    updateEnemies(dt);

    updateGuardian(dt);

    updateParticles(dt);

    checkDoor();

    updateHUD();
}

/* =====================================================
   LOOP
===================================================== */

let gameRunning=false;
let lastTime=0;

function loop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000||0
        );

    lastTime=time;

    update(dt);

    renderWorld();

    renderMini();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);

/* =====================================================
   INICIO
===================================================== */

document.getElementById(
    "start"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        gameRunning=true;

        generateMap();

        spawnEnemies();

        applyGod();

        /*
           El guardián siempre es INVOCADO.
        */

        summonGuardian();

        addMessage(
            "Exploración iniciada."
        );

        addMessage(
            "Usa el joystick para desplazarte."
        );

        addMessage(
            "Desliza el lado derecho para mirar."
        );
    }
);

/* =====================================================
   ESTADO INICIAL
===================================================== */

updateHUD();
